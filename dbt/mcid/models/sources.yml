version: 2

sources:
  - name: raw
    schema: __dados_brutos
    description: >
      Schema de dados brutos do banco cidades.
      Contém os dados ingeridos das fontes GFAR, CAIXA e SNH para o programa MCMV.
    tables:
      # Fontes FAR
      - name: novo_mcmv_far_consolidado
        description: >
          Tabela consolidada do GFAR com todas as propostas FAR do Novo MCMV.
          Contém 15.091 registros (13.216 propostas únicas), incluindo propostas
          não contratadas, contratadas e distratadas. Todas as colunas são text.
      - name: novo_mcmv_far_cad_pj_mensal
        description: >
          Cadastro detalhado de pessoa jurídica (empreendimento) com 82 colunas.
          Contém 822 empreendimentos contratados com dados de composição financeira,
          coordenadas GPS, tipologia, construtora e datas-chave. Snapshot mensal.
      - name: novo_mcmv_far_obra_mensal
        description: >
          Dados de evolução física da obra com 40 colunas. Contém 822 registros
          (1 por empreendimento). Inclui percentual previsto/realizado, situação
          da obra, UHs concluídas e datas de paralisação/retomada.
      - name: novo_mcmv_far_financeiro_mensal
        description: >
          Dados de liberações financeiras com série temporal. Contém 6.069 registros
          para 638 APFs (média de 9,5 liberações por empreendimento). Detalha
          valores pagos por componente (obra, terreno, PTS, INCC).
      - name: dados_prioritarios_recebidos_caixa_empreendimentos
        description: >
          Dados prioritários recebidos da CAIXA com snapshot consolidado.
          Contém 4.443 empreendimentos FAR com situação, percentual de execução,
          valores contratados/desembolsados, UHs e coordenadas geográficas.
      - name: api_ibge_uf
        description: >
          Tabela de referência do IBGE com os 27 estados brasileiros.
          Contém sigla, nome completo e região. Usada para enriquecer dashboards.
      - name: api_ibge_regioes
        description: >
          Tabela de referência do IBGE com as 5 regiões brasileiras.
          Contém id e nome (Norte, Nordeste, Centro-Oeste, Sudeste, Sul).
      - name: dados_prioritarios_recebidos_caixa_entregas
        description: >
          Snapshot de entregas reportadas pela CAIXA. Contém 11.540 registros
          de múltiplos programas.

      # Fontes FDS (Entidades)
      - name: novo_mcmv_fds_cad_pj_mensal
        description: >
          Cadastro PJ mensal do MCMV Entidades (FDS). 343 empreendimentos
          contratados a partir de ago/2024. 89 colunas text com dados de
          Entidade Organizadora, construtora, UHs, composição financeira,
          GPS, datas, substituição de EO e indicadores. Snapshot mensal.
      - name: novo_mcmv_fds_obra_mensal
        description: >
          Evolução física da obra FDS. 343 registros (1 por empreendimento).
          47 colunas text com situação da operação, percentual previsto/realizado,
          UHs concluídas/alienadas, paralisação, invasão e datas de entrega.
      - name: novo_mcmv_fds_financeiro_mensal
        description: >
          Série temporal de liberações financeiras FDS. 16.124 registros para
          750 APFs (111 do Novo MCMV). APF em 6 dígitos. ATENÇÃO: ic_credito=0
          são liberações reais (valores negativos), usar ABS(). ic_credito=1
          são devoluções (20 registros).
      - name: novo_mcmv_fds_trabalho_social_mensal
        description: >
          Acompanhamento do Trabalho Técnico Social FDS. 89 registros com
          situação, datas de aprovação PTS, convênio, relatórios e portaria.
      
      # Fontes Complementares
      - name: int_empreendimentos_int_059_fds_caixa_pj
        description: >
          Tabela complementar da CAIXA (INT 059) com 856 registros.
          Contém dados do legado e do Novo MCMV. Importante para filtros
          como situacao_gefus e fase_contrato.
      - name: api_ibge_municipios
        description: >
          Tabela de referência do IBGE com os municípios brasileiros.
          Contém id, nome, microrregião, mesorregião e códigos relacionados.

  - name: ibge
    schema: ibge
    description: >
      Schema de dados do IBGE. Contém dados de PIB da construção civil e SINAPI
      por município, com cobertura de 2010 a 2021 para os 5.570 municípios brasileiros.
    tables:
      - name: pib_construcao
        description: >
          Produto Interno Bruto (PIB) da construção civil por município, em valores correntes e constantes.
          Tipagem aplicada: text→int, text→numeric.
      - name: sinapi
        description: >
          Índice Nacional de Custo da Construção (SINAPI) por município, em valores correntes.
          Tipagem aplicada: text→int, text→numeric.
      - name: pnadc_ocupados_construcao
        description: >
          Pessoas ocupadas na construção civil (PNAD Contínua trimestral).
          Agregado 6323, variável 4090. Tipagem aplicada: text→int, text→numeric.
      - name: pnadc_rendimento_construcao
        description: >
          Rendimento médio mensal real na construção civil (PNAD Contínua trimestral).
          Agregado 6391, variável 5932. Tipagem aplicada: text→int, text→numeric.
      - name: ibge_pim_pf_brasil
        description: >
          Pesquisa Industrial Mensal - Produção Física (PIM-PF), Brasil.
          Agregado 8888, variáveis 12606, 12607, 11601-11604, classificação 544[129314].
          Tipagem aplicada: text→int, text→numeric.
      - name: ibge_pmc_construcao
        description: >
          Pesquisa Mensal de Comércio (PMC), material de construção.
          Agregado 8880, variáveis 7169, 7170, 11708-11711, classificação 11046 (receita nominal e volume).
          Tipagem aplicada: text→int, text→numeric.

  - name: fgv
    schema: fgv
    description: >
      Schema de dados da FGV. Contém dados de evolução do preço médio do metro quadrado
      para imóveis residenciais em 8 capitais brasileiras, com cobertura mensal de 2010 a 2021.
    tables:
      - name: icst
        description: >
          Evolução do preço médio do metro quadrado para imóveis residenciais em 8 capitais brasileiras.
          Tipagem aplicada: text→date, text→numeric.
      - name: incc_m
        description: >
          Evolução do preço médio do metro quadrado para imóveis residenciais em 8 capitais brasileiras.
          Tipagem aplicada: text→date, text→numeric.

  - name: bacen
    schema: bacen
    description: >
      Schema de dados do Banco Central. Contém dados de séries temporais de taxas de juros
      (Selic, CDB, CDI) e inflação (IPCA) com cobertura mensal de 2010 a 2021.
    tables:
      - name: financiamentos_imobiliarios
        description: >
          Séries temporais de taxas de juros (Selic, CDB, CDI) e inflação (IPCA) com cobertura mensal de 2010 a 2021.
          Tipagem aplicada: text→date, text→numeric.

  - name: novo_caged
    schema: novo_caged
    description: >
      Schema de dados do Novo CAGED.
    tables:
      - name: saldo_estoque_construcao_edificios
        description: >
          Saldo e estoque da construção de edifícios.
          Tipagem aplicada: text→int, text→float.
  - name: infomoney
    schema: infomoney
    description: >
      Schema de dados do InfoMoney.
    tables:
      - name: acoes_imob
        description: >
          Dados diários de preços de ações do setor imobiliário.

  - name: fipe
    schema: fipe
    description: >
      Schema de dados da FIPE. Contém o índice FipeZap de locação residencial
      com variações mensais e acumuladas no ano.
    tables:
      - name: indice_locacao
        description: >
          Índice FipeZap de locação residencial com variação mensal e acumulada no ano.
          Tipagem aplicada: text→date, text→numeric.

  - name: abecip
    schema: abecip
    description: >
      Schema de dados da ABECIP. Contém dados de financiamentos habitacionais
      SBPE e saldo de caderneta de poupança com cobertura mensal.
    tables:
      - name: poupanca_sbpe_mensal
        description: >
          Saldo e captação líquida da caderneta de poupança SBPE mensal.
          Contém depósitos, retiradas, captação líquida, rendimento e saldo.
          Tipagem aplicada: text→date, text→numeric.

  - name: conjuntura_bronze
    schema: conjuntura_bronze
    description: >
      Schema bronze do projeto conjuntura. Contém dados brutos tipados
      provenientes de diversas fontes do setor imobiliário e de construção civil.
    tables:
      - name: bronze_fgv_icst
        description: Índice de Confiança do Setor de Construção (ICST) da FGV-IBRE.
      - name: bronze_imob_infomoney
        description: Índice IMOB da Infomoney com dados diários de fechamento.
      - name: bronze_abramat_indice
        description: Índice ABRAMAT de custos da construção civil.
      - name: bronze_fgts_financiamentos_habitacionais
        description: Financiamentos habitacionais do FGTS por faixa e modalidade.
      - name: bronze_abecip_sbpe_financiamentos_habitacionais
        description: Financiamentos habitacionais SBPE da ABECIP.
      - name: bronze_abecip_novos_financiamentos_imobiliarios
        description: Novos financiamentos imobiliários por agente financeiro (ABECIP).
      - name: bronze_bacen_financiamentos_imobiliarios
        description: Financiamentos imobiliários PF e PJ do Banco Central.
      - name: bronze_ibge_pib_construcao_civil
        description: PIB da construção civil do IBGE.
      - name: bronze_ibge_sinapi
        description: Índice SINAPI do IBGE.
      - name: bronze_fgv_incc_m
        description: Índice Nacional de Custo da Construção (INCC-M) da FGV.
      - name: bronze_cbic_lancamentos_vendas
        description: Lançamentos e vendas do setor imobiliário da CBIC.
      - name: bronze_balancos_empresas
        description: Balanços trimestrais de empresas do setor imobiliário.
      - name: bronze_ticket_medio_empresas
        description: Ticket médio de lançamentos por empresa.
      - name: bronze_mcid_orcamento_por_acao
        description: Orçamento do MCID por ação governamental.

  - name: staging_lake
    schema: bronze
    description: >
      Camada bronze do data lake. Cada tabela é um parquet de staging/ (MinIO)
      materializado no Postgres pelo scripts/staging_para_bronze.py, via pg_duckdb.
      Tudo text, colunas em snake_case, mais as colunas de linhagem _source_file,
      _ingested_at e _source_hash. A tipagem acontece na silver.
      Carga full refresh por família (ver scripts/bronze_familias.yml).
    tables:
      # Família empreendimento_far. A origem é resolvida por padrão (a versão mais
      # recente vence), então as contagens são da carga corrente, não fixas.
      - name: novo_mcmv_far_consolidado
        description: >
          Consolidado do GFAR com as propostas FAR do Novo MCMV, do protocolo à
          contratação. 15.231 registros, 100 colunas text.
          Origem: HIS_MCIDADES_CONSOLIDADO_<aaaammdd>.
      - name: novo_mcmv_far_cad_pj_mensal
        description: >
          Cadastro PJ do empreendimento contratado (composição financeira, GPS,
          tipologia, construtora, datas). 876 registros, 85 colunas text.
          Origem: MONIT_CAD_PJ_FAR_MENSAL_<aaaamm>.
      - name: novo_mcmv_far_obra_mensal
        description: >
          Evolução física da obra, snapshot mensal. 876 registros, 43 colunas text.
          Origem: MONIT_MOV_OBRA_FAR_MENSAL_<aaaamm>.
      - name: novo_mcmv_far_financeiro_mensal
        description: >
          Série de liberações financeiras por componente. 11.596 registros, 26 colunas
          text. Origem: MONIT_MOV_FINANC_FAR_MENSAL_<aaaamm>.
      - name: dados_prioritarios_recebidos_caixa_empreendimentos
        description: >
          Snapshot de dados prioritários da CAIXA, todas as modalidades. 15.031
          registros, 45 colunas text (o dump antigo em __dados_brutos tinha essas
          mesmas linhas duplicadas 2x).
          Origem: <aaaamm>_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA.
      # Família empreendimento_rural. Origens conferidas contra a listagem da
      # staging/ (mc ls, 2026-09-01); as contagens de linha ficam de fora porque as
      # tabelas ainda não foram carregadas uma vez — preencher após o primeiro --apply.
      - name: novo_mcmv_rural_cad_pj_mensal
        description: >
          Cadastro PJ do empreendimento Rural contratado (entidade organizadora,
          composição do investimento, cisternas/efluentes, prazos). Colunas text.
          Origem: MONIT_CAD_PJ_RURAL_MENSAL_<aaaamm>, competência vigente 202607.
      - name: novo_mcmv_rural_cadastro_pf_mensal
        description: >
          Cadastro de beneficiários PF do Rural, com perfil socioeconômico
          (renda, pessoas por família, Bolsa Família, BPC). Colunas text.
          Origem: MONIT_CADASTRO_PF_RURAL_MENSAL_<aaaamm>, vigente 202607.
      - name: novo_mcmv_rural_obra_mensal
        description: >
          Evolução física da obra do Rural, snapshot mensal. Colunas text.
          Origem: MONIT_MOV_OBRA_RURAL_MENSAL_<aaaamm>, vigente 202607.
      - name: novo_mcmv_rural_financeiro_mensal
        description: >
          Série de liberações financeiras do Rural, decomposta por componente
          (obra, TS, ATEC, cisternas/efluentes, custos indiretos). Colunas text.
          Origem: MONIT_MOV_FINANC_RURAL_MENSAL_<aaaamm>, vigente 202607.
      - name: dados_prioritarios_disponibilizados_snh_empreendimentos
        description: >
          Snapshot de dados prioritários da SNH, todas as modalidades; a silver
          prioritarios_snh filtra modalidade='RURAL'. Colunas text.
          Origem: export canônico staging/sharepoint/
          dados_prioritarios_disponibilizados_snh_empreendimentos.parquet — snapshot de
          2026-08-25, sobrescrito in-place, NÃO acompanha o feed mensal.
      - name: dados_prioritarios_recebidos_bb_empreendimentos
        description: >
          Snapshot de dados prioritários do Banco do Brasil, todas as
          modalidades; a silver prioritarios_bb filtra modalidade='RURAL'.
          Mesmo layout do arquivo da CAIXA. Colunas text.
          Origem: <aaaamm>_SNH_PMCMV_DADOS_PRIORITARIOS_AF_BB, vigente 202606 — um mês
          atrás da CAIXA (202607), porque o BB envia com atraso.
      - name: int_empreendimentos_int_065_pnhr_caixa_pj
        description: >
          Histórico de empreendimentos PNHR na CAIXA (integração INT065), com
          composição de investimento e execução física. Colunas text.
          Origem: INT065_MinisterioCidades_PNHR_CAIXA_EMPREENDIMENTOS_<aaaammdd>. O feed
          para em 20241129: o PNHR é programa encerrado, a série não avança mais.
      - name: int_empreendimentos_int_057_pnhr_bb_pj
        description: >
          Histórico de empreendimentos PNHR no Banco do Brasil (integração
          INT057). Não traz nu_apf: o APF sai do número do contrato do
          empreendimento. Colunas text.
          Origem: INT057_MinisterioCidades_PNHR_BB_EMPREENDIMENTOS_<aaaammdd>, também
          parado em 20241129.
      - name: int_financeiro_int055_liberacoes_caixa_bb
        description: >
          Liberações de recurso de CAIXA e BB (integração INT055), de todos os
          programas; a silver liberacoes_pnhr filtra no_programa like '%PNHR%'.
          Não decompõe o valor por componente. Colunas text.
          Origem: INT055_MinisterioCidades_LIBERACOES_CAIXA_BB_<aaaammdd>, vigente
          20250318. Chega zipado do SFTP e é expandido para .TXT na entrada; a extensão
          de origem não entra na key de staging.
      - name: base_trabalho_social_pnhr_rural_caixa
        description: >
          Base de acompanhamento do Trabalho Social (PTS) do PNHR pela CAIXA:
          situação do TS, valores global/desembolsado e % de execução. Colunas text.
          Origem: export canônico staging/sharepoint/
          base_trabalho_social_pnhr_rural_caixa.parquet. Key exata em vez de padrão: o
          feed datado (Trabalho Social/MCMV_RURAL_TS_CAIXA_BB_<aaaamm>) vira um parquet
          por aba e o sufixo da aba muda de nome todo mês. Snapshot de 2026-08-25.
      - name: base_trabalho_social_pnhr_bb
        description: >
          Base de acompanhamento do Trabalho Social (PTS) do PNHR pelo Banco do
          Brasil. Layout próprio, diferente do da CAIXA. Colunas text.
          Origem: export canônico staging/sharepoint/base_trabalho_social_pnhr_bb.parquet,
          mesma ressalva do da CAIXA. Snapshot de 2026-08-25.

      # Família entidades_fds. Mesma resolução por padrão da família do FAR.
      - name: novo_mcmv_fds_cad_pj_mensal
        description: >
          Cadastro PJ do empreendimento FDS (Entidade Organizadora, construtora,
          UHs, composição financeira, GPS, datas). 364 registros, 90 colunas text.
          Origem: MONIT_CAD_PJ_FDS_MENSAL_<aaaamm>.
      - name: novo_mcmv_fds_obra_mensal
        description: >
          Evolução física da obra FDS, snapshot mensal (percentual previsto/realizado,
          UHs concluídas/alienadas, paralisação, invasão). 364 registros, 48 colunas text.
          Origem: MONIT_MOV_OBRA_FDS_MENSAL_<aaaamm>.
      - name: novo_mcmv_fds_financeiro_mensal
        description: >
          Série de liberações financeiras FDS por componente. APF em 6 dígitos e
          ic_credito='0' com valor negativo nas liberações reais. 16.887 registros,
          25 colunas text.
          Origem: MONIT_MOV_FINANC_FDS_MENSAL_<aaaamm>.
      - name: novo_mcmv_fds_trabalho_social_mensal
        description: >
          Acompanhamento do Trabalho Técnico Social FDS (situação, datas do PTS,
          convênio, percentual de execução, portaria). 141 registros, 15 colunas text.
          Origem: MONIT_EXEC_TS_FDS_MENSAL_<aaaamm>.
      - name: int_empreendimentos_int_059_fds_caixa_pj
        description: >
          Complementar da CAIXA (INT 059) com legado e Novo MCMV juntos; traz
          situacao_gefus, fase_contrato e no_selecao_pmcmv_e. 916 registros,
          74 colunas text.
          Origem: INT059_MinisterioCidades_FDS_CAIXA_EMPREENDIMENTOS_<aaaammdd>.
      - name: dados_prioritarios_recebidos_caixa_entregas
        description: >
          Entregas reportadas pela CAIXA, todas as modalidades. 11.677 registros,
          8 colunas text (o dump antigo em __dados_brutos tinha essas linhas duplicadas 2x).
          Origem: <aaaamm>_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA_ENTREGAS.
