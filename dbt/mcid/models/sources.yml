version: 2

sources:
  - name: raw
    schema: __dados_brutos
    description: >
      Schema de dados brutos do banco cidades.
      Contém os dados ingeridos das fontes GFAR, CAIXA e SNH para o programa MCMV.
    tables:
      - name: api_ibge_uf
        description: >
          Tabela de referência do IBGE com os 27 estados brasileiros.
          Contém sigla, nome completo e região. Usada para enriquecer dashboards.
      - name: api_ibge_regioes
        description: >
          Tabela de referência do IBGE com as 5 regiões brasileiras.
          Contém id e nome (Norte, Nordeste, Centro-Oeste, Sudeste, Sul).
      - name: dados_prioritarios_recebidos_caixa_entregas
        description: >
          Snapshot de entregas reportadas pela CAIXA. Contém 11.540 registros
          de múltiplos programas.

      # Fontes FDS (Entidades)
      - name: novo_mcmv_fds_cad_pj_mensal
        description: >
          Cadastro PJ mensal do MCMV Entidades (FDS). 343 empreendimentos
          contratados a partir de ago/2024. 89 colunas text com dados de
          Entidade Organizadora, construtora, UHs, composição financeira,
          GPS, datas, substituição de EO e indicadores. Snapshot mensal.
      - name: novo_mcmv_fds_obra_mensal
        description: >
          Evolução física da obra FDS. 343 registros (1 por empreendimento).
          47 colunas text com situação da operação, percentual previsto/realizado,
          UHs concluídas/alienadas, paralisação, invasão e datas de entrega.
      - name: novo_mcmv_fds_financeiro_mensal
        description: >
          Série temporal de liberações financeiras FDS. 16.124 registros para
          750 APFs (111 do Novo MCMV). APF em 6 dígitos. ATENÇÃO: ic_credito=0
          são liberações reais (valores negativos), usar ABS(). ic_credito=1
          são devoluções (20 registros).
      - name: novo_mcmv_fds_trabalho_social_mensal
        description: >
          Acompanhamento do Trabalho Técnico Social FDS. 89 registros com
          situação, datas de aprovação PTS, convênio, relatórios e portaria.
      
      # Fontes Complementares
      - name: int_empreendimentos_int_059_fds_caixa_pj
        description: >
          Tabela complementar da CAIXA (INT 059) com 856 registros.
          Contém dados do legado e do Novo MCMV. Importante para filtros
          como situacao_gefus e fase_contrato.
      - name: api_ibge_municipios
        description: >
          Tabela de referência do IBGE com os municípios brasileiros.
          Contém id, nome, microrregião, mesorregião e códigos relacionados.

  - name: ibge
    schema: ibge
    description: >
      Schema de dados do IBGE. Contém dados de PIB da construção civil e SINAPI
      por município, com cobertura de 2010 a 2021 para os 5.570 municípios brasileiros.
    tables:
      - name: pib_construcao
        description: >
          Produto Interno Bruto (PIB) da construção civil por município, em valores correntes e constantes.
          Tipagem aplicada: text→int, text→numeric.
      - name: sinapi
        description: >
          Índice Nacional de Custo da Construção (SINAPI) por município, em valores correntes.
          Tipagem aplicada: text→int, text→numeric.
      - name: pnadc_ocupados_construcao
        description: >
          Pessoas ocupadas na construção civil (PNAD Contínua trimestral).
          Agregado 6323, variável 4090. Tipagem aplicada: text→int, text→numeric.
      - name: pnadc_rendimento_construcao
        description: >
          Rendimento médio mensal real na construção civil (PNAD Contínua trimestral).
          Agregado 6391, variável 5932. Tipagem aplicada: text→int, text→numeric.
      - name: ibge_pim_pf_brasil
        description: >
          Pesquisa Industrial Mensal - Produção Física (PIM-PF), insumos típicos
          da construção civil.
          Agregado exigido pelos modelos: 8886 ("Produção física industrial dos
          insumos típicos da construção civil"), variáveis 11601-11604, sem
          classificação — é tabela dedicada.
          ⚠️ A Variable `IBGE_CONFIGURACOES` ainda pede o agregado 8888 ("por
          seções e atividades industriais", classificação 544[129314]), que é a
          indústria brasileira inteira, não a construção. Enquanto não for
          corrigida, esta tabela carrega a série errada.
          Tipagem aplicada: text→int, text→numeric.
      - name: ibge_pmc_construcao
        description: >
          Pesquisa Mensal de Comércio (PMC), material de construção.
          Agregado exigido pelos modelos: 8757 ("receita nominal e volume de
          vendas de materiais de construção"), variáveis 11708-11711,
          classificação 11046, categoria 56732 (índice de volume de vendas).
          ⚠️ A Variable `IBGE_CONFIGURACOES` ainda pede o agregado 8880, de
          varejo geral, cujas categorias são 56733/56734. Por isso a 56732 não
          existe na silver e o `gld_producao_fisica` deixa as colunas
          da PMC nulas — preencher com 56734 daria número plausível e falso.
          Tipagem aplicada: text→int, text→numeric.

  - name: fgv
    schema: fgv
    description: >
      Schema de dados da FGV. Contém dados de evolução do preço médio do metro quadrado
      para imóveis residenciais em 8 capitais brasileiras, com cobertura mensal de 2010 a 2021.
    tables:
      - name: icst
        description: >
          Evolução do preço médio do metro quadrado para imóveis residenciais em 8 capitais brasileiras.
          Tipagem aplicada: text→date, text→numeric.
      - name: incc_m
        description: >
          Evolução do preço médio do metro quadrado para imóveis residenciais em 8 capitais brasileiras.
          Tipagem aplicada: text→date, text→numeric.

  - name: bacen
    schema: bacen
    description: >
      Schema de dados do Banco Central. Contém dados de séries temporais de taxas de juros
      (Selic, CDB, CDI) e inflação (IPCA) com cobertura mensal de 2010 a 2021.
    tables:
      - name: financiamentos_imobiliarios
        description: >
          Séries temporais de taxas de juros (Selic, CDB, CDI) e inflação (IPCA) com cobertura mensal de 2010 a 2021.
          Tipagem aplicada: text→date, text→numeric.

  - name: novo_caged
    schema: novo_caged
    description: >
      Schema de dados do Novo CAGED.
    tables:
      - name: saldo_estoque_construcao_edificios
        description: >
          Saldo e estoque da construção de edifícios.
          Tipagem aplicada: text→int, text→float.
  - name: infomoney
    schema: infomoney
    description: >
      Schema de dados do InfoMoney.
    tables:
      - name: acoes_imob
        description: >
          Dados diários de preços de ações do setor imobiliário.

  - name: fipe
    schema: fipe
    description: >
      Schema de dados da FIPE. Contém o índice FipeZap de locação residencial
      com variações mensais e acumuladas no ano.
    tables:
      - name: indice_locacao
        description: >
          Índice FipeZap de locação residencial com variação mensal e acumulada no ano.
          Tipagem aplicada: text→date, text→numeric.

  - name: abecip
    schema: abecip
    description: >
      Schema de dados da ABECIP. Contém dados de financiamentos habitacionais
      SBPE e saldo de caderneta de poupança com cobertura mensal.
    tables:
      - name: poupanca_sbpe_mensal
        description: >
          Saldo e captação líquida da caderneta de poupança SBPE mensal.
          Contém depósitos, retiradas, captação líquida, rendimento e saldo.
          Tipagem aplicada: text→date, text→numeric.

  - name: conjuntura_manual
    schema: bronze
    description: >
      Bronze do conjuntura que não vem do lake. São cargas manuais: chegam pela
      planilha oficial do boletim (boletim.xlsx), revisadas à mão, sem DAG de
      ingestão. O dbt as lê mas não as produz — o conteúdo é versionado em
      `scripts/database/`, e o endereço atual foi fixado pelo 0010.
    tables:
      - name: bronze_manual_dados_mensais
        description: >
          Série mensal da planilha do boletim: CAGED, PNAD rendimento, índices
          de preços, crédito Bacen, SBPE por banco, financiamento PF MCMV por
          faixa e valor médio FGTS.
      - name: bronze_manual_dados_trimestrais
        description: >
          Série trimestral da planilha do boletim: PIB %, CBIC, balanço das
          empresas, ocupados PNAD, INCC trimestral, ticket médio e
          financiamentos habitacionais.
      - name: bronze_manual_empresas_balanco_lancamentos_vendas
        description: >
          Balanços das construtoras MRV, Cury, Tenda, Direcional, Pacaembu e
          Plano & Plano. Já chega tipado.
      - name: bronze_manual_fgts_valor_medio_imoveis
        description: >
          FGTS — valor médio dos imóveis em R$ e variações, total e Faixa 1.
      - name: bronze_manual_sbpe_financiamentos_aquisicao_bancos
        description: >
          SBPE — financiamentos de construção e aquisição por banco, com a
          captação líquida da poupança.
      - name: bronze_cbic_lancamentos_vendas
        description: Lançamentos e vendas de imóveis por região (CBIC), carga manual.
