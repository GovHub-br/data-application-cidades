      Uma linha por edição do boletim e indicador com o quadro Índices da
      Construção (variação %) da página 7, reproduzindo as colunas do
      impresso.
    columns:
      - name: 'edicao'
        description: >
          Trimestre a que a linha se refere, no formato usado pelo boletim.
      - name: 'indicador'
        description: >
          Rótulo da linha do quadro, correspondente à coluna indicador do
          impresso.
      - name: 'Índice IMOB'
        description: >
          Valor da coluna Índice IMOB do quadro impresso, para a linha e a
          edição indicadas.
      - name: 'Índice ABRAMAT'
        description: >
          Valor da coluna Índice ABRAMAT do quadro impresso, para a linha e
          a edição indicadas.
      - name: 'Índice FipeZap'
        description: >
          Valor da coluna Índice FipeZap do quadro impresso, para a linha e
          a edição indicadas.
      - name: 'Índice ICST'
        description: >
          Valor da coluna Índice ICST do quadro impresso, para a linha e a
          edição indicadas.
  - name: gold_boletim_valores
    description: >
      Uma linha por célula dos quadros do boletim, com o modelo de origem, a
      página, a edição, o rótulo da linha, o nome da coluna e o valor numérico
      quando aplicável.
    columns:
      - name: 'modelo'
        description: >
          Modelo do quadro a que a célula pertence.
      - name: 'pagina'
        description: >
          Página do boletim em que o quadro é impresso.
      - name: 'quadro'
        description: >
          Título do quadro tal como aparece no impresso.
      - name: 'edicao'
        description: >
          Trimestre a que a célula se refere, no formato usado pelo boletim.
      - name: 'linha'
        description: >
          Rótulo da linha do quadro.
      - name: 'coluna'
        description: >
          Nome da coluna do quadro.
      - name: 'valor'
        description: >
          Valor numérico da célula, nulo quando o conteúdo não é numérico.
