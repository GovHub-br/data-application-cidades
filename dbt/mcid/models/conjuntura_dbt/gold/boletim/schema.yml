version: 2

# Quadros do Boletim de Conjuntura materializados como tabela.
#
# Cada modelo reproduz um quadro impresso, com as linhas e as colunas do
# original. A coluna `edicao` identifica o trimestre; o filtro do painel
# seleciona a edição, e por isso a série de todas as edições convive na
# mesma tabela.

models:
  - name: gold_boletim_p1_pib_construcao_civil_em_de_crescimento
    description: >
      Uma linha por edição do boletim e indicador com o quadro PIB Construção
      Civil (em % de Crescimento) da página 1, reproduzindo as colunas do
      impresso.
    columns:
      - name: 'edicao'
        description: >
          Trimestre a que a linha se refere, no formato usado pelo boletim.
      - name: 'indicador'
        description: >
          Rótulo da linha do quadro, correspondente à coluna indicador do
          impresso.
      - name: '4 trim. antes'
        description: >
          Valor da coluna 4 trim. antes do quadro impresso, para a linha e a
          edição indicadas.
      - name: '3 trim. antes'
        description: >
          Valor da coluna 3 trim. antes do quadro impresso, para a linha e a
          edição indicadas.
      - name: '2 trim. antes'
        description: >
          Valor da coluna 2 trim. antes do quadro impresso, para a linha e a
          edição indicadas.
      - name: 'trim. anterior'
        description: >
          Valor da coluna trim. anterior do quadro impresso, para a linha e
          a edição indicadas.
      - name: 'trimestre selecionado'
        description: >
          Valor da coluna trimestre selecionado do quadro impresso, para a
          linha e a edição indicadas.
