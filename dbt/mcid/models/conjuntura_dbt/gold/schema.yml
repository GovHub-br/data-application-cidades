version: 2

# Gold do produto Conjuntura: um modelo por quadro do boletim, organizado
# pelas páginas do impresso.
#
# As descrições abaixo documentam O DADO — que fenômeno mede, o que é uma
# linha, em que unidade e de que período. Não registram se a origem é manual
# ou automatizada, nem por qual model ou DAG o dado passou: isso é assunto do
# time de desenvolvimento e não é metadado de consumo do catálogo.

models:
  # PÁGINA 1 — PIB DA CONSTRUÇÃO CIVIL
  - name: gld_pib_construcao_civil
    description: >
      Uma linha por trimestre com as variações percentuais do PIB da
      construção civil apuradas pelo IBGE, contra o trimestre anterior, contra
      o mesmo trimestre do ano anterior, acumulada no ano e acumulada em
      quatro trimestres.
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: ano
        description: >
          Ano do período de referência.
      - name: var_trim_trim_anterior
        description: >
          Variação percentual do produto da construção em relação ao
          trimestre imediatamente anterior.
      - name: var_trim_mesmo_trim_ano_anterior
        description: >
          Variação percentual do produto da construção em relação ao mesmo
          trimestre do ano anterior.
      - name: var_acumulada_ano
        description: >
          Variação percentual do produto da construção acumulada desde o
          início do ano.
      - name: var_acumulada_4_trimestres
        description: >
          Variação percentual do produto da construção acumulada em quatro
          trimestres.
  - name: gld_pib_construcao_civil_pct
    description: >
      Uma linha por trimestre com as três taxas de variação do PIB da
      construção civil publicadas no boletim: contra o trimestre imediatamente
      anterior, acumulada no ano e acumulada em quatro trimestres.
  # PÁGINA 2 — BALANÇO DAS EMPRESAS + FINANCIAMENTOS IMOBILIÁRIOS
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: ano
        description: >
          Ano do período de referência.
      - name: trimestre
        description: >
          Trimestre do período de referência.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: var_trim_trim_anterior
        description: >
          Variação percentual do produto da construção em relação ao
          trimestre imediatamente anterior.
      - name: var_acumulada_ano
        description: >
          Variação percentual do produto da construção acumulada desde o
          início do ano.
      - name: var_acumulada_4_trimestres
        description: >
          Variação percentual do produto da construção acumulada em quatro
          trimestres.
  - name: gld_balancos_empresas
    description: >
      Uma linha por incorporadora de capital aberto e trimestre com as
      unidades lançadas e vendidas e suas variações percentuais contra o
      trimestre anterior, contra o mesmo trimestre do ano anterior e no
      acumulado do ano.
    columns:
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: edicao
        description: >
          Trimestre a que a observação pertence, no formato usado pelo
          boletim.
      - name: ano
        description: >
          Ano do período de referência.
      - name: trimestre
        description: >
          Trimestre do período de referência.
      - name: empresa
        description: >
          Incorporadora habitacional a que os números se referem.
      - name: lancamentos
        description: >
          Unidades habitacionais lançadas no trimestre.
      - name: var_lancamentos_tri_anterior
        description: >
          Variação percentual das unidades lançadas em relação ao trimestre
          imediatamente anterior.
      - name: var_lancamentos_mesmo_tri_ano_anterior
        description: >
          Variação percentual das unidades lançadas em relação ao mesmo
          trimestre do ano anterior.
      - name: var_lancamentos_acumulado_periodo_ano_anterior
        description: >
          Variação percentual das unidades lançadas no acumulado do ano
          contra igual período do ano anterior.
      - name: vendas
        description: >
          Unidades habitacionais vendidas no trimestre.
      - name: var_vendas_tri_anterior
        description: >
          Variação percentual das unidades vendidas em relação ao trimestre
          imediatamente anterior.
      - name: var_vendas_mesmo_tri_ano_anterior
        description: >
          Variação percentual das unidades vendidas em relação ao mesmo
          trimestre do ano anterior.
      - name: var_vendas_acumulado_periodo_ano_anterior
        description: >
          Variação percentual das unidades vendidas no acumulado do ano
          contra igual período do ano anterior.
  - name: gld_balancos_empresas_totais
    description: >
      Uma linha por trimestre com o total de unidades lançadas e vendidas pelo
      conjunto das incorporadoras acompanhadas e as variações percentuais
      contra o trimestre anterior, o mesmo trimestre do ano anterior e o
      acumulado do ano.
    columns:
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: edicao
        description: >
          Trimestre a que a observação pertence, no formato usado pelo
          boletim.
      - name: ano
        description: >
          Ano do período de referência.
      - name: trimestre
        description: >
          Trimestre do período de referência.
      - name: lancamentos_totais
        description: >
          Total de unidades habitacionais lançadas no trimestre pelo
          conjunto das incorporadoras acompanhadas.
      - name: var_lancamentos_totais_tri_anterior
        description: >
          Variação percentual do total lançado em relação ao trimestre
          imediatamente anterior.
      - name: var_lancamentos_totais_mesmo_tri_ano_anterior
        description: >
          Variação percentual do total lançado em relação ao mesmo trimestre
          do ano anterior.
      - name: var_lancamentos_totais_acumulado_mesmo_periodo_ano_anterior
        description: >
          Variação percentual do total lançado no acumulado do ano contra
          igual período do ano anterior.
      - name: vendas_totais
        description: >
          Total de unidades habitacionais vendidas no trimestre pelo
          conjunto das incorporadoras acompanhadas.
      - name: var_vendas_totais_tri_anterior
        description: >
          Variação percentual do total vendido em relação ao trimestre
          imediatamente anterior.
      - name: var_vendas_totais_mesmo_tri_ano_anterior
        description: >
          Variação percentual do total vendido em relação ao mesmo trimestre
          do ano anterior.
      - name: var_vendas_totais_acumulado_mesmo_periodo_ano_anterior
        description: >
          Variação percentual do total vendido no acumulado do ano contra
          igual período do ano anterior.
  - name: gld_financiamentos_imobiliarios_pf_pj
    description: >
      Uma linha por mês com as concessões de crédito imobiliário, taxas de
      juros e inadimplência apuradas pelo BACEN, separadas entre pessoa física
      e pessoa jurídica.
    columns:
      - name: data
        description: >
          Primeiro dia do mês a que a observação se refere.
      - name: concessoes_pf_rs_mi
        description: >
          Crédito imobiliário concedido a pessoa física no mês, em milhões
          de reais.
      - name: concessoes_pj_rs_mi
        description: >
          Crédito imobiliário concedido a pessoa jurídica no mês, em milhões
          de reais.
      - name: taxa_juros_pf_aa
        description: >
          Taxa de juros média das concessões a pessoa física, em percentual
          ao ano.
      - name: taxa_juros_pj_aa
        description: >
          Taxa de juros média das concessões a pessoa jurídica, em
          percentual ao ano.
      - name: inadimplencia_pf_pct
        description: >
          Parcela da carteira de pessoa física em atraso, em percentual.
      - name: inadimplencia_pj_pct
        description: >
          Parcela da carteira de pessoa jurídica em atraso, em percentual.
  - name: gld_financiamentos_habitacionais
    description: >
      Uma linha por trimestre com as unidades habitacionais financiadas pelo
      FGTS na produção e pelo SBPE na construção, no trimestre e no acumulado
      de doze meses.
  # PÁGINA 3 — EMPREGOS · PNAD · PRODUÇÃO FÍSICA E VENDAS · NOVOS FINANCIAMENTOS
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: ano
        description: >
          Ano do período de referência.
      - name: trimestre
        description: >
          Trimestre do período de referência.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: edicao
        description: >
          Trimestre a que a observação pertence, no formato usado pelo
          boletim.
      - name: financ_hab_fgts_pj
        description: >
          Unidades habitacionais cuja produção foi financiada com recursos
          do fundo de garantia no trimestre.
      - name: financ_hab_fgts_pj_acumulado_12_meses
        description: >
          Unidades habitacionais financiadas com recursos do fundo de
          garantia, acumuladas em doze meses.
      - name: financ_hab_sbpe_constr
        description: >
          Unidades habitacionais cuja construção foi financiada com recursos
          da poupança no trimestre.
      - name: financ_hab_sbpe_constr_acumulado_12_meses
        description: >
          Unidades habitacionais com construção financiada por recursos da
          poupança, acumuladas em doze meses.
  - name: gld_empregos_caged
    description: >
      Uma linha por mês com a criação líquida e o estoque de empregos formais
      na construção civil apurados pelo Novo CAGED, abertos entre construção
      de edifícios, serviços especializados e o total do setor.
    columns:
      - name: ano
        description: >
          Ano do período de referência.
      - name: mes
        description: >
          Mês do período de referência.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: edificios_saldo
        description: >
          Diferença entre admissões e desligamentos no mês na construção de
          edifícios, positiva quando houve criação líquida de postos.
      - name: edificios_saldo_var_mes
        description: >
          Variação percentual do saldo mensal na construção de edifícios em
          relação ao mês anterior.
      - name: edificios_saldo_var_12_meses
        description: >
          Variação percentual do saldo na construção de edifícios acumulada
          em doze meses.
      - name: edificios_estoque
        description: >
          Quantidade total de postos de trabalho formais na construção de
          edifícios ao fim do mês.
      - name: servicos_especializados_saldo
        description: >
          Diferença entre admissões e desligamentos no mês em serviços
          especializados para construção, positiva quando houve criação
          líquida de postos.
      - name: servicos_especializados_saldo_var_mes
        description: >
          Variação percentual do saldo mensal em serviços especializados
          para construção em relação ao mês anterior.
      - name: servicos_especializados_saldo_var_12_meses
        description: >
          Variação percentual do saldo em serviços especializados para
          construção acumulada em doze meses.
      - name: servicos_especializados_estoque
        description: >
          Quantidade total de postos de trabalho formais em serviços
          especializados para construção ao fim do mês.
      - name: total_construcao_saldo
        description: >
          Diferença entre admissões e desligamentos no mês no conjunto da
          construção civil, positiva quando houve criação líquida de postos.
      - name: total_construcao_saldo_var_mes
        description: >
          Variação percentual do saldo mensal no conjunto da construção
          civil em relação ao mês anterior.
      - name: total_construcao_saldo_var_12_meses
        description: >
          Variação percentual do saldo no conjunto da construção civil
          acumulada em doze meses.
      - name: total_construcao_estoque
        description: >
          Quantidade total de postos de trabalho formais no conjunto da
          construção civil ao fim do mês.
  - name: gld_pnad_ocupados
    description: >
      Uma linha por trimestre móvel com a população ocupada na construção
      civil e no total da economia, em milhares de pessoas, conforme a PNAD
      Contínua do IBGE.
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: periodo_nome
        description: >
          Nome do trimestre móvel, indicando os três meses que o compõem.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: ocupados_construcao_mil
        description: >
          População ocupada na construção civil, em milhares de pessoas.
      - name: ocupados_total_mil
        description: >
          População ocupada no conjunto da economia, em milhares de pessoas.
  - name: gld_pnad_rendimento
    description: >
      Uma linha por trimestre móvel com o rendimento médio real de quem
      trabalha na construção civil e do conjunto dos ocupados, em reais,
      conforme a PNAD Contínua do IBGE.
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: periodo_nome
        description: >
          Nome do trimestre móvel, indicando os três meses que o compõem.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: rendimento_construcao_rs
        description: >
          Rendimento médio real de quem trabalha na construção civil, em
          reais.
      - name: rendimento_total_rs
        description: >
          Rendimento médio real do conjunto dos ocupados, em reais.
  - name: gld_producao_fisica
    description: >
      Uma linha por mês com as variações da produção física dos insumos
      típicos da construção e do volume de vendas de material de construção
      apuradas pelo IBGE, no mês, no acumulado do ano e em doze meses.
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: pim_pf_var_mes
        description: >
          Variação percentual da produção física dos insumos da construção
          em relação ao mês anterior.
      - name: pim_pf_var_acum_ano
        description: >
          Variação percentual da produção física acumulada desde o início do
          ano.
      - name: pim_pf_var_12_meses
        description: >
          Variação percentual da produção física acumulada em doze meses.
      - name: pmc_var_mes
        description: >
          Variação percentual do volume de vendas de material de construção
          em relação ao mês anterior.
      - name: pmc_var_acum_ano
        description: >
          Variação percentual do volume de vendas acumulada desde o início
          do ano.
      - name: pmc_var_12_meses
        description: >
          Variação percentual do volume de vendas acumulada em doze meses.
  - name: gld_novos_financiamentos_banco
    description: >
      Uma linha por mês com as unidades e o valor de novos financiamentos
      imobiliários do SBPE acumulados no ano, abertos por instituição
      financeira, conforme a ABECIP.
  # PÁGINA 4 — CRÉDITO/PIB · FGTS/FS-PF POR RENDA · UH POR CONDIÇÃO · FUNDING
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: ano
        description: >
          Ano do período de referência.
      - name: mes
        description: >
          Mês do período de referência.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: abecip_sbpe_fin_uh_acum_caixa
        description: >
          Unidades financiadas pela Caixa Econômica Federal desde o início
          do ano até o mês de referência.
      - name: abecip_sbpe_fin_uh_acum_bradesco
        description: >
          Unidades financiadas pelo Bradesco desde o início do ano até o mês
          de referência.
      - name: abecip_sbpe_fin_uh_acum_itau
        description: >
          Unidades financiadas pelo Itaú Unibanco desde o início do ano até
          o mês de referência.
      - name: abecip_sbpe_fin_uh_acum_santander
        description: >
          Unidades financiadas pelo Santander desde o início do ano até o
          mês de referência.
      - name: abecip_sbpe_fin_uh_acum_bb
        description: >
          Unidades financiadas pelo Banco do Brasil desde o início do ano
          até o mês de referência.
      - name: abecip_sbpe_fin_uh_acum_demais
        description: >
          Unidades financiadas pelas demais instituições desde o início do
          ano até o mês de referência.
      - name: abecip_sbpe_fin_uh_acum_total
        description: >
          Unidades financiadas pelo conjunto das instituições desde o início
          do ano até o mês de referência.
      - name: abecip_sbpe_fin_milhoes_acum_caixa
        description: >
          Valor financiado pela Caixa Econômica Federal desde o início do
          ano até o mês de referência, em milhões de reais.
      - name: abecip_sbpe_fin_milhoes_acum_bradesco
        description: >
          Valor financiado pelo Bradesco desde o início do ano até o mês de
          referência, em milhões de reais.
      - name: abecip_sbpe_fin_milhoes_acum_itau
        description: >
          Valor financiado pelo Itaú Unibanco desde o início do ano até o
          mês de referência, em milhões de reais.
      - name: abecip_sbpe_fin_milhoes_acum_santander
        description: >
          Valor financiado pelo Santander desde o início do ano até o mês de
          referência, em milhões de reais.
      - name: abecip_sbpe_fin_milhoes_acum_bb
        description: >
          Valor financiado pelo Banco do Brasil desde o início do ano até o
          mês de referência, em milhões de reais.
      - name: abecip_sbpe_fin_milhoes_acum_demais
        description: >
          Valor financiado pelas demais instituições desde o início do ano
          até o mês de referência, em milhões de reais.
      - name: abecip_sbpe_fin_milhoes_acum_total
        description: >
          Valor financiado pelo conjunto das instituições desde o início do
          ano até o mês de referência, em milhões de reais.
  - name: gld_credito_pib
    description: >
      Uma linha por mês com o saldo da carteira de crédito imobiliário
      expresso como percentual do Produto Interno Bruto, conforme o BACEN.
    columns:
      - name: data
        description: >
          Último dia do mês a que a observação se refere.
      - name: credito_imobiliario_pib_pct
        description: >
          Saldo da carteira de crédito imobiliário expresso como percentual
          do Produto Interno Bruto.
  - name: gld_financiamento_pf_faixa
    description: >
      Uma linha por mês com as unidades habitacionais e o valor financiado a
      pessoa física pelo FGTS, abertos por faixa de renda familiar do MCMV,
      faixa de classe média e operações sem faixa atribuída.
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: ano
        description: >
          Ano do período de referência.
      - name: mes
        description: >
          Mês do período de referência.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: trimestre
        description: >
          Trimestre do período de referência.
      - name: financiamento_pf_uh_total
        description: >
          Unidades habitacionais financiadas a pessoa física no conjunto das
          faixas.
      - name: financiamento_pf_valor_total
        description: >
          Valor financiado a pessoa física no conjunto das faixas, em
          milhões de reais.
      - name: financiamento_pf_uh_faixa_1
        description: >
          Unidades habitacionais financiadas a pessoa física na faixa de
          menor renda do programa.
      - name: financiamento_pf_valor_faixa_1
        description: >
          Valor financiado a pessoa física na faixa de menor renda do
          programa, em milhões de reais.
      - name: financiamento_pf_uh_faixa_2
        description: >
          Unidades habitacionais financiadas a pessoa física na segunda
          faixa de renda do programa.
      - name: financiamento_pf_valor_faixa_2
        description: >
          Valor financiado a pessoa física na segunda faixa de renda do
          programa, em milhões de reais.
      - name: financiamento_pf_uh_faixa_3
        description: >
          Unidades habitacionais financiadas a pessoa física na terceira
          faixa de renda do programa.
      - name: financiamento_pf_valor_faixa_3
        description: >
          Valor financiado a pessoa física na terceira faixa de renda do
          programa, em milhões de reais.
      - name: financiamento_pf_uh_classe_media
        description: >
          Unidades habitacionais financiadas a pessoa física na faixa de
          classe média.
      - name: financiamento_pf_valor_classe_media
        description: >
          Valor financiado a pessoa física na faixa de classe média, em
          milhões de reais.
      - name: financiamento_pf_uh_nao_classificado
        description: >
          Unidades habitacionais financiadas a pessoa física em operações
          sem faixa atribuída.
      - name: financiamento_pf_valor_nao_classificado
        description: >
          Valor financiado a pessoa física em operações sem faixa atribuída,
          em milhões de reais.
  - name: gld_uh_condicao_uso
    description: >
      Uma linha por mês com as unidades habitacionais financiadas separadas
      entre imóveis novos e usados, distinguindo os recursos do FGTS dos
      recursos do SBPE destinados à aquisição.
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: ano
        description: >
          Ano do período de referência.
      - name: mes
        description: >
          Mês do período de referência.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: fgts_pf_uh_novos
        description: >
          Unidades novas financiadas a pessoa física com recursos do fundo
          de garantia.
      - name: fgts_pf_uh_usados
        description: >
          Unidades usadas financiadas a pessoa física com recursos do fundo
          de garantia.
      - name: fgts_pf_milhoes_novos
        description: >
          Valor financiado em unidades novas com recursos do fundo de
          garantia, em milhões de reais.
      - name: fgts_pf_milhoes_usados
        description: >
          Valor financiado em unidades usadas com recursos do fundo de
          garantia, em milhões de reais.
