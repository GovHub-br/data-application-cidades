version: 2

# Bronze do produto Conjuntura: cada modelo preserva integralmente o conteúdo
# de uma origem institucional, sem recorte nem reinterpretação.
#
# As descrições documentam O DADO — que fenômeno a origem mede, o que é uma
# linha, em que unidade e de que período. Não registram por onde o dado passou
# nem se a origem é consultada por interface ou por arquivo: isso é assunto do
# time de desenvolvimento e não é metadado de consumo do catálogo.
#
# Espelho textual do parquet, então o teste que importa é o de layout. A lista
# `colunas` de cada tabela é o contrato aceito hoje: mudou na origem, atualizar
# a lista é aceitar.

models:
  - name: bronze_abecip_financiamentos
    description: >
      Financiamento imobiliário com recursos da poupança, separado entre
      destinação à construção e à aquisição, em unidades e em milhões de
      reais, por mês.
    tests:
      - sem_drift_de_colunas:
          colunas:
            - column_1
            - "Construção"
            - "Aquisição "
            - Total
            - "Construção_2"
            - "Aquisição _2"
            - Total_2
            - filename
  - name: bronze_abecip_instituicoes
    description: >
