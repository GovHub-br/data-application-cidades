          load_mode: overwrite   # a consulta devolve a série inteira
          dag: credito_pib_ingest_dag
          linhas_minimas: 73   # metade do observado em 2026-08-29 (146)
      - name: bacen_financiamentos_imobiliarios
        description: "Séries do SGS do BACEN (BACEN_SERIES): um parquet por série (<tipo>.parquet), colunas data e valor em texto."
        meta:
          caminho: staging/bacen/financiamentos_imobiliarios
          load_mode: overwrite
          dag: bacen_sgs_ingest_dag
          linhas_minimas: 1   # metade do observado em 2026-08-29 (1)
      - name: fgv_icst
        description: "Índice de Confiança da Construção (FGV), com e sem ajuste sazonal."
