version: 2

sources:
  - name: lake_staging
    description: >
      Fontes estruturadas do lake utilizadas pelo produto Conjuntura. Cada
      tabela representa uma origem institucional submetida ao contrato de
      ingestão, rastreabilidade e qualidade do produto.
    # `meta.dag` diz qual DAG de ingestão produz o arquivo. É DECLARAÇÃO, não
    # inferência: 12 das 31 puderam ser resolvidas lendo a chamada
    # `registros_para_staging_parquet(fonte, dado)` no código, mas as outras 19
    # não são conhecíveis pelo repo —
    #
    #   - as 5 de `sftp/` chegam por transferência do agente operador; não há
    #     DAG que as escreva, e o campo fica ausente de propósito;
    #   - as do IBGE saem de `ibge_ingest_dag` (API v3); a
    #     `ibge_pnad_construcao_sidra_ingest_dag` grava `pnad_construcao_ocupados`
    #     e `pnad_construcao_rendimento` (`ibge_sidra_*`), reserva da v3 para o
    #     PNAD, sem leitor além do bronze.
    #
    # Quem souber a resposta acrescenta a linha; o catálogo passa a mostrar a
    # DAG de origem do dado sem que ninguém precise ler código.
    schema: staging
    meta:
      bucket: data-lake-mcid
      camada: staging
      governance:
        product: conjuntura
        owner_key: mcid_data_engineering
        classification: restricted
        rag_publication: prohibited
    tables:
      - name: abecip_financiamentos
        description: "Financiamentos SBPE por modalidade (Construção/Aquisição), mensal desde 2002. XLSX público da ABECIP."
        meta:
          caminho: staging/abecip/financiamentos_modalidade
          load_mode: overwrite   # cada edição traz a série inteira
          dag: abecip_financiamentos_ingest_dag
          linhas_minimas: 147   # metade do observado em 2026-08-29 (294)
      - name: abecip_instituicoes
        description: "Financiamentos SBPE por instituição financeira e modalidade. Extração do relatório mensal — UMA competência por arquivo, não série."
        meta:
          caminho: staging/abecip/financiamentos_por_instituicao.parquet
          linhas_minimas: 16   # metade do observado em 2026-08-29 (33)
      - name: abecip_poupanca_sbpe
        description: "Depósitos, retiradas, captação líquida, rendimento e saldo da poupança SBPE."
        meta:
          caminho: staging/abecip/poupanca_sbpe_mensal
          load_mode: overwrite   # cada edição traz a série inteira
          dag: abecip_poupanca_trimestral_ingest_dag
          linhas_minimas: 267   # metade do observado em 2026-08-29 (535)
      - name: bacen_credito_pib
        description: "Razão crédito imobiliário / PIB (BACEN Olinda, painel Mercado Imobiliário)."
