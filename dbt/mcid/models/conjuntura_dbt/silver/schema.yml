version: 2

# Documentação dos modelos silver do conjuntura contínuo, organizada pelas
# páginas/seções do Boletim de Conjuntura do Setor Habitacional (ref.: 4T2025).

# Legenda:
#   [OK]         pronto e materializado
#   [A-FAZER]    automatizável — falta implementar (portar DAG / novo endpoint / recorte IBGE)
#   [MANUAL]     inserir na mão (tabela Postgres, como o empresas)
#   [DERIVADO]   calcular a partir de dados que já temos (no gold)
#   [SEM FONTE]  não teremos o dado (sem acesso / descartado)
models:
  # PÁGINA 1 — 1. PIB DA CONSTRUÇÃO CIVIL  +  2. LANÇAMENTOS E VENDAS
  - name: silver_continuo_ibge_pib_construcao_civil
    description: >
      Uma linha por trimestre e variável com o PIB da construção civil apurado
      pelo IBGE, incluindo o valor do índice e as taxas de variação da série.
    columns:
      - name: periodo
        description: >
          Rótulo do período a que a observação se refere.
      - name: data_referencia
        description: >
          Primeiro dia do período a que a observação se refere.
      - name: variavel_id
        description: >
          Código da variável pesquisada, conforme a numeração da pesquisa de
          origem.
      - name: variavel
        description: >
          Nome da variável pesquisada, que define o que o valor da linha
          mede.
      - name: unidade
        description: >
          Unidade de medida em que o valor é expresso.
      - name: localidade_id
        description: >
          Código da localidade a que a observação se refere.
      - name: localidade
        description: >
          Nome da localidade a que a observação se refere.
      - name: classificacao_id
        description: >
          Código do eixo de classificação que recorta a pesquisa.
      - name: classificacao
        description: >
          Nome do eixo de classificação que recorta a pesquisa.
      - name: categoria_id
        description: >
          Código da categoria dentro do eixo de classificação.
      - name: categoria
        description: >
          Nome da categoria dentro do eixo de classificação, que delimita o
          subconjunto observado.
      - name: valor
        description: >
          Valor apurado para a variável e o recorte desta linha, na unidade
          indicada.
      - name: dt_ingest
        description: >
          Momento em que o registro entrou no acervo.
  - name: silver_continuo_pib_construcao_civil_pct
    description: >
      Uma linha por trimestre com as três taxas de variação do PIB da
      construção civil: contra o trimestre imediatamente anterior, acumulada
      no ano e acumulada em quatro trimestres.
    columns:
      - name: periodo
        description: >
          Rótulo do trimestre a que a observação se refere.
      - name: trimestre
        description: >
          Trimestre do período de referência.
      - name: ano
        description: >
          Ano do período de referência.
      - name: pib_const_trimestre_anterior
        description: >
          Variação percentual do produto da construção em relação ao
          trimestre imediatamente anterior.
      - name: pib_const_taxa_acumulada_ano
        description: >
          Variação percentual do produto da construção acumulada desde o
          início do ano.
      - name: pib_const_taxa_acumulada_4_trimestres
        description: >
          Variação percentual do produto da construção acumulada em quatro
          trimestres.
