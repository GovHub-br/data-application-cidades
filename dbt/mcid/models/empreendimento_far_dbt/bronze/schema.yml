version: 2

models:

  - name: bronze_far_consolidado
    description: >
      Bronze — cópia fiel do GFAR consolidado (propostas e contratos FAR do Novo
      MCMV), lida de mcmv_staging.novo_mcmv_far_consolidado via MinIO/DuckDB.
      Cobre da proposta protocolizada à contratação. Grão: 1 linha por linha da
      fonte, sem dedup. Requer target staging_duckdb.
    meta:
      tags: [bronze, far, empreendimento]
    columns:
      - name: id_proposta
        description: Identificador único da proposta no GFAR (UUID).
      - name: apf
        description: APF normalizado para 8 dígitos (chave de integração principal).
      - name: portaria_contratacao
        description: Número da portaria MCID de seleção/contratação.
      - name: co_situacao_contratada
        description: "Situação da contratação: 1=Contratado, 2=Distratado, 3=Outro, NULL=Não contratado."
      - name: proponente_nome
        description: Nome social do proponente (ente público ou construtora).
      - name: proponente_cnpj
        description: CNPJ do proponente (apenas dígitos).
      - name: tomador_nome
        description: Nome social do tomador do financiamento.
      - name: tomador_cnpj
        description: CNPJ do tomador (apenas dígitos).
      - name: empreendimento_nome
        description: Nome do empreendimento (prioriza nome de contratação sobre protocolo).
      - name: qt_uh
        description: Quantidade de unidades habitacionais.
      - name: co_tipo_edificacao
        description: "Tipologia: 1=Casa Térrea, 2=Apartamento, 3=Sobrado, 4=Misto."
      - name: valor_far
        description: Valor do empréstimo FAR em R$ (numeric 15,2).
      - name: valor_contrapartidas
        description: Valor total de contrapartidas em R$ (numeric 15,2).
      - name: source_file
        description: Arquivo de origem na staging (contém a data no nome).
        data_tests: [not_null]
      - name: hash_linha
        description: Hash de conteúdo da linha (_source_hash da staging).
      - name: dt_referencia
        description: Mês de referência do snapshot (derivado do nome do arquivo).

  - name: bronze_far_cadastro_pj
    description: >
      Bronze — cópia fiel do cadastro PJ mensal (empreendimento contratado),
      lida de mcmv_staging.novo_mcmv_far_cad_pj_mensal. Composição financeira,
      coordenadas GPS, tipologia, construtora, datas-chave. Requer staging_duckdb.
    meta:
      tags: [bronze, far, empreendimento]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
      - name: construtora_nome
        description: Nome da construtora responsável.
      - name: construtora_cnpj
        description: CNPJ da construtora (apenas dígitos).
      - name: qt_uh
        description: Quantidade de unidades habitacionais contratadas.
      - name: vr_emprestimo_far
        description: Valor do empréstimo FAR em R$.
      - name: vr_total_investimento
        description: Valor total do investimento (FAR + contrapartidas) em R$.
      - name: dt_contratacao
        description: Data de assinatura do contrato.
      - name: dt_inicio_obra
        description: Data de início efetivo da obra.
      - name: dt_previsao_conclusao
        description: Data prevista de conclusão da obra.
      - name: source_file
        data_tests: [not_null]
      - name: hash_linha
        description: Hash de conteúdo da linha.
      - name: dt_referencia
        description: Mês de referência do snapshot.

  - name: bronze_far_obra_mensal
    description: >
      Bronze — cópia fiel da evolução física da obra (snapshot mensal), lida de
      mcmv_staging.novo_mcmv_far_obra_mensal. Percentual previsto/realizado,
      situação, UHs concluídas, datas de paralisação/retomada/entrega.
    meta:
      tags: [bronze, far, empreendimento]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
      - name: co_situacao_obra
        description: "Código da situação: 1=Não iniciada, 2=Paralisada, 11=Em andamento."
      - name: pct_obra_prevista
        description: Percentual de obra previsto para a data de referência (0-100).
      - name: pct_obra_realizada
        description: Percentual de obra efetivamente realizado (0-100).
      - name: dt_conclusao_obra
        description: Data de conclusão da obra (quando concluída).
      - name: dt_entrega
        description: Data de entrega do empreendimento aos beneficiários.
      - name: dt_paralisacao
        description: Data de paralisação da obra (quando paralisada).
      - name: dt_movimento
        description: Data de referência do snapshot.
      - name: source_file
        data_tests: [not_null]
      - name: hash_linha
        description: Hash de conteúdo da linha.
      - name: dt_referencia
        description: Mês de referência do snapshot.

  - name: bronze_far_financeiro_mensal
    description: >
      Bronze — cópia fiel da série de liberações financeiras, lida de
      mcmv_staging.novo_mcmv_far_financeiro_mensal. Cada linha = uma liberação de
      recurso com decomposição por componente. APF em 6 dígitos → normalize_apf.
    meta:
      tags: [bronze, far, empreendimento]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
      - name: co_tipo_movimento
        description: "Tipo: 1=Liberação obra, 5=INCC/ajuste."
      - name: vr_liberado
        description: Valor total liberado nesta operação em R$.
      - name: vr_pago_obra
        description: Parcela destinada à obra/edificação em R$.
      - name: vr_pago_terreno
        description: Parcela destinada ao terreno em R$.
      - name: vr_pago_trabalho_social
        description: Parcela destinada ao trabalho social (PTS) em R$.
      - name: vr_pago_incc
        description: Parcela de ajuste INCC em R$.
      - name: dt_liberacao
        description: Data efetiva da liberação do recurso.
      - name: dt_movimento
        description: Data de registro/movimento no sistema.
      - name: source_file
        data_tests: [not_null]
      - name: hash_linha
        description: Hash de conteúdo da linha.

  - name: bronze_far_contratacao
    description: >
      Bronze — cópia fiel de mcmv_staging.novo_mcmv_far_contratacao. Fonte
      praticamente vazia (1 linha no snapshot atual); materializada para
      completude/linhagem, não consumida pela silver.
    meta:
      tags: [bronze, far, empreendimento]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
      - name: source_file
        data_tests: [not_null]

  - name: bronze_far_dados_prioritarios_caixa
    description: >
      Bronze — cópia fiel dos dados prioritários CAIXA, lida de
      mcmv_staging.dados_prioritarios_recebidos_caixa_empreendimentos. Filtrada
      para modalidade FAR (recorte de frente). Situação atual, execução, valores,
      coordenadas.
    meta:
      tags: [bronze, far, empreendimento]
    columns:
      - name: apf
        description: APF no formato CAIXA (8 dígitos).
      - name: situacao
        description: "Situação textual: EM ANDAMENTO, CONCLUÍDO, PARALISADO, etc."
      - name: pct_execucao
        description: Percentual de execução física reportado pela CAIXA (0-100).
      - name: valor_contratado
        description: Valor total contratado em R$.
      - name: valor_desembolsado
        description: Valor total desembolsado acumulado em R$.
      - name: valor_aporte_adicional
        description: Valor de aporte/suplementação adicional em R$.
      - name: uh_contratadas
        description: Quantidade de UHs contratadas.
      - name: uh_entregues
        description: Quantidade de UHs já entregues.
      - name: dt_contratacao
        description: Data de contratação do empreendimento.
      - name: source_file
        data_tests: [not_null]
      - name: hash_linha
        description: Hash de conteúdo da linha.

  - name: bronze_far_dados_prioritarios_bb
    description: >
      Bronze — cópia fiel dos dados prioritários BB (frente FAR), espelho de
      bronze_far_dados_prioritarios_caixa para o agente Banco do Brasil.
      Lida de mcmv_staging.dados_prioritarios_recebidos_bb_empreendimentos, filtrada FAR.
    meta:
      tags: [bronze, far, empreendimento]
    columns:
      - name: apf
        description: APF no formato BB (8 dígitos).
      - name: situacao
        description: Situação textual do empreendimento.
      - name: valor_contratado
        description: Valor total contratado em R$.
      - name: valor_desembolsado
        description: Valor total desembolsado acumulado em R$.
      - name: source_file
        data_tests: [not_null]

  - name: bronze_far_dados_prioritarios_snh
    description: >
      Bronze — snapshot corrente SNH (data_de_referencia 30/09/2025), frente FAR.
      Lida de mcmv_staging.dados_prioritarios_disponibilizados_snh_empreendimentos.
      NÃO é a série mensal (essa é bronze_mcmv_historico_empreendimento_snh).
      Chave: normalize_apf(codigo_da_operacao_no_agente_financeiro). ~813/822
      casam com silver_far_empreendimento.
    meta:
      tags: [bronze, far, empreendimento, snh]
    columns:
      - name: apf
        description: APF normalizado (de codigo_da_operacao_no_agente_financeiro).
      - name: situacao
        description: Situação do empreendimento reportada pela SNH.
      - name: valor_contratado_total
        description: Valor contratado total (original + aporte) em R$.
      - name: valor_desembolsado
        description: Valor desembolsado total acumulado em R$.
      - name: uh_entregues
        description: Unidades habitacionais entregues (acumulado).
      - name: source_file
        data_tests: [not_null]

  - name: bronze_far_int040_caixa
    description: >
      Bronze — cópia fiel do INT 040 (empreendimentos FAR CAIXA PJ), colunas
      preservadas como texto. O nu_apf desta interface está num espaço de
      identificador distinto do APF do cadastro PJ — não casa por normalize_apf;
      materializada para uso futuro (precisa de de-para de APF para entrar na silver).
    meta:
      tags: [bronze, far, empreendimento, agente-caixa]
    columns:
      - name: apf
        description: normalize_apf(nu_apf) — não casa 1:1 com o APF do cadastro (ver descrição do modelo).
      - name: nu_apf_origem
        description: nu_apf cru da interface INT040.
      - name: source_file
        data_tests: [not_null]

  - name: bronze_far_int054_bb
    description: >
      Bronze — cópia fiel do INT 054 (empreendimentos FAR BB PJ), colunas
      preservadas como texto. Mesmo caveat de identificador do bronze_far_int040_caixa.
    meta:
      tags: [bronze, far, empreendimento, agente-bb]
    columns:
      - name: apf
        description: normalize_apf(nu_apf) — não casa 1:1 com o APF do cadastro.
      - name: nu_apf_origem
        description: nu_apf cru da interface INT054.
      - name: source_file
        data_tests: [not_null]

  - name: bronze_far_trabalho_social
    description: >
      Bronze — Trabalho Técnico Social FAR, CAIXA + BB empilhados (union all by
      name) com contrato comum e coluna `agente`. Grão: contrato/recurso (sem APF).
    meta:
      tags: [bronze, far, trabalho-social]
    columns:
      - name: agente
        description: CAIXA ou BB (origem do registro).
        data_tests:
          - accepted_values:
              values: ['CAIXA', 'BB']
      - name: contrato
        description: Número do contrato/registro AO.
      - name: vr_ts_global
        description: Valor global do trabalho social em R$.
      - name: pct_execucao_ts
        description: Percentual de execução do trabalho social (0-100).
      - name: source_file
        data_tests: [not_null]
