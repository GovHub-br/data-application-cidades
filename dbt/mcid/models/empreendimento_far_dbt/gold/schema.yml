version: 2

models:
  - name: gold_far_ficha_empreendimento
    description: >
      Gold — 1 linha por empreendimento (APF) da frente FAR, consumida pelo
      gargalo (ouro_reloginho_indicadores_gargalo_desempenho). Materializa como
      empreendimento_far.gold_atual_ficha_empreendimento (convenção
      2026-09-04 — schema por frente, prefixo atual_ para o produto
      current-state que replica o que os colegas já entregam em prod;
      mantida só pela dependência do gargalo). Consome a silver
      (silver_atual_empreendimento) e injeta regras de negócio finais como
      cálculo de status, prazos e ritmo financeiro.
    meta:
      tags:
        - gold
    columns:
      - name: apf
        description: APF (Autorização de Projeto de Financiamento) do empreendimento.
      - name: municipio_uf
        description: Localização do empreendimento no formato "Município/UF" (ex. "Horizonte/CE").
      - name: metodo
        description: Método de originação/seleção do empreendimento (ex. SELEÇÃO, CALAMIDADE/EMERGÊNCIA).
      - name: demanda
        description: Tipo de demanda habitacional atendida pelo projeto (ex. CADASTRO HABITACIONAL).
      - name: nome_empreendimento
        description: Nome do empreendimento em maiúsculo (padronizado).
      - name: status_execucao_simplificado
        description: >
          Regra de negócio: Traduz a porcentagem física em status categóricos (Não Iniciado, Em Andamento, Concluído).
      - name: status_prazo
        description: >
          Regra de negócio: Analisa a data de previsão de entrega com a data atual.
          Alerta se o empreendimento está "Em Atraso" (não entregue e data limite vencida).
      - name: ritmo_fisico_financeiro
        description: >
          Regra de negócio: Compara o % de execução física com o % de desembolso financeiro.
          Aplica uma tolerância de 5% para classificar como "Ritmo Equilibrado", "Desembolso Adiantado" ou "Desembolso Atrasado".

  - name: gold_atual_execucao_fisica_financeira_chart
    description: >
      Gold consumida pelo gargalo (ouro_reloginho_indicadores_gargalo_desempenho).
      Materializa como empreendimento_far.gold_atual_execucao_fisica_financeira_chart
      (convenção 2026-09-04, ver nota acima). Faz o join entre a silver de
      evolução financeira e a bronze de obra mensal.
    meta:
      tags:
        - gold
    columns:
      - name: apf
        description: APF (Autorização de Projeto de Financiamento) do empreendimento.
      - name: mes
        description: Mês de referência no formato YYYY-MM-DD.
      - name: pct_obra_realizada
        description: Percentual de execução física da obra (0 a 100).
      - name: pct_executado_financeiro
        description: Percentual de execução financeira (desembolso) da obra (0 a 100).
