version: 2

models:

  # Eventos de Mudanca de Fase

  - name: bronze_fds_mudanca_fase_eventos
    description: >
      Eventos de mudanca de fase FDS, derivados de fds_cadastro_pj onde
      ic_mudanca_fase = true. Registra o APF de origem e o APF de destino
      (apf_mudanca_fase) da mudanca de fase. No snapshot atual esta vazio
      (mudancas ja resolvidas); o vinculo operacional vem do INT059.
    meta:
      tags:
        - bronze
        - entidades
    columns:
      - name: apf
        description: APF de origem (fase anterior) normalizado para 8 dígitos.
        data_tests:
          - not_null
      - name: apf_mudanca_fase
        description: APF de destino (nova fase) normalizado para 8 dígitos.
      - name: dt_movimento
        description: Data de referência do movimento.
      - name: source_file
        description: Arquivo de origem na staging.
        data_tests: [not_null]
