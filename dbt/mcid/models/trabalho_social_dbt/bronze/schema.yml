      ente público executa; todo empreendimento começa assim) ou FAR-CAIXA (a CAIXA notificou o ente por atraso
      e assumiu a execução). No BB e no Rural vem o programa (PNHU, PNHR, RURAL). O dicionário pede ajustar o nome
