# Bronze do Trabalho Social: espelho em texto da staging do MinIO (bnz_shpt_*) e dos seeds
# curados (bnz_seed_*). Descrição das colunas pelo dicionário comparativo-dados-base v.01.
# Gerado a partir do layout declarado em cada .sql (lista `colunas`).
version: 2
models:

- name: bronze_shpt_mcmv_rural_ts_caixa_bb_202607
  description: 'Acompanhamento do Trabalho Social das operações do MCMV-Rural / PNHR geridas pela CAIXA, um contrato por linha. Cópia fiel, tudo texto. Staging: aba TS_AF_CAIXA_PNHR_RURAL_MM_AA da planilha MCMV_RURAL_TS_CAIXA_BB_AAAAMM. Dicionário: comparativo-dados-base v.01 (revisão da Portaria MDR 3.760/2022, reunião de 29/09/2026).'
  
  # -------------------------------------------------------------
  # GOVERNANÇA, ETIQUETAS E CERTIFICAÇÃO (Nível da Tabela)
  # -------------------------------------------------------------
  tags:
