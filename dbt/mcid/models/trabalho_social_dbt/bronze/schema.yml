    - Tier.Tier3
    - Certification.Bronze

  owners:
    - name: "Time de Engenharia de Dados do MCID"
      type: team

  meta:
    openmetadata:
      glossary:
      - MCID.ProgramasHabitacionais.MCMV.MCMVRural
      - MCID.ExecucaoDeEmpreendimentos.TrabalhoSocial
      customProperties:
        dataLayer: "Bronze"
        tier: "Tier3"
        certificationStatus: "Bronze"
        ownerTeam: "Time de Engenharia de Dados do MCID"

  # -------------------------------------------------------------
  # COLUNAS, TIPOS E DOMÍNIOS / GLOSSÁRIOS
  # -------------------------------------------------------------
  columns:
  - name: recurso
    dataType: text
    description: 'Identifica a origem/modalidade do recurso do programa habitacional rural. Valores possíveis: PNHR, RURAL.'
    meta:
      openmetadata:
        glossary:
        - MCID.ExecucaoDeEmpreendimentos.TrabalhoSocial.AgenteExecutorTS
        - MCID.Atores.AgenteFinanceiro

  - name: contrato
    dataType: text
    description: 'Código identificador único do empreendimento/operação rural: número do APF cadastrado no SIAPF com o Dígito Verificador (DV).'
    tags:
      - PrimaryKey.APF
    meta:
      openmetadata:
        glossary:
        - MCID.Identificadores.APF

  - name: municipio
    dataType: text
    description: 'Nome do município de localização da operação habitacional rural.'
    meta:
      openmetadata:
        glossary:
        - MCID.Localizacao.Municipio

  - name: uf
    dataType: text
    description: 'Sigla da Unidade da Federação (UF) de localização do empreendimento rural. Ex: RO, PR, RS, SP.'
    meta:
      openmetadata:
        glossary:
        - MCID.Localizacao.UF

  - name: nome_empreendimento
    dataType: text
    description: 'Nome oficial do projeto habitacional rural / grupo de beneficiários cadastrado na operação.'

  - name: uh
    dataType: text
    description: 'Quantidade total de Unidades Habitacionais (UH) contratadas/concluídas da operação rural.'

  - name: tipologia
    dataType: text
    description: 'Tipologia construtiva das habitações rurais. No PNHR é frequentemente preenchido com hífen (-) ou "Não se aplica ao PNHR".'

  - name: fase_mcmv
    dataType: text
    description: 'Fase ou edição do Programa Minha Casa, Minha Vida / PNHR na qual o contrato se enquadra. Valores comuns: Legado I, Legado II, Fase III.'

  - name: data_da_contratacao
    dataType: text
    description: 'Data formal de contratação da operação rural junto ao agente financeiro (formato YYYY-MM-DD).'

  - name: vr_global_ts
    dataType: text
    description: 'Valor total global destinado à execução do Projeto de Trabalho Social na operação rural.'

  - name: vr_desembolsado
    dataType: text
    description: 'Valor acumulado efetivamente pago/desembolsado para a execução do Trabalho Social rural.'

  - name: vr_a_desembolsar_nao_concluidos
    dataType: text
    description: 'Valor total pendente de desembolso para a execução de Projeto de Trabalho Social em operações não concluídas.'

  - name: vr_nao_desembolsado_concluidos
    dataType: text
    description: 'Saldo orçamentário não utilizado ("perdido") de Projetos de Trabalho Social que já foram concluídos.'

  - name: execucao_ts
    dataType: text
    description: 'Percentual acumulado de execução física/operacional do Trabalho Social atingido no mês de movimento.'

  - name: obra
    dataType: text
    description: 'Percentual acumulado de avanço físico das obras habitacionais rurais no mês de movimento.'

  - name: portaria_adotada
    dataType: text
    description: 'Portaria ou normativa regulamentadora adotada para reger as diretrizes do Trabalho Social rural. Ex: 464-2018, 21-2014, 75-2025.'

  - name: instrumento_de_planejamento
    dataType: text
    description: 'Tipo de documento formal de planejamento adotado para a intervenção social rural. Valor comum: PTS (Plano de Trabalho Social).'

  - name: natureza_execucao
    dataType: text
    description: 'Modalidade de execução das ações do Projeto de Trabalho Social. Valores possíveis: INDIRETA, DIRETA, MISTA.'

  - name: dt_entrega
    dataType: text
    description: 'Data de entrega das unidades habitacionais rurais concluídas aos beneficiários (formato YYYY-MM-DD).'

  - name: situacao_ts
    dataType: text
    description: 'Status atual da execução do Trabalho Social na operação rural. Valores possíveis: CONCLUIDO, EM ANDAMENTO, PARALISADO, ATRASADO, NAO INICIADO.'
    meta:
      openmetadata:
        glossary:
        - MCID.ExecucaoDeEmpreendimentos.TrabalhoSocial.StatusTS

  - name: motivo_situacao_ts_atrasado_paralisado
    dataType: text
    description: 'Justificativa técnica quando o Trabalho Social rural está com status Atrasado ou Paralisado. Ex: EM TRATAMENTO - PLANO DE AÇÃO, REALIZADAS TRATATIVAS COM A EO SEM RETOMADA DO TS, PARALISAÇÃO DE OBRAS.'

  - name: dt_ultimo_avt
    dataType: text
    description: 'Data do ateste do último relatório ordinário de Acompanhamento de Verificação Técnica (AVT) emitido pela CAIXA.'

  - name: dt_avf
    dataType: text
    description: 'Data do ateste do relatório de Avaliação Final (AVF) emitido pela CAIXA, atestando a conclusão do Trabalho Social.'

  - name: _source_file
    dataType: text
    description: 'Caminho e nome do arquivo de origem carregado pela pipeline de ingestão (metadado de engenharia).'

  - name: _ingested_at
    dataType: text
    description: 'Data e hora em UTC de quando a linha foi inserida na camada Bronze (metadado de engenharia).'

  - name: _source_hash
    dataType: text
    description: 'Hash único gerado a partir do conteúdo do registro para deduplicação e rastreabilidade (metadado de engenharia).'

