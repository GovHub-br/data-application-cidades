version: 2

sources:
  - name: trabalho_social_lake
    description: >
      Arquivos de acompanhamento do Trabalho Social na staging do MinIO. Só entra aqui o que
      uma bronze lê por caminho_fonte_lake / fonte_lake; as bronzes de remessa única (jul/2026)
      ainda leem o parquet direto.
    schema: staging
    meta:
      bucket: data-lake-mcid
      camada: staging
      governance:
        product: trabalho_social
        owner_key: mcid_data_engineering
        classification: restricted
        rag_publication: prohibited
    tables:
      - name: mcmv_ts_remessas_historico
        description: >
          Todas as remessas de acompanhamento do Trabalho Social guardadas na pasta Trabalho Social
          (FAR, FDS e Rural; CAIXA e BB; de jan/2025 a jul/2026, inclusive as arquivadas). Serve para
          recuperar a portaria de TS de contratos que vieram sem ela na remessa mais recente.
        meta:
          caminho: snh/staging/sharepoint/Trabalho Social/**/*.parquet
      - name: far_empreendimentos_caixa_int040
        description: >
          INT040 do SFTP/GEFUS: empreendimentos do FAR operados pela CAIXA, uma remessa por mês
          (a última na staging é de 29/11/2024, em GEFUS/ANTERIORES). O TS usa a tipologia.
        meta:
          caminho: snh/staging/sftp/fabrica/GEFUS/**/INT040_MinisterioCidades_FAR_CAIXA_EMPREENDIMENTOS_*.parquet
          dag: minio_transform_dag
      - name: fds_empreendimentos_caixa_int059
        description: >
          INT059 do SFTP/GEFUS: empreendimentos do FDS (Entidades) operados pela CAIXA, uma
          remessa por mês. O TS usa a tipologia.
        meta:
          caminho: snh/staging/sftp/fabrica/GEFUS/**/INT059_MinisterioCidades_FDS_CAIXA_EMPREENDIMENTOS_*.parquet
          dag: minio_transform_dag
