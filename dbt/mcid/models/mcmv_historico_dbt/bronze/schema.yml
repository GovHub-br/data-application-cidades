version: 2

# As bronzes de série histórica são uma TABELA POR FAMÍLIA desde a change
# pipeline-bronze-historica-destino-trocavel (D5): 4 da série executiva + 5
# interfaces GEFUS + 2 agentes SNH neste domínio, mais 2 agentes de entregas em
# indicadores_mcmv_dbt/bronze. O mapa que as define está em
# macros/historico/familias.sql; a união entre famílias vive na silver.
#
# As quatro colunas de auditoria (source_file, dt_referencia, dt_ingest,
# hash_linha) existem em todas, com a mesma semântica de antes da separação.

models:

  - name: bronze_mcmv_historico_serie_bases_relatorio_executivo
    description: >
      Bronze — série executiva histórica do MCMV (~2010-2018), família
      `bases_relatorio_executivo` (grão empreendimento), cópia fiel do glob
      `staging/dados_historicos/*bases_relat*rio_executivo*.parquet`. Uma linha por linha de
      origem; só as colunas da própria família (tabela estreita) mais
      auditoria. A família tem 2-3 gerações de schema — a harmonização e a
      união com as outras três ficam em
      silver_mcmv_historico_serie_executiva.
    meta:
      tags: [bronze, mcmv, dados-historicos, serie-executiva, preditivo]
    data_tests:
      # Vigilância de drift de schema (change testes-data-quality-dbt):
      # avisa se o conjunto de colunas divergir de
      # seeds/data_quality/colunas_esperadas.csv. Nível warn.
      - colunas_esperadas:
          config:
            severity: warn
    columns:
      - name: fonte_familia
        description: Constante `bases_relatorio_executivo` — discriminador da família na silver.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["bases_relatorio_executivo"]
      # valor_nao_negativo em `warn` no bronze (cópia fiel); gate `error` na
      # silver pós-quarentena. Change:
      # vocabulario-e-qualidade-financeira-historica (D6/8.3).
      - name: valor_total_do_investimento
        description: Investimento total (texto). ~1,3 mil linhas < 0 na fonte (erro de sinal).
        data_tests:
          - valor_nao_negativo:
              config: { severity: warn }
      - name: subsidio_ogu
        description: Subsídio OGU (texto). ~960 linhas < 0 na fonte.
        data_tests:
          - valor_nao_negativo:
              config: { severity: warn }
      # Colunas de código com sufixo ".0" numa das gerações de schema desta
      # família (a geração posterior traz `cod_munic_ibge` / `cod_apf` limpos).
      # Teste em `warn` — defeito de origem, não regressão. Limpeza na silver.
      # Ver docs/varredura-sufixo-float-texto.md.
      - name: codmunicibge
        description: Código IBGE do município (geração antiga; identificador textual).
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: codapf
        description: Código do APF (geração antiga; identificador textual).
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: idregistro
        description: Identificador de registro (geração antiga).
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: id_mcmv
        description: Identificador MCMV (geração antiga).
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: cnpj
        description: CNPJ (geração antiga; identificador textual).
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: inumero_cnpj
        description: CNPJ (variante `i*` de outra geração; identificador textual).
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: ano
        description: >
          Ano (4 dígitos como texto). Chega com sufixo ".0" numa geração.
          Não é propagado a silver (a série usa `dt_referencia`) — teste em
          `warn` para rastrear.
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: report_date_parsed
        description: report_date normalizado, dentro da janela de plausibilidade.
      - name: source_file
        description: Caminho do objeto parquet de origem no MinIO staging.
        data_tests:
          - not_null
      - name: dt_referencia
        description: Mês do snapshot (report_date normalizado; fallback pelo nome do arquivo).
      - name: dt_ingest
        description: Timestamp da materialização desta camada.
      - name: hash_linha
        description: Hash MD5 (source_file + content_hash + sequência) — surrogate de linha.
        data_tests:
          - not_null
          - unique


