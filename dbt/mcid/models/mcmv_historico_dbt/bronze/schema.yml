    columns:
      - name: modalidade
        description: Frente informada pela fonte (FAR / Entidades / RURAL / Rural).
      - name: agente_arquivo
        description: Constante `CAIXA` — derivado do nome do arquivo.
      - name: apf
        description: Autorização Para Financiamento — chave do empreendimento (texto, cru).
      - name: codigo_ibge_do_municipio
        description: >
          Código IBGE do município (identificador textual). ~20% dos valores
          preenchidos chegam com sufixo ".0" da fonte CAIXA (o agente BB não
          tem a coluna). Teste em `warn`; limpeza na silver.
          Ver docs/varredura-sufixo-float-texto.md.
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: cep_do_imovel
        description: >
          CEP do imóvel (identificador textual, 8 dígitos). Chega com sufixo
          ".0" da fonte CAIXA. Não é propagado a nenhuma silver hoje — teste em
          `warn` para rastrear. Ver docs/varredura-sufixo-float-texto.md.
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: numero_do_imovel
        description: >
          Número do imóvel no logradouro (inteiro-texto). Chega com sufixo
          ".0". Não propagado a silver — teste em `warn`.
        data_tests:
          - sem_sufixo_float_texto:
              config:
                severity: warn
      - name: prioridade_reentrega
        description: >
          Prioridade de desempate para reentregas do mesmo mês:
          3 = correção, 2 = versão vsNN, 1 = arquivo base.
      - name: source_file
        description: Caminho do objeto parquet de origem no MinIO staging.
        data_tests:
          - not_null
      - name: dt_referencia
        description: Mês de referência do snapshot (derivado do nome do arquivo).
      - name: dt_ingest
        description: Timestamp da materialização desta camada.
      - name: hash_linha
        description: Hash MD5 do conteúdo-chave da linha (auditoria / detecção de mudança).
        data_tests:
          - not_null
