version: 2

models:
  - name: silver_mcmv_historico_empreendimento_far
    description: >
      Silver — série histórica mensal de empreendimentos MCMV da frente FAR
      (SFTP INT040/INT054 ∪ SNH modalidade=FAR), contrato semântico comum,
      tipada, deduplicada por (frente_mcmv, apf, dt_referencia). Precedência SNH
      na janela sobreposta. Grão: empreendimento × mês. Requer target
      staging_duckdb.
    meta:
      tags: [silver, mcmv, dados-historicos, empreendimento, far]
    columns: &contrato_empreendimento
      - name: id_historico_snapshot
        description: Chave técnica única por frente, APF e mês de referência.
        data_tests:
          - not_null
          - unique
      - name: id_negocio_historico
        description: Chave lógica estável (programa + frente + APF), constante entre meses.
        data_tests:
          - not_null
      - name: programa
        data_tests:
          - not_null
      - name: frente_mcmv
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["FAR", "Entidades", "Rural"]
      - name: apf
        description: APF / contrato do empreendimento (chave física da linha).
        data_tests:
          - not_null
      - name: codigo_empreendimento
        description: >
          Chave estável de empreendimento. FDS: id_empreendimento (hash do
          APF-âncora / Fase Projeto — liga APFs de fase distintas do mesmo
          empreendimento). FAR/Rural: = apf. Change:
          id-empreendimento-eixo-historico.
      - name: id_empreendimento
        description: >
          Identidade lógica estável do empreendimento. FDS: da dim
          silver_atual_dim_empreendimento (#130), fallback
          md5('empreendimento-fds|' || apf) quando o APF não está na dim.
          FAR/Rural: = apf.
        data_tests:
          - not_null
      - name: fase_empreendimento
        description: >
          Fase administrativa do APF no FDS (Projeto / Obra / Desligamento).
          NULL para APF fora da dim e para FAR/Rural (não têm fase de APF).
          NÃO confundir com situacao_canonica (estado físico da obra).
        data_tests:
          - accepted_values:
              arguments:
                values: ["Projeto", "Obra", "Desligamento"]
              config:
                severity: warn
      - name: codigo_ibge_municipio
        description: >
          Código IBGE do município, sem sufixo ".0" (limpo por
          strip_float_text no braço SNH). Ver
          docs/varredura-sufixo-float-texto.md.
        data_tests:
          - sem_sufixo_float_texto
      - name: dt_referencia
        description: Mês de referência do snapshot (nome do arquivo).
        data_tests:
          - not_null
      - name: fonte_serie
        description: Origem da linha mantida na dedup.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["sftp", "snh"]
      - name: quantidade_uh
        description: Unidades habitacionais contratadas no snapshot.
        data_tests:
          # Limiar informativo (warn) — sem contrato de obrigatoriedade ainda
          # (vem do campos_obrigatorios.csv do catalogo-dicionario). Ajustar
          # quando esse artefato existir. Change: testes-data-quality-dbt.
          - completude_minima:
              arguments:
                min_pct: 0.80
              config:
                severity: warn
      - name: quantidade_uh_entregues
        description: >
          Unidades habitacionais entregues (acumulado). coalesce(braço da linha,
          valor preservado no grão, espinha silver_mcmv_historico_entrega_apf) —
          só preenche NULL, nunca sobrescreve 0. Change:
          enriquecer-datas-acompanhamento-historico. FDS agora tem valor do
          braço INT059 (change destravar-datas-obra-entrega-silver-historico).
      - name: quantidade_uh_concluidas
        description: >
          Unidades habitacionais com obra concluída (estágio anterior a
          "entregue"). Só o braço SFTP reporta — INT059 (FDS), INT040/INT054
          (FAR), INT057/INT065 (Rural); coalesce(braço da linha, valor
          preservado no grão). NULL no braço SNH. Change:
          destravar-datas-obra-entrega-silver-historico.
      - name: dt_entrega_uh
        description: >
          Data de entrega de unidades habitacionais (última). Substitui a antiga
          `dt_entrega` (BREAKING). coalesce(dt_ultima_entrega do braço SFTP →
          mesmo valor preservado no grão → espinha SNH por evento). FDS: braço
          INT059 ∪ espinha; FAR: INT040/INT054 ∪ espinha; Rural: INT065 (~11%) ∪
          espinha (INT057 não tem a coluna). Changes:
          enriquecer-datas-acompanhamento-historico +
          destravar-datas-obra-entrega-silver-historico.
      - name: dt_conclusao_obra
        description: >
          Data de conclusão física da obra / legalização. FDS/FAR:
          coalesce(dt_termino_obra, dt_legalizacao) do SFTP; Rural:
          dt_efetiva_conclusao. Braço SNH: NULL — `data_do_termino` do snapshot
          SNH é 0% preenchido para FAR/FDS/Rural (change
          destravar-datas-obra-entrega-silver-historico, task 7.5).
      - name: dt_previsao_entrega
        description: >
          Data prevista de entrega, reportada pelo braço SNH
          (`data_da_previsao_da_entrega`, ISO). NULL no braço SFTP. Fill baixo
          (~2% dos APFs — só o SNH reporta). Change:
          destravar-datas-obra-entrega-silver-historico (resolve a OQ1 do B+D).
      - name: qt_uh_previsao_entrega
        description: >
          Unidades habitacionais previstas para entrega, braço SNH —
          coalesce(qt_uh_previsao_entrega, unidades_habitacionais_a_serem_entregues).
          NULL no braço SFTP. Change: destravar-datas-obra-entrega-silver-historico.
      - name: dt_entrega_uh_fonte
        description: >
          Origem de `dt_entrega_uh`: `sftp:INTxxx` (feed mensal GEFUS —
          INT059/INT040/INT054/INT065), `snh:entrega_evento` (espinha) ou NULL
          quando `dt_entrega_uh` é NULL.
        data_tests:
          - accepted_values:
              arguments:
                values: ["sftp", "sftp:INT040", "sftp:INT054", "sftp:INT057", "sftp:INT059", "sftp:INT065", "snh:entrega_evento"]
              config:
                severity: warn
      - name: valor_contratado
        description: Valor contratado (R$), parse de formato brasileiro.
        data_tests:
          - completude_minima:
              arguments:
                min_pct: 0.70
              config:
                severity: warn
      - name: valor_desembolsado
        description: Valor desembolsado/liberado (R$).
      - name: percentual_execucao_fisica
        description: Percentual de execução física da obra.
      - name: status_operacional
        description: Situação da obra/operação no snapshot (valor cru preservado).
      - name: dt_movimento
        description: Data de movimento da fonte (auxiliar; coalesce entre fontes).
      - name: situacao_canonica
        description: >
          Situação de obra canônica (nao_iniciada / em_obras / paralisada /
          concluida / cancelada), por join ao seed dominio_status sobre
          lower(trim(status_operacional)). NULL quando status ausente;
          'nao_mapeada' quando não casa no seed. Change:
          serie-historica-situacao-obra-regiao.
        data_tests:
          - dentro_do_dominio:
              arguments:
                seed: dominio_status
                seed_column: situacao_canonica
              config:
                severity: warn
      - name: regiao_sigla
        description: >
          Macrorregião IBGE (N / NE / CO / SE / S) por join ao seed
          dominio_regiao_uf sobre uf. Nula quando a linha não tem uf (ex.: braço
          SFTP INT059 do FDS).
        data_tests:
          - relationships:
              arguments:
                to: ref('dominio_regiao_uf')
                field: regiao_sigla
              config:
                severity: warn
      - name: regiao_nome
        description: Nome da macrorregião IBGE (par de regiao_sigla).

  - name: silver_mcmv_historico_empreendimento_fds
    description: >
      Silver — série histórica mensal de empreendimentos MCMV da frente
      FDS/Entidades (SFTP INT059 ∪ SNH modalidade=ENTIDADES). Contrato comum,
      dedup por (frente_mcmv, apf, dt_referencia), precedência SNH. Grão:
      empreendimento × mês. Requer target staging_duckdb.
    meta:
      tags: [silver, mcmv, dados-historicos, empreendimento, fds]
    columns: *contrato_empreendimento

  - name: silver_mcmv_historico_empreendimento_rural
    description: >
      Silver — série histórica mensal de empreendimentos MCMV da frente Rural
      (SFTP INT057/INT065 ∪ SNH modalidade=RURAL). Contrato comum, dedup por
      (frente_mcmv, apf, dt_referencia), precedência SNH. Grão: empreendimento ×
      mês. Requer target staging_duckdb.
    meta:
      tags: [silver, mcmv, dados-historicos, empreendimento, rural]
    columns: *contrato_empreendimento

  - name: silver_mcmv_historico_entrega_apf
    description: >
      Silver — espinha de entregas por APF. Grão: 1 linha por `apf`. Consolida os
      EVENTOS de entrega de UH da SNH (bronze_reloginho_snh_entregas_evento_bb /
      _caixa, mesma fonte do reloginho) num atributo estável: dt_primeira_entrega,
      dt_ultima_entrega, uh_entregues_acumulada, n_eventos, dt_ultimo_snapshot.
      Dedup por hash de conteúdo (agente, apf, dt_evento, qtd) idêntico ao de
      silver_historico_snh_entregas_mes — os totais reconciliam. As silvers
      históricas por frente fazem left join por `apf` para resolver
      dt_entrega_uh / quantidade_uh_entregues nas lacunas do SFTP. Change:
      enriquecer-datas-acompanhamento-historico. Requer target staging_duckdb.
    meta:
      tags: [silver, mcmv, dados-historicos, entrega, espinha]
    columns:
      - name: apf
        description: APF do empreendimento (chave da linha).
        data_tests:
          - not_null
          - unique
      - name: agente_financeiro
        description: Agente do evento mais recente (BB / CAIXA).
      - name: dt_primeira_entrega
        description: Menor dt_evento de entrega do APF (evento deduplicado).
      - name: dt_ultima_entrega
        description: Maior dt_evento de entrega do APF.
      - name: uh_entregues_acumulada
        description: Soma das UH entregues em todos os eventos deduplicados do APF.
      - name: n_eventos
        description: Contagem de eventos de entrega deduplicados do APF.
      - name: dt_ultimo_snapshot
        description: Maior dt_referencia de snapshot em que o APF apareceu nos streams de evento.

  - name: silver_mcmv_historico_serie_executiva
    description: >
      Silver — série executiva histórica no contrato comum. Aplica o mapa de
      colunas (doc issue-130-proposta-bronze-series-historicas.md) via
      coalesce_present(), tipa (UH→bigint, valores→double, datas→date),
      classifica linha_ogu_fgts (para o piloto #118) e deduplica por
      (fonte_familia, chave_natural, dt_referencia) mantendo o snapshot mais
      recente do mês. Grão: registro de origem (empreendimento ou contrato).
      Requer target staging_duckdb.
    meta:
      tags: [silver, mcmv, dados-historicos, serie-executiva, preditivo]
    columns:
      - name: fonte_familia
        data_tests:
          - not_null
      - name: dt_referencia
        description: Mês do snapshot.
        data_tests:
          - not_null
      # Identificadores já limpos por strip_float_text — gate `error`: uma
      # falha aqui significa regressão da limpeza (o bronze correspondente
      # segue em `warn`). Ver docs/varredura-sufixo-float-texto.md.
      - name: chave_natural
        description: Chave natural do registro (código de empreendimento/contrato), sem sufixo ".0".
        data_tests:
          - sem_sufixo_float_texto
      - name: codigo_ibge_municipio
        description: Código IBGE do município (só dígitos), sem sufixo ".0".
        data_tests:
          - sem_sufixo_float_texto
      - name: responsavel_id
        description: CNPJ do responsável, sem sufixo ".0".
        data_tests:
          - sem_sufixo_float_texto
      - name: uf
        description: UF (maiúsculas). Pode ser nulo em min_cidades/bext antigos (sem UF na origem).
      - name: linha_ogu_fgts
        description: >
          OGU/Subsidiado quando o subsídio OGU domina; FGTS/Financiado quando o
          FGTS domina; nulo quando não há subsídio informado.
        data_tests:
          - accepted_values:
              arguments:
                values: ["OGU/Subsidiado", "FGTS/Financiado"]
      - name: uh_contratadas
        description: UH contratadas do registro (harmonizado das ~6 origens).
      - name: uh_entregues
        description: UH entregues do registro.
      - name: subsidio_fgts
        description: Valor de subsídio/complemento FGTS (R$).
      - name: subsidio_ogu
        description: Valor de subsídio/complemento OGU (R$).
      - name: situacao_derivada
        description: >
          Situação derivada SÓ de quantidade (esta fonte não tem
          status_operacional): contratada / em_entrega / concluida /
          nao_mapeada. Domínio e propósito DISTINTOS de situacao_canonica das
          silvers por frente — nunca combinar as duas séries sem ressalva.
          Change: serie-historica-situacao-obra-regiao (D2).
        data_tests:
          - accepted_values:
              arguments:
                values: ["contratada", "em_entrega", "concluida", "nao_mapeada"]
      - name: regiao_sigla
        description: >
          Macrorregião IBGE (N / NE / CO / SE / S) por join ao seed
          dominio_regiao_uf sobre uf. Nula quando o registro não tem uf
          (min_cidades e bext antigos).
        data_tests:
          - relationships:
              arguments:
                to: ref('dominio_regiao_uf')
                field: regiao_sigla
              config:
                severity: warn
      - name: regiao_nome
        description: Nome da macrorregião IBGE (par de regiao_sigla).
