version: 2

models:
  - name: gold_marco_empreendimento
    description: >
      Gold — linha do tempo (marcos) por empreendimento (grão
      coalesce(id_empreendimento, apf), alinhado ao gold_snapshot). 7 marcos,
      cada um com `<marco>_fonte` e `<marco>_dt_snapshot`. Só seleciona entre
      valores observados — nunca interpola.
      Ordem: dt_contratacao / dt_inicio_obra vêm da linha "estado" vencedora
      (fase mais avançada -> dt_referencia mais recente); dt_conclusao_obra e
      dt_ultima_entrega são o MAIOR valor já resolvido na silver em qualquer
      snapshot (dt_ultima_entrega considera também o max da espinha
      silver_mcmv_historico_entrega_apf sobre todos os APFs de fase);
      dt_primeira_entrega vem da espinha. dt_legalizacao / dt_previsao_entrega
      nascem NULL nesta fase (escopo da change
      destravar-datas-obra-entrega-silver-historico). `marcos_coerentes` é
      diagnóstico. Change: enriquecer-datas-acompanhamento-historico. Requer
      target staging_duckdb.
    meta:
      tags: [gold, mcmv, dados-historicos, empreendimento, marco, linha-do-tempo]
    columns:
      - name: id_empreendimento
        description: Chave do empreendimento (= id_empreendimento no FDS, = apf em FAR/Rural).
        data_tests:
          - not_null
      - name: frente_mcmv
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["FAR", "Entidades", "Rural"]
      - name: dt_contratacao_fonte
        data_tests:
          - not_null
      - name: dt_ultima_entrega_fonte
        description: >
          Origem de dt_ultima_entrega: `sftp[:INTxxx]`, `snh:entrega_evento` ou
          `sem_fonte`. Herda dt_entrega_uh_fonte da silver.
        data_tests:
          - not_null
      - name: dt_previsao_entrega_fonte
        description: Sempre 'sem_fonte' nesta fase (Open Question 1, lean).
        data_tests:
          - accepted_values:
              arguments:
                values: ["sem_fonte"]
      - name: marcos_coerentes
        description: Cadeia de datas coerente ignorando nulos. Diagnóstico — o modelo não corrige.
        data_tests:
          - not_null

  - name: gold_snapshot_empreendimento_atual
    description: >
      Gold — snapshot corrente (estado atual) derivado da silver histórica
      consolidada: uma linha por (frente, codigo_empreendimento) com o último
      mês de referência disponível. No FDS, um empreendimento multi-fase colapsa
      os 2-3 APFs de fase para 1 linha pela chave estável codigo_empreendimento
      (= id_empreendimento), prevalecendo a fase mais avançada
      (Desligamento > Obra > Projeto). FAR/Rural inalterados (chave = apf).
      Consolidado apenas — filtrável por frente_mcmv. Change:
      id-empreendimento-eixo-historico.
    meta:
      tags: [gold, mcmv, dados-historicos, empreendimento, snapshot]
    columns:
      - name: id_historico_snapshot
        description: Identificador herdado da versão corrente do empreendimento (por APF).
        data_tests:
          - not_null
          - unique
      - name: frente_mcmv
        data_tests:
          - not_null
      - name: apf
        description: APF da fase escolhida como corrente (física).
        data_tests:
          - not_null
      - name: codigo_empreendimento
        description: >
          Chave estável do empreendimento. FDS: id_empreendimento (hash do
          APF-âncora); FAR/Rural: = apf. Grão do snapshot.
        data_tests:
          - not_null
          - unique:
              config:
                where: "frente_mcmv = 'Entidades'"
      - name: id_empreendimento
        description: Identidade lógica estável (= codigo_empreendimento). FAR/Rural = apf.
      - name: fase_empreendimento
        description: >
          Fase administrativa do APF corrente no FDS (Projeto/Obra/Desligamento);
          NULL para FAR/Rural e APF fora da dim.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Projeto", "Obra", "Desligamento"]
              config:
                severity: warn
      - name: dt_referencia
        data_tests:
          - not_null
      - name: dt_entrega_uh
        description: >
          Data de entrega de UH (substitui a antiga `dt_entrega`, BREAKING).
          Herdada da silver por frente. Change: enriquecer-datas-acompanhamento-historico.
      - name: dt_conclusao_obra
        description: Data de conclusão física da obra / legalização. Herdada da silver.
      - name: dt_entrega_uh_fonte
        description: Origem de `dt_entrega_uh` (`sftp[:INTxxx]` / `snh:entrega_evento`).
      - name: fonte_tabela
        data_tests:
          - not_null

  - name: gold_serie_mensal
    description: >
      Gold — série histórica mensal do MCMV (pré-2024) para análise preditiva.
      Agrega a silver_mcmv_historico_serie_executiva por (dt_referencia,
      fonte_familia, nivel_agregacao, regiao_sigla, uf, linha_ogu_fgts) via
      GROUPING SETS (nacional + regiao + uf). NÃO somar entre fonte_familia
      (bases_relatório_executivo e min_cidades se sobrepõem 2014-2016) — usar
      prioridade_familia para escolher uma série contínua. Requer target
      staging_duckdb.
    meta:
      tags: [gold, mcmv, dados-historicos, serie-executiva, preditivo]
    columns:
      - name: dt_referencia
        data_tests:
          - not_null
      - name: fonte_familia
        data_tests:
          - not_null
      - name: prioridade_familia
        description: 1 bases_relatorio_executivo, 2 min_cidades, 3 entrada_bb, 4 bext (menor = preferencial).
      - name: nivel_agregacao
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["nacional", "regiao", "uf"]
      - name: regiao_sigla
        description: >
          Macrorregião IBGE (N / NE / CO / SE / S) da silver. Chave no nível
          'regiao'; enriquece as linhas de nível 'uf'; 'BR' no nível 'nacional';
          'ND' onde a silver não tem uf. Adicional ao contrato.
      - name: regiao_nome
        description: Nome da macrorregião IBGE (par de regiao_sigla). Nulo no nível 'nacional'. Adicional ao contrato.
      - name: linha_ogu_fgts
        data_tests:
          - not_null
      - name: uh_contratadas
        description: Soma de UH contratadas no recorte (dentro da mesma fonte_familia).
      - name: uh_entregues
        description: Soma de UH entregues no recorte.

  - name: gold_serie_situacao_mensal
    description: >
      Gold — série histórica mensal de empreendimentos por SITUAÇÃO DE OBRA
      canônica (2019-12 → mês corrente das silvers por frente). Grão:
      (mes, frente_mcmv, situacao_canonica, nivel_geografico, uf, regiao_sigla),
      com nivel_geografico ∈ {nacional, regiao, uf} via GROUPING SETS. Métricas
      de ESTOQUE — n_empreendimentos (empreendimentos distintos na situação no
      mês, por chave_empreendimento = coalesce(id_empreendimento, apf); no FDS
      um multi-fase conta 1), uh — e de FLUXO — entradas / saidas da situação no
      mês, por lag(situacao_canonica) particionado por
      (frente_mcmv, chave_empreendimento). **NÃO somar entradas / saidas entre
      nivel_geografico** (cada transição acontece numa única UF). Change:
      id-empreendimento-eixo-historico (antes contava APF distintos — a contagem
      FDS caiu ~10%; FAR/Rural inalterados).
      `fonte_serie` é a predominante do mês por frente — usar para anotar o pico
      de paralisação de 2024 (virada SFTP→SNH), que o gold NÃO suaviza. Requer
      target staging_duckdb.
    meta:
      tags: [gold, mcmv, dados-historicos, empreendimento, situacao-obra, "issue-59"]
    columns:
      - name: mes
        description: Primeiro dia do mês de referência.
        data_tests:
          - not_null
      - name: frente_mcmv
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["FAR", "Entidades", "Rural"]
      - name: situacao_canonica
        description: Situação de obra canônica (pode ser 'nao_mapeada'; nunca NULL — linhas sem situação são excluídas do gold).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["nao_iniciada", "em_obras", "paralisada", "concluida", "cancelada", "nao_mapeada"]
      - name: nivel_geografico
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["nacional", "regiao", "uf"]
      - name: uf
        description: UF no nível 'uf' ('ND' quando a silver não tem uf); 'BR' nos demais níveis.
      - name: regiao_sigla
        description: Macrorregião IBGE — chave no nível 'regiao', enriquece o nível 'uf', 'BR' no nacional.
      - name: n_empreendimentos
        description: Empreendimentos distintos (chave_empreendimento) na situação naquele mês/recorte (estoque).
      - name: uh
        description: Soma de quantidade_uh na situação naquele mês/recorte (estoque).
      - name: entradas
        description: Empreendimentos que ENTRARAM na situação no mês (mudança vinda de outra situação). Não somar entre nivel_geografico.
      - name: saidas
        description: Empreendimentos que SAÍRAM da situação no mês. Não somar entre nivel_geografico.
      - name: fonte_situacao
        description: Origem da situação — 'reportada' (sempre, nesta fase; 'derivada' reservado para a série pré-2019).
      - name: fonte_serie
        description: fonte_serie predominante do mês por frente ('sftp' até 2024-11, 'snh' depois) — para anotar a descontinuidade de série.
