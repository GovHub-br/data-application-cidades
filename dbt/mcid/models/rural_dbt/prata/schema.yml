    description: APF do empreendimento (8 dígitos, normalizado).
  - name: mes
    description: Primeiro dia do mês da(s) liberação(ões), truncado.
  - name: vr_acumulado
    description: Soma progressiva do valor liberado por APF ao longo dos meses.
  - name: pct_executado_financeiro
    description: vr_acumulado sobre valor_contratado, em %.
  - name: vr_liberado_mes
    description: "Valor liberado no mês (R$), líquido de devoluções."
- name: prata_rural_ficha_empreendimento
  description: 'Lógica que antes ficava na ouro ouro_rural_ficha_empreendimento, trazida para a prata para a ouro
    ler só prata. Tabela Gold que alimenta a "Ficha do Empreendimento" no dashboard do MCMV Rural. Consome a prata_rural_empreendimento
    e injeta as regras de negócio finais: programa (Novo MCMV Rural vs. PNHR histórico), status de execução, status
    de prazo, valor por UH e ritmo físico-financeiro. Uma linha por empreendimento (APF).'
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF (Autorização de Projeto de Financiamento) do empreendimento.
  - name: programa
    description: 'Regra de negócio: NOVO MCMV RURAL quando ic_novo_mcmv, senão PNHR (HISTÓRICO).

      '
  - name: pessoas_atendidas
    description: 'Estimativa de pessoas atendidas: UHs contratadas × 3,3 (média de moradores por domicílio), truncada
      para inteiro.

      '
  - name: municipio_uf
    description: Localização no formato "Município/UF".
  - name: apf_municipio_empreendimento
    description: 'Rótulo concatenado "APF - Município/UF - EMPREENDIMENTO", usado como dimensão de filtro no Superset.

      '
  - name: status_execucao_simplificado
    description: 'Regra de negócio: traduz o percentual físico em categorias (Não Iniciado, Em Andamento, Concluído,
      Status Desconhecido).

      '
  - name: status_prazo
    description: 'Regra de negócio: compara a previsão de entrega com a data atual. Alerta "Em Atraso" quando não
      foi entregue e a data venceu.

      '
  - name: percentual_execucao_financeira
    description: Valor desembolsado sobre valor contratado, em %.
  - name: ritmo_fisico_financeiro
    description: 'Regra de negócio: compara o % de execução física com o % de desembolso, com tolerância de 5% (Ritmo
      Equilibrado, Desembolso Adiantado ou Atrasado).

      '
