- name: prata_rural_portarias_selecao
  description: >
    Catálogo das portarias do ciclo de seleção do Rural, tipado: abertura do ciclo, resultado da seleção,
    reaproveitamento e autorização de contratação. Uma linha por portaria, com o tipo usado no filtro único de
    portaria do painel e o ciclo de seleção.
  meta:
    tags:
    - silver
  columns:
  - name: portaria_codigo
    description: "Código da portaria (número sem ponto + ano, ex. 1133_2024)."
    tests:
    - unique
    - not_null
  - name: ato_selecao
    description: Nome do ato de seleção por extenso.
  - name: numero_portaria
    description: Número da portaria.
  - name: ano_portaria
    description: Ano da portaria.
  - name: dt_portaria
    description: Data da portaria, quando confirmada.
  - name: dt_referencia_vinculo
    description: Data a partir da qual um contrato pode ter vindo da portaria (data da portaria ou 1º de janeiro do ano).
  - name: papel_portaria
    description: "Papel no ciclo: Abertura do ciclo, Resultado da seleção, Enquadramento (Calamidade), Reaproveitamento, Alteração, Autorização de contratação ou A confirmar."
  - name: tem_lista_nominal
    description: Se a portaria publica lista de selecionados (sim, não, a confirmar).
  - name: fonte_lista
    description: De onde vem (ou deve vir) a lista de selecionados.
  - name: observacao
    description: Observação sobre a portaria.
  - name: tipo_portaria
    description: >
      Tipo da portaria no filtro único do painel: Seleção (resultado da seleção, enquadramento da calamidade,
      alteração e reaproveitamento), Autorização de
      contratação, Abertura do ciclo ou A confirmar. A portaria de Trabalho Social é o quarto tipo e vem da
      planilha de TS, não deste catálogo.
    tests:
    - accepted_values:
        values: ['Seleção', 'Autorização de contratação', 'Abertura do ciclo', 'A confirmar']
  - name: ciclo_selecao
    description: Ciclo de seleção a que a portaria pertence (Seleção PNHR 2017-2018, Seleção 2023, Seleção 2025).
- name: prata_rural_selecao_portarias
  description: Propostas selecionadas por todas as portarias de seleção do Rural num formato só. A 162/2018 vem
    do anexo do SFTP; as demais, do seed selecao_portarias_rural. Uma linha por linha do anexo.
  meta:
    tags:
    - silver
  columns:
  - name: id_selecao
    description: Identificador da linha do anexo (md5 de portaria, protocolo, empreendimento, EO, município, UH e ordem de repetição).
  - name: portaria_codigo
    description: Código da portaria (número_ano).
  - name: ato_selecao
    description: Nome do ato de seleção por extenso.
  - name: papel_portaria
    description: Papel da portaria no ciclo.
  - name: dt_portaria
    description: Data da portaria, quando confirmada.
  - name: dt_referencia_vinculo
    description: Data a partir da qual um contrato pode ter vindo da portaria.
  - name: uf
    description: Sigla da UF.
  - name: municipio
    description: Nome do município, em maiúsculas.
  - name: cod_ibge
    description: Código IBGE do município, só dígitos, quando o anexo traz.
  - name: municipio_chave
    description: Nome do município sem acento e sem espaço, para casar quando falta o código IBGE.
  - name: eo_cnpj_selecionada
    description: CNPJ da entidade organizadora selecionada (14 dígitos).
  - name: eo_nome_selecionada
    description: Nome da entidade organizadora selecionada, quando o anexo traz.
  - name: protocolo_proposta
    description: Número da proposta (NU_PROTOCOLO_SISAD), quando o anexo traz.
  - name: apf
    description: Código do empreendimento normalizado como APF, quando o anexo traz.
  - name: codigo_empreendimento
    description: Código do empreendimento como veio no anexo.
  - name: quantidade_uh_selecionadas
    description: UH selecionadas.
  - name: situacao_selecao
    description: Situação no anexo (Selecionada, Reaproveitada…).
  - name: observacao_selecao
    description: Observação da linha do anexo.
  - name: ic_portaria_fora_do_catalogo
    description: Verdadeiro se o código da portaria não está no catálogo portarias_selecao_rural.
  - name: fonte_linha
    description: De onde veio a linha (SFTP da 162/2018 ou seed).
  - name: arquivo_de_origem
    description: Arquivo de origem da linha (linhagem).
  - name: ciclo_selecao
    description: Ciclo de seleção da portaria (do catálogo).
- name: prata_rural_selecao_contrato
  description: Vínculo de cada proposta selecionada (todas as portarias) com o contrato que saiu dela. Tenta
    APF; depois CNPJ da EO + município (código IBGE); depois CNPJ da EO + município (nome e UF), só com contratos
    assinados a partir da portaria. Uma linha por linha do anexo.
  meta:
    tags:
    - silver
  columns:
  - name: id_selecao
    description: Identificador da linha do anexo.
  - name: portaria_codigo
    description: Código da portaria (número_ano).
  - name: ato_selecao
    description: Nome do ato de seleção por extenso.
  - name: papel_portaria
    description: Papel da portaria no ciclo.
  - name: dt_portaria
    description: Data da portaria, quando confirmada.
  - name: uf
    description: Sigla da UF da proposta selecionada.
  - name: municipio
    description: Município da proposta selecionada.
  - name: cod_ibge
    description: Código IBGE do município, quando o anexo traz.
  - name: eo_cnpj_selecionada
    description: CNPJ da entidade organizadora selecionada (14 dígitos).
  - name: eo_nome_selecionada
    description: Nome da entidade organizadora selecionada, quando o anexo traz.
  - name: protocolo_proposta
    description: Número da proposta, quando o anexo traz.
  - name: codigo_empreendimento
    description: Código do empreendimento como veio no anexo.
  - name: apf_selecao
    description: APF vinda do anexo, quando ele traz o código do empreendimento.
  - name: quantidade_uh_selecionadas
    description: UH selecionadas.
  - name: situacao_selecao
    description: Situação no anexo (Selecionada, Reaproveitada…).
  - name: ic_contratado
    description: Verdadeiro se a proposta foi ligada a um contrato.
  - name: metodo_vinculo
    description: Como o contrato foi achado (APF; CNPJ da EO + município pelo IBGE; CNPJ da EO + município pelo nome e UF; Sem vínculo).
  - name: confianca_vinculo
    description: Exata (APF); Alta (um só candidato e mesmas UH); Média (um só candidato); Baixa (vários candidatos). Nulo sem vínculo.
  - name: qt_contratos_candidatos
    description: Quantos contratos atendiam ao critério que achou o vínculo.
  - name: apf_contrato
    description: APF do contrato vinculado.
  - name: agente_financeiro
    description: Agente financeiro do contrato.
  - name: fonte_contrato
    description: De onde veio o contrato (visão consolidada Rural ou INT065 PNHR CAIXA).
  - name: dt_contratacao
    description: Data de contratação.
  - name: dias_selecao_ate_contrato
    description: Dias entre a portaria e o contrato (só quando a data da portaria é conhecida).
  - name: eo_cnpj_contrato
    description: CNPJ da EO no contrato (14 dígitos).
  - name: eo_nome_contrato
    description: Nome da EO no contrato.
  - name: ic_mesma_eo
    description: Verdadeiro se a EO do contrato é a selecionada. Nos vínculos por CNPJ é verdadeiro por construção.
  - name: uh_contratadas
    description: UH contratadas no contrato vinculado.
  - name: uh_entregues
    description: UH entregues no contrato vinculado.
  - name: status_operacao
    description: Situação simplificada do contrato, ou "Não contratado (sem vínculo)".
  - name: situacao_origem
    description: Situação do contrato como veio da origem.
  - name: qt_selecoes_mesmo_contrato
    description: Quantas linhas de anexo caíram no mesmo contrato. Acima de 1 pede conferência.
  - name: ic_portaria_fora_do_catalogo
    description: Verdadeiro se o código da portaria não está no catálogo.
  - name: fonte_linha
    description: De onde veio a linha do anexo.
  - name: arquivo_de_origem
    description: Arquivo de origem da linha do anexo.
  - name: ciclo_selecao
    description: Ciclo de seleção da portaria (do catálogo).
- name: prata_rural_autorizacao_proposta
  description: >
    Propostas autorizadas a contratar pelas portarias de autorização da Seleção 2023 do MCMV Rural, tipadas e
    com o catálogo. Fonte: bronze_seed_manual_rural_portaria_autorizacao (anexos extraídos dos PDFs de 1.133/2024,
    1.346/2024, 1.386/2024 e 278/2025). Uma linha por portaria × proposta. O número da proposta (UUID) é o
    mesmo do anexo da 354/2024.
  meta:
    tags:
    - silver
    openmetadata:
      glossary:
      - MCID.ProgramasHabitacionais.MCMV.MCMVRural
      - MCID.Identificadores.IDProposta
  columns:
  - name: id_autorizacao
    description: Identificador da linha (md5 de portaria e número da proposta).
    tests:
    - unique
    - not_null
  - name: portaria_codigo
    description: Código da portaria de autorização (número sem ponto + ano).
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_portarias_selecao')
        field: portaria_codigo
  - name: ato_autorizacao
    description: Nome por extenso da portaria (do catálogo).
  - name: dt_autorizacao
    description: Data da portaria (do catálogo; na falta, a do anexo).
  - name: ciclo_selecao
    description: Ciclo de seleção da autorização.
  - name: uf
    description: Sigla da UF.
    meta:
      openmetadata:
        glossary:
        - MCID.Identificadores.UF
  - name: municipio
    description: Município da proposta, em maiúsculas.
  - name: municipio_chave
    description: Chave de comparação do nome do município (sem acento, só letras e dígitos).
  - name: eo_cnpj
    description: CNPJ da entidade organizadora com 14 dígitos.
    meta:
      openmetadata:
        glossary:
        - MCID.Identificadores.CNPJ
  - name: eo_nome
    description: Nome da entidade organizadora.
  - name: protocolo_proposta
    description: Número de identificação da proposta (UUID, minúsculo). Liga a autorização à seleção.
    tests:
    - not_null
    meta:
      openmetadata:
        glossary:
        - MCID.Identificadores.IDProposta
  - name: empreendimento_nome
    description: Nome do empreendimento, quando o anexo traz.
  - name: quantidade_uh_autorizadas
    description: UH autorizadas.
  - name: ic_portaria_fora_do_catalogo
    description: Verdadeiro se a portaria não está no catálogo portarias_selecao_rural.
  - name: pagina
    description: Página do PDF.
  - name: metodo_extracao
    description: Método de extração do PDF.
  - name: tabela_origem
    description: Tabela do schema seeds de onde veio a linha.
  - name: arquivo_de_origem
    description: PDF de onde o anexo foi extraído.
- name: prata_rural_proposta_funil
  description: >
    Funil de cada proposta selecionada do Rural: seleção → autorização de contratação → contrato. Uma linha por
    linha do anexo da portaria de seleção (id_selecao): todas as colunas da prata_rural_selecao_contrato mais a
    autorização, ligada pelo número da proposta. `etapa_funil` é a etapa mais avançada com evidência
    (1. Selecionada, 2. Autorizada, 3. Contratada). Só 4 das 46 autorizações da Seleção 2023 estão carregadas,
    então "Contratada sem autorização carregada" é falta de dado, não irregularidade.
  meta:
    tags:
    - silver
    openmetadata:
      glossary:
      - MCID.ProgramasHabitacionais.MCMV.MCMVRural
      - MCID.Identificadores.IDProposta
  columns:
  - name: id_selecao
    description: Identificador da linha do anexo de seleção.
    tests:
    - unique
    - not_null
  - name: portaria_codigo
    description: Código da portaria (número_ano).
  - name: ato_selecao
    description: Nome do ato de seleção por extenso.
  - name: papel_portaria
    description: Papel da portaria no ciclo.
  - name: dt_portaria
    description: Data da portaria, quando confirmada.
  - name: uf
    description: Sigla da UF da proposta selecionada.
  - name: municipio
    description: Município da proposta selecionada.
  - name: cod_ibge
    description: Código IBGE do município, quando o anexo traz.
  - name: eo_cnpj_selecionada
    description: CNPJ da entidade organizadora selecionada (14 dígitos).
  - name: eo_nome_selecionada
    description: Nome da entidade organizadora selecionada, quando o anexo traz.
  - name: protocolo_proposta
    description: Número da proposta, quando o anexo traz.
  - name: codigo_empreendimento
    description: Código do empreendimento como veio no anexo.
  - name: apf_selecao
    description: APF vinda do anexo, quando ele traz o código do empreendimento.
  - name: quantidade_uh_selecionadas
    description: UH selecionadas.
  - name: situacao_selecao
    description: Situação no anexo (Selecionada, Reaproveitada…).
  - name: ic_contratado
    description: Verdadeiro se a proposta foi ligada a um contrato.
  - name: metodo_vinculo
    description: Como o contrato foi achado (APF; CNPJ da EO + município pelo IBGE; CNPJ da EO + município pelo nome e UF; Sem vínculo).
  - name: confianca_vinculo
    description: Exata (APF); Alta (um só candidato e mesmas UH); Média (um só candidato); Baixa (vários candidatos). Nulo sem vínculo.
  - name: qt_contratos_candidatos
    description: Quantos contratos atendiam ao critério que achou o vínculo.
  - name: apf_contrato
    description: APF do contrato vinculado.
  - name: agente_financeiro
    description: Agente financeiro do contrato.
  - name: fonte_contrato
    description: De onde veio o contrato (visão consolidada Rural ou INT065 PNHR CAIXA).
  - name: dt_contratacao
    description: Data de contratação.
  - name: dias_selecao_ate_contrato
    description: Dias entre a portaria e o contrato (só quando a data da portaria é conhecida).
  - name: eo_cnpj_contrato
    description: CNPJ da EO no contrato (14 dígitos).
  - name: eo_nome_contrato
    description: Nome da EO no contrato.
  - name: ic_mesma_eo
    description: Verdadeiro se a EO do contrato é a selecionada. Nos vínculos por CNPJ é verdadeiro por construção.
  - name: uh_contratadas
    description: UH contratadas no contrato vinculado.
  - name: uh_entregues
    description: UH entregues no contrato vinculado.
  - name: status_operacao
    description: Situação simplificada do contrato, ou "Não contratado (sem vínculo)".
  - name: situacao_origem
    description: Situação do contrato como veio da origem.
  - name: qt_selecoes_mesmo_contrato
    description: Quantas linhas de anexo caíram no mesmo contrato. Acima de 1 pede conferência.
  - name: ic_portaria_fora_do_catalogo
    description: Verdadeiro se o código da portaria não está no catálogo.
  - name: fonte_linha
    description: De onde veio a linha do anexo.
  - name: arquivo_de_origem
    description: Arquivo de origem da linha do anexo.
  - name: ciclo_selecao
    description: Ciclo de seleção da portaria (do catálogo).
  - name: portaria_autorizacao_codigo
    description: Código da portaria de autorização (número sem ponto + ano).
  - name: portaria_autorizacao
    description: Portaria de autorização no formato número/ano.
  - name: ato_autorizacao
    description: Nome por extenso da portaria de autorização.
  - name: dt_autorizacao
    description: Data da portaria de autorização.
  - name: quantidade_uh_autorizadas
    description: UH autorizadas na proposta.
  - name: ic_autorizada
    description: Verdadeiro se a proposta está numa portaria de autorização carregada.
  - name: qt_autorizacoes
    description: Em quantas portarias de autorização carregadas a proposta aparece (esperado 0 ou 1).
  - name: ic_uh_autorizada_igual_selecionada
    description: Verdadeiro se as UH autorizadas são as mesmas UH selecionadas.
  - name: dias_autorizacao_ate_contrato
    description: Dias entre a autorização e a contratação.
  - name: ic_contrato_antes_da_autorizacao
    description: Verdadeiro se o contrato ligado foi assinado antes da autorização (sinal de vínculo errado; regra R12).
  - name: etapa_funil
    description: Etapa mais avançada com evidência (1. Selecionada, 2. Autorizada, 3. Contratada).
    tests:
    - accepted_values:
        values: ['1. Selecionada', '2. Autorizada', '3. Contratada']
  - name: situacao_funil
    description: >
      Contratada com autorização carregada; Contratada sem autorização carregada; Autorizada, sem contrato
      identificado; Selecionada, sem autorização carregada e sem contrato.
