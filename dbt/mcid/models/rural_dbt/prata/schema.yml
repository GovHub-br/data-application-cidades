version: 2
models:
- name: prata_rural_cadastro_pj
  description: 'Cadastro PJ do empreendimento contratado no Novo MCMV Rural: entidade organizadora, composição
    do investimento, cisternas/efluentes, prazo de construção e datas-chave. Tipagem aplicada sobre a
    bronze do data lake: text→int, text→date, text→numeric, text→boolean.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos (chave de integração principal).
    tests:
    - not_null
  - name: eo_nome
    description: Nome da entidade organizadora (EO) responsável pelo empreendimento.
  - name: eo_cnpj
    description: CNPJ da entidade organizadora (apenas dígitos).
  - name: modalidade_codigo
    description: Código da modalidade do empreendimento no Rural.
  - name: qt_uh_contratadas
    description: Quantidade de unidades habitacionais contratadas.
  - name: vr_investimento_total
    description: Valor total de investimento em R$ (numeric 15,2).
  - name: qt_cisterna
    description: Quantidade de cisternas previstas no empreendimento.
  - name: percentual_obra_realizada
    description: Percentual de obra realizada informado no cadastro PJ.
- name: prata_rural_cadastro_pf
  description: 'Cadastro de beneficiários (pessoa física) do Novo MCMV Rural, com perfil socioeconômico:
    renda familiar, pessoas por família, Bolsa Família, BPC, subsídio e distrato. Uma linha por beneficiário.
    Alimenta a gold ouro_rural_perfil_beneficiarios.

    '
  meta:
    tags:
    - silver
  columns:
  - name: nu_registro
    description: Identificador do registro do beneficiário na remessa.
  - name: apf
    description: APF normalizado para 8 dígitos do empreendimento do beneficiário.
  - name: beneficiario_cpf
    description: CPF do beneficiário (apenas dígitos).
  - name: beneficiario_sexo
    description: 'Sexo declarado: F ou M.'
  - name: ic_benef_bolsa_familia
    description: Indicador booleano de beneficiário do Bolsa Família.
  - name: ic_benef_bpc
    description: Indicador booleano de beneficiário do BPC.
  - name: vr_renda_familiar
    description: Renda familiar declarada em R$ (numeric 15,2).
- name: prata_rural_obra_mensal
  description: 'Evolução física da obra no Novo MCMV Rural, snapshot mensal por APF: percentual previsto/realizado,
    UHs concluídas e alienadas, paralisação, retomada e datas de entrega.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos.
    tests:
    - not_null
  - name: percentual_obra_realizada
    description: Percentual de obra realizada (numeric 6,2).
  - name: percentual_obra_prevista
    description: Percentual de obra previsto no cronograma (numeric 6,2).
  - name: dt_alteracao_situacao
    description: 'Data da última alteração de situação. É a data usada como eixo temporal da execução
      física na gold ouro_rural_execucao_fisica_financeira.

      '
- name: prata_rural_financeiro_mensal
  description: 'Série de liberações financeiras do Novo MCMV Rural, decomposta por componente (obra, trabalho
    social, ATEC, cisternas/efluentes e custos indiretos). Várias linhas por APF.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos.
    tests:
    - not_null
  - name: dt_liberacao_recurso
    description: Data da liberação do recurso; eixo temporal da série financeira.
  - name: vr_movimento
    description: Valor total do movimento financeiro em R$ (numeric 15,2).
- name: prata_rural_prioritarios_snh
  description: 'Dados prioritários disponibilizados pela SNH, filtrados para `modalidade = ''RURAL''`.
    É a espinha dorsal da prata_rural_empreendimento: todos os outros insumos entram por left join sobre
    esta base.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos.
    tests:
    - not_null
  - name: modalidade
    description: Modalidade do empreendimento; o model filtra por RURAL.
  - name: situacao
    description: Situação do empreendimento informada pela SNH.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: ic_novo_mcmv
    description: 'Indicador booleano que separa Novo MCMV Rural de PNHR histórico. É o que define a coluna
      `programa` na gold.

      '
  - name: percentual_execucao_fisica
    description: Percentual de execução física da obra (numeric 6,2).
  - name: municipio
    description: Nome do município.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: estado_nome
    description: Nome da UF por extenso.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: regiao
    description: Nome da região.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: empreendimento_nome
    description: Nome do empreendimento.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: construtora_nome
    description: Nome da construtora/entidade.
    tests:
    - sem_mojibake:
        config:
          severity: warn
- name: prata_rural_prioritarios_caixa
  description: 'Dados prioritários recebidos da CAIXA, filtrados para `modalidade = ''RURAL''`. Lê a mesma
    origem do FAR (bronze.bronze_sftp_snh_pmcmv_dados_prioritarios_af_caixa), que é um snapshot de todas
    as modalidades — o recorte Rural é feito aqui.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos.
    tests:
    - not_null
  - name: valor_desembolsado
    description: Valor desembolsado acumulado em R$ (numeric 15,2).
- name: prata_rural_prioritarios_bb
  description: 'Dados prioritários recebidos do Banco do Brasil, filtrados para `modalidade = ''RURAL''`.
    Mesmo layout do prioritarios_caixa.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos.
    tests:
    - not_null
  - name: valor_desembolsado
    description: Valor desembolsado acumulado em R$ (numeric 15,2).
  - name: municipio
    description: Nome do município.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: empreendimento_nome
    description: Nome do empreendimento.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: situacao
    description: Situação do empreendimento na origem.
    tests:
    - sem_mojibake:
        config:
          severity: warn
- name: prata_rural_pnhr_caixa
  description: 'Histórico de empreendimentos PNHR na CAIXA (integração INT065). Cobre os contratos anteriores
    ao Novo MCMV Rural, com composição de investimento, cisternas/efluentes e execução física.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos, derivado de nu_apf.
    tests:
    - not_null
  - name: percentual_execucao_fisica
    description: Percentual de obra realizado (numeric 6,2).
  - name: municipio
    description: Nome do município.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: empreendimento_nome
    description: Nome do empreendimento.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: eo_nome
    description: Nome da entidade organizadora.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: situacao_obra
    description: Situação da obra informada pelo agente.
    tests:
    - sem_mojibake:
        config:
          severity: warn
- name: prata_rural_pnhr_bb
  description: 'Histórico de empreendimentos PNHR no Banco do Brasil (integração INT057). Diferente da
    CAIXA, o APF é derivado do número do contrato do empreendimento, porque o INT057 não traz nu_apf.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado a partir de nu_contrato_empreendimento.
    tests:
    - not_null
  - name: percentual_execucao_financeira
    description: Percentual de execução financeira da obra (numeric 6,2).
- name: prata_rural_pnhr_liberacoes
  description: 'Liberações de recurso do PNHR (integração INT055 CAIXA/BB), tipadas e já filtradas por
    `no_programa like ''%PNHR%''`. Concentra aqui a leitura da fonte, para a gold
    ouro_rural_evolucao_financeira não precisar parsear text cru.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos.
    tests:
    - not_null
  - name: dt_liberacao
    description: 'Data da liberação. O INT055 chega com ISO em algumas remessas e dd/mm/aaaa em outras;
      o model trata os dois formatos.

      '
    tests:
    - not_null
  - name: vr_liberado
    description: Valor liberado em R$ (numeric 15,2).
- name: prata_rural_trabalho_social_caixa
  description: 'Base de acompanhamento do Plano de Trabalho Social (PTS) do PNHR pela CAIXA: situação
    do TS, valor global e desembolsado, % de execução do TS e % de obra reportado. Alimenta a gold ouro_rural_ficha_trabalho_social.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF normalizado para 8 dígitos, derivado do número do contrato.
    tests:
    - not_null
  - name: situacao_ts
    description: Situação do trabalho social informada pela CAIXA.
  - name: percentual_execucao_ts
    description: Percentual de execução do trabalho social (numeric 6,2).
  - name: percentual_obra
    description: 'Percentual de obra reportado na própria base de TS. É comparado com o percentual_execucao_ts
      na gold para medir a defasagem físico-social.

      '
  - name: vr_a_desembolsar_nao_concluidos
    description: Valor de TS a desembolsar em empreendimentos não concluídos, em R$.
  - name: vr_nao_desembolsado_concluidos
    description: 'Valor de TS não desembolsado em empreendimentos já concluídos, em R$. Só existe na base
      da CAIXA — o BB não informa esta coluna.

      '
- name: prata_rural_trabalho_social_bb
  description: 'Base de acompanhamento do Plano de Trabalho Social (PTS) do PNHR pelo Banco do Brasil.
    Mesmo papel do trabalho_social_caixa, mas o layout de origem é diferente: os nomes das colunas de
    valor e de data não coincidem e a base não traz vr_nao_desembolsado_concluidos.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: 'APF normalizado para 8 dígitos, derivado de contrato_registro_ao (o equivalente ao `contrato`
      da base da CAIXA).

      '
    tests:
    - not_null
  - name: situacao_ts
    description: Situação do trabalho social informada pelo BB.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: percentual_execucao_ts
    description: Percentual de execução do trabalho social (numeric 6,2).
  - name: dt_ultimo_relatorio
    description: 'Data do último relatório de TS. Só existe na base do BB — a da CAIXA traz dt_ultimo_avt
      e dt_avf no lugar.

      '
  - name: municipio
    description: Nome do município.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: empreendimento_nome
    description: Nome do empreendimento.
    tests:
    - sem_mojibake:
        config:
          severity: warn
- name: prata_rural_empreendimento
  description: 'Visão unificada do empreendimento Rural. Parte do prioritarios_snh e resolve cada atributo
    por coalesce na ordem SNH → agente (CAIXA/BB) → cadastro PJ → histórico PNHR, para que um empreendimento
    apareça uma única vez com o melhor dado disponível. É a base de toda a camada gold.

    '
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: Chave primária. APF normalizado para 8 dígitos.
    tests:
    - not_null
    - unique
  - name: ic_novo_mcmv
    description: 'Booleano que separa Novo MCMV Rural de PNHR histórico. Vem do SNH e, na ausência dele,
      da presença do APF no cadastro PJ do Novo MCMV.

      '
  - name: quantidade_uh_contratadas
    description: UHs contratadas, resolvidas por coalesce entre as fontes.
  - name: valor_contratado
    description: Valor contratado em R$, resolvido por coalesce entre as fontes.
  - name: percentual_execucao_fisica
    description: Percentual de execução física, resolvido por coalesce entre as fontes.
  - name: municipio
    description: Nome do município.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: estado_nome
    description: Nome da UF por extenso.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: regiao
    description: Nome da região.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: empreendimento_nome
    description: Nome do empreendimento.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: entidade_organizadora_nome
    description: Nome da entidade organizadora.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: construtora_nome
    description: Nome da construtora/entidade.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: situacao_empreendimento
    description: Situação resolvida por coalesce entre as fontes.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: fonte_execucao_fisica
    description: >
      Qual fonte produziu o `percentual_execucao_fisica` desta linha (prioritarios_snh,
      prioritarios_caixa, prioritarios_bb, obra_mensal, pnhr_caixa, pnhr_bb, cadastro_pj).
      Existe porque as fontes discordam: no APF 63665048 o SNH dizia 33,90% e a CAIXA e o
      MONIT de obra diziam 100,00%. Sem a procedência, o número aparece no dashboard sem
      como conferir de onde veio.
    tests:
      - accepted_values:
          values: [prioritarios_snh, prioritarios_caixa, prioritarios_bb, obra_mensal,
                   pnhr_caixa, pnhr_bb, cadastro_pj]
          config:
            severity: warn
  - name: dt_referencia_execucao_fisica
    description: >
      Data de medição da fonte que venceu para a execução física. É o que permite dizer
      "100% (CAIXA, ref. 31/07/2026)" em vez de só "100%".
  - name: fonte_valor_desembolsado
    description: Idem, para o valor desembolsado.
  - name: dt_referencia_valor_desembolsado
    description: Data de medição da fonte que venceu para o valor desembolsado.
  - name: fonte_valor_contratado
    description: Idem, para o valor contratado.
  - name: fonte_situacao
    description: Idem, para a situação do empreendimento.
  - name: dt_referencia_consolidada
    description: >
      Data da medição mais recente que entrou nesta linha, qualquer que seja o campo. É a
      idade do empreendimento na visão consolidada — serve para o dashboard avisar quando
      um número é velho, em vez de apresentá-lo com a mesma autoridade de um de ontem.

  # --- perguntas do MCID (models/docs/entregas/perguntas-mcid-rural-fnhis-pro-moradia.md) ---
- name: prata_rural_obra_mensal_serie
  description: 'Situação da obra do Novo Rural mês a mês (série desde dez/2025): uma linha por APF e mês
    de referência, com situação e andamento decodificados pelo layout da CAIXA, percentual previsto e
    realizado, motivos de paralisação, não retomada e distrato, e o estágio do mês anterior para medir
    mudanças.'
  meta:
    tags:
    - silver
  data_tests:
  - chave_composta_unica:
      arguments:
        colunas:
        - apf
        - dt_referencia
  columns:
  - name: apf
    description: APF da operação (8 dígitos, normalizada por normalize_apf) — chave do empreendimento
      no Rural.
  - name: dt_referencia
    description: Mês de referência do retrato (primeiro dia do mês).
  - name: co_situacao_operacao
    description: Código da situação da operação no layout MONIT_MOV_OBRA_RURAL (1 a 12; 16 aparece e não
      está no layout).
  - name: situacao_operacao
    description: Descrição oficial do código de situação (seed dominio_rural_obra).
  - name: estagio_obra
    description: 'Estágio simplificado: Não iniciada, Em obra - no prazo, Em obra - atrasada, Paralisada,
      Concluída, Entregue...'
  - name: co_andamento_operacao
    description: Código do andamento da obra (1 a 8) no layout.
  - name: andamento_operacao
    description: 'Descrição do andamento: Não iniciada, Normal, Atrasada, Paralisada, Em retomada...'
  - name: percentual_obra_prevista
    description: Percentual de obra previsto no cronograma para o mês.
  - name: percentual_obra_realizada
    description: Percentual de obra acumulado realizado no mês.
  - name: desvio_cronograma_pp
    description: Realizado menos previsto, em pontos percentuais (negativo = atraso).
  - name: dt_alteracao_situacao
    description: Data da última alteração da situação informada pela CAIXA.
  - name: dt_paralisacao
    description: Data de paralisação do empreendimento, quando houver.
  - name: co_classificacao_paralisados
    description: Código do motivo de paralisação/atraso (zero vira nulo).
  - name: motivo_paralisacao
    description: Descrição do motivo de paralisação/atraso (técnico, orçamentário, abandono pela EO...).
  - name: co_classificacao_nao_retomada
    description: Código do motivo de não retomada de obra paralisada.
  - name: motivo_nao_retomada
    description: Descrição do motivo de não retomada (defasagem orçamentária, dívidas da EO...).
  - name: co_motivo_distrato
    description: Código do motivo de distrato do empreendimento.
  - name: motivo_distrato
    description: Descrição do motivo de distrato.
  - name: detalhe_paralisacao
    description: Texto livre da CAIXA detalhando paralisação ou não retomada.
  - name: dt_previsao_entrega
    description: Data prevista de entrega do empreendimento ao beneficiário.
  - name: estagio_mes_anterior
    description: Estágio da mesma APF no mês anterior da série (nulo no primeiro retrato).
  - name: arquivo_de_origem
    description: Nome do arquivo da staging de onde veio a linha (linhagem).
- name: prata_rural_gehis_andamento_obra
  description: Andamento de obra da CAIXA (GEHIS) por APF e mês, de jul/2021 em diante, com a situação
    da obra (Normal, Em atenção, Risco de paralisação, Paralisado, Obra retomada...) e as datas previstas,
    marcando se a APF pertence ao Rural. Quando chega mais de um arquivo no mês, vale o último.
  meta:
    tags:
    - silver
  data_tests:
  - chave_composta_unica:
      arguments:
        colunas:
        - apf
        - dt_referencia
  columns:
  - name: apf
    description: APF da operação (8 dígitos, normalizada).
  - name: dt_referencia
    description: Mês de referência do retrato (primeiro dia do mês).
  - name: frente_mcmv
    description: Rural quando a APF está na visão consolidada do Rural; Outra frente (FAR, Entidades)
      caso contrário.
  - name: situacao_obra
    description: Situação da obra segundo a GEHIS/CAIXA, em maiúsculas.
  - name: dt_prevista_conclusao
    description: Data prevista de conclusão da obra informada pela CAIXA.
  - name: dt_prevista_inauguracao
    description: Data prevista de inauguração informada pela CAIXA.
  - name: arquivo_de_origem
    description: Nome do arquivo da staging de onde veio a linha (linhagem).
- name: prata_rural_selecao_portaria_162
  description: Empreendimentos do Rural selecionados pela Portaria MCidades nº 162/2018, com a entidade
    organizadora selecionada, a localização e as UH. O código do empreendimento é normalizado como APF
    para casar com os contratos do PNHR e da SNH.
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: Código do empreendimento normalizado como APF (8 dígitos).
  - name: codigo_empreendimento
    description: Código do empreendimento como veio na portaria.
  - name: entidade_organizadora_cnpj
    description: CNPJ da entidade organizadora selecionada, só dígitos.
  - name: uf
    description: Sigla da UF.
  - name: municipio
    description: Nome do município.
  - name: regiao
    description: Região geográfica da UF.
  - name: quantidade_uh_selecionadas
    description: UH selecionadas para o empreendimento.
  - name: dt_portaria
    description: Data da portaria de seleção (27/02/2018).
  - name: ato_selecao
    description: 'Ato de seleção: Portaria MCidades nº 162/2018.'
  - name: arquivo_de_origem
    description: Nome do arquivo da staging de onde veio a linha (linhagem).
- name: prata_rural_operacao_eo
  description: Operação do Rural (PNHR e Novo Rural) com a entidade organizadora resolvida e o status
    simplificado. A EO vem do cadastro de EO (Cad PJ, INT065, INT057); onde falta, do CNPJ construtora/entidade
    do arquivo AF CAIXA, ainda a confirmar com a CAIXA. Uma linha por APF.
  meta:
    tags:
    - silver
  columns:
  - name: apf
    description: APF da operação (8 dígitos, normalizada por normalize_apf) — chave do empreendimento
      no Rural.
    data_tests:
    - not_null
    - unique
  - name: agente_financeiro
    description: Agente financeiro da operação (CAIXA ou BB).
  - name: ic_novo_mcmv
    description: Verdadeiro para operação do Novo MCMV (2023 em diante); falso para o PNHR antigo.
  - name: empreendimento_nome
    description: Nome do empreendimento.
  - name: municipio
    description: Nome do município.
  - name: uf
    description: Sigla da UF.
  - name: regiao
    description: Região geográfica da UF.
  - name: cod_ibge
    description: Código IBGE do município (como na visão consolidada do Rural).
  - name: eo_cnpj
    description: CNPJ da entidade organizadora, só dígitos.
  - name: eo_nome
    description: Nome da entidade organizadora.
  - name: fonte_eo
    description: 'De onde veio a EO: cadastro de EO (Cad PJ/INT065/INT057), AF CAIXA construtora/entidade
      (a confirmar) ou sem EO.'
  - name: situacao_empreendimento
