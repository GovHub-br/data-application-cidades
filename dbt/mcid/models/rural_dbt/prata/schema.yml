    description: "Nome da construtora."
  - name: fonte_execucao_fisica
    description: 'Fonte que produziu o percentual de execução física, propagada da silver. Publicar o número sem
      a procedência foi o que deixou a ficha (33,90%) e o gráfico (100,00%) discordarem na mesma tela sem ninguém
      saber por quê.

      '
