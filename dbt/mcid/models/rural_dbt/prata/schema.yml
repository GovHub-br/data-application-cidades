- name: prata_rural_evolucao_financeira
  description: Lógica que antes ficava na ouro ouro_rural_evolucao_financeira, trazida para a prata para a ouro
    ler só prata. Série temporal Gold de liberações por APF × mês, com acumulado progressivo e percentual executado
    sobre o valor contratado. Une o financeiro mensal do Novo MCMV Rural (decomposto por componente) com as liberações
    históricas do PNHR vindas da silver liberacoes_pnhr — o INT055 não decompõe por componente, então essas linhas
    entram só no total liberado.
  meta:
    tags:
    - silver
  columns:
