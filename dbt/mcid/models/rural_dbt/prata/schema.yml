    description: Fonte que produziu a situação do empreendimento.
  - name: dt_referencia_consolidada
    description: Data da medição mais recente que entrou na linha, qualquer que seja o campo.
  - name: dias_desde_ultima_medicao
    description: '`current_date - dt_referencia_consolidada`. Serve para o dashboard marcar número velho: uma fonte
      de boa cobertura pode estar meses atrás dos feeds mensais.

      '
  - name: vr_acumulado_liberacoes
    description: 'Soma da série de liberações (FLUXO), para ser confrontada com `valor_desembolsado`, que é ESTOQUE.
      Quando as duas não fecham é a série que está incompleta: o INT055 só traz o que CAIXA e BB reportaram por
      aquela integração e o feed para em 2025-03, então contrato antigo tem história anterior ao arquivo. No APF
      29712236 o estoque diz 100% do contratado e a série soma 75,7%.

      '
  - name: percentual_acumulado_liberacoes
    description: '`vr_acumulado_liberacoes` sobre o valor contratado. É o número que o gráfico plota.

      '
  - name: qt_meses_com_liberacao
    description: Meses com liberação registrada na série. Zero/nulo = sem série financeira.
  - name: diferenca_estoque_menos_serie
    description: '`valor_desembolsado - vr_acumulado_liberacoes`. Positivo = a série não cobre todo o desembolso
      informado. Negativo merece investigação: a série passou do estoque.

      '
  - name: consistencia_desembolso
    description: 'Marca desembolso acima de contratado + aportes. Acontece de verdade (suplementação), mas é também
      a assinatura de erro de sinal ou liberação duplicada na origem. Marcado em vez de limitado: um `least(pct,
      100)` esconderia justamente o caso a olhar.

      '
