version: 2

# Espelho textual do parquet, então o teste que importa é o de layout. A lista `colunas`
# de cada tabela é o contrato aceito hoje: mudou na origem, atualizar a lista é aceitar.
#
# `bronze_sftp_snh_pmcmv_dados_prioritarios_af_caixa` NÃO é declarado aqui: é o mesmo
# arquivo do FAR e o model já existe em far_dbt/bronze/. Nome de model é único no projeto,
# e com os três schemas compartilhados a tabela também é — a prata do rural apenas a
# referencia e filtra modalidade RURAL.

