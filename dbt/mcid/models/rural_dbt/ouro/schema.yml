    description: Mês de referência (primeiro dia do mês).
    tests:
    - not_null
  - name: ic_ultimo_mes
    description: Verdadeiro nas linhas do último mês da série (usado para a tabela "último mês" do painel).
  - name: tipo_portaria
    description: Seleção, Autorização de contratação ou Trabalho Social.
    tests:
    - accepted_values:
        values: ['Seleção', 'Autorização de contratação', 'Trabalho Social']
  - name: portaria
    description: Portaria do tipo (número/ano) ou o motivo de não haver.
  - name: uf
    description: Sigla da UF.
  - name: agente_financeiro
    description: Agente financeiro (hoje só CAIXA no Novo Rural).
  - name: programa
    description: Programa (NOVO MCMV RURAL).
  - name: qt_contratos
    description: Contratos (APF) assinados até o mês.
  - name: uh_contratadas
    description: UH desses contratos.
  - name: valor_contratado
    description: Valor contratado desses contratos (R$).
  - name: vr_liberado_acumulado
    description: Liberado acumulado até o mês (R$), líquido de devoluções; contrato sem liberação conta 0.
