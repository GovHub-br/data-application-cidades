  - name: fis_p90
    description: "% físico realizado: percentil 90 na idade."
  - name: fis_previsto_mediana
    description: "% físico previsto pelo cronograma dos contratos: mediana na idade."
  - name: fin_p25
    description: "% financeiro liberado: percentil 25 na idade."
  - name: fin_mediana
