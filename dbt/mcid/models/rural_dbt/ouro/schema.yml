    description: Contratos com algum retrato físico até o mês.
  - name: qt_contratos_com_retrato_no_mes
    description: Contratos com retrato físico exatamente naquele mês (os demais repetem o último).
  - name: uh_com_medicao
    description: UH dos contratos com medição física (denominador do % físico realizado).
  - name: fis_realizado_x_uh
    description: Σ(% físico realizado × UH). % físico realizado = fis_realizado_x_uh ÷ uh_com_medicao.
  - name: uh_com_previsao
    description: UH dos contratos com % previsto (denominador do % físico previsto).
  - name: fis_previsto_x_uh
    description: Σ(% físico previsto × UH). % físico previsto = fis_previsto_x_uh ÷ uh_com_previsao.
  - name: pct_fisico_realizado
    description: '% físico realizado da linha, ponderado por UH. Não somar nem tirar média entre linhas.'
  - name: pct_fisico_previsto
    description: '% físico previsto da linha, ponderado por UH. Não somar nem tirar média entre linhas.'
  - name: pct_financeiro
    description: '% financeiro da linha (liberado acumulado ÷ contratado × 100). Não somar nem tirar média entre linhas.'
- name: ouro_rural_curva_s_referencia
  description: >
    Curva S de referência do Novo MCMV Rural por tempo de contrato (meses desde a contratação): para cada idade, a
    distribuição do % físico realizado e do % financeiro de todos os empreendimentos com retrato naquela idade
    (MONIT_MOV_OBRA, dez/2025 em diante). A mediana é a curva padrão; a faixa p25–p75 contém a metade central dos
    empreendimentos. Grão: idade_meses. Comparar por idade, e não por mês do calendário, evita misturar contratos
    novos e antigos.
