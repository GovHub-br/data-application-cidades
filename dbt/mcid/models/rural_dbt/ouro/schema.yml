# --- aba Rural do painel do MCID: vínculos e qualidade (2026-10-09) ---
- name: ouro_rural_painel_operacao
  description: >
    Dataset principal da aba Rural do painel do MCID: a prata_rural_vinculo_operacao publicada como está.
    Uma linha por APF (contrato = empreendimento). Some valores e conte APFs/EOs distintas a partir daqui; não
    some percentuais — recalcule como Σ desembolsado ÷ Σ contratado e média de % físico ponderada por UH.
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: 'Código da operação (APF). No Rural identifica ao mesmo tempo o contrato e o empreendimento.'
    tests:
    - unique
    - not_null
  - name: agente_financeiro
    description: 'Agente financeiro da operação (CAIXA ou BB).'
  - name: programa
    description: 'PNHR (HISTÓRICO) ou NOVO MCMV RURAL.'
  - name: nome_empreendimento
    description: 'Nome do empreendimento.'
  - name: municipio
    description: 'Município do empreendimento.'
  - name: uf
    description: 'Sigla da UF.'
  - name: regiao
    description: 'Região geográfica da UF.'
  - name: dt_contratacao
    description: 'Data de contratação da operação.'
  - name: ano_contratacao
    description: 'Ano da data de contratação.'
  - name: situacao_empreendimento
    description: 'Situação do empreendimento como informada na origem.'
  - name: status_execucao
    description: 'Status pela execução física: Concluído (100%), Não Iniciado (0%) ou Em Andamento.'
  - name: status_operacao
    description: 'Status simplificado da operação: Concluída, Em obra, Paralisada, Não iniciada ou Distratada.'
  - name: quantidade_uh
    description: 'Unidades habitacionais contratadas.'
  - name: quantidade_uh_entregues
    description: 'Unidades habitacionais entregues.'
  - name: valor_contratado
    description: 'Valor contratado da operação (R$).'
  - name: valor_aporte_adicional
    description: 'Aporte adicional à operação (R$).'
  - name: valor_desembolsado
    description: 'Valor desembolsado acumulado (R$), conforme o arquivo de dados prioritários do agente.'
  - name: percentual_execucao_fisica
    description: 'Execução física mais recente informada pelo agente (0 a 100).'
  - name: percentual_execucao_financeira
    description: 'valor_desembolsado ÷ valor_contratado × 100. Nulo quando o valor contratado é nulo ou zero.'
  - name: diferenca_financeiro_fisico_pp
    description: 'Execução financeira menos execução física, em pontos percentuais. Positivo: pagou mais do que a obra avançou. Nulo se faltar um dos dois.'
  - name: ritmo_fisico_financeiro
    description: 'Desembolso Adiantado / Atrasado / Ritmo Equilibrado (margem de 5 p.p.) ou Sem Informação.'
  - name: consistencia_desembolso
    description: 'Dentro do Contratado ou Desembolso Acima do Contratado (desembolsado > contratado + aporte).'
  - name: dt_referencia_execucao_fisica
    description: 'Data de referência da medição física.'
  - name: dt_referencia_valor_desembolsado
    description: 'Data de referência do valor desembolsado.'
  - name: eo_cnpj
    description: 'CNPJ da entidade organizadora com 14 dígitos. Nulo se ausente ou inválido.'
  - name: eo_cnpj_origem
    description: 'CNPJ da EO como chegou da origem (só dígitos).'
  - name: eo_nome
    description: 'Nome da entidade organizadora.'
  - name: fonte_eo
    description: 'De onde veio a EO: cadastro de EO, AF CAIXA (a confirmar), CNPJ inválido na origem ou sem EO.'
  - name: situacao_vinculo_eo
    description: 'EO do cadastro de EO / EO a confirmar (arquivo AF CAIXA) / CNPJ da EO inválido na origem / Sem EO informada.'
  - name: portaria_selecao
    description: "Portaria que selecionou a proposta do contrato, no formato número/ano (162/2018, 354/2024, 697/2026). Nula se nenhuma proposta selecionada foi ligada à APF."
  - name: ic_selecionado_portaria_162
    description: "Verdadeiro se a portaria de seleção da APF é a 162/2018."
  - name: eo_cnpj_selecionada
    description: "CNPJ (14 dígitos) da EO indicada na portaria de seleção."
  - name: ic_mesma_eo_selecao
    description: 'Verdadeiro se a EO do contrato é a mesma da seleção; nulo quando não foi selecionada ou não há EO no contrato.'
  - name: agente_ts
    description: 'Agente cuja planilha de Trabalho Social traz a APF (CAIXA ou BB).'
  - name: portaria_ts
    description: 'Portaria de Trabalho Social adotada (21/2014, 464/2018, 75/2025). Nula quando não informada.'
  - name: situacao_ts
    description: 'Situação do Trabalho Social informada pelo agente.'
  - name: situacao_portaria_ts
    description: 'Portaria informada / Portaria não informada pelo agente / Sem registro de Trabalho Social.'
  - name: ic_sem_eo
    description: 'Regra R01: sem EO em nenhuma fonte.'
  - name: ic_cnpj_eo_invalido
    description: 'Regra R02: CNPJ da EO só com zeros na origem.'
  - name: ic_eo_a_confirmar
    description: 'Regra R03: EO vinda do arquivo AF CAIXA (campo construtora/entidade).'
  - name: ic_desembolso_acima_contratado
    description: 'Regra R05: desembolsado maior que contratado + aporte.'
  - name: ic_eo_diferente_da_selecao
    description: 'Regra R07: EO do contrato diferente da selecionada na Portaria 162/2018.'
  - name: ic_sem_trabalho_social
    description: 'Regra R09: APF fora das planilhas de Trabalho Social.'
  - name: ic_portaria_ts_nao_informada
    description: 'Regra R10: portaria de Trabalho Social vazia na planilha do agente.'
  - name: qt_alertas
    description: 'Quantidade de alertas que pedem ação na operação: sem EO válida (R01/R02), desembolso acima do contratado (R05) e EO diferente da selecionada (R07).'
  - name: ato_selecao
    description: Nome por extenso da portaria de seleção.
  - name: ciclo_selecao
    description: Ciclo de seleção (Seleção PNHR 2017-2018, Seleção 2023, Seleção 2025).
  - name: dt_portaria_selecao
    description: Data da portaria de seleção.
  - name: confianca_vinculo_selecao
    description: >
      Firmeza do vínculo proposta → contrato: Exata (pela APF), Alta (CNPJ da EO + município, um candidato e
      mesmas UH), Média (um candidato) ou Baixa (vários candidatos).
  - name: metodo_vinculo_selecao
    description: Regra que ligou a proposta selecionada ao contrato (APF; CNPJ da EO + município).
  - name: situacao_portaria_selecao
    description: Selecionada (vínculo exato/alto/médio/baixo) ou Sem portaria de seleção identificada.
  - name: portaria_autorizacao
    description: >
      Portaria que autorizou contratar a proposta selecionada, no formato número/ano (ex. 1133/2024). Nula
      quando a autorização da proposta ainda não foi carregada (hoje 4 das 46 da Seleção 2023).
  - name: ato_autorizacao
    description: Nome por extenso da portaria de autorização.
  - name: dt_autorizacao
    description: Data da portaria de autorização.
  - name: situacao_portaria_autorizacao
    description: >
      Autorização carregada; Seleção 2023 sem autorização carregada; Ciclo sem autorização carregada (162/2018,
      697/2026); Sem portaria de seleção identificada.
- name: ouro_rural_painel_pendencia
  description: >
    Pendências de vínculo e de qualidade do Rural, uma linha por registro × regra (R01 a R12).
    Conta ocorrências, não operações: uma APF pode estar em mais de uma regra. Cada regra tem classificação —
    Inconsistência comprovada, Associação ausente, Informação ausente ou Requer investigação. R11 (proposta
    autorizada sem contrato identificado) e R12 (contrato assinado antes da autorização) vêm do funil de portarias.
  meta:
    tags:
    - gold
  columns:
