  - name: dt_autorizacao
    description: Data da portaria de autorização.
  - name: situacao_portaria_autorizacao
    description: >
      Autorização carregada; Seleção 2023 sem autorização carregada; Ciclo sem autorização carregada (162/2018,
      697/2026); Sem portaria de seleção identificada.
- name: ouro_rural_curva_s
  description: >
    Curva S físico-financeira do Novo MCMV Rural, por mês, já agregada por recorte de portaria. Grão: mês ×
    tipo_portaria × portaria × UF × agente financeiro × programa. Carteira: contratos do Novo MCMV Rural já
    assinados até o mês (o PNHR fica fora: não tem medição física mensal). Físico: retratos mensais do
    MONIT_MOV_OBRA (dez/2025 em diante), com o último retrato repetido nos meses sem retrato. Financeiro:
    liberações do MONIT_MOV_FINANC acumuladas (jul/2024 em diante). Some as colunas de soma e recalcule os
    percentuais; não some nem tire média das colunas pct_*. Filtre UM tipo_portaria antes de somar.
  meta:
    tags:
    - gold
    openmetadata:
      glossary:
      - MCID.ProgramasHabitacionais.MCMV.MCMVRural
      - MCID.ExecucaoDeEmpreendimentos
  columns:
  - name: id_curva_s
    description: Identificador da linha (md5 do grão).
    tests:
    - unique
    - not_null
