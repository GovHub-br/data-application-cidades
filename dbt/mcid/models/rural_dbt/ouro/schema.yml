version: 2
models:
- name: ouro_rural_ficha_empreendimento
  description: 'Tabela Gold que alimenta a "Ficha do Empreendimento" no dashboard do MCMV Rural. Consome
    a prata_rural_empreendimento e injeta as regras de negócio finais: programa (Novo MCMV Rural vs.
    PNHR histórico), status de execução, status de prazo, valor por UH e ritmo físico-financeiro. Uma
    linha por empreendimento (APF).

    '
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: APF (Autorização de Projeto de Financiamento) do empreendimento.
    tests:
    - not_null
    - unique
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: programa
    description: 'Regra de negócio: NOVO MCMV RURAL quando ic_novo_mcmv, senão PNHR (HISTÓRICO).

      '
    tests:
    - accepted_values:
        values:
        - NOVO MCMV RURAL
        - PNHR (HISTÓRICO)
        config:
          severity: warn
  - name: pessoas_atendidas
    description: 'Estimativa de pessoas atendidas: UHs contratadas × 3,3 (média de moradores por domicílio),
      truncada para inteiro.

      '
  - name: municipio_uf
    description: Localização no formato "Município/UF".
  - name: apf_municipio_empreendimento
    description: 'Rótulo concatenado "APF - Município/UF - EMPREENDIMENTO", usado como dimensão de filtro
      no Superset.

      '
  - name: status_execucao_simplificado
    description: 'Regra de negócio: traduz o percentual físico em categorias (Não Iniciado, Em Andamento,
      Concluído, Status Desconhecido).

      '
    tests:
    - accepted_values:
        values:
        - Concluído
        - Não Iniciado
        - Em Andamento
        - Sem Informação
        config:
          severity: warn
  - name: status_prazo
    description: 'Regra de negócio: compara a previsão de entrega com a data atual. Alerta "Em Atraso"
      quando não foi entregue e a data venceu.

      '
    tests:
    - accepted_values:
        values:
        - Entregue
        - Em Atraso
        - Dentro do Prazo
        - Sem Previsão
        config:
          severity: warn
  - name: percentual_execucao_financeira
    description: Valor desembolsado sobre valor contratado, em %.
  - name: ritmo_fisico_financeiro
    description: 'Regra de negócio: compara o % de execução física com o % de desembolso, com tolerância
      de 5% (Ritmo Equilibrado, Desembolso Adiantado ou Atrasado).

      '
    tests:
    - accepted_values:
        values:
        - Desembolso Adiantado
        - Desembolso Atrasado
        - Ritmo Equilibrado
        - Sem Informação
        config:
          severity: warn
  - name: tipologia
    tests:
    - accepted_values:
        values:
        - Novo MCMV Rural
        - PNHR (Rural)
        config:
          severity: warn
  - name: nome_empreendimento
    tests:
    - not_null:
        config:
          severity: warn
    - sem_mojibake:
        config:
          severity: warn
  - name: municipio
    tests:
    - not_null:
        config:
          severity: warn
    - sem_mojibake:
        config:
          severity: warn
  - name: uf
    tests:
    - not_null:
        config:
          severity: warn
  - name: quantidade_uh
    tests:
    - not_null:
        config:
          severity: warn
  - name: valor_contratado
    tests:
    - not_null:
        config:
          severity: warn
  - name: valor_desembolsado
    tests:
    - not_null:
        config:
          severity: warn
  - name: percentual_execucao_fisica
    tests:
    - not_null:
        config:
          severity: warn
  - name: nome_entidade_organizadora
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: nome_construtora
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: fonte_execucao_fisica
    description: >
      Fonte que produziu o percentual de execução física, propagada da silver. Publicar o
      número sem a procedência foi o que deixou a ficha (33,90%) e o gráfico (100,00%)
      discordarem na mesma tela sem ninguém saber por quê.
  - name: dt_referencia_execucao_fisica
    description: Data de medição da fonte que venceu para a execução física.
  - name: fonte_valor_desembolsado
    description: Fonte que produziu o valor desembolsado.
  - name: dt_referencia_valor_desembolsado
    description: Data de medição da fonte que venceu para o valor desembolsado.
  - name: fonte_situacao
    description: Fonte que produziu a situação do empreendimento.
  - name: dt_referencia_consolidada
    description: Data da medição mais recente que entrou na linha, qualquer que seja o campo.
  - name: dias_desde_ultima_medicao
    description: >
      `current_date - dt_referencia_consolidada`. Serve para o dashboard marcar número
      velho: uma fonte de boa cobertura pode estar meses atrás dos feeds mensais.
  - name: vr_acumulado_liberacoes
    description: >
      Soma da série de liberações (FLUXO), para ser confrontada com `valor_desembolsado`,
      que é ESTOQUE. Quando as duas não fecham é a série que está incompleta: o INT055 só
      traz o que CAIXA e BB reportaram por aquela integração e o feed para em 2025-03, então
      contrato antigo tem história anterior ao arquivo. No APF 29712236 o estoque diz 100%
      do contratado e a série soma 75,7%.
  - name: percentual_acumulado_liberacoes
    description: >
      `vr_acumulado_liberacoes` sobre o valor contratado. É o número que o gráfico plota.
  - name: qt_meses_com_liberacao
    description: Meses com liberação registrada na série. Zero/nulo = sem série financeira.
  - name: diferenca_estoque_menos_serie
    description: >
      `valor_desembolsado - vr_acumulado_liberacoes`. Positivo = a série não cobre todo o
      desembolso informado. Negativo merece investigação: a série passou do estoque.
  - name: consistencia_desembolso
    description: >
      Marca desembolso acima de contratado + aportes. Acontece de verdade (suplementação),
      mas é também a assinatura de erro de sinal ou liberação duplicada na origem. Marcado
      em vez de limitado: um `least(pct, 100)` esconderia justamente o caso a olhar.
    tests:
      - accepted_values:
          values: [Dentro do Contratado, Desembolso Acima do Contratado, Sem Informação]
          config:
            severity: warn

- name: ouro_rural_resumo_gerencial
  description: 'Visão agregada Gold com os KPIs gerenciais (empreendimentos, UHs, UHs entregues, pessoas
    atendidas, valores e médias) agrupados por agente financeiro, programa, situação, tipologia e status.
    Alimenta os gráficos de pizza e barra do painel gerencial.

    '
  meta:
    tags:
    - gold
  columns:
  - name: total_empreendimentos
    description: Contagem de APFs no grupo.
    tests:
    - not_null:
        config:
          severity: warn
  - name: media_valor_por_uh
    description: Média do valor por UH dos empreendimentos do grupo.
  - name: total_uhs
    tests:
    - not_null:
        config:
          severity: warn
- name: ouro_rural_panorama_estadual
  description: 'Visão Gold por UF em formato longo (uma seção por linha) para o dashboard "Panorama Estadual":
    header com os grandes números e distribuições por agente financeiro, programa, situação e faixa de
    execução física. A seção de situação usa uma grade fixa de 4 status, então UF sem empreendimento em
    determinado status aparece com zero em vez de faltar.

    '
  meta:
    tags:
    - gold
  columns:
  - name: uf
    description: Sigla da UF.
  - name: secao
    description: 'Qual bloco do painel a linha alimenta: header, agente_financeiro, programa, situacao
      ou execucao_fisica.

      '
    tests:
    - accepted_values:
        values:
        - header
        - agente_financeiro
        - programa
        - situacao
        - execucao_fisica
        config:
          severity: warn
  - name: ordem
    description: Ordem de exibição dentro da seção (0 quando não se aplica).
  - name: estado
    tests:
    - sem_mojibake:
        config:
          severity: warn
  tests:
  - unique_combinacao:
      colunas:
      - uf
      - secao
      - dimensao
- name: ouro_rural_mapa_nacional
  description: 'Visão Gold geográfica para o mapa coroplético e os gráficos por região. Traz duas visões
    no mesmo formato, distinguidas pela coluna `nivel`: por UF (com código ISO 3166-2) e por região. Enriquecida
    com a referência IBGE.

    '
  meta:
    tags:
    - gold
  columns:
  - name: nivel
    description: uf ou regiao — indica a granularidade da linha.
    tests:
    - accepted_values:
        values:
        - uf
        - regiao
        config:
          severity: warn
  - name: iso_3166_2
    description: Código ISO 3166-2 (BR-XX), nulo nas linhas de região.
  - name: total_empreendimentos
    tests:
    - not_null:
        config:
          severity: warn
  - name: total_uhs
    tests:
    - not_null:
        config:
          severity: warn
  - name: estado_nome
    tests:
    - sem_mojibake:
        config:
          severity: warn
  tests:
  - unique_combinacao:
      colunas:
      - uf
      - nivel
- name: ouro_rural_evolucao_financeira
  description: 'Série temporal Gold de liberações por APF × mês, com acumulado progressivo e percentual
    executado sobre o valor contratado. Une o financeiro mensal do Novo MCMV Rural (decomposto por componente)
    com as liberações históricas do PNHR vindas da silver liberacoes_pnhr — o INT055 não decompõe por
    componente, então essas linhas entram só no total liberado.

    '
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: APF do empreendimento (8 dígitos, normalizado).
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: mes
    description: Primeiro dia do mês da(s) liberação(ões), truncado.
    tests:
    - not_null:
        config:
          severity: warn
  - name: vr_acumulado
    description: Soma progressiva do valor liberado por APF ao longo dos meses.
    tests:
    - not_null:
        config:
          severity: warn
  - name: pct_executado_financeiro
    description: vr_acumulado sobre valor_contratado, em %.
    tests:
    - not_null:
        config:
          severity: warn
  - name: vr_liberado_mes
    tests:
    - not_null:
        config:
          severity: warn
  tests:
  - unique_combinacao:
      colunas:
      - apf
      - mes
- name: ouro_rural_execucao_fisica_financeira
  description: 'Série temporal Gold comparando execução física e financeira por APF × mês, pronta para
    o gráfico de linhas. Faz full outer join entre as duas séries e preenche os buracos com o último valor
    conhecido (last observation carried forward), para que a linha não caia a zero em mês sem movimento.

    '
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: APF do empreendimento.
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: apf_municipio_empreendimento
    description: Rótulo concatenado com APF, município, UF e nome do empreendimento.
  - name: mes
    description: Mês de referência no formato YYYY-MM-DD.
    tests:
    - not_null
  - name: pct_obra_realizada
    description: Percentual de execução física acumulada.
  - name: pct_executado_financeiro
    description: Percentual de execução financeira acumulada.
  tests:
  - unique_combinacao:
      colunas:
      - apf
      - mes
- name: ouro_rural_ficha_trabalho_social
  description: 'Modelo Gold de acompanhamento do Plano de Trabalho Social (PTS). Empilha as bases de trabalho
    social da CAIXA e do BB e cruza com a ficha do empreendimento, permitindo comparar o ritmo do trabalho
    social com o da obra. Uma linha por APF × agente financeiro.

    '
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: APF do empreendimento.
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: situacao_trabalho_social
    description: Situação do PTS em maiúsculo; NÃO INFORMADO quando ausente.
  - name: ritmo_social_fisico
    description: 'Regra de negócio: compara o % de obra reportado no PTS com o % de execução do trabalho
      social, com tolerância de 10%.

      '
    tests:
    - accepted_values:
        values:
        - Trabalho Social Atrasado
        - Trabalho Social Adiantado
        - Ritmo Alinhado
        - Sem Informação
        config:
          severity: warn
  - name: agente_financeiro
    tests:
    - accepted_values:
        values:
        - CAIXA
        - BB
        config:
          severity: warn
  - name: valor_global_ts
    tests:
    - not_null:
        config:
          severity: warn
  - name: percentual_execucao_ts
    tests:
    - not_null:
        config:
          severity: warn
  - name: nome_empreendimento
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: municipio
    tests:
    - sem_mojibake:
        config:
          severity: warn
  tests:
  - unique_combinacao:
      colunas:
      - apf
      - agente_financeiro
- name: ouro_rural_perfil_beneficiarios
  description: 'Modelo Gold com o perfil socioeconômico agregado dos beneficiários por empreendimento:
    total de beneficiários, média de pessoas por família e proporção de mulheres, Bolsa Família e BPC.
    Agregado da silver cadastro_pf. Uma linha por APF; só aparecem APFs com beneficiário cadastrado (inner
    join).

    '
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: APF do empreendimento.
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: percentual_mulheres
    description: Proporção de beneficiárias mulheres sobre o total cadastrado, em %.
  - name: renda_familiar_media
    description: Média da renda familiar declarada em R$.
  - name: total_beneficiarios_cadastrados
    tests:
    - not_null:
        config:
          severity: warn
- name: ouro_rural_infraestrutura_agua_saneamento
  description: 'Modelo Gold do escopo rural específico de cisternas e efluentes: quantidade e investimento
    por empreendimento. Quantidades vêm do cadastro PJ e, na ausência dele, da soma do cadastro PF; valores
    vêm do cadastro PJ e, na ausência, do histórico PNHR do agente correspondente.

    '
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: APF do empreendimento.
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: valor_investimento_saneamento_total
    description: Soma do investimento em cisternas e efluentes em R$.
    tests:
    - not_null:
        config:
          severity: warn

  # --- perguntas do MCID (models/docs/entregas/perguntas-mcid-rural-fnhis-pro-moradia.md) ---
- name: ouro_rural_entidade_organizadora
  description: 'Histórico e capacidade de execução de cada entidade organizadora do Rural, de 2009 em
    diante: operações por status, UH contratadas, entregues e distratadas, valores, período de atuação,
    quantas vezes recontratou com operação anterior pendente e se foi selecionada na Portaria 162/2018.
    Não há histórico de habilitação na origem.'
  meta:
    tags:
    - gold
  columns:
  - name: eo_cnpj
    description: CNPJ da entidade organizadora, só dígitos.
    data_tests:
    - not_null
    - unique
  - name: eo_nome
    description: Nome mais recente da entidade organizadora.
  - name: fonte_eo
    description: Fontes de onde veio a EO nas operações dela (separadas por ponto e vírgula).
  - name: qt_operacoes
    description: Operações contratadas pela EO.
  - name: qt_operacoes_novo_mcmv
    description: Operações do Novo MCMV.
  - name: qt_concluidas
    description: Operações concluídas.
  - name: qt_em_obra
    description: Operações em obra.
  - name: qt_paralisadas
    description: Operações paralisadas.
  - name: qt_nao_iniciadas
    description: Operações com obra não iniciada.
  - name: qt_distratadas
    description: Operações distratadas ou canceladas.
  - name: uh_contratadas
    description: UH contratadas somadas.
  - name: uh_entregues
    description: UH entregues somadas.
  - name: uh_distratadas
    description: UH distratadas somadas.
  - name: percentual_medio_obra_abertas
    description: Média do percentual de obra das operações em obra ou paralisadas.
  - name: valor_contratado
    description: Valor contratado somado (R$).
  - name: valor_desembolsado
    description: Valor desembolsado somado (R$).
  - name: dt_primeira_contratacao
    description: Data da primeira contratação da EO.
  - name: dt_ultima_contratacao
    description: Data da contratação mais recente.
  - name: qt_anos_com_contratacao
    description: Quantos anos distintos a EO teve contratação.
  - name: qt_ufs
    description: Quantas UFs a EO atua.
  - name: ufs
    description: UFs onde a EO tem operação.
  - name: percentual_uh_entregues
    description: UH entregues sobre (contratadas − distratadas), em %.
  - name: qt_abertas
    description: Operações em obra, paralisadas ou não iniciadas.
  - name: qt_contratos_com_pendencia_anterior
    description: Contratos assinados enquanto outra operação anterior da EO estava pendente.
  - name: max_anteriores_pendentes
    description: Maior número de operações anteriores pendentes no momento de um novo contrato.
  - name: qt_selecionados_portaria_162
    description: Empreendimentos da EO selecionados na Portaria 162/2018.
  - name: uh_selecionadas_portaria_162
    description: UH selecionadas para a EO na Portaria 162/2018.
  - name: situacao_execucao_eo
    description: Com obra paralisada, Em execução, Entregou tudo o que contratou ou Concluída com entrega
      parcial.
- name: ouro_rural_entidade_recontratacao
  description: Para cada operação do Rural com entidade organizadora, quantas operações anteriores da
    mesma EO ainda não tinham obra concluída na data da contratação, quantas UH estavam pendentes e se
    alguma delas hoje está paralisada. A data de contratação substitui a data de inscrição no ciclo, que
    não existe no dado.
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: APF da operação (8 dígitos, normalizada por normalize_apf) — chave do empreendimento
      no Rural.
    data_tests:
    - not_null
    - unique
  - name: eo_cnpj
    description: CNPJ da entidade organizadora, só dígitos.
  - name: eo_nome
    description: Nome da entidade organizadora.
  - name: fonte_eo
    description: 'De onde veio a EO: cadastro de EO (Cad PJ/INT065/INT057), AF CAIXA construtora/entidade
      (a confirmar) ou sem EO.'
  - name: ic_novo_mcmv
    description: Verdadeiro para operação do Novo MCMV (2023 em diante); falso para o PNHR antigo.
  - name: empreendimento_nome
    description: Nome do empreendimento.
  - name: municipio
    description: Nome do município.
  - name: uf
    description: Sigla da UF.
  - name: dt_contratacao
    description: Data de contratação da operação.
  - name: ano_contratacao
    description: Ano da contratação.
  - name: quantidade_uh_contratadas
    description: UH contratadas na operação.
  - name: status_operacao
    description: 'Status simplificado: Concluída, Em obra, Paralisada, Não iniciada ou Distratada.'
  - name: qt_anteriores
    description: Operações da mesma EO contratadas antes desta.
  - name: qt_anteriores_pendentes
    description: Anteriores não distratadas e sem obra concluída na data desta contratação.
  - name: uh_anteriores_pendentes
    description: UH ainda não entregues nas anteriores pendentes.
  - name: qt_anteriores_hoje_paralisadas
    description: Anteriores que hoje estão paralisadas.
  - name: qt_anteriores_sem_data_conclusao
    description: Anteriores hoje concluídas sem data de conclusão — incerteza da medida.
  - name: dt_anterior_pendente_mais_antiga
    description: Contratação mais antiga entre as anteriores pendentes.
  - name: ic_contratou_com_pendencia
    description: Verdadeiro quando havia pelo menos uma anterior pendente.
  - name: situacao_recontratacao
    description: Primeira operação da EO, Anteriores concluídas, Contratou com anterior pendente (hoje
      paralisada ou não).
- name: ouro_rural_selecao_portaria_162
  description: 'Destino de cada empreendimento selecionado pela Portaria MCidades nº 162/2018: se virou
    contrato, em quanto tempo, com qual EO, quantas UH foram contratadas e entregues e em que situação
    está hoje. Único ciclo do Rural com lista nominal de selecionados; não há propostas apresentadas nem
    motivo de não seleção.'
  meta:
    tags:
    - gold
  columns:
  - name: apf
    description: Código do empreendimento selecionado normalizado como APF.
  - name: codigo_empreendimento
    description: Código do empreendimento como na portaria.
  - name: ato_selecao
    description: Ato de seleção (Portaria MCidades nº 162/2018).
  - name: dt_portaria
    description: Data da portaria.
  - name: uf
    description: Sigla da UF.
  - name: regiao
    description: Região geográfica da UF.
  - name: municipio
    description: Nome do município.
  - name: eo_cnpj_selecionada
    description: CNPJ da EO na seleção.
  - name: quantidade_uh_selecionadas
    description: UH selecionadas.
  - name: ic_contratado
    description: Verdadeiro quando a APF aparece em contrato (visão consolidada ou INT065).
  - name: fonte_contrato
    description: Onde o contrato foi encontrado.
  - name: dt_contratacao
    description: Data de contratação.
  - name: dias_selecao_ate_contrato
    description: Dias entre a portaria e a contratação.
  - name: eo_cnpj_contrato
    description: CNPJ da EO no contrato.
  - name: eo_nome_contrato
    description: Nome da EO no contrato.
  - name: ic_mesma_eo
    description: Verdadeiro quando a EO do contrato é a mesma da seleção.
  - name: uh_contratadas
    description: UH contratadas.
  - name: uh_entregues
