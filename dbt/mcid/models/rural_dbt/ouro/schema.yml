version: 2
models:
- name: ouro_rural_ficha_empreendimento
  description: >
    Ficha de cada empreendimento habitacional rural: do Novo MCMV Rural e do Programa Nacional de Habitação
    Rural (PNHR), que o antecedeu. Traz a entidade organizadora e a construtora, onde fica, quantas moradias
    foram contratadas e entregues, valores, execução física e financeira, prazo, e de que fonte e data
    veio cada número, para o painel mostrar a procedência e a idade de cada informação. É a base das demais
    tabelas do Rural.
  config:
    meta:
      tags:
      - gold
      documentacao:
        grao: Uma linha por empreendimento (APF).
        chave: [apf]
        fonte: >-
          Ministério das Cidades, monitoramento do MCMV Rural, e agentes financeiros (CAIXA e Banco do
          Brasil), inclusive o histórico do PNHR.
        periodicidade: mensal
        consumo:
        - Superset, painel RURAL (ficha do empreendimento)
  columns:
  - name: apf
    description: APF (Autorização de Projeto de Financiamento) do empreendimento.
    tests:
    - not_null
    - unique
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: programa
    description: 'Regra de negócio: NOVO MCMV RURAL quando ic_novo_mcmv, senão PNHR (HISTÓRICO).

      '
    tests:
    - accepted_values:
        values:
        - NOVO MCMV RURAL
        - PNHR (HISTÓRICO)
        config:
          severity: warn
  - name: pessoas_atendidas
    description: 'Estimativa de pessoas atendidas: UHs contratadas × 3,3 (média de moradores por domicílio),
      truncada para inteiro.

      '
  - name: municipio_uf
    description: Localização no formato "Município/UF".
  - name: apf_municipio_empreendimento
    description: 'Rótulo concatenado "APF - Município/UF - EMPREENDIMENTO", usado como dimensão de filtro
      no Superset.

      '
  - name: status_execucao_simplificado
    description: 'Regra de negócio: traduz o percentual físico em categorias (Não Iniciado, Em Andamento,
      Concluído, Status Desconhecido).

      '
    tests:
    - accepted_values:
        values:
        - Concluído
        - Não Iniciado
        - Em Andamento
        - Sem Informação
        config:
          severity: warn
  - name: status_prazo
    description: 'Regra de negócio: compara a previsão de entrega com a data atual. Alerta "Em Atraso"
      quando não foi entregue e a data venceu.

      '
    tests:
    - accepted_values:
        values:
        - Entregue
        - Em Atraso
        - Dentro do Prazo
        - Sem Previsão
        config:
          severity: warn
  - name: percentual_execucao_financeira
    description: Valor desembolsado sobre valor contratado, em %.
  - name: ritmo_fisico_financeiro
    description: 'Regra de negócio: compara o % de execução física com o % de desembolso, com tolerância
      de 5% (Ritmo Equilibrado, Desembolso Adiantado ou Atrasado).

      '
    tests:
    - accepted_values:
        values:
        - Desembolso Adiantado
        - Desembolso Atrasado
        - Ritmo Equilibrado
        - Sem Informação
        config:
          severity: warn
  - name: tipologia
    description: >-
      Programa do empreendimento como tipologia do painel (Novo MCMV Rural ou PNHR).
    tests:
    - accepted_values:
        values:
        - Novo MCMV Rural
        - PNHR (Rural)
        config:
          severity: warn
  - name: nome_empreendimento
    description: Nome do empreendimento, em maiúsculas.
    tests:
    - not_null:
        config:
          severity: warn
    - sem_mojibake:
        config:
          severity: warn
  - name: municipio
    description: Município do empreendimento.
    tests:
    - not_null:
        config:
          severity: warn
    - sem_mojibake:
        config:
          severity: warn
  - name: uf
    description: Sigla da UF.
    tests:
    - not_null:
        config:
          severity: warn
  - name: quantidade_uh
    description: Unidades habitacionais (moradias) contratadas.
    tests:
    - not_null:
        config:
          severity: warn
  - name: valor_contratado
    description: Valor contratado, em reais.
    tests:
    - not_null:
        config:
          severity: warn
  - name: valor_desembolsado
    description: Total já desembolsado, em reais (posição informada pela fonte).
    tests:
    - not_null:
        config:
          severity: warn
  - name: percentual_execucao_fisica
    description: Execução física na medição mais recente, em percentual.
    tests:
    - not_null:
        config:
          severity: warn
  - name: nome_entidade_organizadora
    description: Razão social da entidade organizadora, em maiúsculas.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: nome_construtora
    description: Razão social da construtora, em maiúsculas.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: fonte_execucao_fisica
    description: >
      Fonte que produziu o percentual de execução física, propagada da silver. Publicar o
      número sem a procedência foi o que deixou a ficha (33,90%) e o gráfico (100,00%)
      discordarem na mesma tela sem ninguém saber por quê.
  - name: dt_referencia_execucao_fisica
    description: Data de medição da fonte que venceu para a execução física.
  - name: fonte_valor_desembolsado
    description: Fonte que produziu o valor desembolsado.
  - name: dt_referencia_valor_desembolsado
    description: Data de medição da fonte que venceu para o valor desembolsado.
  - name: fonte_situacao
    description: Fonte que produziu a situação do empreendimento.
  - name: dt_referencia_consolidada
    description: Data da medição mais recente que entrou na linha, qualquer que seja o campo.
  - name: dias_desde_ultima_medicao
    description: >
      `current_date - dt_referencia_consolidada`. Serve para o dashboard marcar número
      velho: uma fonte de boa cobertura pode estar meses atrás dos feeds mensais.
  - name: vr_acumulado_liberacoes
    description: >
      Soma da série de liberações (FLUXO), para ser confrontada com `valor_desembolsado`,
      que é ESTOQUE. Quando as duas não fecham é a série que está incompleta: o INT055 só
      traz o que CAIXA e BB reportaram por aquela integração e o feed para em 2025-03, então
      contrato antigo tem história anterior ao arquivo. No APF 29712236 o estoque diz 100%
      do contratado e a série soma 75,7%.
  - name: percentual_acumulado_liberacoes
    description: >
      `vr_acumulado_liberacoes` sobre o valor contratado. É o número que o gráfico plota.
  - name: qt_meses_com_liberacao
    description: Meses com liberação registrada na série. Zero/nulo = sem série financeira.
  - name: diferenca_estoque_menos_serie
    description: >
      `valor_desembolsado - vr_acumulado_liberacoes`. Positivo = a série não cobre todo o
      desembolso informado. Negativo merece investigação: a série passou do estoque.
  - name: consistencia_desembolso
    description: >
      Marca desembolso acima de contratado + aportes. Acontece de verdade (suplementação),
      mas é também a assinatura de erro de sinal ou liberação duplicada na origem. Marcado
      em vez de limitado: um `least(pct, 100)` esconderia justamente o caso a olhar.
    tests:
    - accepted_values:
        values: [Dentro do Contratado, Desembolso Acima do Contratado, Sem Informação]
        config:
          severity: warn

  - name: agente_financeiro
    description: Agente financeiro que opera o contrato (CAIXA ou Banco do Brasil).
  - name: entidade_organizadora_cnpj
    description: CNPJ da entidade organizadora.
  - name: construtora_cnpj
    description: CNPJ da construtora.
  - name: quantidade_uh_entregues
    description: Moradias já entregues às famílias.
  - name: quantidade_uh_vigentes
    description: Moradias com contrato vigente.
  - name: latitude
    description: Latitude do empreendimento, quando informada.
  - name: longitude
    description: Longitude do empreendimento, quando informada.
  - name: situacao_empreendimento
    description: Situação do empreendimento como a fonte informa.
  - name: valor_aporte_adicional
    description: Aporte adicional ao valor contratado, em reais.
  - name: valor_por_uh
    description: Valor contratado dividido pelas moradias contratadas, em reais.
  - name: dt_contratacao
    description: Data de assinatura do contrato.
  - name: dt_previsao_entrega
    description: Data prevista para a entrega das moradias.
  - name: dt_conclusao_obra
    description: Data de conclusão da obra, quando informada.
- name: ouro_rural_resumo_gerencial
  description: 'Visão agregada Gold com os KPIs gerenciais (empreendimentos, UHs, UHs entregues, pessoas
    atendidas, valores e médias) agrupados por agente financeiro, programa, situação, tipologia e status.
    Alimenta os gráficos de pizza e barra do painel gerencial.

    '
  config:
    meta:
      tags:
      - gold
      documentacao:
        grao: Uma linha por combinação de agente financeiro, programa, situação, tipologia, 
          andamento da obra e situação do prazo.
        chave: [agente_financeiro, programa, situacao_empreendimento, tipologia, 
            status_execucao_simplificado, status_prazo]
        fonte: >-
          Ministério das Cidades, monitoramento do MCMV Rural, e agentes financeiros (CAIXA e Banco do
          Brasil), inclusive o histórico do PNHR.
        periodicidade: mensal
        consumo:
        - Superset, painel RURAL (resumo gerencial)
  columns:
  - name: total_empreendimentos
    description: Contagem de APFs no grupo.
    tests:
    - not_null:
        config:
          severity: warn
  - name: media_valor_por_uh
    description: Média do valor por UH dos empreendimentos do grupo.
  - name: total_uhs
    description: Soma das moradias contratadas no grupo.
    tests:
    - not_null:
        config:
          severity: warn
  - name: agente_financeiro
    description: Agente financeiro (CAIXA ou Banco do Brasil).
  - name: programa
    description: Novo MCMV Rural ou PNHR (histórico).
  - name: situacao_empreendimento
    description: Situação do empreendimento como a fonte informa.
  - name: tipologia
    description: Tipologia do painel (Novo MCMV Rural ou PNHR).
  - name: status_execucao_simplificado
    description: >-
      Andamento da obra (não iniciado, em andamento, concluído ou sem informação).
  - name: status_prazo
    description: >-
      Situação do prazo (entregue, em atraso, dentro do prazo ou sem previsão).
  - name: total_uhs_entregues
    description: Soma das moradias entregues no grupo.
  - name: total_pessoas_atendidas
    description: Soma da estimativa de pessoas atendidas no grupo.
  - name: somatorio_valor_contratado
    description: Soma do valor contratado, em reais.
  - name: somatorio_valor_desembolsado
    description: Soma do valor desembolsado, em reais.
  - name: somatorio_valor_aporte
    description: Soma dos aportes adicionais, em reais.
  - name: media_execucao_fisica
    description: >-
      Média simples da execução física dos empreendimentos do grupo, em percentual.
- name: ouro_rural_panorama_estadual
  description: 'Visão Gold por UF em formato longo (uma seção por linha) para o dashboard "Panorama Estadual":
    header com os grandes números e distribuições por agente financeiro, programa, situação e faixa de
    execução física. A seção de situação usa uma grade fixa de 4 status, então UF sem empreendimento em
    determinado status aparece com zero em vez de faltar.

    '
  config:
    meta:
      tags:
      - gold
      documentacao:
        grao: Uma linha por UF, seção do painel e categoria da seção.
        chave: [uf, secao, dimensao]
        fonte: >-
          Ministério das Cidades, monitoramento do MCMV Rural, e agentes financeiros (CAIXA e Banco do
          Brasil), inclusive o histórico do PNHR.
        periodicidade: mensal
        consumo:
        - Superset, painel RURAL (panorama estadual)
  columns:
  - name: uf
    description: Sigla da UF.
  - name: secao
    description: 'Qual bloco do painel a linha alimenta: header, agente_financeiro, programa, situacao
      ou execucao_fisica.

      '
    tests:
    - accepted_values:
        values:
        - header
        - agente_financeiro
        - programa
        - situacao
        - execucao_fisica
        config:
          severity: warn
  - name: ordem
    description: Ordem de exibição dentro da seção (0 quando não se aplica).
  - name: estado
    description: Nome do estado, em maiúsculas.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: dimensao
    description: Categoria da linha dentro da seção; nos grandes números vale "resumo".
  - name: qtd_empreendimentos
    description: >-
      Empreendimentos da categoria. Na seção de grandes números traz a quantidade de municípios; o total
      de empreendimentos está em `total_empreendimentos_uf`.
  - name: qtd_uhs
    description: Moradias da categoria.
  - name: valor_1
    description: Só nos grandes números; valor contratado total da UF, em reais.
  - name: valor_2
    description: Só nos grandes números; valor desembolsado total da UF, em reais.
  - name: valor_3
    description: Só nos grandes números; aporte adicional total da UF, em reais.
  - name: valor_4
    description: >-
      Só nos grandes números; valor contratado médio por moradia na UF, em reais.
  - name: total_empreendimentos_uf
    description: Só nos grandes números; quantidade de empreendimentos da UF.
  tests:
  - unique_combinacao:
      colunas:
      - uf
      - secao
      - dimensao
- name: ouro_rural_mapa_nacional
  description: 'Visão Gold geográfica para o mapa coroplético e os gráficos por região. Traz duas visões
    no mesmo formato, distinguidas pela coluna `nivel`: por UF (com código ISO 3166-2) e por região. Enriquecida
    com a referência IBGE.

    '
  config:
    meta:
      tags:
      - gold
      documentacao:
        grao: Uma linha por UF e uma por macrorregião.
        chave: [uf, nivel]
        fonte: >-
          Ministério das Cidades, monitoramento do MCMV Rural, e agentes financeiros (CAIXA e Banco do
          Brasil), inclusive o histórico do PNHR.
        periodicidade: mensal
        consumo:
        - Superset, painel RURAL (mapa nacional)
  columns:
  - name: nivel
    description: uf ou regiao — indica a granularidade da linha.
    tests:
    - accepted_values:
        values:
        - uf
        - regiao
        config:
          severity: warn
  - name: iso_3166_2
    description: Código ISO 3166-2 (BR-XX), nulo nas linhas de região.
  - name: total_empreendimentos
    description: Quantidade de empreendimentos.
    tests:
    - not_null:
        config:
          severity: warn
  - name: total_uhs
    description: Moradias contratadas.
    tests:
    - not_null:
        config:
          severity: warn
  - name: estado_nome
    description: Nome do estado; no nível de região, o nome da região.
    tests:
    - sem_mojibake:
        config:
          severity: warn
  - name: uf
    description: Sigla da UF; no nível de região, a sigla da região.
  - name: regiao_sigla
    description: Sigla da macrorregião do IBGE.
  - name: regiao_nome
    description: Nome da macrorregião do IBGE.
  - name: total_municipios
    description: Municípios com empreendimento rural.
  - name: total_valor_contratado
    description: Valor contratado, em reais.
  - name: total_valor_desembolsado
    description: Valor desembolsado, em reais.
  - name: media_execucao_fisica
    description: >-
      Média simples da execução física, em percentual, entre quem tem medição.
  - name: media_execucao_fisica_ponderada_uh
    description: >-
      Execução física média ponderada pelas moradias de cada empreendimento, em percentual.
  - name: empreendimentos_com_medicao_fisica
    description: Empreendimentos com execução física informada.
  tests:
  - unique_combinacao:
      colunas:
      - uf
      - nivel
- name: ouro_rural_evolucao_financeira
  description: 'Série temporal Gold de liberações por APF × mês, com acumulado progressivo e percentual
    executado sobre o valor contratado. Une o financeiro mensal do Novo MCMV Rural (decomposto por componente)
    com as liberações históricas do PNHR vindas da silver liberacoes_pnhr — o INT055 não decompõe por
    componente, então essas linhas entram só no total liberado.

    '
  config:
    meta:
      tags:
      - gold
      documentacao:
        grao: Uma linha por empreendimento e mês com liberação.
        chave: [apf, mes]
        fonte: >-
          Ministério das Cidades, monitoramento do MCMV Rural, e agentes financeiros (CAIXA e Banco do
          Brasil), inclusive o histórico do PNHR.
        periodicidade: mensal
        consumo:
        - Superset, painel RURAL (evolução financeira)
  columns:
  - name: apf
    description: APF do empreendimento (8 dígitos, normalizado).
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: mes
    description: Primeiro dia do mês da(s) liberação(ões), truncado.
    tests:
    - not_null:
        config:
          severity: warn
  - name: vr_acumulado
    description: Soma progressiva do valor liberado por APF ao longo dos meses.
    tests:
    - not_null:
        config:
          severity: warn
  - name: pct_executado_financeiro
    description: vr_acumulado sobre valor_contratado, em %.
    tests:
    - not_null:
        config:
          severity: warn
  - name: vr_liberado_mes
    description: Total liberado no mês, em reais; estornos entram com sinal negativo.
    tests:
    - not_null:
        config:
          severity: warn
  - name: qt_liberacoes
    description: Quantidade de liberações no mês.
  - name: vr_pago_obra_mes
    description: >-
      Parte do liberado destinada à obra, em reais; vazia no histórico do PNHR.
  - name: vr_pago_ts_mes
    description: >-
      Parte do liberado destinada ao trabalho social, em reais; vazia no PNHR.
  - name: vr_pago_atec_mes
    description: >-
      Parte do liberado destinada à assistência técnica, em reais; vazia no PNHR.
  - name: vr_pago_cisternas_efluentes_mes
    description: >-
      Parte do liberado destinada a cisternas e efluentes, em reais; vazia no PNHR.
  - name: vr_pago_custos_indiretos_mes
    description: >-
      Parte do liberado destinada a custos indiretos, em reais; vazia no PNHR.
  - name: valor_contratado
    description: Valor contratado do empreendimento, em reais.
  - name: municipio
    description: Município do empreendimento.
  - name: uf
    description: Sigla da UF.
  tests:
  - unique_combinacao:
      colunas:
      - apf
      - mes
- name: ouro_rural_execucao_fisica_financeira
  description: >
    Execução física e financeira de cada empreendimento na mesma série mensal, para o gráfico que compara
    as duas. O Rural não tem série mensal da obra: a execução física é a medição mais recente, repetida
    em todos os meses da série financeira. Empreendimento sem liberação registrada aparece numa só linha,
    no mês da medição física.
  config:
    meta:
      tags:
      - gold
      documentacao:
        grao: Uma linha por empreendimento e mês da série financeira.
        chave: [apf, mes]
        fonte: >-
          Ministério das Cidades, monitoramento do MCMV Rural, e agentes financeiros (CAIXA e Banco do
          Brasil), inclusive o histórico do PNHR.
        periodicidade: mensal
        consumo:
        - Superset, painel RURAL (execução física e financeira)
  columns:
  - name: apf
    description: APF do empreendimento.
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: apf_municipio_empreendimento
    description: Rótulo concatenado com APF, município, UF e nome do empreendimento.
  - name: mes
    description: Mês de referência no formato YYYY-MM-DD.
    tests:
    - not_null
  - name: pct_obra_realizada
    description: Execução física na medição mais recente, em percentual, repetida em todos os meses.
  - name: pct_executado_financeiro
    description: Liberado acumulado até o mês sobre o valor contratado, em percentual.
  - name: vr_acumulado
    description: Total liberado até o mês, em reais.
  - name: pct_financeiro_estoque
    description: >-
      Desembolsado informado pela fonte sobre o valor contratado, em percentual.
  - name: fonte_execucao_fisica
    description: Fonte da medição física exibida.
  - name: dt_referencia_execucao_fisica
    description: Data da medição física exibida.
  - name: tem_serie_financeira
    description: Verdadeiro quando o empreendimento tem liberações mensais registradas.
  tests:
  - unique_combinacao:
      colunas:
      - apf
      - mes
- name: ouro_rural_ficha_trabalho_social
  description: 'Modelo Gold de acompanhamento do Plano de Trabalho Social (PTS). Empilha as bases de trabalho
    social da CAIXA e do BB e cruza com a ficha do empreendimento, permitindo comparar o ritmo do trabalho
    social com o da obra. Uma linha por APF × agente financeiro.

    '
  config:
    meta:
      tags:
      - gold
      documentacao:
        grao: Uma linha por empreendimento e agente financeiro com trabalho social registrado.
        chave: [apf, agente_financeiro]
        fonte: >-
          Ministério das Cidades, monitoramento do MCMV Rural, e agentes financeiros (CAIXA e Banco do
          Brasil), inclusive o histórico do PNHR.
        periodicidade: mensal
        consumo:
        - Superset, painel RURAL (trabalho social)
  columns:
  - name: apf
    description: APF do empreendimento.
    tests:
    - not_null
    - relationships:
        to: ref('prata_rural_empreendimento')
        field: apf
  - name: situacao_trabalho_social
    description: Situação do PTS em maiúsculo; NÃO INFORMADO quando ausente.
  - name: ritmo_social_fisico
    description: 'Regra de negócio: compara o % de obra reportado no PTS com o % de execução do trabalho
      social, com tolerância de 10%.

      '
    tests:
    - accepted_values:
        values:
        - Trabalho Social Atrasado
        - Trabalho Social Adiantado
        - Ritmo Alinhado
        - Sem Informação
        config:
          severity: warn
  - name: agente_financeiro
    description: Agente financeiro que informou o trabalho social (CAIXA ou BB).
    tests:
    - accepted_values:
        values:
        - CAIXA
        - BB
        config:
          severity: warn
  - name: valor_global_ts
