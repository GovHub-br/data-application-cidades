  - name: fin_p75
    description: "% financeiro liberado: percentil 75 na idade."
  - name: ic_referencia_valida
    description: "Verdadeiro quando a idade tem pelo menos 10 retratos; abaixo disso a referência não é usada."
- name: ouro_rural_curva_s_desvio
  description: >
    Quais empreendimentos do Novo MCMV Rural fogem da curva S de referência. Para cada APF, o retrato mais recente
    do MONIT_MOV_OBRA (% físico realizado e previsto, % financeiro), comparado com a distribuição de todos os
    empreendimentos na MESMA idade de contrato (ouro_rural_curva_s_referencia): desvio da mediana em p.p. e faixa
    (muito abaixo, abaixo, na curva, acima). Grão: APF × tipo de portaria (3 linhas por APF, para o filtro único de
    portaria); filtre um tipo antes de contar.
