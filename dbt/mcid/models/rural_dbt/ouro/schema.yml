  - name: dt_portaria_selecao
    description: Data da portaria de seleção.
  - name: confianca_vinculo_selecao
    description: >
      Firmeza do vínculo proposta → contrato: Exata (pela APF), Alta (CNPJ da EO + município, um candidato e
      mesmas UH), Média (um candidato) ou Baixa (vários candidatos).
  - name: metodo_vinculo_selecao
    description: Regra que ligou a proposta selecionada ao contrato (APF; CNPJ da EO + município).
  - name: situacao_portaria_selecao
