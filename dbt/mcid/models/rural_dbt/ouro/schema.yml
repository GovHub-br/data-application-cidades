    por APF, uma por tipo de portaria (Seleção, Autorização de contratação, Trabalho Social). Grão: APF ×
    tipo_portaria. Escolha UM tipo de portaria antes de somar: com um tipo, cada APF aparece uma vez e os totais
    batem com a ouro_rural_painel_operacao. APF sem portaria do tipo entra com um rótulo que diz por quê.
