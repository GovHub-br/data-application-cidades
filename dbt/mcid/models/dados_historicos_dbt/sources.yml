version: 2

sources:
  - name: lake_staging_historico
    description: >
      Cleansed dos dados históricos do MCMV (dump do banco antigo, 2009 a 2019, e o painel
      SNH de 2024 a 2026), publicado pela dados_historicos_dag em
      snh/staging/historico_mcmv/cleansed/, uma pasta por família. O dado pessoal já chega
      mascarado da staging.
    schema: staging
    meta:
      bucket: data-lake-mcid
      camada: staging
      governance:
        product: dados_historicos
        owner_key: mcid_data_engineering
        classification: restricted
        rag_publication: prohibited
    tables:
      - name: cleansed_log
        description: Uma linha por saída do cleansed, com competência, corte e status.
        meta:
          caminho: snh/staging/historico_mcmv/cleansed/_cleansed_log.parquet
          dag: dados_historicos_dag
      - name: colunas_evolucao
        description: Grafo de nomes (task mapear_colunas), cada coluna de cada família com o período e os layouts em que aparece.
        meta:
          caminho: snh/staging/historico_mcmv/cleansed/_colunas_evolucao.parquet
          dag: dados_historicos_dag
      - name: colunas_candidatos
        description: Grafo de nomes (task mapear_colunas), pares de colunas que trocam de nome numa família, com as notas de valor, nome e formato.
        meta:
          caminho: snh/staging/historico_mcmv/cleansed/_colunas_candidatos.parquet
          dag: dados_historicos_dag
      - name: colunas_conceitos
        description: Grafo de nomes (task mapear_colunas), o nome canônico que a task propõe para cada coluna de cada família.
        meta:
          caminho: snh/staging/historico_mcmv/cleansed/_colunas_conceitos.parquet
          dag: dados_historicos_dag
      - name: balanco_min_planejamento_bb
