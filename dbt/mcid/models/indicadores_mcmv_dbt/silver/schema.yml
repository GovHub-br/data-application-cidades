version: 2

models:
  - name: silver_historico_snh_apf_mes
    description: >
      Silver do reloginho (grupo A): série mensal SNH tipada, com domínio
      normalizado e deduplicada por APF. Grão: uma linha por
      (agente_financeiro, apf, dt_referencia), com frente_mcmv canônica
      (FAR / Entidades / Rural) derivada de `modalidade`. A chave de dedup é
      a mesma validada na reconciliação contra a referência #66. Requer
      target staging_duckdb.
    meta:
      tags:
        - silver
        - mcmv
        - reloginho
        - dados-historicos
    columns:
      - name: agente_financeiro
        description: Agente financeiro normalizado em maiúsculas (BB ou CAIXA).
        data_tests:
          - not_null
          - accepted_values:
              values: ["BB", "CAIXA"]
      - name: frente_mcmv
        description: >
          Frente do MCMV canônica a partir de `modalidade`. Valores esperados
          FAR, Entidades e Rural. Nulo quando a origem não informa modalidade.
        data_tests:
          - accepted_values:
              values: ["FAR", "Entidades", "Rural"]
      - name: apf
        description: Autorização Para Financiamento — chave do empreendimento.
        data_tests:
          - not_null
      - name: dt_referencia
        description: Primeiro dia do mês de referência (derivado do nome do arquivo).
        data_tests:
          - not_null
      - name: uh_contratadas
        description: Unidades habitacionais contratadas do APF no snapshot do mês.
      - name: uh_entregues
        description: Unidades habitacionais entregues (acumulado) do APF no snapshot do mês.
      - name: uh_vigentes
        description: Unidades habitacionais vigentes do APF no snapshot do mês.
      - name: quantidade_uh_distratadas
        description: >
          UH distratadas (acumulado) do APF no snapshot do mês, de
          `quantidade_de_uhs_distratadas` da SNH (ambos os agentes). `0` é
          informação, distinto de NULL. Change:
          enriquecer-quantidades-uh-e-sinais-obra-historico. Grão
          (agente_financeiro, apf, dt_referencia) e saída dos golds do reloginho
          inalterados.
      - name: uf
        description: UF do empreendimento (maiúsculas).
      - name: codigo_ibge_municipio
        description: >
          Código IBGE do município, sem sufixo ".0" (limpo por strip_float_text
          — a fonte SNH CAIXA entrega ~20% com ".0"). Ver
          docs/varredura-sufixo-float-texto.md.
        data_tests:
          - sem_sufixo_float_texto
      - name: hash_linha
        description: Hash MD5 herdado da bronze.
        data_tests:
          - not_null
      - name: situacao_canonica
        description: >
          Situação de obra canônica (nao_iniciada / em_obras / paralisada /
          concluida / cancelada) por join ao seed dominio_status sobre
          lower(trim(status_operacional)). NULL quando status ausente;
          'nao_mapeada' quando não casa. status_operacional cru preservado.
          Não consumida pelos golds do reloginho. Change:
          serie-historica-situacao-obra-regiao.
        data_tests:
          - dentro_do_dominio:
              arguments:
                seed: dominio_status
                seed_column: situacao_canonica
              config:
                severity: warn
      - name: regiao_sigla
        description: >
          Macrorregião IBGE (N / NE / CO / SE / S) por join ao seed
          dominio_regiao_uf sobre uf. Nula quando a linha não tem uf.
        data_tests:
          - relationships:
              arguments:
                to: ref('dominio_regiao_uf')
                field: regiao_sigla
              config:
                severity: warn
      - name: regiao_nome
        description: Nome da macrorregião IBGE (par de regiao_sigla).

  - name: silver_historico_snh_entregas_mes
    description: >
      Silver do reloginho (grupo A) — entregas por evento agregadas ao mês do
      EVENTO. Lê bronze_reloginho_snh_entregas_evento, deduplica eventos
      repetidos por hash_linha e soma por (agente_financeiro, apf, mes_evento).
      É o fluxo real de entregas (base do ritmo_recente e do caminho alternativo
      do total de entregas — decisão #5). Requer target staging_duckdb.
    meta:
      tags: [silver, mcmv, reloginho, dados-historicos, entregas]
    columns:
      - name: agente_financeiro
        description: Agente financeiro (BB ou CAIXA).
        data_tests:
          - not_null
          - accepted_values:
              values: ["BB", "CAIXA"]
      - name: apf
        description: APF do empreendimento.
        data_tests:
          - not_null
      - name: mes_evento
        description: Primeiro dia do mês em que a UH foi entregue.
        data_tests:
          - not_null
      - name: uh_entregues_evento_mes
        description: UH entregues no mês, por APF (fluxo).
      - name: n_eventos
        description: Número de eventos de entrega deduplicados no mês/APF.
