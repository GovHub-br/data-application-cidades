version: 2

# Entregas por EVENTO da SNH, uma tabela POR AGENTE. A série mensal SNH
# (acumulado) está nas bronzes bronze_dhist_empreendimento_snh_bb /
# _snh_caixa, em mcmv_historico_dbt; a view passthrough
# bronze_reloginho_snh_serie_mensal deixou de existir junto com a bronze única
# que ela envolvia — prata_dhist_snh_apf_mes lê as duas bronzes por agente
# diretamente.

models:

  - name: bronze_dhist_snh_entregas_evento_bb
    description: >
      Bronze do reloginho — entregas por EVENTO (fluxo), agente BB. Cópia fiel
      de `staging/dados_historicos/*snh_pmcmv_dados_prioritarios_da_entrega_da_unidade_af_bb.parquet`,
      **sem regra de negócio** (só projeção mínima + helpers de harmonização).
      Frente: todas as modalidades MCMV do agente BB (o split por frente é da
      prata). Uma linha por linha de origem, sem dedup. Neste agente as colunas
      de origem do evento são `dt_ass_doc / numero_de_unidades_entregues`; os
      helpers harmonizados `dt_evento` e `qt_uh_entregues_evento` normalizam isso
      para a prata, que une os dois agentes. Complementa a série mensal SNH (que
      traz o acumulado).
    meta:
      tags: [bronze, mcmv, reloginho, dados-historicos, entregas]
    data_tests:
      # Vigilância de drift de schema.
      - colunas_esperadas:
          config:
            severity: warn
    columns:
      - name: apf
        description: APF do empreendimento (texto, cru).
      - name: agente_arquivo
        description: Constante `BB` — derivado do nome do arquivo.
      - name: dt_evento
        description: Data da entrega, harmonizada a partir da coluna do agente.
      - name: qt_uh_entregues_evento
        description: >
          UH entregues no evento, harmonizada a partir da coluna do agente.
          Conceito canônico `quantidade_uh_entregues` (recorte de fluxo por
          evento).
      - name: source_file
        description: Caminho do objeto parquet de origem no MinIO staging.
        data_tests:
          - not_null
      - name: dt_referencia
        description: Mês do arquivo (snapshot) — não é a data do evento.
      - name: dt_ingest
        description: Timestamp da materialização desta camada.
      - name: hash_linha
        description: Hash MD5 do evento (dedup na prata).
        data_tests:
          - not_null

  - name: bronze_dhist_snh_entregas_evento_caixa
    description: >
      Bronze do reloginho — entregas por EVENTO (fluxo), agente CAIXA. Cópia
      fiel de `staging/dados_historicos/*snh_pmcmv_dados_prioritarios_af_caixa_entregas.parquet`,
      **sem regra de negócio** (só projeção mínima + helpers de harmonização).
      Frente: todas as modalidades MCMV do agente CAIXA (o split por frente é da
      prata). Uma linha por linha de origem, sem dedup. Neste agente as colunas
      de origem do evento são `dt_entrega / qt_uh_entregues`; os helpers
      harmonizados `dt_evento` e `qt_uh_entregues_evento` normalizam isso para a
      prata, que une os dois agentes. Complementa a série mensal SNH (que traz o
      acumulado).
    meta:
      tags: [bronze, mcmv, reloginho, dados-historicos, entregas]
    data_tests:
      # Vigilância de drift de schema.
      - colunas_esperadas:
          config:
            severity: warn
    columns:
      - name: apf
        description: APF do empreendimento (texto, cru).
      - name: agente_arquivo
        description: Constante `CAIXA` — derivado do nome do arquivo.
      - name: dt_evento
        description: Data da entrega, harmonizada a partir da coluna do agente.
      - name: qt_uh_entregues_evento
        description: >
          UH entregues no evento, harmonizada a partir da coluna do agente.
          Conceito canônico `quantidade_uh_entregues` (recorte de fluxo por
          evento).
      - name: source_file
        description: Caminho do objeto parquet de origem no MinIO staging.
        data_tests:
          - not_null
      - name: dt_referencia
        description: Mês do arquivo (snapshot) — não é a data do evento.
      - name: dt_ingest
        description: Timestamp da materialização desta camada.
      - name: hash_linha
        description: Hash MD5 do evento (dedup na prata).
        data_tests:
          - not_null
