# GERADO por scripts/contratos/gerar_sources.py a partir de contracts/api_ibge.odcs.yaml.
# Não edite: mude o contrato e rode o gerador.
version: 2
sources:
- name: api_ibge
  description: Agregados do IBGE listados na Variable IBGE_CONFIGURACOES, um por tabela. Cada carga é
    a resposta JSON da API como veio (carga completa da janela de períodos pedida).
  schema: staging
  meta:
    bucket: data-lake-mcid
    camada: staging
    contract: contracts/api_ibge.odcs.yaml
    owner: IBGE
  tables:
  - name: pib_construcao
    description: Agregado do IBGE da tabela pib_construcao (variável x localidade x classificação x período).
    meta:
      caminho: staging/ibge/pib_construcao/*.parquet
      file_pattern: pib_construcao\.json
      load_type: full
      dag: ibge_ingest_dag
    columns:
    - name: variavel_id
    - name: variavel_nome
    - name: localidade_id
    - name: localidade_nome
    - name: classificacao_id
    - name: classificacao_nome
    - name: categoria_id
    - name: categoria_nome
    - name: unidade
    - name: periodo
    - name: valor
  - name: sinapi
