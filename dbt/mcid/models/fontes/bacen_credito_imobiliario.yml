# GERADO por scripts/contratos/gerar_sources.py a partir de contracts/snh/bacen/credito_imobiliario.odcs.yaml.
# Não edite: mude o contrato e rode o gerador.
version: 2
sources:
- name: bacen_credito_imobiliario
  description: Séries do Banco Central usadas na conjuntura. Cada carga é a resposta da API como veio,
    com a série inteira (carga completa).
  schema: staging
  meta:
    bucket: data-lake-mcid
    camada: staging
    contract: contracts/snh/bacen/credito_imobiliario.odcs.yaml
    owner: Banco Central do Brasil
  tables:
  - name: credito_imobiliario_pib
    description: Crédito imobiliário / PIB (%), indicador indices_imobiliario_pib_br do Olinda MercadoImobiliario.
    meta:
      caminho: staging/bacen/credito_imobiliario_pib/*.parquet
      file_pattern: credito_imobiliario_pib\.json
      load_type: full
      dag: bacen_credito_pib_ingest_dag
    columns:
    - name: info
    - name: data
    - name: valor
  - name: financiamentos_imobiliarios
    description: Séries do SGS listadas na Variable BACEN_SERIES (concessões, juros e inadimplência PF/PJ),
      um arquivo por série; o nome do arquivo é o tipo da série.
    meta:
      caminho: staging/bacen/financiamentos_imobiliarios/*.parquet
      file_pattern: '[a-z0-9_]+\.json'
      load_type: full
      dag: bacen_sgs_ingest_dag
    columns:
    - name: tipo
    - name: data
    - name: valor
