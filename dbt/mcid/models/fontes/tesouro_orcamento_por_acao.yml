# GERADO por scripts/contratos/gerar_sources.py a partir de contracts/snh/tesouro/orcamento_por_acao.odcs.yaml.
# Não edite: mude o contrato e rode o gerador.
version: 2
sources:
- name: tesouro_orcamento_por_acao
  description: Dotação, empenho, liquidação, pagamento e restos a pagar do MCID (órgão UGE 56000) por
    ação, fonte, plano orçamentário, UG e natureza de despesa, dia a dia no ano corrente, enviados pelo
    Tesouro Gerencial por e-mail. Cada carga é o ZIP do e-mail do dia, com o ano inteiro até a véspera
    (carga completa).
  schema: staging
  meta:
    bucket: data-lake-mcid
    camada: staging
    contract: contracts/snh/tesouro/orcamento_por_acao.odcs.yaml
    owner: Tesouro Nacional (Tesouro Gerencial)
  tables:
  - name: orcamento_mcid_por_acao_com_data
    description: 'Relatório "Orçamento MCid por ação (com data)": UTF-16, TSV, título e filtro e um cabeçalho
      de 3 linhas (dimensões, código e nome do Item Informação). Valores no formato do relatório (`4.929.655,57`,
      negativo entre parênteses); `dia_lancamento` = `000/<ano>` é o lançamento de abertura do ano, sem
      dia.'
    meta:
      caminho: snh/staging/siafi-tesouro-gerencial/orcamento_mcid_por_acao_com_data/*.parquet
      file_pattern: \d{2}_orcamento_mcid_com_data\.zip
      load_type: full
      dag: orcamento_mcid_por_acao_com_data_ingest_dag
    columns:
    - name: dia_lancamento
    - name: acao_governo_codigo
    - name: acao_governo_nome
    - name: programa_governo_codigo
    - name: programa_governo_nome
    - name: fonte_recursos_detalhada_codigo
    - name: fonte_recursos_detalhada_nome
    - name: pt
    - name: ptres
    - name: plano_orcamentario_uo
    - name: plano_orcamentario_funcao
    - name: plano_orcamentario_subfuncao
    - name: plano_orcamentario_programa
    - name: plano_orcamentario_acao
    - name: plano_orcamentario_codigo
    - name: plano_orcamentario_nome
    - name: ug_executora_codigo
    - name: ug_executora_nome
    - name: ug_responsavel_codigo
    - name: ug_responsavel_nome
    - name: pi_codigo
    - name: pi_nome
    - name: natureza_despesa_codigo
    - name: natureza_despesa_nome
    - name: dotacao_inicial
    - name: dotacao_atualizada
    - name: despesas_empenhadas
    - name: despesas_empenhadas_a_liquidar
    - name: despesas_liquidadas_a_pagar
    - name: despesas_pagas
    - name: restos_a_pagar_inscritos
    - name: restos_a_pagar_pagos
    - name: liquidacoes_totais
    - name: pagamentos_totais
