# GERADO por scripts/contratos/gerar_sources.py a partir de contracts/api_infomoney.odcs.yaml.
# Não edite: mude o contrato e rode o gerador.
version: 2
sources:
- name: api_infomoney
  description: 'Cotações diárias do índice IMOB da B3. Cada carga traz só os ~100 últimos pregões (carga
    incremental): o histórico está nas cargas anteriores.'
  schema: staging
  meta:
    bucket: data-lake-mcid
    camada: staging
    contract: contracts/api_infomoney.odcs.yaml
    owner: Alpha Vantage
  tables:
  - name: acoes_imob
    description: Resposta TIME_SERIES_DAILY da Alpha Vantage como veio.
    meta:
      caminho: staging/infomoney/acoes_imob/*.parquet
      file_pattern: acoes_imob\.json
      load_type: incremental
      dag: infomoney_imob
    columns:
    - name: symbol
    - name: data_pregao
    - name: open
    - name: high
    - name: low
    - name: close
    - name: volume
  - name: acoes_imob_postgres
    description: Exportação única de infomoney.acoes_imob (o histórico que o Postgres acumulou antes de
      o lake guardar as cargas).
    meta:
      caminho: staging/infomoney/acoes_imob/*.parquet
      file_pattern: acoes_imob_postgres\.csv
      load_type: incremental
      dag: infomoney_imob
    columns:
    - name: symbol
    - name: data_pregao
    - name: open
    - name: high
    - name: low
    - name: close
    - name: volume
