    meta:
      caminho: staging/sftp/fabrica/GEFUS/*_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA.parquet
      file_pattern: \d{6}_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA\.csv
      load_type: full
      dag: sftp_ingest_dag
    columns:
    - name: data_de_movimento
