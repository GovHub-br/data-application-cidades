version: 2

# A prata tipa o texto da bronze e aplica as regras de negócio do FAR. Os testes aqui
# guardam o GRÃO de cada tabela: um join que multiplica linha dobra todo somatório do
# dashboard sem erro nenhum aparecer.

models:

  - name: prata_far_consolidado
    description: >
      Propostas do GFAR tipadas, do protocolo à contratação. Uma linha por MOVIMENTO de
      proposta, não por empreendimento.
    columns:
      - name: id_proposta
        description: Identificador da proposta no GFAR.
        tests:
          - not_null
      - name: apf
        description: >
          APF normalizado para 8 dígitos. Nulo na maior parte das linhas porque
          proposta ainda não contratada não tem APF — por isso não há not_null aqui.

  - name: prata_far_cadastro_pj
    description: >
      Cadastro do empreendimento contratado: construtora, tipologia, composição
      financeira, coordenadas e datas-chave. Uma linha por empreendimento.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique
      - name: construtora_cnpj
        description: CNPJ da construtora, apenas dígitos.

  - name: prata_far_obra_mensal
    description: >
      Medição física do empreendimento na competência mais recente.
      Uma linha por empreendimento — é retrato, não série.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique

  - name: prata_far_financeiro_mensal
    description: >
      Liberações financeiras do empreendimento. Uma linha por liberação, então o APF
      repete: é a única fonte do FAR com série histórica.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null

  - name: prata_far_dados_prioritarios_caixa
    description: >
      Recorte FAR do snapshot da CAIXA. Uma linha por empreendimento.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique

  - name: prata_far_empreendimento
    description: >
      Visão unificada do empreendimento FAR: cadastro, consolidado, obra e CAIXA
      reconciliados numa linha por APF. É a base da ficha.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos — chave do domínio.
        tests:
          - not_null
          - unique
      - name: municipio
        description: Município do empreendimento.
        tests:
          - sem_mojibake
      - name: uf
        description: >
          Sigla da UF. Fica nula nos empreendimentos que não têm localização
          informada em nenhuma das fontes.

  - name: prata_far_evolucao_financeira
    description: >
      Série de desembolsos por empreendimento e mês, com acumulado e percentual
      executado.
    tests:
      # O grão é (apf, mes): duas linhas para o mesmo mês dobrariam o acumulado.
      - unique_combinacao:
          colunas: ["apf", "mes"]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
      - name: mes
        description: Primeiro dia do mês da liberação.
        tests:
          - not_null

  - name: prata_far_obra_serie
    description: >
      Execução física do MONIT por competência. Uma linha por APF por mês; a
      competência sai do nome do arquivo. Não há competência 2026-06 na origem.
    tests:
      - unique_combinacao:
          colunas: ["apf", "competencia"]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
      - name: competencia
        description: Primeiro dia do mês de referência do arquivo.
        tests:
          - not_null
      - name: co_situacao_obra
        description: >
          Código da situação da obra; o rótulo está no seed far_situacao_obra.
        tests:
          - relationships:
              to: ref('far_situacao_obra')
              field: co_situacao_obra
              config:
                severity: warn

  - name: prata_far_caixa_serie
    description: >
      Recorte FAR dos dados prioritários da CAIXA por competência. Uma linha por APF
      por mês. É série contínua desde 2024-06 e cobre os meses sem MONIT.
    tests:
      - unique_combinacao:
          colunas: ["apf", "competencia"]
    columns:
      - name: apf
        description: APF de 8 dígitos, como a CAIXA envia.
        tests:
          - not_null
      - name: competencia
        description: Primeiro dia do mês de referência do arquivo.
        tests:
          - not_null

  - name: prata_far_serie_mensal
    description: >
      Série mensal por APF, com execução física (MONIT, com a CAIXA como fallback) e
      financeira (livro-razão MONIT), mais as colunas da CAIXA para conciliação. O
      calendário é contínuo: meses sem medição carregam o último valor, identificado
      em `fonte_fisica`.
    tests:
      - unique_combinacao:
          colunas: ["apf", "mes"]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
      - name: mes
        description: Primeiro dia do mês.
        tests:
          - not_null
      - name: pct_obra_realizada
        description: Percentual físico realizado; ver `fonte_fisica`.
      - name: pct_obra_prevista
        description: >
          Percentual físico previsto pelo cronograma. Só o MONIT informa, então é
          nulo antes de 2025-12; ver `fonte_prevista` para os meses sem arquivo.
      - name: fonte_prevista
        description: >
          De onde veio o previsto: `monit`, `interpolado` (mês sem MONIT entre dois
          observados, em linha reta) ou `carregado` (depois do último observado).
        tests:
          - accepted_values:
              values: ["monit", "interpolado", "carregado"]
      - name: fonte_fisica
        description: >
          De onde veio o percentual realizado: `monit`, `caixa` (mês sem MONIT) ou
          `carregado` (último valor observado). Nulo antes da primeira medição. A
          CAIXA só entra a partir da primeira competência em que mede o Novo MCMV
          (antes disso manda 0 para todos).
        tests:
          - accepted_values:
              values: ["monit", "caixa", "carregado"]
      - name: situacao_obra
        description: >
          Rótulo de `co_situacao_obra`, pelo dicionário do LAYOUT do MONIT (seed
          far_situacao_obra).
      - name: vr_liberado_acum
        description: Soma das liberações do APF até o mês.
        tests:
          - acumulado_nao_regride:
              partition_by: apf
              order_by: mes
              config:
                severity: warn
      - name: pct_financeiro
        description: >
          Liberado acumulado sobre o valor FAR do cadastro. Sem teto: o INCC é pago
          acima do valor contratado e leva alguns APFs acima de 100%.
      - name: vr_desembolsado_caixa
        description: Desembolso informado pela CAIXA no mês, para conciliação.
      - name: dif_desembolso_caixa
        description: Liberado acumulado MONIT menos o desembolsado CAIXA no mesmo mês.
