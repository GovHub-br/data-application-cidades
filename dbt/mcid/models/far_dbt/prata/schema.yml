version: 2

# A prata tipa o texto da bronze e aplica as regras de negócio do FAR. Os testes aqui
# guardam o GRÃO de cada tabela: um join que multiplica linha dobra todo somatório do
# dashboard sem erro nenhum aparecer.

models:

  - name: prata_far_consolidado
    description: >
      Propostas do GFAR tipadas, do protocolo à contratação. Uma linha por MOVIMENTO de
      proposta, não por empreendimento; cada fase vem da última remessa em que
      apareceu. A remessa é a foto da semana e proposta contratada pode sair dela, ou
      voltar só com a linha da seleção, sem ter sido cancelada;
      `ic_na_remessa_mais_recente` diz quem ainda está na foto.
    columns:
      - name: id_proposta
        description: Identificador da proposta no GFAR.
        tests:
          - not_null
      - name: apf
        description: >
          APF normalizado para 8 dígitos. Nulo na maior parte das linhas porque
          proposta ainda não contratada não tem APF — por isso não há not_null aqui.
      - name: dt_remessa
        description: Data da remessa de onde veio a linha (nome do arquivo).
        tests:
          - not_null
      - name: dt_primeira_remessa
        description: Primeira remessa em que a proposta apareceu.
      - name: dt_ultima_remessa
        description: >
          Última remessa em que a proposta apareceu, em qualquer fase. Maior que
          `dt_remessa` quando a fase da linha sumiu nas remessas seguintes.
      - name: ic_na_remessa_mais_recente
        description: >
          Falso para proposta que saiu do consolidado. Sair não é cancelamento: em
          2026-10 os 74 APFs contratados que saíram seguiam em obra na CAIXA e no MONIT.

  - name: prata_far_cadastro_pj
    description: >
      Cadastro do empreendimento contratado: construtora, tipologia, composição
      financeira, coordenadas e datas-chave. Uma linha por empreendimento.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique
      - name: construtora_cnpj
        description: CNPJ da construtora, apenas dígitos.

  - name: prata_far_obra_mensal
    description: >
      Medição física do empreendimento na competência mais recente.
      Uma linha por empreendimento — é retrato, não série.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique

  - name: prata_far_financeiro_mensal
    description: >
      Liberações financeiras do empreendimento. Uma linha por liberação, então o APF
      repete: é a única fonte do FAR com série histórica.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null

  - name: prata_far_dados_prioritarios_caixa
    description: >
      Recorte FAR do snapshot da CAIXA. Uma linha por empreendimento.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique

  - name: prata_far_empreendimento
    description: >
      Visão unificada do empreendimento FAR: cadastro, consolidado, obra e CAIXA
      reconciliados numa linha por APF. É a base da ficha.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos — chave do domínio.
        tests:
          - not_null
          - unique
      - name: municipio
        description: Município do empreendimento.
        tests:
          - sem_mojibake
      - name: uf
        description: >
          Sigla da UF. Fica nula nos empreendimentos que não têm localização
          informada em nenhuma das fontes.

  - name: prata_far_evolucao_financeira
    description: >
      Série de desembolsos por empreendimento e mês, com acumulado e percentual
      executado.
    tests:
      # O grão é (apf, mes): duas linhas para o mesmo mês dobrariam o acumulado.
      - unique_combinacao:
          arguments:
            colunas: ["apf", "mes"]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
      - name: mes
        description: Primeiro dia do mês da liberação.
        tests:
          - not_null

  - name: prata_far_gehis_andamento_obra
    description: >
      Andamento de obra do FAR informado pela CAIXA (GEHIS), por APF e mês, de jul/2021 em diante,
      com a situação da obra (Normal, Em atenção, Risco de paralisação, Paralisado, Obra retomada...)
      e as datas previstas de conclusão e inauguração. Recorta da GEHIS só as APFs que estão na
      visão de empreendimentos do FAR. Quando chega mais de um arquivo no mês, vale o último.
    meta:
      tags:
        - silver
      openmetadata:
        glossary:
          - MCID.ProgramasHabitacionais.MCMV.MCMVFAR
          - MCID.ExecucaoDeEmpreendimentos.ExecucaoFisica
          - MCID.ExecucaoDeEmpreendimentos.ParalisacaoDeObra
    data_tests:
      - unique_combinacao:
          arguments:
            colunas:
              - apf
              - dt_referencia
    columns:
      - name: apf
        description: APF do empreendimento (8 dígitos, normalizada).
        data_tests:
          - not_null
      - name: dt_referencia
        description: Mês de referência do retrato (primeiro dia do mês).
        data_tests:
          - not_null
      - name: situacao_obra
        description: Situação da obra segundo a GEHIS/CAIXA, em maiúsculas.
      - name: dt_prevista_conclusao
        description: Data prevista de conclusão da obra informada pela CAIXA.
      - name: dt_prevista_inauguracao
        description: Data prevista de inauguração informada pela CAIXA.
      - name: arquivo_de_origem
        description: Nome do arquivo da staging de onde veio a linha (linhagem).
