version: 2

# A ouro é o que o Superset lê. Os testes aqui protegem o que o painel afirma: uma linha
# por empreendimento na ficha, e nenhum APF que exista na ficha mas não na prata.

models:

  - name: ouro_far_ficha_empreendimento
    description: >
      Uma linha por empreendimento FAR, com identificação, localização, execução física
      e financeira. Alimenta a ficha do Superset.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos — chave do painel.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('prata_far_empreendimento')
                field: apf
      - name: municipio
        description: Município do empreendimento.
        tests:
          - sem_mojibake
      - name: nome_empreendimento
        description: Nome do empreendimento.
        tests:
          - sem_mojibake

  - name: ouro_far_resumo_gerencial
    description: >
      KPIs agregados por situação, tipologia e status de execução.
    columns:
      - name: categoria
        description: Dimensão da agregação.

  - name: ouro_far_panorama_estadual
    description: >
      Painel agregado por UF, portaria e município, com quebra por situação e
      tipologia.
    columns:
      - name: portaria
        description: >
          Portaria normativa (seed far_portaria_apf) ou 'Todas as portarias', que
          repete o total da UF. Quem lê a tabela filtra uma portaria por vez.
        tests:
          - not_null
      - name: municipio
        description: >
          Município da ficha ou 'Todos os municípios', que repete o total da UF. Quem
          lê a tabela filtra um município por vez.
        tests:
          - not_null

  - name: ouro_far_mapa_nacional
    description: >
      Agregação geográfica por UF e portaria para o mapa do Superset. Uma linha por
      UF e portaria, incluindo 'Todas as portarias'.
    columns:
      - name: portaria
        description: Portaria normativa ou 'Todas as portarias'. Filtrar uma por vez.
        tests:
          - not_null

  - name: ouro_far_evolucao_financeira_chart
    description: >
      Série APF × mês pronta para o gráfico de evolução financeira.
    tests:
      - unique_combinacao:
          arguments:
            colunas: ["apf", "mes"]

  - name: ouro_far_execucao_fisica_financeira_chart
    description: >
      As duas curvas na mesma série mensal. A execução física do FAR é retrato único,
      repetido ao longo dos meses para virar linha de referência sobre a série
      financeira, que é a única das duas com história.

  - name: ouro_far_serie_mensal_apf
    description: >
      Série mensal por APF com execução física e financeira, ritmo entre as duas e
      colunas da CAIXA para conciliação. Alimenta o dashboard e o modelo preditivo.
    tests:
      - unique_combinacao:
          arguments:
            colunas: ["apf", "mes"]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
      - name: ic_cadastro_monit
        description: >
          Falso para os APFs que têm liberação no livro-razão mas não estão no
          cadastro MONIT: entram pela conciliação dos valores, sem % financeiro.
      - name: etapa
        description: >
          `Cláusula suspensiva` antes do mês de `dt_inicio_obra`, `Aguardando início
          físico` até o primeiro físico acima de zero, `Em execução` depois.
        tests:
          - accepted_values:
              arguments:
                values:
                  ["Cláusula suspensiva", "Aguardando início físico", "Em execução"]
      - name: pct_marco_fim_suspensiva
        description: 100 no mês de `dt_inicio_obra`, nulo nos demais.
      - name: pct_marco_inicio_efetivo
        description: 100 no mês de `mes_inicio_fisico`, nulo nos demais.

  - name: ouro_far_curva_s
    description: >
      Curva S do FAR: percentuais físico (previsto e realizado) e financeiro por mês,
      ponderados pelo valor FAR, no nível nacional (`uf` = 'BR') e por UF, para cada
      portaria e para 'Todas as portarias'. Exclui os APFs distratados ou cancelados
      na situação mais recente da CAIXA. O denominador é o valor FAR de toda a
      carteira do recorte, igual em todos os meses (obra não iniciada conta 0%), e a
      curva começa no primeiro mês com físico realizado no recorte.
    tests:
      - unique_combinacao:
          arguments:
            colunas: ["mes", "nivel", "uf", "portaria", "municipio"]
    columns:
      - name: qt_empreendimentos
        description: APFs da carteira do recorte, a mesma em todos os meses.
      - name: qt_iniciados
        description: APFs da carteira que já tiveram físico realizado até o mês.
      - name: nivel
        description: "`nacional` ou `uf`."
        tests:
          - accepted_values:
              arguments:
                values: ["nacional", "uf"]
      - name: municipio
        description: >
          Município da ficha ou 'Todos os municípios', que repete o total da UF. O
          nacional só tem 'Todos os municípios'. Filtrar um por vez.
        tests:
          - not_null
