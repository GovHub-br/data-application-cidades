version: 2

# Contratos das famílias do FAR usados no painel de perguntas. Espelho textual do parquet:
# a lista `colunas` é o contrato de layout aceito hoje.

models:

  - name: bronze_sftp_mont_cont_pf_far
    description: >
      Contratos das famílias do Novo MCMV FAR (MONT_CONT_PF_FAR, layout 015): perfil do
      beneficiário, instrumento, situação, inadimplência, sinistros e retomada. Retrato
      completo por remessa; a tabela guarda o mais recente. CPF/NIS em HMAC, nome e
      nascimento redigidos.
    tests:
      - sem_drift_de_colunas:
          arguments:
            colunas:
              - co_tipo_registro
              - dh_movimento
              - nu_apf
              - nu_uh
