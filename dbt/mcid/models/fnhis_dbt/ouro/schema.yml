  - name: ouro_fnhis_empenho_parcelas
    description: >
      Situação das parcelas de empenho de cada termo de compromisso do FNHIS Sub-50 (termos ativos, sem anulados ou
      rescindidos). O empenho sai em parcelas fixas (≈10%, 20%, 30%, 50%…), então em vez de comparar com uma curva o
      modelo diz quantas parcelas o termo já teve e há quantos meses não recebe uma nova. Os retratos mensais do
      TransfereGov começam em mar/2025: o que foi empenhado antes conta como uma parcela. Grão: termo.
    meta:
      tags:
        - gold
      openmetadata:
        glossary:
          - MCID.ProgramasHabitacionais.MCMV
    columns:
      - name: numero_proposta_transferegov
        description: "Número da proposta no TransfereGov (chave do termo)."
        tests:
          - unique
          - not_null
      - name: numero_proposta
        description: "Número da proposta na seleção."
      - name: proponente_nome
        description: "Município ou estado proponente."
      - name: uf
        description: "Sigla da UF."
      - name: municipio
        description: "Município."
      - name: regiao
        description: "Região."
      - name: dt_assinatura
        description: "Data de assinatura do termo."
      - name: ano_assinatura
        description: "Ano de assinatura."
      - name: objeto
        description: "Objeto do termo."
      - name: situacao_instrumento
        description: "Situação do instrumento no último retrato."
      - name: idade_meses
        description: "Meses desde a assinatura no último retrato."
      - name: valor_repasse
        description: "Repasse previsto (R$) no último retrato."
      - name: valor_empenhado_acumulado
        description: "Empenhado acumulado (R$) no último retrato."
      - name: pct_empenhado
        description: "% empenhado acumulado ÷ repasse no último retrato."
      - name: faixa_empenho
        description: "Faixa do % empenhado, ordenável pelo prefixo: 0. Sem empenho, 1. Até 10%, 2. 10% a 20%, 3. 20% a 30%, 4. 30% a 50%, 5. 50% a 99%, 6. 100%."
        tests:
          - accepted_values:
              values: ['0. Sem empenho', '1. Até 10%', '2. 10% a 20%', '3. 20% a 30%', '4. 30% a 50%', '5. 50% a 99%', '6. 100%']
      - name: qt_parcelas_empenhadas
        description: "Vezes que o empenho acumulado subiu nos retratos (+1 se o primeiro retrato já veio com empenho)."
      - name: qt_retratos
        description: "Retratos mensais do termo na base."
      - name: dt_primeiro_retrato
        description: "Mês do primeiro retrato do termo."
      - name: dt_ultimo_retrato
        description: "Mês do último retrato do termo."
      - name: dt_ultimo_empenho
        description: "Mês do retrato em que o empenho subiu pela última vez (ou do primeiro retrato, se nunca subiu depois dele)."
      - name: ic_ultimo_empenho_antes_dos_retratos
        description: "Verdadeiro quando o último empenho já estava no primeiro retrato: a data real é essa ou anterior."
      - name: dt_referencia_base
        description: "Mês do retrato mais recente da base (data de corte)."
      - name: meses_sem_novo_empenho
        description: "Meses entre dt_ultimo_empenho e dt_referencia_base (mínimo, se ic_ultimo_empenho_antes_dos_retratos)."
      - name: situacao_parcelas
        description: "Sem empenho, Sem novo empenho há 12+ meses, Sem novo empenho há 6 a 11 meses ou Empenho nos últimos 6 meses."
        tests:
          - accepted_values:
              values: ['Sem empenho', 'Sem novo empenho há 12+ meses', 'Sem novo empenho há 6 a 11 meses', 'Empenho nos últimos 6 meses']
      - name: portaria_selecao
        description: "Portaria de resultado da seleção dos termos (1.310/2024)."

  - name: ouro_fnhis_curva_s
    description: >
      Evolução do empenho do FNHIS Sub-50 por mês do retrato do TransfereGov. Grão: mês × UF. Termos ativos com assinatura.
      % empenhado = Σ empenhado ÷ Σ repasse (recalcule a partir das somas). Não é Curva S de obra: o Sub-50 não tem
      % físico nas bases e o empenho sai em parcelas fixas, por isso a linha anda em degraus.
    meta:
      tags:
        - gold
      openmetadata:
        glossary:
          - MCID.ProgramasHabitacionais.MCMV
    columns:
      - name: id_curva_s
        description: "Identificador da linha."
        tests:
          - unique
          - not_null
      - name: mes
        description: "Mês do retrato."
      - name: ic_ultimo_mes
        description: "Verdadeiro no último retrato."
      - name: ic_retrato_completo
        description: "Verdadeiro quando o retrato do mês tem pelo menos 80% do maior número de termos da série."
      - name: uf
        description: "Sigla da UF."
      - name: portaria_selecao
        description: "Portaria de resultado da seleção (1.310/2024)."
      - name: qt_termos
        description: "Termos ativos no retrato."
      - name: qt_termos_com_empenho
        description: "Termos com algum empenho."
      - name: valor_repasse
        description: "Repasse previsto (R$)."
      - name: valor_empenhado_acumulado
        description: "Empenhado acumulado (R$)."
      - name: pct_empenhado
        description: "% empenhado da linha. Não somar."
