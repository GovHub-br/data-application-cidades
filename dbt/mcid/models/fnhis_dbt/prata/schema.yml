version: 2

models:
  - name: prata_fnhis_propostas
    description: >
      Todas as propostas apresentadas por estados e municípios ao Novo MCMV FNHIS Sub-50
      (portaria MCID nº 673/2024), com as UH propostas e o resultado da seleção. Uma linha por
      proposta. É a primeira etapa do ciclo: quem pediu, e quem foi selecionado.
    meta:
      tags:
        - silver
    columns:
      - name: numero_proposta
        description: Número da proposta na seleção (ex. 56000005929/2024). Chave que liga ao termo de compromisso.
        data_tests:
          - not_null
          - unique
      - name: cod_ibge
        description: Código IBGE do município beneficiado (7 dígitos).
        data_tests:
          - not_null
      - name: cod_ibge_6
        description: IBGE sem o dígito verificador (6 dígitos) — o formato do SNH, usado para cruzar com o contrato.
      - name: municipio
        description: Município beneficiado.
      - name: uf
        description: UF do município beneficiado.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: proponente_esfera
        description: Município ou Estado/DF, conforme a administração pública proponente.
      - name: quantidade_uh
        description: Unidades habitacionais propostas.
      - name: situacao_proposta
        description: Resultado da seleção como veio da origem (nove situações).
      - name: resultado_selecao
        description: >
          Regra de negócio: agrupa a situação em Selecionada, Não enquadrada, Cota insuficiente da
          UF, Município já contemplado ou Outra.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Selecionada", "Não enquadrada", "Cota insuficiente da UF", "Município já contemplado", "Outra"]
              config:
                severity: warn
      - name: ic_selecionada
        description: Verdadeiro quando a proposta foi selecionada (inclusive as de risco).
      - name: ic_proposta_de_risco
        description: Verdadeiro para as propostas do grupo de áreas de risco.
      - name: justificativa_nao_enquadramento
        description: Motivo do não enquadramento, quando houver.
      - name: arquivo_de_origem
        description: Arquivo da staging de onde veio a linha (`_source_file` da bronze).
      - name: criado_em
        description: >
          Momento em que a linha foi ingerida no lake (`_ingested_at` da bronze). É carimbo de
          ingestão, não data de negócio.

  - name: prata_fnhis_termo_compromisso
    description: >
      Termos de compromisso do Novo MCMV FNHIS Sub-50 no TransfereGov: uma linha por proposta
      selecionada, com a situação da contratação e do instrumento e os valores de repasse,
      contrapartida e empenho. Retrato mais recente do painel mensal.
    meta:
      tags:
        - silver
    columns:
      - name: numero_proposta_transferegov
        description: Número da proposta no TransfereGov (ex. 32847/2024).
        data_tests:
          - not_null
          - unique
      - name: numero_proposta
        description: Número da proposta na seleção, extraído de `no_reservado_pac`. Liga à prata_fnhis_propostas.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('prata_fnhis_propostas')
                field: numero_proposta
      - name: codigo_programa
        description: Código do programa no TransfereGov.
      - name: situacao_contratacao
        description: Situação da contratação (Normal, Cláusula Suspensiva, Liminar Judicial).
      - name: situacao_proposta
        description: >
          Situação da proposta no TransfereGov — o estágio dela dentro do sistema de transferência,
          diferente do `resultado_selecao` da prata_fnhis_propostas, que é o resultado da seleção
          do MCID.
      - name: situacao_instrumento
        description: Situação do instrumento (Em execução, Convênio Anulado, Convênio Rescindido, Prestação de Contas...).
      - name: modalidade_instrumento
        description: Modalidade do instrumento de transferência no TransfereGov (convênio, contrato de repasse, termo).
      - name: valor_repasse_proposta
        description: >
          Valor de repasse como constava na PROPOSTA, em R$. Fica ao lado de `valor_repasse`
          (o do instrumento firmado) justamente para tornar visível a diferença entre pedido e
          pactuado.
      - name: valor_repasse
        description: Valor de repasse do FNHIS, em R$.
      - name: valor_contrapartida
        description: Contrapartida do ente, em R$.
      - name: valor_empenhado_pre_convenio
        description: Valor empenhado antes da celebração do convênio (pré-convênio), em R$.
      - name: valor_empenhado_acumulado
        description: Valor empenhado acumulado, em R$.
      - name: objeto
        description: Objeto do termo de compromisso, como descrito no painel do TransfereGov.
      - name: uf
        description: UF do proponente.
      - name: municipio
        description: Município do proponente.
      - name: regiao
        description: Região geográfica do proponente, como vem do painel.
      - name: proponente_nome
        description: Ente proponente.
      - name: proponente_cnpj
        description: CNPJ do ente proponente (apenas dígitos). É ente público, não pessoa.
      - name: dt_assinatura
        description: Data de assinatura do termo.
      - name: dt_consulta
        description: Data de extração do painel no TransfereGov.
      - name: arquivo_de_origem
        description: Arquivo do painel mensal de onde veio a linha (o `filename` do parquet vencedor).
      - name: criado_em
        description: >
          Momento em que a linha foi ingerida no lake (`_ingested_at` da bronze). É carimbo de
          ingestão, não data de negócio.
      - name: ic_instrumento_ativo
        description: Falso quando o termo foi anulado, rescindido ou não chegou a ter instrumento.
      - name: valor_investimento
        description: Repasse + contrapartida, em R$.

  - name: prata_fnhis_prioritarios_snh
    description: >
      Dados prioritários disponibilizados pela SNH filtrados para `modalidade = 'FNHIS'`: os
      contratos do Sub-50 acompanhados como empreendimento, com situação da obra, UH e valores.
      Uma linha por operação na SNH.
    meta:
      tags:
        - silver
    columns:
      - name: id_operacao_snh
        description: Identificador da operação na SNH.
        data_tests:
          - not_null
          - unique
      - name: cod_operacao_agente
        description: Código da operação na CAIXA (7 dígitos). Não é APF.
      - name: agente_financeiro
        description: Agente financeiro da operação — no Sub-50 é a CAIXA na totalidade das operações.
      - name: empreendimento_nome
        description: Nome do empreendimento como a SNH o registra.
      - name: modalidade
        description: Modalidade; o model filtra FNHIS.
        data_tests:
          - accepted_values:
              arguments:
                values: ["FNHIS"]
      - name: ic_novo_mcmv
        description: Verdadeiro quando a operação é do Novo MCMV.
      - name: municipio
        description: Município do empreendimento, em caixa alta.
      - name: uf
        description: Sigla da UF do empreendimento.
      - name: estado_nome
        description: Nome por extenso da UF do empreendimento.
      - name: regiao
        description: Região geográfica do empreendimento. O `#N/D` da origem vira nulo.
      - name: cod_ibge_6
        description: IBGE do município sem o dígito verificador (6 dígitos), como a SNH grava.
      - name: situacao
        description: Situação do empreendimento informada pela SNH.
        data_tests:
          - sem_mojibake:
              config:
                severity: warn
      - name: situacao_agrupada
        description: Agrupamento da situação do empreendimento já entregue pela própria SNH.
      - name: ic_operacao_vigente
        description: Verdadeiro quando a SNH marca a operação como vigente.
      - name: percentual_execucao_fisica
        description: Percentual de execução da obra.
      - name: uh_contratadas
        description: Unidades habitacionais contratadas.
      - name: uh_entregues
        description: Unidades habitacionais já entregues.
      - name: uh_vigentes
        description: Unidades habitacionais vigentes (contratadas menos as distratadas).
      - name: uh_distratadas
        description: Unidades habitacionais distratadas.
      - name: uh_a_entregar
        description: Unidades habitacionais ainda a entregar, conforme a SNH.
      - name: valor_contratado_original
        description: Valor contratado na assinatura, antes de aporte adicional, em R$.
      - name: valor_aporte_adicional
        description: Aporte adicional concedido depois da contratação, em R$.
      - name: valor_contratado
        description: Valor contratado total, em R$.
      - name: valor_desembolsado
        description: Valor desembolsado total, em R$.
      - name: dt_contratacao
        description: Data da contratação.
      - name: dt_previsao_termino
        description: Data prevista para o término da obra.
      - name: dt_termino
        description: Data efetiva do término da obra, quando já concluída.
      - name: dt_referencia
        description: Data de referência do extrato da SNH — a que mês a foto se refere.
      - name: arquivo_de_origem
        description: Arquivo da staging de onde veio a linha (`_source_file` da bronze).
      - name: criado_em
        description: >
          Momento em que a linha foi ingerida no lake (`_ingested_at` da bronze). É carimbo de
          ingestão, não data de negócio.

  - name: prata_fnhis_regularidade_entes
    description: >
      Regularidade de estados, DF e municípios no Sistema Nacional de Habitação de Interesse
      Social (SNHIS) — condição para receber recurso do FNHIS. Cinco exigências (lei do fundo
      local, lei do conselho gestor, termo de adesão, plano habitacional e relatório de gestão)
      e a situação-síntese do ente. Uma linha por ente.
    meta:
      tags:
        - silver
    columns:
      - name: cod_ibge
        description: Código IBGE do ente (7 dígitos; estados usam o código da UF seguido de zeros).
        data_tests:
          - not_null
          - unique
      - name: cod_ibge_6
        description: IBGE do ente sem o dígito verificador (6 dígitos), para cruzar com as bases da SNH.
      - name: ente_esfera
        description: Estado/DF ou Município.
      - name: ente_nome
        description: Nome do ente.
      - name: uf
        description: UF do ente.
      - name: ente_cnpj
        description: CNPJ do ente (apenas dígitos). É ente público, não pessoa.
      - name: populacao
        description: População do ente.
      - name: ic_regiao_metropolitana
        description: Verdadeiro quando o ente integra região metropolitana, conforme a extração da CAIXA.
      - name: situacao_lei_fundo
        description: Lei de criação do Fundo Local de Habitação de Interesse Social (FLHIS) — Regular ou Pendente.
      - name: dt_lei_fundo
        description: Data da análise da lei do FLHIS pela CEFUS.
      - name: situacao_lei_conselho
        description: Lei do conselho gestor do FLHIS — Regular ou Pendente.
      - name: dt_lei_conselho
        description: Data da análise da lei do conselho gestor pela CEFUS.
      - name: situacao_termo_adesao
        description: Termo de adesão ao SNHIS — Regular ou Pendente.
      - name: dt_termo_adesao
        description: Data da análise do termo de adesão pela CEFUS.
      - name: situacao_plano_habitacional
        description: Plano Local de Habitação de Interesse Social — Regular ou Pendente.
      - name: dt_plano_habitacional
        description: Data da análise do plano habitacional pela CEFUS.
      - name: ano_relatorio_gestao
        description: Ano do relatório de gestão do fundo a que a situação se refere.
      - name: situacao_relatorio_gestao
        description: Situação do relatório de gestão do fundo.
      - name: situacao_ente
        description: Situação-síntese do ente no SNHIS.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Regular", "Pendente"]
              config:
                severity: warn
      - name: ic_ente_regular
        description: Verdadeiro quando a situação do ente é Regular.
      - name: dt_referencia
        description: Data de referência da extração semanal — a que semana a foto se refere.
      - name: arquivo_de_origem
        description: Arquivo da staging de onde veio a linha (`_source_file` da bronze).
      - name: criado_em
        description: >
          Momento em que a linha foi ingerida no lake (`_ingested_at` da bronze). É carimbo de
          ingestão, não data de negócio.

  # --- perguntas do MCID (models/docs/entregas/perguntas-mcid-rural-fnhis-pro-moradia.md) ---
  - name: prata_fnhis_termo_compromisso_mensal
    description: Termo de compromisso do FNHIS Sub-50 em cada retrato mensal do painel do TransfereGov,
      com situação da contratação e do instrumento, valores de repasse, contrapartida e empenho e a situação
      no retrato anterior — base da trajetória do instrumento. O retrato de mar/2025 não traz situação do
      instrumento.
    meta:
      tags:
      - silver
    data_tests:
    - chave_composta_unica:
        arguments:
          colunas:
          - numero_proposta_transferegov
          - dt_retrato
    columns:
    - name: numero_proposta_transferegov
      description: Número da proposta no TransfereGov (identifica o termo).
    - name: numero_proposta
      description: Número da proposta na seleção do MCID (primeira parte de no_reservado_pac).
    - name: dt_retrato
      description: Data do retrato do painel (do nome do arquivo).
    - name: situacao_contratacao
      description: Situação da contratação (Normal, Cláusula Suspensiva, Liminar Judicial).
    - name: situacao_proposta
      description: Estágio da proposta dentro do TransfereGov.
    - name: situacao_instrumento
      description: Situação do instrumento (Em execução, Convênio Anulado, Prestação de Contas...).
    - name: valor_repasse
      description: Valor de repasse (R$).
    - name: valor_contrapartida
      description: Valor de contrapartida (R$).
    - name: valor_empenhado_acumulado
      description: Valor empenhado acumulado no retrato (R$).
    - name: uf
      description: UF do proponente.
    - name: arquivo_de_origem
      description: Nome do arquivo da staging de onde veio a linha (linhagem).
    - name: situacao_instrumento_retrato_anterior
      description: Situação do instrumento no retrato anterior do mesmo termo.

# --- regra das camadas (prata só lê bronze; ouro só lê prata), 2026-10-08 ---
  - name: prata_fnhis_snh_mcmv_outras_modalidades
    description: >
      Operações do MCMV acompanhadas pela SNH em todas as modalidades exceto FNHIS, com município,
      situação, data de contratação e UH. Base da experiência anterior dos municípios com obra habitacional no
      histórico do ente (ouro_fnhis_ente_historico). Uma linha por operação da SNH.
    meta:
      tags:
      - silver
    columns:
    - name: cod_ibge_6
      description: 'Código IBGE do município com 6 dígitos (sem o verificador), como a SNH grava.'
    - name: modalidade
      description: 'Modalidade do MCMV (FAR, Entidades, Rural, FGTS...).'
    - name: situacao
      description: 'Situação agrupada do empreendimento na SNH.'
    - name: dt_contratacao
      description: 'Data de contratação da operação.'
    - name: uh_contratadas
      description: 'UH contratadas.'
    - name: uh_entregues
      description: 'UH entregues.'
    - name: uh_distratadas
      description: 'UH distratadas.'
  - name: prata_mcid_cobertura_perguntas
    description: >
      Matriz pergunta × dado das três linhas acompanhadas com o MCID (Rural, FNHIS Sub-50, Pró-Moradia),
      uma linha por pergunta, com as colunas fixadas. Rótulos e limpeza ficam na ouro_mcid_cobertura_perguntas.
    meta:
      tags:
      - silver
    columns:
    - name: programa
      description: 'Linha: Rural, FNHIS Sub-50 ou Pró-Moradia.'
    - name: ordem
      description: 'Ordem da pergunta dentro da linha.'
    - name: origem_pergunta
      description: 'Oficina MCID ou Réplica do Rural.'
    - name: pergunta
      description: 'Texto da pergunta.'
    - name: situacao_dado
      description: 'respondivel, parcial ou lacuna_de_fonte.'
    - name: resposta_disponivel
      description: 'O que os dados conseguem responder.'
    - name: modelo_ouro
      description: 'Ouro que responde a pergunta (vazio quando não há).'
    - name: fonte_necessaria
      description: 'Fonte que falta para responder.'
    - name: limitacao
      description: 'Limitação do dado disponível.'
  - name: prata_fnhis_ficha_termo_compromisso
    description: 'Lógica que antes ficava na ouro ouro_fnhis_ficha_termo_compromisso, trazida para a prata para a
      ouro ler só prata. Ficha do termo de compromisso do FNHIS Sub-50: uma linha por termo, juntando a seleção (UH,
      IBGE), o instrumento no TransfereGov (repasse, empenho, situação), a regularidade do município no SNHIS e a
      execução acompanhada pela SNH, vinculada por município + valor (+ data) somente quando o vínculo é 1:1.'
    meta:
      tags:
      - silver
    columns:
    - name: numero_proposta_transferegov
      description: Número da proposta no TransfereGov.
    - name: numero_proposta
      description: Número da proposta na seleção do MCID — a chave que liga o termo à proposta.
    - name: codigo_programa
      description: Código do programa no TransfereGov.
    - name: programa
      description: Sempre "Novo MCMV FNHIS Sub-50".
    - name: uf
      description: UF do proponente.
    - name: regiao
      description: Região geográfica da UF.
    - name: municipio
      description: Município do proponente.
    - name: cod_ibge
      description: 'Código IBGE do município beneficiado (7 dígitos), vindo da proposta. Nulo quando o termo não casou
        com nenhuma proposta da seleção.

        '
    - name: municipio_uf
      description: Localização no formato "Município/UF".
    - name: termo_municipio
      description: Rótulo "proposta TransfereGov - Município/UF", usado como dimensão de filtro no Superset.
    - name: proponente_nome
      description: Ente proponente.
    - name: proponente_esfera
      description: Município ou Estado/DF, conforme a administração pública proponente.
    - name: objeto
      description: Objeto do termo de compromisso, como descrito no painel do TransfereGov.
    - name: situacao_selecao
      description: 'Situação da proposta na SELEÇÃO do MCID (portaria nº 673/2024) — não confundir com `situacao_proposta`,
        que é o estágio dela dentro do TransfereGov.

        '
    - name: ic_proposta_de_risco
      description: Verdadeiro para as propostas do grupo de áreas de risco.
    - name: quantidade_uh
      description: UH da proposta selecionada.
    - name: pessoas_atendidas
      description: Estimativa = UH × 3,3 moradores por domicílio, truncada.
    - name: situacao_contratacao
      description: Situação da contratação (Normal, Cláusula Suspensiva, Liminar Judicial).
    - name: situacao_proposta
      description: Situação da proposta no TransfereGov — o estágio dela dentro do sistema de transferência.
    - name: situacao_instrumento
      description: Situação do instrumento (Em execução, Convênio Anulado, Convênio Rescindido, Prestação de Contas...).
    - name: ic_instrumento_ativo
      description: Falso quando o termo foi anulado, rescindido ou não chegou a ter instrumento.
    - name: dt_assinatura
      description: Data de assinatura do termo.
    - name: valor_repasse
      description: Valor de repasse do FNHIS, em R$.
    - name: valor_contrapartida
      description: Contrapartida do ente, em R$.
    - name: valor_investimento
      description: Repasse + contrapartida, em R$.
    - name: valor_repasse_por_uh
      description: Repasse sobre UH.
    - name: valor_empenhado_acumulado
      description: Valor empenhado acumulado, em R$.
    - name: percentual_empenhado
      description: Empenhado acumulado sobre o repasse, em %.
    - name: ic_ente_regular
      description: Situação do município no SNHIS no retrato mais recente (nulo se o município não está no SNHIS).
    - name: situacao_ente
      description: Situação-síntese do município no SNHIS (Regular ou Pendente).
    - name: situacao_plano_habitacional
      description: Situação do Plano Local de Habitação de Interesse Social do município.
    - name: situacao_lei_fundo
      description: Situação da lei de criação do Fundo Local de Habitação de Interesse Social (FLHIS).
    - name: situacao_lei_conselho
      description: Situação da lei do conselho gestor do FLHIS.
    - name: ic_contrato_snh_identificado
      description: Verdadeiro quando o termo foi vinculado 1:1 a um contrato acompanhado pela SNH.
    - name: criterio_vinculo_snh
      description: Como o vínculo foi feito — município + valor + data, ou município + valor.
    - name: id_operacao_snh
      description: Operação da SNH vinculada.
    - name: cod_operacao_agente
      description: Código da operação na CAIXA (7 dígitos), do contrato vinculado na SNH. Não é APF.
    - name: agente_financeiro
      description: Agente financeiro do contrato vinculado — no Sub-50 é a CAIXA na totalidade das operações.
    - name: situacao_obra_snh
      description: Situação do empreendimento informada pela SNH, do contrato vinculado.
    - name: percentual_execucao_fisica
      description: Percentual de execução da obra, do contrato vinculado na SNH.
    - name: uh_entregues
      description: Unidades habitacionais já entregues, do contrato vinculado na SNH.
    - name: valor_desembolsado
      description: Valor desembolsado no contrato vinculado, em R$. É desembolso da SNH, não o empenho do TransfereGov.
    - name: dt_previsao_termino
      description: Data prevista para o término da obra, do contrato vinculado na SNH.
    - name: dt_termino
      description: Data efetiva do término da obra, quando já concluída.
    - name: status_execucao_simplificado
      description: 'Regra de negócio: Sem instrumento ativo, Sem acompanhamento SNH, Concluído, Não Iniciado, Paralisado
        ou Em Andamento.

        '
    - name: dt_consulta
      description: Data de extração do painel no TransfereGov — a idade do lado instrumento desta ficha.
    - name: dt_referencia_snh
      description: Data de referência do extrato da SNH — a idade do lado execução desta ficha.
  - name: prata_fnhis_proposta_tramite
    description: Lógica que antes ficava na ouro ouro_fnhis_proposta_tramite, trazida para a prata para a ouro ler
      só prata. Etapa atual de cada proposta apresentada ao FNHIS Sub-50 — fora no enquadramento, fora na seleção,
      selecionada sem termo, termo anulado, termo em execução, obra na SNH, prestação de contas — com o termo do TransfereGov,
      a execução na SNH e a trajetória do instrumento entre os retratos mensais. O trâmite interno do MCID (SEI +
      planilha) não chega ao banco.
    meta:
      tags:
      - silver
    columns:
    - name: numero_proposta
      description: Número da proposta na seleção.
    - name: uf
      description: UF do município beneficiado.
    - name: municipio
