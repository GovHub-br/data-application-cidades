version: 2

# A prata tipa o texto da bronze e aplica as regras de negócio do FDS. Os testes aqui
# guardam o GRÃO de cada tabela: um join que multiplica linha dobra todo somatório do
# dashboard sem erro nenhum aparecer.

models:

  - name: prata_fds_cadastro_pj
    description: >
      Cadastro do empreendimento contratado pela entidade organizadora: composição
      financeira, tipologia, coordenadas e datas-chave. Uma linha por empreendimento.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique

  - name: prata_fds_obra_mensal
    description: >
      Medição física do empreendimento na competência mais recente.
      Uma linha por empreendimento — é retrato, não série.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique

  - name: prata_fds_financeiro_mensal
    description: >
      Liberações financeiras do empreendimento. Uma linha por liberação, então o APF
      repete: é a fonte do FDS com série histórica.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null

  - name: prata_fds_trabalho_social
    description: >
      Execução do trabalho social por empreendimento. Cobre parte do domínio:
      só quem tem TS reportado aparece aqui.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique

  - name: prata_fds_int_059_caixa_pj
    description: >
      Recorte do INT059 da CAIXA: situação GEFUS e indicativo de paralisação por
      empreendimento.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique

  - name: prata_fds_dados_prioritarios_entregas
    description: >
      Entregas reportadas pela CAIXA. Sem teste de unicidade: o APF 50710727 vem
      duplicado no retrato da origem.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null

  - name: prata_fds_empreendimento
    description: >
      Visão unificada do empreendimento FDS: cadastro, obra, INT059, trabalho social e
      entregas reconciliados numa linha por APF. É a base da ficha.
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos — chave do domínio.
        tests:
          - not_null
          - unique
      - name: municipio
        description: Município do empreendimento.
        tests:
          - sem_mojibake

  - name: prata_fds_evolucao_financeira
    description: >
      Série de desembolsos por empreendimento e mês, com acumulado e percentual
      executado.
    tests:
      # O grão é (apf, mes): duas linhas para o mesmo mês dobrariam o acumulado.
      - unique_combinacao:
          colunas: ["apf", "mes"]
    columns:
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
      - name: mes
        description: Primeiro dia do mês da liberação.
        tests:
          - not_null

  - name: prata_fds_dim_empreendimento
    description: >
      Identidade estável do empreendimento FDS. Liga os APFs de fases distintas
      (Projeto → Obra → Desligamento) de um mesmo empreendimento a um
      id_empreendimento derivado do APF-âncora. Sucessora de
      silver_atual_dim_empreendimento (change #130); consumida pelo eixo
      histórico (prata_fds_historico_empreendimento). Grão: uma linha por
      (id_empreendimento, apf) — o APF é único, o id_empreendimento repete.
    columns:
      - name: id_empreendimento
        description: md5('empreendimento-fds|' || apf_ancora) — chave estável.
        tests:
          - not_null
      - name: apf
        description: APF normalizado para 8 dígitos.
        tests:
          - not_null
          - unique
      - name: fase_empreendimento
        description: Fase administrativa do APF (Projeto / Obra / Desligamento).
      - name: origem_mapeamento
        description: >
          De onde veio a fase: seed curado (JAN26/ABR26), evento de mudança de
          fase, ou fallback do cadastro.

  - name: prata_fds_familia_legado
    description: >
      Famílias do MCMV Entidades (FDS) no legado, contratos da CAIXA (INT042), uma linha por contrato,
      com o último movimento. Traz localização do imóvel em nível de município, valores, prazos,
      situação do contrato e perfil agregado (sexo, estado civil e faixa etária). Não guarda nome,
      CPF, PIS, data de nascimento, endereço nem CEP.
    meta:
      tags:
        - silver
      governance:
        classification: restricted
        rag_publication: prohibited
      openmetadata:
        glossary:
          - MCID.ProgramasHabitacionais.MCMV.MCMVEntidades
          - MCID.FundosEFontes.FDS
          - MCID.Identificadores.APF
    data_tests:
      - unique_combinacao:
          arguments:
            colunas:
              - nu_contrato
    columns:
      - name: agente_financeiro_codigo
        description: Código do agente financeiro como veio na origem.
      - name: apf
        description: APF do empreendimento (8 dígitos, normalizada).
      - name: apf_vinculacao
        description: APF de vinculação do contrato (8 dígitos, normalizada), quando a origem informa.
      - name: nu_contrato
        description: Número do contrato. É a chave do grão.
        data_tests:
          - not_null
      - name: dt_movimento
        description: Data do movimento da remessa; fica a mais recente por contrato.
      - name: dt_assinatura
        description: Data de assinatura do contrato.
      - name: dt_termino_contrato
        description: Data de término do contrato.
      - name: co_produto_siico
        description: Código do produto no SIICO.
      - name: tipo_contrato
        description: Descrição do tipo de contrato.
      - name: situacao_contrato
        description: Descrição da situação do contrato.
      - name: fase
        description: Fase do contrato informada pela CAIXA.
      - name: sexo
        description: Sexo do mutuário como veio na origem.
      - name: estado_civil
        description: Estado civil do mutuário.
      - name: ic_mulher_chefe_familia
        description: Verdadeiro quando a família é chefiada por mulher.
      - name: qt_coobrigados
        description: Quantidade de coobrigados no contrato.
      - name: faixa_etaria
        description: Faixa etária do mutuário na data do movimento, calculada na prata. A data de nascimento não é guardada.
      - name: cod_ibge
        description: Código IBGE completo do município do imóvel.
      - name: municipio
        description: Nome do município do imóvel.
      - name: uf
        description: Sigla da UF do imóvel.
      - name: vr_renda_familiar
        description: Renda familiar comprovada, em reais.
      - name: vr_garantia_inicial
        description: Valor da garantia inicial, em reais.
      - name: vr_subsidio_concessao
        description: Valor do subsídio na concessão, em reais.
      - name: vr_subsidio_concedido
        description: Valor do subsídio concedido, em reais.
      - name: vr_saldo_devedor
        description: Saldo devedor atual, em reais.
      - name: vr_prestacao
        description: Valor da prestação, em reais.
      - name: vr_encargo_atraso
        description: Encargo total em atraso, em reais.
      - name: qt_dias_atraso
        description: Quantidade de dias em atraso.
      - name: qt_prestacoes_atraso
        description: Quantidade de prestações em atraso.
      - name: pz_amortizacao
        description: Prazo de amortização, em meses.
      - name: pz_decorrido
        description: Prazo decorrido, em meses.
      - name: pz_remanescente
        description: Prazo remanescente, em meses.
      - name: arquivo_de_origem
        description: Nome do arquivo da staging de onde veio a linha (linhagem).
