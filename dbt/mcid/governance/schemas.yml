version: 1

# Registro semântico dos schemas físicos. É a ÚNICA fonte de descrição e de
# nome de exibição de schema no catálogo: o sincronizador falha se um schema
# aparecer no catálogo sem entrada aqui, em vez de inventar uma descrição. Não contém caminhos, SQL, contagens
# ou exemplos de dados. A sincronização para OpenMetadata usa este arquivo
# como fonte de descrição de schema.
schemas:
  - name: conjuntura
    display_name: Conjuntura
    product: conjuntura
    layer: mixed
    owner_key: mcid_data_engineering
    classification: internal
    # Schema único: a camada de cada tabela vem do prefixo do nome e do
    # `meta.governance.layer` do modelo, não do schema. Por isso `mixed` e
    # `determined_per_model`, como no empreendimento_far.
    rag_publication: determined_per_model
    description: >-
      Schema do produto Conjuntura, com as camadas distinguidas pelo prefixo do
      nome: `bnz_` para a ingestão fiel, `slv_` para o dado conformado e `gld_`
      para o consumo. As tabelas `bnz_manual_*` são cargas manuais sem DAG.

  - name: empreendimento_far
    display_name: Empreendimento FAR
    product: empreendimento_far
    layer: mixed
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: determined_per_model
    description: Schema do produto Empreendimento FAR, com ativos operacionais e analíticos do Fundo de Arrendamento Residencial.

  - name: entidades_fds
    display_name: Entidades FDS
    product: entidades_fds
    layer: mixed
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: determined_per_model
    description: Schema do produto Entidades FDS, com ativos operacionais e analíticos do Fundo de Desenvolvimento Social.

  - name: metadata
    display_name: Metadados técnicos
    product: metadata
    layer: technical
    owner_key: mcid_data_engineering
    classification: restricted
    rag_publication: prohibited
    description: Metadados técnicos e operacionais do pipeline de dados.

