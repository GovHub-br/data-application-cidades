version: 1

# Registro semântico dos schemas físicos. É a ÚNICA fonte de descrição e de
# nome de exibição de schema no catálogo: o sincronizador falha se um schema
# aparecer no catálogo sem entrada aqui, em vez de inventar uma descrição. Não contém caminhos, SQL, contagens
# ou exemplos de dados. A sincronização para OpenMetadata usa este arquivo
# como fonte de descrição de schema.
schemas:
  - name: bronze
    display_name: Bronze
    product: compartilhado
    layer: bronze
    owner_key: mcid_data_engineering
    classification: restricted
    rag_publication: prohibited
    description: >-
      Espelho textual das origens, compartilhado pelos produtos do ministério.
      Cada tabela reproduz um arquivo recebido sem recorte nem tipagem, e o
      domínio a que pertence é dado pelo modelo que a produz, não pelo schema.

  - name: prata
    display_name: Prata
    product: compartilhado
    layer: silver
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: eligible_after_security_validation
    description: >-
      Dado tipado e conformado às regras de negócio, compartilhado pelos
      produtos do ministério. O nome de cada tabela carrega o domínio a que
      pertence, logo depois da camada.

  - name: ouro
    display_name: Ouro
    product: compartilhado
    layer: gold
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: eligible_after_security_validation
    description: >-
      Camada de consumo, compartilhada pelos produtos do ministério: é o que os
      painéis leem. O nome de cada tabela carrega o domínio a que pertence,
      logo depois da camada.

  - name: conjuntura
    display_name: Conjuntura (cargas manuais e histórico)
    product: conjuntura
    layer: mixed
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: determined_per_model
    description: >-
      Schema do produto Conjuntura, com as camadas distinguidas pelo prefixo do
      nome: `bnz_` para a ingestão fiel, `slv_` para o dado conformado e `gld_`
      para o consumo. As tabelas `bnz_manual_*` são cargas manuais sem DAG.

  # `bronze`, `prata` e `ouro` substituíram `empreendimento_far` e
  # `entidades_fds` como schema físico: os models de FAR, FDS e Rural passaram
  # a materializar por CAMADA, nos três schemas abaixo, e não mais um schema
  # por produto. Por isso estas três entradas não têm `product`: cada schema
  # abriga tabela de TRÊS produtos, distinguidas pelo prefixo do nome. Declarar
  # um produto aqui afirmaria que as tabelas dos outros dois pertencem a ele —
  # o produto é por tabela e sai do `meta.governance.product` de cada model,
  # via catálogo semântico.
  #
  # A camada, por outro lado, agora é do SCHEMA: cada um guarda uma só. É o
  # oposto do `conjuntura`, que continua `mixed` com a camada no prefixo.
  - name: bronze
    display_name: Bronze
    layer: bronze
    owner_key: mcid_data_engineering
    classification: restricted
    rag_publication: prohibited
    description: >-
      Camada bronze dos produtos de empreendimentos (FAR, FDS e Rural):
      espelho fiel do que chega da origem, publicado no catálogo para que a
      linhagem alcance o início do caminho, não para consumo.

  - name: prata
    display_name: Prata
    layer: silver
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: eligible_after_security_validation
    description: >-
      Camada prata dos produtos de empreendimentos (FAR, FDS e Rural), com o
      dado tipado e conformado a partir da bronze e as regras de negócio de
      cada programa aplicadas.

  - name: ouro
    display_name: Ouro
    layer: gold
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: eligible_after_security_validation
    description: >-
      Camada ouro dos produtos de empreendimentos (FAR, FDS e Rural), com os
      ativos de consumo que alimentam ficha de empreendimento, panorama
      estadual, mapa nacional e resumo gerencial.

  - name: metadata
    display_name: Metadados técnicos
    product: metadata
    layer: technical
    owner_key: mcid_data_engineering
    classification: restricted
    rag_publication: prohibited
    description: Metadados técnicos e operacionais do pipeline de dados.

