version: 1

# Registro semântico dos schemas físicos. É a ÚNICA fonte de descrição e de
# nome de exibição de schema no catálogo: o sincronizador falha se um schema
# aparecer no catálogo sem entrada aqui, em vez de inventar uma descrição. Não contém caminhos, SQL, contagens
# ou exemplos de dados. A sincronização para OpenMetadata usa este arquivo
# como fonte de descrição de schema.
schemas:
  - name: bronze
    display_name: Bronze
    product: compartilhado
    layer: bronze
    owner_key: mcid_data_engineering
    classification: restricted
    rag_publication: prohibited
    description: >-
      Espelho textual das origens, compartilhado pelos produtos do ministério.
      Cada tabela reproduz um arquivo recebido sem recorte nem tipagem, e o
      domínio a que pertence é dado pelo modelo que a produz, não pelo schema.

  - name: prata
    display_name: Prata
    product: compartilhado
    layer: silver
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: eligible_after_security_validation
    description: >-
      Dado tipado e conformado às regras de negócio, compartilhado pelos
      produtos do ministério. O nome de cada tabela carrega o domínio a que
      pertence, logo depois da camada.

  - name: ouro
    display_name: Ouro
    product: compartilhado
    layer: gold
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: eligible_after_security_validation
    description: >-
      Camada de consumo, compartilhada pelos produtos do ministério: é o que os
      painéis leem. O nome de cada tabela carrega o domínio a que pertence,
      logo depois da camada.

  - name: conjuntura
    display_name: Conjuntura (histórico das edições)
    product: conjuntura
    layer: mixed
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: determined_per_model
    description: >-
      Guarda os snapshots `snap_boletim_*`, que congelam cada edição publicada
      do boletim, e o seed `boletim_gabarito`, usado na conferência contra o
      boletim impresso. Os modelos do produto Conjuntura ficam em `bronze`,
      `prata` e `ouro`; as cargas manuais foram para `bronze` no 0010.

  # Schemas dos dbts aposentados. A declaração fica porque os produtos
  # `empreendimento_far` e `entidades_fds` ainda os citam em `dominios.yml`:
  # migrar esses domínios para `bronze`/`prata`/`ouro` é etapa própria, e
  # remover a entrada antes disso faria o sincronizador acusar schema sem
  # descrição. Não há tabela viva em nenhum dos dois.
  - name: empreendimento_far
    display_name: Empreendimento FAR (aposentado)
    product: empreendimento_far
    layer: mixed
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: determined_per_model
    description: Schema aposentado do produto Empreendimento FAR; os modelos vivem em `bronze`, `prata` e `ouro`.

  - name: entidades_fds
    display_name: Entidades FDS (aposentado)
    product: entidades_fds
    layer: mixed
    owner_key: mcid_data_engineering
    classification: internal
    rag_publication: determined_per_model
    description: Schema aposentado do produto Entidades FDS; os modelos vivem em `bronze`, `prata` e `ouro`.

  - name: metadata
    display_name: Metadados técnicos
    product: metadata
    layer: technical
    owner_key: mcid_data_engineering
    classification: restricted
    rag_publication: prohibited
    description: Metadados técnicos e operacionais do pipeline de dados.

