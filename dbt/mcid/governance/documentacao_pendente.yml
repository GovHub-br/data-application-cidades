version: 1

# Models da ouro que ainda não cumprem o contrato de documentação
# (`scripts/governance/documentacao_dbt.py`): descrição do model e de cada
# coluna, mais `meta.documentacao` com grão, chave, fonte, periodicidade e
# consumo.
#
# É uma catraca, e só anda para um lado. `tests/test_documentacao_ouro.py`
# falha se:
#   - um model da ouro fora desta lista deixar de cumprir o contrato — model
#     novo na ouro já nasce documentado;
#   - um model desta lista passar a cumprir — tire-o daqui no mesmo PR.
#
# Para ver o que falta em cada um:
#   poetry run python scripts/governance/auditar_metadados.py --ouro
