    - gld_fgts_valor_medio
    - gld_uh_condicao_uso
    - gld_fundo_social
  MCID.FundosEFontes.SBPE:
    - gld_financiamentos_habitacionais
    - gld_saldo_poupanca
    - gld_novos_financiamentos_banco
    - gld_financiamentos_instituicao
    - gld_uh_condicao_uso
    - gld_funding
  MCID.IndicadoresConjunturais.PIBConstrucaoCivil:
    - gld_pib_construcao_civil
    - gld_pib_construcao_civil_pct
  MCID.IndicadoresConjunturais.NovoCAGED:
    - gld_empregos_caged
  MCID.IndicadoresConjunturais.PNADContinua:
    - gld_pnad_ocupados
    - gld_pnad_rendimento
  MCID.IndicadoresConjunturais.SINAPI:
    - gld_sinapi
  MCID.IndicadoresConjunturais.INCCM:
    - gld_incc_m
    - gld_ticket_medio
  MCID.IndicadoresConjunturais.ICST:
    - gld_icst
  MCID.IndicadoresConjunturais.IMOB:
    - gld_indice_imob
  MCID.IndicadoresConjunturais.FipeZapLocacao:
    - gld_fipezap
  MCID.IndicadoresConjunturais.TicketMedio:
    - gld_ticket_medio
  MCID.IndicadoresConjunturais.CaptacaoLiquida:
    - gld_saldo_poupanca
  MCID.IndicadoresConjunturais.FinanciamentoHabitacional:
    - gld_financiamentos_habitacionais
    - gld_financiamento_pf_faixa
    - gld_uh_condicao_uso
  MCID.IndicadoresConjunturais.FinanciamentoImobiliario:
    - gld_financiamentos_imobiliarios_pf_pj
    - gld_novos_financiamentos_banco
    - gld_financiamentos_instituicao
  MCID.IndicadoresConjunturais.LancamentoImobiliario:
    - gld_balancos_empresas
    - gld_balancos_empresas_totais
  MCID.IndicadoresConjunturais.VendaImobiliaria:
    - gld_balancos_empresas
    - gld_balancos_empresas_totais
  MCID.Identificadores.UH:
    - gld_financiamentos_habitacionais
    - gld_financiamento_pf_faixa
    - gld_uh_condicao_uso
    - gld_canal_fgts
    - gld_fundo_social
  MCID.ProgramasHabitacionais.MCMV:
    - gld_financiamento_pf_faixa
    - gld_canal_fgts
    - gld_fundo_social

#: O glossário como entidade, não só os termos dentro dele (HU-20). Sem dono
#: declarado, vocabulário novo entra sem ninguém responder por ele.
#:
#: `revisores` fica vazio por decisão do Lucas (2026-08-31). O mecanismo está
#: pronto: acrescentar o `name` do usuário na lista basta para que o sync o
#: aplique. Nomear quem aprova termo novo é decisão do time.
glossario:
  name: MCID
  owner_key: mcid_data_engineering
  revisores: []
