# Seletores do projeto, compartilhados por quem roda o dbt fora da CLI.
#
# Quem usa:
#   - dags/snh/dbt/mcid_cosmos_dag.py: o task group do Cosmos;
#   - helpers/openmetadata/dbt_artifacts.py: o `dbt docs generate` da ingestão
#     do OpenMetadata, que roda no target `prod`.
#
# Até 11/2026 havia também o `eixo_historico` (Reforma Casa Brasil e Linha Financiada, no
# target prod_duckdb), e este seletor era o projeto menos ele. Os dois domínios passaram para
# o Postgres (pg_duckdb), e o projeto inteiro voltou a rodar num grupo só. Se um dia o
# projeto for repartido de novo, tests/test_cosmos_grupos.py confere que nenhum teste fica
# num grupo diferente do de um dos seus pais.
#
# Nenhum seletor é `default`: a CLI continua selecionando o projeto inteiro.
selectors:
  - name: dominios_postgres
    description: Todo o projeto, com as fontes (target prod).
    definition:
      union:
        - method: fqn
          value: "*"
        # `fqn:*` não pega as fontes, e sem elas o catalog sai sem os tipos
        # das colunas de origem.
        - method: source
          value: "*"
