version: 2

# Dados de referência versionados no repositório: o gabarito de conferência do
# boletim e a tabela de unidades da federação do IBGE.

seeds:
  - name: api_ibge_uf
    description: >
      Uma linha por unidade da federação, com sigla, nome e a região a que
      pertence. Serve para traduzir a sigla da UF em nome do estado nos
      painéis de FAR e Rural.
    columns:
      - name: id
        description: Código do IBGE da unidade da federação.
        tests:
          - unique
          - not_null
      - name: sigla
        description: Sigla de duas letras da unidade da federação.
        tests:
          - unique
          - not_null
      - name: nome
        description: Nome por extenso da unidade da federação.
        tests:
          - not_null
      - name: regiao_id
        description: Código do IBGE da região.
      - name: regiao_sigla
        description: Sigla da região (N, NE, CO, SE, S).
      - name: regiao_nome
        description: Nome por extenso da região.

  - name: boletim_gabarito
    description: >
      Uma linha por célula publicada em uma edição do boletim, com a página, o
      modelo correspondente, o rótulo da linha, o nome da coluna, o valor
      impresso e a tolerância aceita na comparação.
    columns:
      - name: edicao
        description: >
          Trimestre da edição do boletim em que o valor foi publicado.
      - name: pagina
        description: >
          Página do boletim em que a célula aparece.
      - name: modelo
        description: >
          Modelo que reproduz o quadro a que a célula pertence.
      - name: linha
        description: >
          Rótulo da linha do quadro.
      - name: coluna
        description: >
          Nome da coluna do quadro.
      - name: esperado
        description: >
          Valor impresso na edição do boletim.
      - name: tolerancia
        description: >
          Diferença absoluta aceita entre o valor impresso e o valor
          apurado.
