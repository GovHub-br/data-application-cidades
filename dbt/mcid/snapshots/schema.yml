version: 2

# Congelamento das edições do boletim.
#
# Cada snapshot guarda o histórico do quadro correspondente: quando uma fonte
# revisa um período já publicado, a versão anterior permanece registrada com
# sua janela de validade. É o que permite responder por que uma edição
# publicou um número diferente do que a série mostra hoje.

snapshots:
  - name: snap_boletim_p1_pib_construcao_civil_em_de_crescimento
    description: >
      Histórico de revisões do quadro PIB Construção Civil (em % de
      Crescimento) da página 1: uma linha por edição e indicador, com a janela
      de validade de cada versão.
    columns:
      - name: chave
        description: >
          Identificador da linha do quadro, formado pela edição e pelo
          rótulo da linha.
      - name: edicao
        description: >
          Trimestre a que a linha se refere, no formato usado pelo boletim.
      - name: dbt_valid_from
        description: >
          Momento a partir do qual esta versão da linha passou a valer.
      - name: dbt_valid_to
        description: >
          Momento em que esta versão deixou de valer, nulo enquanto for a
          versão corrente.
      - name: dbt_scd_id
        description: >
          Identificador interno da versão da linha.
      - name: dbt_updated_at
        description: >
          Momento em que a versão foi registrada.
