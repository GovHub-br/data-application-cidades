mcid:
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DB_DW_HOST_MCID') }}"
      user: "{{ env_var('DB_DW_USER_MCID') }}"
      password: "{{ env_var('DB_DW_PASSWORD_MCID') }}"
      port: "{{ env_var('DB_DW_PORT_MCID', '5432') | int }}"
      dbname: "{{ env_var('DB_DW_DBNAME_MCID', 'cidades') }}"
      # Schema de fallback: só recebe recurso que esqueceu o `+schema`. Fica
      # vazio em operação normal, e é isso que o teste
      # `sem_recurso_no_schema_de_fallback` verifica. Nunca apontar para schema
      # real — foi assim que models extraviados se esconderam em `conjuntura`.
      schema: "{{ env_var('DB_DW_SCHEMA_MCID', 'dbt_default') }}"

    # Modo A (dev) — le a staging MinIO, materializa no arquivo local.
    # O catalogo local se chama `cidades` (D3 da change
    # pipeline-bronze-historica-destino-trocavel): o OpenMetadata monta o FQN
    # da tabela a partir de database/schema/name do no no manifest.json, entao
    # o catalogo precisa ter o mesmo nome do banco Postgres para que o FQN
    # `cidades.<schema>.<tabela>` valha em qualquer modo. O dbt-duckdb exige
    # que `database` case com o basename de `path` — dai o arquivo se chamar
    # cidades.duckdb.
    staging_duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_MCID_PATH', '/tmp/cidades.duckdb') }}"
      database: cidades
      schema: mcmv_indicadores
      threads: "{{ env_var('DUCKDB_MCID_THREADS', '4') | int }}"
      extensions:
        - httpfs
      # Porta pro DuckDB as 3 UDFs (normalize_apf/parse_date_br/
      # corrigir_mojibake) que em Postgres nascem do hook create_udfs()
      # (dbt_project.yml on-run-start, gated a target.type == 'postgres') —
      # sem isto, todo modelo far_dbt/fds_dbt/rural_dbt que chama
      # metadata.normalize_apf/... quebra com Catalog Error neste target.
      # Ver plugins/udfs_duckdb.py. module_paths é relativo ao cwd de onde o
      # dbt é invocado — sempre dbt/mcid/ nos run-*.sh deste repo.
      plugins:
        - module: udfs_duckdb
      module_paths:
        - plugins
      # Guardas de recurso. As bronzes históricas fazem union_by_name de
      # muitos parquets; a materialização default do DuckDB
      # (preserve_insertion_order=true) buffra o resultado inteiro em RAM
      # antes de gravar e derrama dezenas de GB no temp_directory. A ordem
      # não importa aqui: bronzes são empilhamento append-only e a dedup na
      # silver é por chave explícita; o gold faz seu próprio ORDER BY.
      # Todos overridáveis por env var — default = comportamento anterior + spill em disco controlado.
      #
      # Ficam em config_options (aplicado uma vez no duckdb.connect), NÃO em
      # settings: o dbt-duckdb reaplica settings a cada cursor novo, e o DuckDB
      # rejeita reconfigurar temp_directory depois que ele já foi usado
      # ("Cannot switch temporary directory after the current one has been
      # used") — o que quebrava a fase de testes logo após um modelo pesado
      # derramar em disco.
      config_options:
        preserve_insertion_order: false
        memory_limit: "{{ env_var('DUCKDB_MCID_MEMORY_LIMIT', '10GB') }}"
        temp_directory: "{{ env_var('DUCKDB_MCID_TEMP_DIR', '/tmp/duckdb_mcid_tmp') }}"
        max_temp_directory_size: "{{ env_var('DUCKDB_MCID_MAX_TEMP', '60GB') }}"
      settings:
        # O DuckDB espera host:porta SEM esquema -- ele mesmo prefixa http://
        # (s3_use_ssl=false). Se MINIO_ENDPOINT vier como "http://host:9000",
        # o resultado vira "http://http://host:9000" e a resolucao de nome falha.
        # O replace abaixo aceita a variavel com ou sem esquema.
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT') | replace('https://', '') | replace('http://', '') | trim('/') }}"
        s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY') }}"
        s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY') }}"
        s3_url_style: path
        s3_use_ssl: false
        # Retry de HTTP contra o MinIO (achado da change
        # enriquecer-pro-moradia-execucao-desembolso-historico): as bronzes
        # GEAVO (38 snapshots cada) falhavam de forma intermitente com
        # "Transferred a partial file"/"Timeout was reached"/403 esporádico
        # sem retry algum configurado -- arquivo e conexao variavam a cada
        # tentativa, sinal de instabilidade transiente de rede, nao de um
        # arquivo especifico corrompido. Valores DELIBERADAMENTE modestos
        # (não os 10 retries / 300s de timeout testados primeiro): aquela
        # combinação deixou UMA conexão problemática travar o build inteiro
        # por 4h10min antes de finalmente desistir -- pior que sem retry
        # nenhum. Prefira poucas tentativas rápidas + reinvocar o `dbt build`
        # do zero (idempotente) a poucas tentativas MUITO longas. Sem custo
        # para leituras que dão certo de primeira (só entra em jogo quando
        # uma requisição falha).
        http_retries: "{{ env_var('DUCKDB_MCID_HTTP_RETRIES', '5') | int }}"
        http_retry_wait_ms: "{{ env_var('DUCKDB_MCID_HTTP_RETRY_WAIT_MS', '1000') | int }}"
        http_retry_backoff: "{{ env_var('DUCKDB_MCID_HTTP_RETRY_BACKOFF', '2') | int }}"
        # Default do DuckDB é 30s; 60s dá alguma folga para os globs grandes
        # deste domínio sob esta rede sem deixar UMA tentativa travar por
        # minutos (ver comentário acima sobre o custo de valores agressivos).
        http_timeout: "{{ env_var('DUCKDB_MCID_HTTP_TIMEOUT_SECONDS', '60') | int }}"
        # MINIO_ENDPOINT é acessado por VPN (10.0.0.x) — suspeita de que o
        # túnel derruba conexões ociosas sem avisar, deixando uma conexão
        # keep-alive "morta" no pool que só falha ao ser reutilizada bem
        # depois. Desligar keep-alive força uma conexão nova por requisição —
        # mais caro por requisição, mas evita reusar socket morto num glob de
        # dezenas de arquivos.
        http_keep_alive: "{{ env_var('DUCKDB_MCID_HTTP_KEEP_ALIVE', 'false') }}"

    # Modo C (direto) — le a staging MinIO e materializa NO POSTGRES, com o
    # motor DuckDB rodando neste processo (nunca via pg_duckdb dentro do
    # banco): o Postgres so recebe DDL e insercao em streaming pelo
    # postgres_scanner. Ver D1/D2/D3 da change
    # pipeline-bronze-historica-destino-trocavel.
    #
    # Dois catalogos: o arquivo local vira `mcid_local` (scratch/spill do
    # DuckDB) e o Postgres e atachado como `cidades` — dois catalogos nao
    # podem dividir nome na mesma sessao, e e o alias do attach que precisa
    # ser `cidades` para o `+database: cidades` dos modelos resolver no banco.
    #
    # Mesmas env vars do target `prod`; nenhuma configuracao de servidor,
    # role ou extensao do Postgres e tocada.
    prod_duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_MCID_LOCAL_PATH', '/tmp/mcid_local.duckdb') }}"
      # `database` TEM de casar com o basename do `path` (o dbt-duckdb valida).
      # Aqui e o arquivo local de scratch/spill: mcid_local.duckdb -> mcid_local.
      # O catalogo `cidades` vem do `attach` abaixo, apontando pro Postgres --
      # e um nome nao pode servir aos dois na mesma sessao.
      database: mcid_local
      schema: "{{ env_var('DB_DW_SCHEMA_MCID', 'dbt_default') }}"
      threads: "{{ env_var('DUCKDB_MCID_THREADS', '4') | int }}"
      extensions:
        - httpfs
        - postgres
      # Ver comentário no target staging_duckdb (mesmo motivo/mesmo plugin).
      plugins:
        - module: udfs_duckdb
      module_paths:
        - plugins
      attach:
        - path: "dbname={{ env_var('DB_DW_DBNAME_MCID', 'cidades') }} host={{ env_var('DB_DW_HOST_MCID') }} port={{ env_var('DB_DW_PORT_MCID', '5432') }} user={{ env_var('DB_DW_USER_MCID') }} password={{ env_var('DB_DW_PASSWORD_MCID') }}"
          type: postgres
          alias: cidades
      config_options:
        preserve_insertion_order: false
        memory_limit: "{{ env_var('DUCKDB_MCID_MEMORY_LIMIT', '10GB') }}"
        temp_directory: "{{ env_var('DUCKDB_MCID_TEMP_DIR', '/tmp/duckdb_mcid_tmp') }}"
        max_temp_directory_size: "{{ env_var('DUCKDB_MCID_MAX_TEMP', '60GB') }}"
      settings:
        # O DuckDB espera host:porta SEM esquema -- ele mesmo prefixa http://
        # (s3_use_ssl=false). Se MINIO_ENDPOINT vier como "http://host:9000",
        # o resultado vira "http://http://host:9000" e a resolucao de nome falha.
        # O replace abaixo aceita a variavel com ou sem esquema.
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT') | replace('https://', '') | replace('http://', '') | trim('/') }}"
        s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY') }}"
        s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY') }}"
        s3_url_style: path
        s3_use_ssl: false
        # Ver comentário no target staging_duckdb (mesmo achado/mesma razão).
        http_retries: "{{ env_var('DUCKDB_MCID_HTTP_RETRIES', '5') | int }}"
        http_retry_wait_ms: "{{ env_var('DUCKDB_MCID_HTTP_RETRY_WAIT_MS', '1000') | int }}"
        http_retry_backoff: "{{ env_var('DUCKDB_MCID_HTTP_RETRY_BACKOFF', '2') | int }}"
        # Default do DuckDB é 30s -- curto demais para os globs grandes deste
        # domínio sob esta rede (achado da mesma change: só subir os retries
        # não bastou, uma requisição de arquivo maior ainda estourava os 30s
        # antes de completar, repetidas vezes, até esgotar as tentativas).
        http_timeout: "{{ env_var('DUCKDB_MCID_HTTP_TIMEOUT_SECONDS', '60') | int }}"
        # MINIO_ENDPOINT é acessado por VPN (10.0.0.x) — suspeita de que o
        # túnel derruba conexões ociosas sem avisar, deixando uma conexão
        # keep-alive "morta" no pool que só falha ao ser reutilizada bem
        # depois. Desligar keep-alive força uma conexão nova por requisição —
        # mais caro por requisição, mas evita reusar socket morto num glob de
        # dezenas de arquivos.
        http_keep_alive: "{{ env_var('DUCKDB_MCID_HTTP_KEEP_ALIVE', 'false') }}"
