name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
    # Um schema por domínio, com a camada no prefixo do nome da tabela (bronze_*,
    # silver_*, gold_*). Como nome de model é único no projeto inteiro, o arquivo leva o
    # token do domínio (far_silver_cadastro_pj) e o `alias` do config define o nome no
    # banco (silver_cadastro_pj) — é o alias que segue o padrão, não o nome do model.
    # A bronze não é dbt: vive no mesmo schema, carregada pelo staging_para_bronze.py.
    empreendimento_far_dbt:
      +materialized: table
      +schema: empreendimento_far
      silver:
        +materialized: table
      gold:
        +materialized: table

    # Um schema só para o domínio, com a camada no prefixo do nome da tabela
    # (bronze_*, silver_*, gold_*). Batendo o olho no banco a listagem sai ordenada
    # por camada, e o Superset aponta para um schema único.
    # A bronze também vive aqui, carregada pelo scripts/staging_para_bronze.py
    # (família `empreendimento_rural` do bronze_familias.yml) — não é dbt.
    empreendimento_rural_dbt:
      +materialized: table
      +schema: empreendimento_rural
      silver:
        +materialized: table
      gold:
        +materialized: table

    entidades_dbt:
      +materialized: table
      +schema: empreendimentos_fds
      silver:
        +materialized: table
      gold:
        +materialized: table

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold
    
    conjuntura_continuo_dbt:
      +materialized: table
      +schema: conjuntura_continuo
      # Sem camada bronze: o parquet de staging já sai tipado (Etapa 02) e a
      # silver lê direto via pg_duckdb (read_parquet).
      silver:
        +materialized: table
        +schema: conjuntura_continuo_silver
      gold:
        +materialized: table
        +schema: conjuntura_continuo_mart

on-run-start:
  - '{{create_udfs()}}'
