      +materialized: table

      +meta:
        governance:
          product: reloginho
          owner_key: mcid_data_engineering
      bronze:
        +materialized: table
        +schema: bronze
        +meta:
          governance:
            product: reloginho
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
