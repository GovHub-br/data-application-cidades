name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
    # Três schemas para o projeto inteiro (bronze, prata, ouro), um por camada, com a
    # camada no prefixo do nome da tabela. A linha entra no nome a partir da prata
    # (prata_far_*, ouro_far_*); na bronze o nome é o do arquivo que veio da staging,
    # que já identifica a origem.
    # A bronze é dbt: cada model lê o parquet da staging direto por read_parquet
    # (pg_duckdb) e materializa como tabela text, sem script externo.
    far_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    # Mesma estrutura do far_dbt: bronze/prata/ouro em três schemas do projeto.
    fds_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    # Mesma estrutura do far_dbt e do fds_dbt: bronze/prata/ouro nos três schemas do
    # projeto. A bronze do rural passou a ser dbt (read_parquet via pg_duckdb) e não é
    # mais carregada pelo scripts/staging_para_bronze.py.
    rural_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold
    
    conjuntura_continuo_dbt:
      +materialized: table
      +schema: conjuntura_continuo
      # Sem camada bronze: o parquet de staging já sai tipado (Etapa 02) e a
      # silver lê direto via pg_duckdb (read_parquet).
      silver:
        +materialized: table
        +schema: conjuntura_continuo_silver
      gold:
        +materialized: table
        +schema: conjuntura_continuo_mart

on-run-start:
  - '{{create_udfs()}}'

# Registra em lake._dbt_log o que não passou — inclusive os testes que são
# `severity: warn` e por isso não derrubam a execução.
on-run-end:
  - '{{ registrar_execucao_dbt() }}'
