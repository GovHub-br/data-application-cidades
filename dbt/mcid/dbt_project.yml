name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

seeds:
  mcid:
    boletim_gabarito:
      +schema: conjuntura

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
      +meta:
        governance:
          product: metadata
          owner_key: mcid_data_engineering
          classification: restricted
          rag_publication: prohibited

    far_dbt:
      +materialized: table
      +meta:
        governance:
          product: empreendimento_far
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    fds_dbt:
      +materialized: table
      +meta:
        governance:
          product: entidades_fds
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: entidades_fds
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited

          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: entidades_fds
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: entidades_fds
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
