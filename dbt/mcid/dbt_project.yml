          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering
      # Piloto (OGU/FGTS): DESABILITADO. O modelo
      # `prata_dhist_serie_anual_ogu_fgts` carrega `config(enabled=false)` no
      # próprio arquivo — por isso não há bloco `piloto:` aqui.

# Os dois hooks sao SQL de Postgres: create_udfs() usa pg_advisory_xact_lock e
# CREATE FUNCTION, e registrar_execucao_dbt() cria lake._dbt_log com `id serial`
# / `timestamptz`. Nenhum dos dois existe no DuckDB, entao ficam atras do guard
# de target.type -- o eixo historico roda nos targets duckdb
# (staging_duckdb / prod_duckdb) e quebrava no hook, nao no modelo.
on-run-start:
  - "{% if target.type == 'postgres' %}{{ create_udfs() }}{% endif %}"

on-run-end:
  - "{% if target.type == 'postgres' %}{{ registrar_execucao_dbt() }}{% endif %}"
