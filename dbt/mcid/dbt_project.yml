name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Schema das UDFs (`corrigir_mojibake`, `parse_date_br`, `normalize_apf`).
# Fixo aqui, e não em `target.schema`: aquele vem de DB_DW_SCHEMA_MCID e pode
# diferir entre máquinas, o que espalharia as funções por schemas diferentes.
vars:
  schema_udfs: metadata

seeds:
  mcid:
    # Todo seed vai para `seeds`: não são ativos de consumo e ficariam fora de
    # convenção em `ouro`, onde todo nome começa por camada e domínio. No nível
    # do projeto, e não por seed, porque sem isto um seed novo cairia no schema
    # de fallback — ver `tests/sem_recurso_no_schema_de_fallback.sql`.
    +schema: seeds

    # Seeds do eixo histórico (mcmv_historico_dbt). Convenção: todas
    # materializam num schema único `seeds`, no catálogo `cidades`.
    conjuntura:
      +database: cidades
      +schema: seeds
      +quote_columns: false

    # Seeds curadas de identidade FDS, consumidas pela dim de empreendimento
    # (prata_fds_dim_empreendimento).
    entidades_fds:
      +database: cidades
      +schema: seeds
      +quote_columns: false

    # Seeds de referência dos testes de qualidade: domínios canônicos e
    # retrato de colunas por família.
    data_quality:
      +database: cidades
      +schema: seeds
      +quote_columns: false
      # chave_natural / faixa são texto — várias chaves são só dígitos e a
      # inferência as tornaria BIGINT, quebrando o join com a prata (varchar).
      quarentena_valores_financeiros:
        +column_types:
          fonte_familia: varchar
          chave_natural: varchar
          motivo: varchar
          evidencia: varchar
      faixa_valor_uh:
        +column_types:
          frente: varchar
          faixa: varchar
          valor_col: varchar
          piso: double
          teto: double
      campos_obrigatorios:
        +column_types:
          modelo: varchar
          coluna: varchar
          obrigatoria: boolean
          min_completude: double
          origem: varchar

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
      +meta:
        governance:
          product: metadata
          owner_key: mcid_data_engineering
          classification: restricted
          rag_publication: prohibited

    # empreendimento_far_dbt e empreendimento_fds_dbt removidos (2026-09-18,
    # change alinhar-far-fds-prod-para-merge-main): todo modelo desses pacotes
    # era duplicata, por nome, de um modelo já publicado em `origin/main` sob
    # `far_dbt`/`fds_dbt` (mesma convenção de nomes prod prata_far_*/ouro_far_*/
    # prata_fds_*/ouro_fds_*) — manter os dois quebraria o `dbt parse` após o
    # merge ("two resources with identical database representation"). O único
    # modelo órfão de `empreendimento_fds_dbt` (`bronze_fds_mudanca_fase_eventos`,
    # sem equivalente em prod/main) também foi apagado: sua única consumidora
    # (`prata_fds_historico_dim_empreendimento`) foi descontinuada em favor do
    # sucessor já publicado em `fds_dbt` (`prata_fds_dim_empreendimento`) — ver
    # `prata_fds_historico_empreendimento.sql`. `indicadores_mcmv_dbt`/
    # `mcmv_historico_dbt` continuam consumindo os nomes far/fds por `ref()`;
    # após o merge eles resolvem para os modelos de `far_dbt`/`fds_dbt`.

    indicadores_mcmv_dbt:

      +database: cidades

      +materialized: table

      +meta:
        governance:
          product: reloginho
          owner_key: mcid_data_engineering
      # bronze removido (2026-09-18, mesma change): os 2 modelos que aqui
      # existiam (bronze_dhist_snh_entregas_evento_bb/caixa) eram duplicatas
      # por nome dos mesmos modelos já publicados em `mcmv_historico_dbt/bronze`
      # (trazidos de `origin/main`) — apagados aqui.
      prata:
        +materialized: table
        +schema: prata
        +meta:
          governance:
            product: reloginho
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +materialized: table
        +schema: ouro
        +meta:
          governance:
            product: reloginho
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

