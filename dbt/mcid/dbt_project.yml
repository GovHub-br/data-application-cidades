name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
    # Sem pasta bronze/: a bronze é o schema `bronze` do Postgres, carregado pelo
    # scripts/staging_para_bronze.py a partir do data lake, e a silver tipa o texto de lá.
    empreendimento_far_dbt:
      +materialized: table
      +schema: empreendimento_far
      silver:
        +materialized: table
      gold:
        +materialized: table

    entidades_dbt:
      +materialized: table
      +schema: entidades_fds
      silver:
        +materialized: table
      gold:
        +materialized: table

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold
    
    conjuntura_continuo_dbt:
      +materialized: table
      +schema: conjuntura_continuo
      # Sem camada bronze: o parquet de staging já sai tipado (Etapa 02) e a
      # silver lê direto via pg_duckdb (read_parquet).
      silver:
        +materialized: table
        +schema: conjuntura_continuo_silver
      gold:
        +materialized: table
        +schema: conjuntura_continuo_mart

on-run-start:
  - '{{create_udfs()}}'
