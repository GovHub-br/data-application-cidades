name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Schema das UDFs (`corrigir_mojibake`, `parse_date_br`, `normalize_apf`).
# Fixo aqui, e não em `target.schema`: aquele vem de DB_DW_SCHEMA_MCID e pode
# diferir entre máquinas, o que espalharia as funções por schemas diferentes.
vars:
  schema_udfs: metadata

seeds:
  mcid:
    # Todo seed vai para `seeds`: não são ativos de consumo e ficariam fora de
    # convenção em `ouro`, onde todo nome começa por camada e domínio. No nível
    # do projeto, e não por seed, porque sem isto um seed novo cairia no schema
    # de fallback — ver `tests/sem_recurso_no_schema_de_fallback.sql`.
    +schema: seeds

    # Convenção: todas as seeds materializam num schema único `seeds`, no catálogo `cidades`.
    conjuntura:
      +database: cidades
      +schema: seeds
      +quote_columns: false

    # Seeds das perguntas do MCID (Rural, FNHIS Sub-50, Pró-Moradia): domínio dos códigos
    # do layout de obra do Rural e a matriz de cobertura pergunta × dado.
    perguntas_mcid:
      +database: cidades
      +schema: seeds
      +quote_columns: false
      dominio_rural_obra:
        +column_types:
          campo: varchar
          codigo: integer
          descricao: varchar
          estagio: varchar
      # Catálogo e anexos das portarias de seleção do Rural: tudo texto (CNPJ, IBGE e código do
      # empreendimento perdem o zero à esquerda se virarem número; o anexo começa vazio).
      portarias_selecao_rural:
        +column_types:
          portaria_codigo: varchar
          ato_selecao: varchar
          numero: varchar
          ano: varchar
          dt_portaria: varchar
          papel: varchar
          tem_lista_nominal: varchar
          fonte_lista: varchar
          observacao: varchar
          ciclo_selecao: varchar
      # Catálogos de portarias/atos do Sub-50 e do Pró-Moradia: tudo texto (a prata tipa).
      portarias_fnhis_sub50:
        +column_types: {portaria_codigo: varchar, ato: varchar, especie_ato: varchar, numero: varchar, ano: varchar, dt_portaria: varchar, papel: varchar, ciclo_selecao: varchar, tem_lista_nominal: varchar, fonte_lista: varchar, observacao: varchar}
      portarias_pro_moradia:
        +column_types: {portaria_codigo: varchar, ato: varchar, especie_ato: varchar, numero: varchar, ano: varchar, dt_portaria: varchar, papel: varchar, ciclo_selecao: varchar, tem_lista_nominal: varchar, fonte_lista: varchar, observacao: varchar}
      selecao_portarias_rural:
        +column_types:
          portaria_codigo: varchar
          uf: varchar
          municipio: varchar
          cod_ibge: varchar
          eo_cnpj: varchar
          eo_nome: varchar
          protocolo_proposta: varchar
          codigo_empreendimento: varchar
          quantidade_uh_selecionadas: varchar
          situacao_selecao: varchar
          observacao: varchar

    # Seeds curadas de identidade FDS, consumidas pela dim de empreendimento
    # (prata_fds_dim_empreendimento).
    entidades_fds:
      +database: cidades
      +schema: seeds
      +quote_columns: false

    # Situações de obra dos dados históricos que faltam no data_quality/dominio_status
    # (compartilhado com outros domínios, por isso não é alterado).
    dados_historicos:
      +database: cidades
      +schema: seeds
      +quote_columns: false

    # Seeds de referência dos testes de qualidade: domínios canônicos e
    # retrato de colunas por família.
    data_quality:
      +database: cidades
      +schema: seeds
      +quote_columns: false
      # chave_natural / faixa são texto — várias chaves são só dígitos e a
      # inferência as tornaria BIGINT, quebrando o join com a prata (varchar).
      quarentena_valores_financeiros:
        +column_types:
          fonte_familia: varchar
          chave_natural: varchar
          motivo: varchar
          evidencia: varchar
      faixa_valor_uh:
        +column_types:
          frente: varchar
          faixa: varchar
          valor_col: varchar
          piso: double
          teto: double
      campos_obrigatorios:
        +column_types:
          modelo: varchar
          coluna: varchar
          obrigatoria: boolean
          min_completude: double
          origem: varchar

    # Seeds do Trabalho Social (trabalho_social_dbt): domínio de situação CAIXA × BB, réguas de
    # marcos das Portarias 464/2018 e 75/2025, catálogo de vigência das portarias, tipo de demanda e UF. Tudo texto: a bronze é cópia fiel
    # e a tipagem é da prata.
    trabalho_social:
      +database: cidades
      +schema: seeds
      +quote_columns: false
      +column_types:
        co_tipo_demanda: varchar
        ordem: varchar
        pc_obra_gatilho: varchar
        prazo_dias: varchar
        ic_ativo: varchar
        ic_critico: varchar
        ic_equivalencia_a_confirmar: varchar
        numero: varchar
        ano: varchar
        dt_assinatura: varchar
        dt_publicacao_dou: varchar
        dt_inicio_vigencia: varchar
        dt_fim_vigencia: varchar
        ic_marcos_transcritos: varchar
        cod_ibge: varchar
        latitude: varchar
        longitude: varchar

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
      +meta:
        governance:
          product: metadata
          owner_key: mcid_data_engineering
          classification: restricted
          rag_publication: prohibited

    # Dados históricos reconstruídos pela dados_historicos_dag (cleansed por família em
    # snh/staging/historico_mcmv/cleansed/). O SQL é do DuckDB e roda no pg_duckdb, dentro do
    # envelope duckdb_query().
    dados_historicos_dbt:
      +database: cidades
      +materialized: table
      +meta:
        governance:
          product: dados_historicos
          owner_key: mcid_data_engineering

      bronze:
        +schema: bronze
        +meta:
          governance:
            layer: bronze
            classification: restricted
            rag_publication: prohibited

      prata:
        +schema: prata
        +meta:
          governance:
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation

    far_dbt:
      +materialized: table
      +meta:
        governance:
          product: empreendimento_far
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    fds_dbt:
      +materialized: table
      +meta:
        governance:
          product: entidades_fds
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: entidades_fds
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited

          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: entidades_fds
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: entidades_fds
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    rural_dbt:
      +materialized: table
      +meta:
        governance:
          product: empreendimento_rural
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: empreendimento_rural
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: empreendimento_rural
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: empreendimento_rural
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    # Pró-Moradia: programa do FGTS para o SETOR PÚBLICO (estados, DF, municípios e suas
    # companhias de habitação). Não é linha do MCMV. A fonte é o Canal FGTS, que traz todos
    # os programas do fundo: a prata recorta o Pró-Moradia pela linha `26`.
    pro_moradia_dbt:
      +materialized: table
      +meta:
        governance:
          product: pro_moradia
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: pro_moradia
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: pro_moradia
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: pro_moradia
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    # FNHIS Sub-50: linha do Novo MCMV para municípios com menos de 50 mil habitantes, com
    # recurso do FNHIS/OGU repassado por termo de compromisso. Três fontes: a seleção de
    # propostas, o painel do TransfereGov e o acompanhamento da SNH (a mesma bronze do Rural).
    fnhis_dbt:
      +materialized: table
      +meta:
        governance:
          product: fnhis_sub50
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: fnhis_sub50
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: fnhis_sub50
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: fnhis_sub50
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    conjuntura_dbt:
      +materialized: table
      +meta:
        governance:
          product: conjuntura
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: conjuntura
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: conjuntura
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: conjuntura
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering
      qualidade:
        +schema: ouro
        +meta:
          governance:
            product: conjuntura
            owner_key: mcid_data_engineering
            layer: quality
            classification: restricted
            rag_publication: prohibited


    reforma_casa_brasil_dbt:
      +materialized: table
      +meta:
        governance:
          product: reforma_casa_brasil
          owner_key: mcid_data_engineering
        # Uma task da Reforma por vez no Airflow (pool de 1 slot, infra/airflow/bootstrap/
        # pools.json). O DuckDB do pg_duckdb tem um limite de memória POR CONEXÃO
        # (duckdb.max_memory), e as bronzes e pratas do CadÚnico (a de famílias tem 9,3 M
        # linhas) são o maior volume do projeto. O resto do grupo segue em paralelo.
        cosmos:
          operator_kwargs:
            pool: pg_duckdb
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: reforma_casa_brasil
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            contains_personal_data: true
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: reforma_casa_brasil
            owner_key: mcid_data_engineering
            layer: silver
            classification: restricted
            contains_pseudonymized_data: true
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: reforma_casa_brasil
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            aggregation_only: true
            small_cell_threshold: 10
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    linha_financiada_dbt:
      +materialized: table
      +meta:
        governance:
          product: linha_financiada
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: linha_financiada
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        # Materializa dentro do motor DuckDB instalado no PostgreSQL para
        # evitar spill local e cópia de dados pelo cliente.
        +pre-hook:
          - "{% if target.type == 'postgres' %}SET LOCAL duckdb.force_execution = true{% endif %}"
        +meta:
          governance:
            product: linha_financiada
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +pre-hook:
          - "{% if target.type == 'postgres' %}SET LOCAL duckdb.force_execution = true{% endif %}"
        +meta:
          governance:
            product: linha_financiada
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            aggregation_only: false
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    # Trabalho Social do MCMV (FAR, Entidades e Rural, CAIXA e BB): acompanhamento por contrato,
    # marcos das Portarias MCID 464/2018 e 75/2025, demanda e executor. Nomes: bronze_<fonte>_<nome
    # do MinIO>, prata_ts_<tabela>, ouro_ts_<tabela>. As bronzes do lake (tag ts_lake) entram no
    # seletor dominios_postgres e rodam no target prod (Postgres + pg_duckdb), como o resto; por
    # isso a macro bnz_ts_staging manda o corpo para o DuckDB com duckdb.query nesse target.
    trabalho_social_dbt:
      +materialized: table
      +meta:
        governance:
          product: trabalho_social
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: trabalho_social
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: trabalho_social
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: trabalho_social
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

# Os dois hooks sao SQL de Postgres: create_udfs() usa pg_advisory_xact_lock e
# CREATE FUNCTION, e registrar_execucao_dbt() cria lake._dbt_log com `id serial`
# / `timestamptz`. Nenhum dos dois existe no DuckDB, entao ficam atras do guard
# de target.type -- no target local staging_duckdb o projeto quebrava no hook, nao no
# modelo.
on-run-start:
  - "{% if target.type == 'postgres' %}{{ create_udfs() }}{% endif %}"

on-run-end:
  - "{% if target.type == 'postgres' %}{{ registrar_execucao_dbt() }}{% endif %}"
