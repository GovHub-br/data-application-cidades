name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  mcid:
    +database: "{{ 'cidades' if target.type == 'postgres' else 'mcid_staging' }}"
    metadata:
      +materialized: incremental
      +schema: metadata
    empreendimento_far_dbt:
      # Convenção 2026-09-04: schema por frente (bronze único em
      # dados_historicos; silver/gold compartilham o schema empreendimento_far
      # já usado pelos colegas — tabelas identificadas pelo prefixo
      # silver_atual_/gold_atual_). Roda sempre no prod (sem gate de target);
      # o mecanismo de leitura da staging (script staging_para_bronze.py em vez
      # de read_minio_staging_parquet_series) é a etapa seguinte, ainda não
      # implementada.
      +materialized: table
      +meta:
        governance:
          product: empreendimento_far
          owner_key: mcid_data_engineering

      bronze:
        +materialized: table
        +schema: dados_historicos
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering

      silver:
        +materialized: table
        +schema: empreendimento_far
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering

      gold:
        +materialized: table
        +schema: empreendimento_far
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    empreendimento_fds_dbt:
      # Convenção 2026-09-04 — ver empreendimento_far_dbt. Schema silver/gold
      # compartilhado com os colegas é empreendimentos_fds (plural — mesmo
      # nome que eles usam em prod).
      +materialized: table
      +meta:
        governance:
          product: empreendimento_fds
          owner_key: mcid_data_engineering

      bronze:
        +materialized: table
        +schema: dados_historicos
        +meta:
          governance:
            product: empreendimento_fds
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering

      silver:
        +materialized: table
        +schema: empreendimentos_fds
        +meta:
          governance:
            product: empreendimento_fds
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering

      gold:
        +materialized: table
        +schema: empreendimentos_fds
        +meta:
          governance:
            product: empreendimento_fds
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    empreendimento_rural_dbt:
      # Convenção 2026-09-04 — ver empreendimento_far_dbt.
      +materialized: table
      +meta:
        governance:
          product: empreendimento_rural
          owner_key: mcid_data_engineering

      bronze:
        +materialized: table
        +schema: dados_historicos
        +meta:
          governance:
            product: empreendimento_rural
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering

      silver:
        +materialized: table
        +schema: empreendimento_rural
        +meta:
          governance:
            product: empreendimento_rural
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering

      # Sem gold própria hoje: os 2 modelos redundantes com o gold já
      # entregue pelos colegas (gold_rural_ficha_empreendimento,
      # gold_rural_panorama) foram aposentados na convenção 2026-09-04 —
      # nenhum consumidor os referenciava (diferente do far/fds, onde 2
      # golds alimentam o gargalo).

    indicadores_mcmv_dbt:
      # Convenção 2026-09-04: reloginho não é uma frente — é um domínio
      # analítico próprio (indicadores de velocidade/gargalo). Silver e gold
      # (reloginho + gargalo) ficam no schema novo "reloginho".
      +materialized: table
      +schema: reloginho
      bronze:
        +materialized: table
        +schema: dados_historicos
      silver:
        +materialized: table
        +schema: reloginho
      gold:
        +materialized: table
        +schema: reloginho

    mcmv_silver_dbt:
      # Convenção 2026-09-04: cada frente (inclusive as sem schema de colega)
      # ganha schema próprio; tabela silver_historico_base em cada uma (via
      # alias, já que o nome do arquivo segue frente-qualificado por exigência
      # de unicidade do dbt). "core" (union de todas as frentes) foi aposentado
      # — quem precisar do consolidado une os schemas na hora.
      +materialized: table
      silver:
        +materialized: table
        far:
          +schema: empreendimento_far
        rural:
          +schema: empreendimento_rural
        entidades:
          +schema: empreendimentos_fds
        conjuntura:
          +schema: conjuntura
        classe_media:
          +schema: classe_media
        reforma:
          +schema: reforma
        cidades:
          +schema: cidades
        sub50:
          +schema: sub50
        pro_moradia:
          +schema: pro_moradia
        minha_casa_minha_vida:
          +schema: minha_casa_minha_vida

    mcmv_historico_dbt:
      # Convenção 2026-09-04: bronze e o carrier bruto pré-split (ainda sem
      # frente) ficam em dados_historicos; os 3 silvers já divididos por
      # frente (far/fds/rural) usam alias para materializar como
      # silver_historico_empreendimento no schema de cada frente; os golds
      # (cross-frente) ganham o schema novo "serie_historica"; o piloto
      # FGTS/OGU (agregado macro anual, não é frente de empreendimento) usa
      # o schema conjuntura.
      +materialized: table
      +meta:
        governance:
          product: mcmv_historico
          owner_key: mcid_data_engineering

      bronze:
        +materialized: table
        +schema: dados_historicos
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering

      silver:
        +materialized: table
        +schema: dados_historicos
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering

      gold:
        +materialized: table
        +schema: serie_historica
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

      # Piloto #118: série anual OGU/FGTS a partir de seed — agregado macro
      # nacional, não é frente de empreendimento; materializa em conjuntura.
      piloto:
        +materialized: table
        +schema: conjuntura
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering

    entidades_dbt:
      +materialized: table
      +schema: entidades_fds
      silver:
        +materialized: table
      gold:
        +materialized: table

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold

    conjuntura_continuo_dbt:
      +materialized: table
      +schema: conjuntura_continuo
      # Sem camada bronze: o parquet de staging já sai tipado (Etapa 02) e a
      # silver lê direto via pg_duckdb (read_parquet).
      silver:
        +materialized: table
        +schema: conjuntura_continuo_silver
      gold:
        +materialized: table
        +schema: conjuntura_continuo_mart

on-run-start:
  - "{% if target.type == 'postgres' %}{{ create_udfs() }}{% endif %}"

seeds:
  mcid:
    mcmv_historico:
      +schema: mcmv_historico
      +quote_columns: false
    entidades_fds:
      +schema: entidades_fds
      +quote_columns: false
