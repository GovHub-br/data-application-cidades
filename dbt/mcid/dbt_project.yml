    mcmv_historico_dbt:

      +database: cidades

      # O piloto FGTS/OGU está desabilitado nesta branch (config(enabled=false)
      # no próprio arquivo) — sem bloco `piloto:` aqui.
      +materialized: table
      +meta:
        governance:
          product: mcmv_historico
          owner_key: mcid_data_engineering

      bronze:
        +materialized: table
        +schema: bronze
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering

      prata:
        +materialized: table
        +schema: prata
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: prata
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering

      ouro:
        +materialized: table
        +schema: ouro
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: ouro
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

      # Piloto (OGU/FGTS): DESABILITADO nesta branch.
      # O modelo foi renomeado
      # para o nome-alvo `prata_dhist_serie_anual_ogu_fgts` e carrega
      # `config(enabled=false)` no próprio arquivo — não há bloco `piloto:`
      # aqui. Retomada do desenvolvimento numa change futura.

    entidades_dbt:
      +materialized: table
      +schema: entidades_fds
      silver:
        +materialized: table
      gold:
        +materialized: table

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold

    conjuntura_continuo_dbt:
      +materialized: table
      +schema: conjuntura_continuo
      # Sem camada bronze: o parquet de staging já sai tipado (Etapa 02) e a
      # silver lê direto via pg_duckdb (read_parquet).
      silver:
        +materialized: table
        +schema: conjuntura_continuo_silver
      gold:
        +materialized: table
        +schema: conjuntura_continuo_mart

on-run-start:
  - "{% if target.type == 'postgres' %}{{ create_udfs() }}{% endif %}"

seeds:
  mcid:
    # Convenção: as seeds
    # necessárias aos braços histórico (mcmv_historico_dbt) e reloginho/gargalo
    # (indicadores_mcmv_dbt) materializam num schema único `seeds` — não mais em
    # `data_quality` nem `conjuntura`. Seeds de outras frentes (entidades_fds)
    # permanecem onde estão.
    # Piloto (série anual OGU/FGTS): agregado macro nacional, não é frente.
    # O piloto OGU/FGTS segue desabilitado nesta branch; este seed agora
    # materializa em `seeds` junto das demais seeds do eixo. CSV em
    # seeds/conjuntura/.
    conjuntura:
      +schema: seeds
      +quote_columns: false
    entidades_fds:
      +schema: entidades_fds
      +quote_columns: false
    # Seeds de referência dos testes de qualidade:
    # domínios canônicos e retrato de colunas por
    # família. Materializam em `seeds`.
    # `cidades` explícito porque
    # o eixo histórico exige o catálogo `cidades` como invariante.
    data_quality:
      +database: cidades
      +schema: seeds
      +quote_columns: false
      # chave_natural / faixa são texto — várias chaves são só dígitos e a
      # inferência as tornaria BIGINT, quebrando o join com a silver (varchar).
      quarentena_valores_financeiros:
        +column_types:
          fonte_familia: varchar
          chave_natural: varchar
          motivo: varchar
          evidencia: varchar
      faixa_valor_uh:
        +column_types:
          frente: varchar
          faixa: varchar
          valor_col: varchar
          piso: double
          teto: double
      campos_obrigatorios:
        +column_types:
          modelo: varchar
          coluna: varchar
          obrigatoria: boolean
          min_completude: double
          origem: varchar
