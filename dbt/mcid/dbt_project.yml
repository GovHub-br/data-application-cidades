name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

seeds:
  mcid:
    # O gabarito do boletim é insumo de teste, mas mora junto do produto: com o
    # schema unificado, tudo do conjuntura vive em `conjuntura`. Sem isto o seed
    # cai no schema do profile e o teste do gabarito quebra procurando por ele.
    boletim_gabarito:
      +schema: conjuntura

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
      +meta:
        governance:
          product: metadata
          owner_key: mcid_data_engineering
          classification: restricted
          rag_publication: prohibited

    far_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    fds_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    rural_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    # `layer` continua dizendo silver/gold enquanto as pastas dizem prata/ouro:
    # é por esse rótulo que dbt/mcid/governance/dominios.yml indexa certificação,
    # permissão de uso e etiqueta. Renomeá-lo é mexer na camada de governança.
    conjuntura_dbt:
      +materialized: table
      +meta:
        governance:
          product: conjuntura
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: conjuntura
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          #: lido pelo conector dbt do OpenMetadata
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: conjuntura
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          #: lido pelo conector dbt do OpenMetadata
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: conjuntura
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          #: lido pelo conector dbt do OpenMetadata
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering
      # Medições sobre o próprio acervo, não sobre o fenômeno habitacional.
      # Materializam na ouro porque o Superset as lê, mas `layer: quality` as
      # separa na governança — não são entrega do produto.
      qualidade:
        +schema: ouro
        +meta:
          governance:
            product: conjuntura
            owner_key: mcid_data_engineering
            layer: quality
            classification: restricted
            rag_publication: prohibited

on-run-start:
  - '{{create_udfs()}}'

# Registra em lake._dbt_log o que não passou — inclusive os testes que são
# `severity: warn` e por isso não derrubam a execução.
on-run-end:
  - '{{ registrar_execucao_dbt() }}'
