name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

seeds:
  mcid:
    boletim_gabarito:
      +schema: conjuntura

    # Seeds do eixo histórico (mcmv_historico_dbt). Convenção: todas
    # materializam num schema único `seeds`, no catálogo `cidades`.
    conjuntura:
      +database: cidades
      +schema: seeds
      +quote_columns: false

    # Seeds curadas de identidade FDS, consumidas pela dim de empreendimento
    # (prata_fds_dim_empreendimento).
    entidades_fds:
      +database: cidades
      +schema: seeds
      +quote_columns: false

    # Seeds de referência dos testes de qualidade: domínios canônicos e
    # retrato de colunas por família.
    data_quality:
      +database: cidades
      +schema: seeds
      +quote_columns: false
      # chave_natural / faixa são texto — várias chaves são só dígitos e a
      # inferência as tornaria BIGINT, quebrando o join com a prata (varchar).
      quarentena_valores_financeiros:
        +column_types:
          fonte_familia: varchar
          chave_natural: varchar
          motivo: varchar
          evidencia: varchar
      faixa_valor_uh:
        +column_types:
          frente: varchar
          faixa: varchar
          valor_col: varchar
          piso: double
          teto: double
      campos_obrigatorios:
        +column_types:
          modelo: varchar
          coluna: varchar
          obrigatoria: boolean
          min_completude: double
          origem: varchar

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
      +meta:
        governance:
          product: metadata
          owner_key: mcid_data_engineering
          classification: restricted
          rag_publication: prohibited

    far_dbt:
      +materialized: table
      +meta:
        governance:
          product: empreendimento_far
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering
      prata:
        +schema: prata
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering
      ouro:
        +schema: ouro
        +meta:
          governance:
            product: empreendimento_far
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

    fds_dbt:
      +materialized: table
      +meta:
        governance:
          product: entidades_fds
          owner_key: mcid_data_engineering
      bronze:
        +schema: bronze
