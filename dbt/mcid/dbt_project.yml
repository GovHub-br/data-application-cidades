name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata

    far_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    fds_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    rural_dbt:
      +materialized: table
      bronze:
        +schema: bronze
      prata:
        +schema: prata
      ouro:
        +schema: ouro

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold
    
    conjuntura_continuo_dbt:
      +materialized: table
      +schema: conjuntura_continuo
      # Sem camada bronze: o parquet de staging já sai tipado (Etapa 02) e a
      # silver lê direto via pg_duckdb (read_parquet).
      silver:
        +materialized: table
        +schema: conjuntura_continuo_silver
      gold:
        +materialized: table
        +schema: conjuntura_continuo_mart

on-run-start:
  - '{{create_udfs()}}'

# Registra em lake._dbt_log o que não passou — inclusive os testes que são
# `severity: warn` e por isso não derrubam a execução.
on-run-end:
  - '{{ registrar_execucao_dbt() }}'
