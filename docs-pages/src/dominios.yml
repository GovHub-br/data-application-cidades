dominios:
  - slug: conjuntura
    rotulo: Conjuntura
    subtitulo: O ambiente econômico em que a política habitacional opera
    contexto: |
      Política habitacional não se planeja no vácuo: crédito, emprego, custo de
      obra e preço de imóvel mudam o que é possível fazer e a que custo. Esses
      indicadores existem, mas espalhados por associações setoriais, bancos e
      institutos de pesquisa — cada um com seu formato, sua periodicidade e seu
      site.

      O Boletim de Conjuntura, publicado trimestralmente, costura mais de trinta
      desses indicadores numa narrativa integrada sobre o mercado habitacional.
      Hoje essa coleta é inteiramente manual, o que faz do boletim um produto de
      custo de produção alto para o volume de informação que entrega.
    o_que_faz: |
      A ingestão busca cada indicador na fonte original — planilha, API ou página
      web —, a camada silver padroniza períodos e unidades e a gold entrega as
      séries prontas para o painel, todas na mesma chave de tempo. É isso que
      permite cruzar crédito, emprego e preço na mesma tela, e o que substitui a
      coleta manual que hoje sustenta o boletim.
    citacao:
      texto: |
        A coleta dos mais de trinta indicadores do Boletim de Conjuntura é feita
        de forma artesanal, por uma única servidora.
      autoria: Diagnóstico do projeto, primeiro semestre de 2026
    perguntas:
      - Como está o crédito imobiliário e a poupança que o financia?
      - O custo da construção sobe mais rápido que o preço de venda?
      - O emprego na construção civil acompanha o volume de lançamentos?
      - O investimento do programa se correlaciona com o PIB regional?
    sistemas: [ABECIP, BACEN, FGV, FIPE, IBGE, InfoMoney, Novo CAGED, CBIC, MRV]
    chaves:
      [
        conjuntura,
        abecip,
        bacen,
        fgv,
        fipe,
        fipezap,
        ibge,
        infomoney,
        caged,
        cbic,
        incc,
        icst,
        poupanca,
        poupança,
        mrv,
        imobiliario,
        imobiliário,
        balancos,
        lancamentos,
      ]

  - slug: empreendimento_far
    rotulo: Empreendimento FAR
    subtitulo: A maior linha do MCMV subsidiado, obra a obra
    contexto: |
      O Fundo de Arrendamento Residencial é a modalidade dominante do MCMV
      subsidiado. Atende famílias urbanas das Faixas 1 e 2, tem a Caixa como
      agente operador exclusivo e é curado pelo Departamento de Produção
      Habitacional. Aqui o Estado assume o risco integral de crédito: a família
      recebe a moradia sem contrair dívida de mercado.

      O monitoramento da execução é o ponto crítico sob a perspectiva dos dados.
      O relatório de obras iniciadas chega semanalmente por e-mail; a execução
      física e financeira por empreendimento chega mensalmente pelo SFTP, com
      atraso de um a dois meses. Em situações de emergência, como as enchentes do
      Rio Grande do Sul, planilhas chegaram por WhatsApp. O efeito é a
      desconfiança: gasta-se tempo conferindo o dado antes de usá-lo, enquanto as
      demandas de instâncias superiores exigem resposta no mesmo dia.
    o_que_faz: |
      As tabelas bronze recebem os arquivos como vieram; a silver reconstrói o
      empreendimento como entidade única, com sua evolução financeira ao longo do
      tempo; a gold entrega a ficha do empreendimento, o panorama por estado, o
      mapa nacional e os gráficos de execução física e financeira. É o material
      que permite comparar medição física e desembolso — a discrepância que
      indica se uma obra travou de fato ou se é falha de leitura do sistema.
    citacao:
      texto: |
        A dor principal é a confiança no dado. Como dependemos das informações
        que a Caixa envia, as pessoas têm receio de usar o dado sem confirmar
        antes, o que gasta muito tempo.
      autoria: Equipe do FAR, reunião de diagnóstico
    perguntas:
      - Em que pé está cada empreendimento, física e financeiramente?
      - Onde a execução da obra descolou do desembolso?
      - Como os recursos se distribuem entre os estados?
      - A contratação está indo para onde o déficit é maior?
    sistemas: [Caixa Econômica Federal, SFTP, Dados Prioritários]
    # 'mcmv' fica fora: as duas linhas sao MCMV, e a chave casaria as duas.
    chaves: [far, empreendimento, obra, panorama, mapa nacional, sftp]

  - slug: entidades
    rotulo: Entidades
    subtitulo: Produção habitacional conduzida por quem mora
    contexto: |
      Na modalidade Entidades, financiada pelo Fundo de Desenvolvimento Social, a
      produção é conduzida por cooperativas habitacionais, associações de
      moradores, sindicatos e movimentos de moradia. Atende exclusivamente a
      Faixa 1, e a seleção das famílias obedece a critérios de vulnerabilidade
      verificados por cruzamento com o Cadastro Único.

      É a modalidade de menor escala e maior complexidade social — e tem um vetor
      de risco que não existe nas outras. O Trabalho Social é obrigatório: começa
      antes da obra, percorre a execução e se estende à pós-ocupação. O relatório
      de acompanhamento é condição para a liberação de parcelas, e sua ausência
      paralisa o repasse financeiro. Acompanhar o trabalho social, portanto, é
      acompanhar risco de paralisação.
    o_que_faz: |
      O pipeline replica a estrutura do FAR sobre as tabelas do FDS — cadastro,
      obra mensal, financeiro mensal, trabalho social e entregas prioritárias — e
      entrega na gold o panorama por entidade, a ficha do empreendimento e a
      evolução financeira. A tabela de trabalho social é única neste ecossistema:
      nenhuma outra linha do programa tem equivalente.
    perguntas:
      - Que entidades conduzem empreendimentos, e com que desempenho?
      - Onde há risco de paralisação por relatório de trabalho social pendente?
      - Como evolui o financeiro de cada obra do FDS?
    sistemas: [Caixa Econômica Federal, SFTP, Cadastro Único]
    chaves: [entidades, fds, trabalho social, mcmv entidades, sftp]

# Números de escala do programa: NÃO publicados até a equipe conciliar.
# O relatório técnico traz três valores incompatíveis para o total de UH
# contratadas (1,69 milhão no abstract, 1,698 milhão na seção 2.6.2 e "mais de
# dois milhões" na seção 1.1), e marca o total do FAR como pendente de
# conferência. Os percentuais por linha usam o subsidiado como denominador, mas
# o texto os apresenta como percentual do programa inteiro.
# Depois de conciliados, mover para o bloco `programa` e exibir com data-base.
numeros_a_confirmar:
  - metrica: UH contratadas no programa
    valores_no_relatorio: ["1,69 milhão", "1,698 milhão", "mais de 2 milhões"]
  - metrica: UH contratadas no FAR
    valores_no_relatorio: ["1.352 mil"]
    observacao: marcado pela própria equipe como pendente de conferência
  - metrica: Recursos comprometidos
    valores_no_relatorio: ["R$ 110 bilhões"]
    observacao: consistente em dois pontos do relatório, mas sem data-base
