# Curadoria do escopo e dos domínios de dados do Ministério das Cidades.
#
# Este é o arquivo mantido à mão. Números, modelos, fontes e entregas são
# resolvidos pelo build a partir do acervo — aqui fica só o que o código não
# sabe dizer: o recorte do escopo e o que cada domínio significa.
#
# O repositório também hospeda os projetos dbt `ipea` e `mir`, de outras
# aplicações. O bloco `escopo` abaixo é o que mantém o site restrito ao MCID:
# tudo que não estiver nele fica fora das contagens e das páginas.
#
# FONTE DO CONTEXTO: relatório técnico "MCMV — acompanhamento da política pelo
# dado" (Lab Livre/FCTE-UnB e SNH), somado à evidência do próprio repositório.
#
# REVISAR ANTES DE PUBLICAR:
#  1. As citações estão atribuídas por cargo, não por nome. Publicar o nome de
#     uma servidora num site público exige o consentimento dela.
#  2. Os números de escala do programa (UH contratadas, R$ investidos) estão
#     comentados de propósito — ver `numeros_a_confirmar` no fim do arquivo.

escopo:
  rotulo: Ministério das Cidades
  sigla: MCID
  projetos_dbt: [mcid]
  grupos_dag:
    - data_ingest/abecip
    - data_ingest/bacen
    - data_ingest/fgv
    - data_ingest/fipe
    - data_ingest/ibge
    - data_ingest/infomoney
    - data_ingest/mrv
    - data_ingest/tesouro_gerencial/mcid
    - dbt/mcid
  # Ingestões que não são DAG: rodam como script sobre o SFTP do agente operador
  # e alimentam o schema `raw`, de onde saem FAR e Entidades.
  ingestoes_script:
    - rotulo: SFTP da Caixa Econômica Federal
      arquivos:
        - scripts/sftp_ingest.py
        - scripts/sftp_snapshot.py
        - scripts/sftp_minio_diff.py
        - scripts/sftp_rename_tables.py
      descricao: |
        Espinha dorsal do fluxo de dados do MCMV subsidiado. O acesso direto ao
        SFTP foi conquistado em 2026 — antes disso a equipe trabalhava sobre um
        dump estático do banco do Ministério. Os scripts fazem a carga, o
        snapshot que detecta o que mudou entre períodos e a conferência contra o
        MinIO.

# Contexto do programa que a plataforma acompanha. Alimenta a capa e a vitrine.
#
# REGRA DESTE BLOCO: nada aqui pode ser afirmação nossa. Todo texto vem do
# relatório técnico do projeto, e cada bloco declara a seção de origem no campo
# `fonte`, exibida na própria página. Se uma informação não está no relatório,
# ela não entra — nem como frase de ligação.
programa:
  nome: Minha Casa, Minha Vida
  sigla: MCMV
  marco_legal: Lei nº 14.620/2023
  documento:
    titulo: MCMV — acompanhamento da política pelo dado
    autoria: Lab Livre/FCTE-UnB e Secretaria Nacional de Habitação
  papel:
    texto: |
      O déficit habitacional brasileiro é estrutural, persistente e
      profundamente desigual. Segundo estimativas da Fundação João Pinheiro,
      calculadas a partir dos microdados da PNAD Contínua e do Censo Demográfico
      do IBGE, o déficit acumulado supera oito milhões de moradias, concentradas
      majoritariamente nas faixas de menor renda — famílias que não possuem
      capacidade de financiamento pelo mercado privado. É nesse contexto que o
      Minha Casa, Minha Vida se constitui como o principal instrumento
      operacional da política habitacional do governo federal brasileiro.
    fonte: Seção 1.1
  resumo:
    texto: |
      Criado originalmente em 2009 pela Lei nº 11.977, em resposta à crise
      econômica global, o programa foi reestruturado e relançado em 2023 sob a
      Lei nº 14.620. Atende famílias em áreas urbanas com renda bruta familiar
      mensal de até R$ 8.000,00 e famílias em áreas rurais com renda bruta anual
      de até R$ 96.000,00, organizadas em três faixas de renda progressivas.
    fonte: Seção 1.1
  gov_hub:
    texto: |
      O Gov Hub é uma plataforma de código aberto voltada à integração,
      qualificação e disponibilização de dados governamentais, desenvolvida pelo
      Laboratório de Competências em Software Livre (Lab Livre) da Faculdade de
      Ciências e Tecnologias em Engenharia (FCTE) da Universidade de Brasília,
      em parceria com o Instituto de Pesquisa Econômica Aplicada (IPEA).
    fonte: Seção 1.1
  parceria:
    texto: |
      Esta aplicação é uma iniciativa conjunta entre a Universidade de Brasília
      (Lab Livre/FCTE) e a Secretaria Nacional de Habitação, no âmbito do
      TED nº 02/2025.
    fonte: Abstract
  problema:
    fonte: Seção 1.1 — dimensões identificadas nas reuniões de diagnóstico com
      as equipes do Ministério ao longo do primeiro semestre de 2026
    itens:
      - titulo: Processamento artesanal e sobrecarga operacional
        texto: |
          A equipe consome tempo substantivo baixando planilhas de portais,
          recebendo dados por e-mail e WhatsApp, e tratando arquivos Excel
          manualmente. A coleta de mais de 30 indicadores para o Boletim de
          Conjuntura é feita de forma artesanal por uma única servidora.
      - titulo: Falta de padronização nas fontes
        texto: |
          Os layouts dos arquivos enviados pela Caixa mudam com frequência —
          colunas trocam de nome ou de formato —, quebrando rotinas e exigindo
          limpeza constante. O mesmo empreendimento pode aparecer com
          identificadores diferentes quando muda de status.
      - titulo: Isolamento tecnológico e defasagem temporal
        texto: |
          Os dados de habitação não estão nos sistemas estruturantes
          tradicionais do governo federal, mas numa camada adicional gerida em
          parceria com a Caixa. A defasagem chega a dois meses no caso do Rural.
      - titulo: Rigidez de acesso e conformidade com a LGPD
        texto: |
          O Ministério atua como custodiante dos arquivos fechados enviados pela
          Caixa. Dados com CPF e informações pessoais dos beneficiários exigem
          anonimização antes de qualquer processamento fora da infraestrutura do
          Ministério.
  perguntas:
    fonte: Seção 1.1 — questões analíticas centrais do projeto
    itens:
      - Eficiência da inovação — a construção industrializada (off-site) é realmente mais rápida e mais barata do que a alvenaria convencional no âmbito do MCMV?
      - Gargalos de execução — onde o fluxo de produção está travando? A disparidade entre a medição física e o desembolso financeiro indica uma paralisação real ou uma falha de leitura do sistema?
      - Impacto macroeconômico — qual é a correlação entre os investimentos do programa habitacional e os indicadores de emprego (CAGED), renda, produção industrial e PIB regional?
      - Alocação estratégica — a distribuição do orçamento e a contratação de novas obras estão focadas nas regiões com o maior déficit habitacional?
      - Equidade e alcance social — o programa está efetivamente contemplando os grupos mais vulneráveis, conforme mandatado pela Lei nº 14.620/2023 e pela Portaria nº 738/2024?
  arquitetura:
    texto: |
      A arquitetura segue o padrão Medallion, que organiza os dados em três
      camadas progressivas de qualidade e abstração — Bronze, Prata e Ouro. A
      orquestração dos pipelines é gerenciada pelo Apache Airflow; as
      transformações, pelo dbt; e a visualização, pelo Apache Superset.

      A escolha não é apenas técnica: é também uma resposta às restrições de
      segurança e conformidade com a LGPD. Dados com informações pessoais de
      beneficiários permanecem na infraestrutura do Ministério nas camadas
      Bronze e Prata. Somente dados anonimizados ou agregados transitam para a
      infraestrutura do Lab Livre.
    fonte: Seção 4
  produtos:
    fonte: Seção 5 — produtos previstos, em estágios distintos de implementação
    itens:
      - titulo: Dados operacionais para as equipes
        texto: |
          O produto mais imediato é disponibilizar, às equipes de cada linha,
          dados limpos, atualizados e confiáveis em substituição às planilhas
          manuais. Representa a diferença entre verificar o dado antes de usar e
          confiar no dado para focar na análise.
      - titulo: Dashboards e painéis de monitoramento
        texto: |
          Painel geral do programa, painéis por linha e painel de conjuntura,
          com acompanhamento por empreendimento, execução física ante desembolso
          financeiro e alertas de obras críticas.
      - titulo: Relatórios e Boletim de Conjuntura
        texto: |
          Automação da coleta dos indicadores externos, geração de rascunho do
          boletim a partir de templates com valores atualizados, e alertas quando
          algum indicador variar acima do esperado.
      - titulo: Consulta em linguagem natural (RAG)
        texto: |
          Interface que permite ao gestor perguntar em português e receber
          respostas fundamentadas nos dados do programa, construída sobre a
          camada Ouro.

