# Curadoria do escopo e dos domínios de dados do Ministério das Cidades.
#
# Este é o arquivo mantido à mão. Números, modelos, fontes e entregas são
# resolvidos pelo build a partir do acervo — aqui fica só o que o código não
# sabe dizer: o recorte do escopo e o que cada domínio significa.
#
# O repositório também hospeda os projetos dbt `ipea` e `mir`, de outras
# aplicações. O bloco `escopo` abaixo é o que mantém o site restrito ao MCID:
# tudo que não estiver nele fica fora das contagens e das páginas.
#
# FONTE DO CONTEXTO: relatório técnico "MCMV — acompanhamento da política pelo
# dado" (Lab Livre/FCTE-UnB e SNH), somado à evidência do próprio repositório.
#
# REVISAR ANTES DE PUBLICAR:
#  1. As citações estão atribuídas por cargo, não por nome. Publicar o nome de
#     uma servidora num site público exige o consentimento dela.
#  2. Os números de escala do programa (UH contratadas, R$ investidos) estão
#     comentados de propósito — ver `numeros_a_confirmar` no fim do arquivo.

escopo:
  rotulo: Ministério das Cidades
  sigla: MCID
  projetos_dbt: [mcid]
  grupos_dag:
    - data_ingest/abecip
    - data_ingest/bacen
    - data_ingest/fgv
    - data_ingest/fipe
    - data_ingest/ibge
    - data_ingest/infomoney
    - data_ingest/mrv
    - data_ingest/tesouro_gerencial/mcid
    - dbt/mcid
  # Ingestões que não são DAG: rodam como script sobre o SFTP do agente operador
  # e alimentam o schema `raw`, de onde saem FAR e Entidades.
  ingestoes_script:
    - rotulo: SFTP da Caixa Econômica Federal
      arquivos:
        - scripts/sftp_ingest.py
        - scripts/sftp_snapshot.py
        - scripts/sftp_minio_diff.py
        - scripts/sftp_rename_tables.py
      descricao: |
        Espinha dorsal do fluxo de dados do MCMV subsidiado. O acesso direto ao
        SFTP foi conquistado em 2026 — antes disso a equipe trabalhava sobre um
        dump estático do banco do Ministério. Os scripts fazem a carga, o
        snapshot que detecta o que mudou entre períodos e a conferência contra o
        MinIO.

# Contexto do programa que a plataforma acompanha. Alimenta a capa e a vitrine.
programa:
  nome: Minha Casa, Minha Vida
  sigla: MCMV
  marco_legal: Lei nº 14.620/2023
  resumo: |
    O Minha Casa, Minha Vida é o principal instrumento operacional da política
    habitacional federal. Criado em 2009 pela Lei nº 11.977 e relançado em 2023
    pela Lei nº 14.620, responde a um déficit habitacional estrutural
    concentrado nas faixas de renda sem acesso ao crédito de mercado.
  parceria: |
    Esta aplicação de dados nasce da parceria entre o Laboratório de
    Competências em Software Livre (Lab Livre/FCTE) da Universidade de Brasília
    e a Secretaria Nacional de Habitação, no âmbito do TED nº 02/2025.
  problema:
    - titulo: Processamento artesanal
      texto: |
        A equipe consome tempo substantivo baixando planilhas de portais e
        tratando arquivos manualmente. Os mais de 30 indicadores do Boletim de
        Conjuntura são coletados um a um, por uma única servidora.
    - titulo: Falta de padronização na origem
      texto: |
        Os layouts dos arquivos enviados pela Caixa mudam com frequência —
        colunas trocam de nome e de formato, quebrando rotinas. O mesmo
        empreendimento pode aparecer com identificadores diferentes quando muda
        de status.
    - titulo: Isolamento e defasagem
      texto: |
        Os dados de habitação não estão nos sistemas estruturantes do governo
        federal, e sim numa camada gerida em parceria com a Caixa. A defasagem
        chega a dois meses.
    - titulo: Acesso restrito e LGPD
      texto: |
        O Ministério atua como custodiante dos arquivos enviados pela Caixa.
        Dados com CPF e informação pessoal de beneficiários exigem anonimização
        antes de qualquer processamento fora da infraestrutura do Ministério.
  perguntas:
    - A construção industrializada é de fato mais rápida e mais barata que a alvenaria convencional?
    - Onde o fluxo de produção está travando, e a diferença entre medição física e desembolso indica paralisação real ou falha de leitura?
    - Qual a correlação entre o investimento habitacional e emprego, renda e PIB regional?
    - A contratação de obras está focada nas regiões de maior déficit?
    - O programa está alcançando os grupos prioritários previstos em lei?

