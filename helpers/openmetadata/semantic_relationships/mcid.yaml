known_limitations:
- Sobreposição é do dado do dia da medição; refazer a rodada mantém o catálogo vivo.
- 17 tabelas do main (histórico e reloginho, eixo DuckDB) não existem no PostgreSQL e não foram medidas.
- Colunas cujo nome não casa com conceito declarado nem com a cauda automática (forma de identificador em 3+ tabelas) não
  são medidas.
