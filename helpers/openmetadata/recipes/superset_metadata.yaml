source:
  type: superset
  serviceName: Cidades - Superset
  serviceConnection:
    config:
      type: Superset
      hostPort: ${SUPERSET_HOST_PORT}
      connection:
        type: SupersetAPI
        username: ${SUPERSET_USERNAME}
        password: ${SUPERSET_PASSWORD}
        provider: db

  sourceConfig:
    config:
      type: DashboardMetadata
      # includeDataModels: true
      # includeDraftDashboard: true
      # lineageInformation:
      #   dbServicePrefixes:
      #     - Cidades.cidades
      # Se quiser restringir:
      # dashboardFilterPattern:
      #   includes: ["^.*$"]
      # chartFilterPattern:
      #   includes: ["^.*$"]
      # projectFilterPattern:
      #   includes: ["^.*$"]
      # dataModelFilterPattern:
      #   includes: ["^.*$"]

processor:
  type: orm-profiler
  config: {}

sink:
  type: metadata-rest
  config:
    bulk_sink_batch_size: 10

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OM_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${INGESTION_TOKEN}
    storeServiceConnection: true
