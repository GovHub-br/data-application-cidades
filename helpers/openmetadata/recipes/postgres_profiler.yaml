source:
  type: postgres
  serviceName: Cidades
  serviceConnection:
    config:
      type: Postgres
      hostPort: ${DB_DW_HOST}:${DB_DW_PORT}
      username: ${DB_DW_USER}
      authType:
        password: ${DB_DW_PASSWORD}
      database: ${DB_DW_DBNAME}
      sslMode: disable
  sourceConfig:
    config:
      type: Profiler
      computeMetrics: true
      profileSample: 25
      schemaFilterPattern:
        includes:
          - '^conjuntura_bronze$'
          - '^conjuntura_continuo_bronze$'
          - '^conjuntura_continuo_mart$'
          - '^conjuntura_continuo_silver$'
          - '^conjuntura_gold$'
          - '^conjuntura_silver$'
          - '^empreendimento_far$'
          - '^entidades_fds$'
          - '^metadata$'
      # Deve permanecer identica a allowlist de postgres_metadata.yaml.

processor:
  type: orm-profiler
  config: {}

sink:
  type: metadata-rest
  config:
    bulk_sink_batch_size: 10

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OM_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${PROFILER_TOKEN}
