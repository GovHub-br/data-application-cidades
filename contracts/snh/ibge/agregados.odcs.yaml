apiVersion: v3.1.0
kind: DataContract
id: ibge_agregados
name: IBGE (API de agregados v3)
version: 0.1.0
status: draft
description:
  purpose: Agregados do IBGE listados na Variable IBGE_CONFIGURACOES, um por tabela. Cada carga é a resposta
    JSON da API como veio (carga completa da janela de períodos pedida).
team:
- username: IBGE
  role: owner
servers:
- server: staging
  type: s3
  format: parquet
  location: s3://data-lake-mcid/snh/staging/
schema:
- name: pib_construcao
  physicalName: pib_construcao
  description: Agregado do IBGE da tabela pib_construcao (variável x localidade x classificação x período).
  customProperties:
  - property: path
    value: snh/staging/ibge/pib_construcao/*.parquet
  - property: file_pattern
    value: pib_construcao\.json
  - property: load_type
    value: full
  - property: max_row_variation
    value: 0.5
  - property: reader
    value: ibge_agregados_json
  - property: dag
    value: ibge_ingest_dag
  - property: dbt_tables
    value:
    - ibge_pib_construcao_civil
  properties:
  - name: variavel_id
    logicalType: string
  - name: variavel_nome
    logicalType: string
  - name: localidade_id
    logicalType: string
  - name: localidade_nome
    logicalType: string
  - name: classificacao_id
    logicalType: string
  - name: classificacao_nome
    logicalType: string
  - name: categoria_id
    logicalType: string
  - name: categoria_nome
    logicalType: string
  - name: unidade
    logicalType: string
  - name: periodo
    logicalType: string
  - name: valor
    logicalType: string
