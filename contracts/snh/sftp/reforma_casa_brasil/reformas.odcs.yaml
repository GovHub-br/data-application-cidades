  purpose: Contratos do Reforma Casa Brasil (PMCMV_REFORMAS) entregues no GEFUS.
team:
- username: CAIXA · GEFUS
  role: owner
servers:
- server: staging
  type: s3
  format: parquet
  location: s3://data-lake-mcid/snh/staging/
schema:
- name: reforma_contratos
  physicalName: reforma_contratos
  description: Snapshots completos de contratos do Reforma Casa Brasil recebidos pelo SFTP/GEFUS. A Bronze
    seleciona somente o arquivo mais recente.
  customProperties:
  - property: path
    value: snh/staging/sftp/fabrica/GEFUS/PMCMV_REFORMAS_MCID_*.parquet
  - property: file_pattern
    value: PMCMV_REFORMAS_MCID_\d{4}_\d{2}_\d{2}\.csv
  - property: load_type
    value: full
  - property: dag
    value: minio_transform_dag
  - property: dbt_tables
