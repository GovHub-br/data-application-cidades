apiVersion: v3.1.0
kind: DataContract
id: sftp_subsidiada_dados_prioritarios
name: Linha subsidiada · dados prioritários da SNH
version: 0.1.0
status: draft
description:
  purpose: Dados prioritários das operações subsidiadas (FAR, FDS e Rural) que CAIXA e BB entregam por
    mês no GEFUS.
team:
- username: CAIXA · GEFUS
  role: owner
servers:
- server: staging
  type: s3
  format: parquet
  location: s3://data-lake-mcid/snh/staging/
schema:
- name: dados_prioritarios_af_caixa
  physicalName: dados_prioritarios_af_caixa
  description: Dados prioritários da SNH reportados pela CAIXA (AF_CAIXA), todas as modalidades. Uma remessa
    por mês (AAAAMM no nome). Colunas da remessa 202610_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA.csv.
  customProperties:
  - property: path
    value: snh/staging/sftp/fabrica/GEFUS/*_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA.parquet
  - property: file_pattern
    value: \d{6}_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA\.csv
  - property: load_type
    value: full
  - property: dag
    value: sftp_ingest_dag
  - property: dbt_tables
    value:
    - bronze_sftp_snh_pmcmv_dados_prioritarios_af_caixa
    - bronze_sftp_snh_pmcmv_dados_prioritarios_af_caixa_serie
  properties:
  - name: data_de_movimento
    logicalType: string
  - name: agente_financeiro
    logicalType: string
  - name: apf
    logicalType: string
  - name: uf
    logicalType: string
