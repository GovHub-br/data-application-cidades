apiVersion: v3.1.0
kind: DataContract
id: novo_caged_pdet
name: Novo CAGED (microdados do PDET, Ministério do Trabalho)
version: 0.1.0
status: draft
description:
  purpose: Movimentações do emprego formal na construção (seção CNAE F), mês a mês, como o PDET publica
    no FTP (ftp.mtps.gov.br/pdet/microdados/NOVO CAGED/<ano>/<ano><mês>/). Cada mês traz três arquivos —
    movimentações do mês (MOV), declarações fora do prazo de meses anteriores (FOR) e exclusões (EXC) —
    e o saldo do painel do MTE de uma competência é MOV + FOR − EXC. Substitui o painel Power BI, cujo
    modelo saiu do ar em 06/2026.
team:
- username: Ministério do Trabalho e Emprego
  role: owner
servers:
- server: staging
  type: s3
  format: parquet
  location: s3://data-lake-mcid/snh/staging/
schema:
- name: novo_caged_pdet_mov
  physicalName: novo_caged_pdet_mov
  description: Movimentações declaradas no prazo, seção F (construção).
  customProperties:
  - property: path
    value: snh/staging/novo_caged/pdet/*/*/CAGEDMOV*.parquet
  - property: file_pattern
    value: CAGEDMOV\d{6}\.7z
  - property: load_type
    value: incremental
  - property: reader
    value: novo_caged_pdet_7z
  - property: dag
    value: novo_caged_pdet_ingest_dag
  - property: dbt_tables
    value:
    - novo_caged_pdet
  properties:
  - name: competenciamov
    logicalType: string
  - name: regiao
    logicalType: string
  - name: uf
    logicalType: string
  - name: municipio
    logicalType: string
  - name: secao
    logicalType: string
  - name: subclasse
    logicalType: string
  - name: saldomovimentacao
    logicalType: string
  - name: cbo2002ocupacao
    logicalType: string
  - name: categoria
    logicalType: string
  - name: graudeinstrucao
    logicalType: string
