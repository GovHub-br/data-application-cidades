name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  mcid:
    +database: cidades
    metadata:
      +materialized: incremental
      +schema: metadata
    empreendimento_far_dbt:
      +materialized: table
      +schema: empreendimento_far
      silver:
        +materialized: table
      gold:
        +materialized: table

    entidades_dbt:
      +materialized: table
      +schema: entidades_fds
      silver:
        +materialized: table
      gold:
        +materialized: table

    indicadores_mcmv_dbt:
      +materialized: table
      +schema: mcmv_indicadores
      gold:
        +materialized: table

    mcmv_silver_dbt:
      +enabled: "{{ target.type == 'duckdb' }}"
      +materialized: table
      +schema: mcmv_silver
      silver:
        +materialized: table

    mcmv_historico_dbt:
      +materialized: table
      +schema: mcmv_historico
      piloto:
        +materialized: table

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold

on-run-start:
  - '{{create_udfs()}}'

seeds:
  mcid:
    mcmv_historico:
      +schema: mcmv_historico
      +quote_columns: false
    entidades_fds:
      +schema: entidades_fds
      +quote_columns: false
