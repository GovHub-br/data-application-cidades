name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  mcid:
    +database: "{{ 'cidades' if target.type == 'postgres' else 'mcid_staging' }}"
    metadata:
      +materialized: incremental
      +schema: metadata
    empreendimento_far_dbt:
      +materialized: table
      +schema: empreendimento_far
      silver:
        +materialized: table
      gold:
        +materialized: table

    entidades_dbt:
      +materialized: table
      +schema: entidades_fds
      silver:
        +materialized: table
      gold:
        +materialized: table

    indicadores_mcmv_dbt:
      +materialized: table
      +schema: mcmv_indicadores
      # Camadas do reloginho (grupo A) — leem staging/dados_historicos via
      # MinIO/DuckDB, portanto só habilitadas no target staging_duckdb.
      # O gargalo (grupo B) roda no Postgres e não é afetado.
      bronze:
        +materialized: table
        +schema: mcmv_indicadores
        +enabled: "{{ target.type == 'duckdb' }}"
      silver:
        +materialized: table
        +schema: mcmv_indicadores
        +enabled: "{{ target.type == 'duckdb' }}"
      gold:
        +materialized: table
        +schema: mcmv_indicadores
        indicadores_reloginho:
          +enabled: "{{ target.type == 'duckdb' }}"
        indicadores_reloginho_frente:
          +enabled: "{{ target.type == 'duckdb' }}"
        resumo_reloginho_dashboard:
          +enabled: "{{ target.type == 'duckdb' }}"

    mcmv_silver_dbt:
      +enabled: "{{ target.type == 'duckdb' }}"
      +materialized: table
      +schema: mcmv_silver
      silver:
        +materialized: table

    mcmv_historico_dbt:
      +materialized: table
      +schema: mcmv_historico
      piloto:
        +materialized: table
      empreendimentos:
        +materialized: table
        +enabled: "{{ target.type == 'duckdb' }}"

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold

on-run-start:
  - "{% if target.type == 'postgres' %}{{ create_udfs() }}{% endif %}"

seeds:
  mcid:
    mcmv_historico:
      +schema: mcmv_historico
      +quote_columns: false
    entidades_fds:
      +schema: entidades_fds
      +quote_columns: false
