name: 'mcid'

version: 1.0.0
config-version: 2

profile: mcid

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  mcid:
    +database: "{{ 'cidades' if target.type == 'postgres' else 'mcid_staging' }}"
    metadata:
      +materialized: incremental
      +schema: metadata
    empreendimento_far_dbt:
      +materialized: table
      +schema: empreendimento_far
      silver:
        +materialized: table
      gold:
        +materialized: table

    entidades_dbt:
      +materialized: table
      +schema: entidades_fds
      silver:
        +materialized: table
      gold:
        +materialized: table

    indicadores_mcmv_dbt:
      +materialized: table
      +schema: mcmv_indicadores
      # Camadas do reloginho (grupo A) — leem staging/dados_historicos via
      # MinIO/DuckDB, portanto só habilitadas no target staging_duckdb.
      # O gargalo (grupo B) roda no Postgres e não é afetado.
      bronze:
        +materialized: table
        +schema: mcmv_indicadores
        +enabled: "{{ target.type == 'duckdb' }}"
      silver:
        +materialized: table
        +schema: mcmv_indicadores
        +enabled: "{{ target.type == 'duckdb' }}"
      gold:
        +materialized: table
        +schema: mcmv_indicadores
        indicadores_reloginho:
          +enabled: "{{ target.type == 'duckdb' }}"
        indicadores_reloginho_frente:
          +enabled: "{{ target.type == 'duckdb' }}"
        indicadores_reloginho_entregas:
          +enabled: "{{ target.type == 'duckdb' }}"
        resumo_reloginho_dashboard:
          +enabled: "{{ target.type == 'duckdb' }}"

    mcmv_silver_dbt:
      +enabled: "{{ target.type == 'duckdb' }}"
      +materialized: table
      +schema: mcmv_silver
      silver:
        +materialized: table

    mcmv_historico_dbt:
      +materialized: table
      +meta:
        governance:
          product: mcmv_historico
          owner_key: mcid_data_engineering

      bronze:
        +materialized: table
        +schema: bronze
        +enabled: "{{ target.type == 'duckdb' }}"
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: bronze
            classification: restricted
            rag_publication: prohibited
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier3
            owner: mcid-data-engineering

      silver:
        +materialized: table
        +schema: silver
        +enabled: "{{ target.type == 'duckdb' }}"
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering

      gold:
        +materialized: table
        +schema: gold
        +enabled: "{{ target.type == 'duckdb' }}"
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: gold
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier1
            owner: mcid-data-engineering

      # Piloto #118: série anual OGU/FGTS a partir de seed — roda no Postgres
      # (não lê MinIO), materializa no schema silver.
      piloto:
        +materialized: table
        +schema: silver
        +meta:
          governance:
            product: mcmv_historico
            owner_key: mcid_data_engineering
            layer: silver
            classification: internal
            rag_publication: eligible_after_security_validation
          openmetadata:
            domain: MCid.Habitacao
            tier: Tier.Tier2
            owner: mcid-data-engineering

    conjuntura_dbt:
      +materialized: table
      +schema: conjuntura
      bronze:
        +materialized: table
        +schema: conjuntura_bronze
      silver:
        +materialized: table
        +schema: conjuntura_silver
      gold:
        +materialized: table
        +schema: conjuntura_gold

on-run-start:
  - "{% if target.type == 'postgres' %}{{ create_udfs() }}{% endif %}"

seeds:
  mcid:
    mcmv_historico:
      +schema: mcmv_historico
      +quote_columns: false
    entidades_fds:
      +schema: entidades_fds
      +quote_columns: false
