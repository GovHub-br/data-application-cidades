version: 2

models:
  - name: fds_cadastro_pj
    description: >
      Cada linha representa um registro cadastral de empreendimento do MCMV
      Entidades na extração mensal do FDS. Padroniza identificadores, dados da
      Entidade Organizadora, localização, tipologia, valores, datas e
      indicadores recebidos de novo_mcmv_fds_cad_pj_mensal.
    config:
      tags:
        - bronze
        - entidades
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier3"
        tags:
          - "Certification.Bronze"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVEntidades"
          - "MCID.FundosEFontes.FDS"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.TrabalhoSocial"
    columns:
      - name: apf
        description: APF do empreendimento normalizado para oito dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
        tests:
          - unique
          - not_null
      - name: id_proposta
        description: Identificador textual da proposta informado pelo FDS.
      - name: agente_financeiro
        description: Nome do agente financeiro responsável pela operação.
      - name: empreendimento_nome
        description: Nome cadastral do empreendimento.
      - name: eo_nome
        description: Nome da Entidade Organizadora responsável pelo empreendimento.
      - name: eo_cnpj
        description: CNPJ da Entidade Organizadora, preservado apenas com dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: co_nivel_hab_eo
        description: Código numérico do nível de habilitação da Entidade Organizadora.
      - name: ic_substituicao_eo
        description: Indica se houve substituição da Entidade Organizadora.
      - name: dt_substituicao_eo
        description: Data em que ocorreu a substituição da Entidade Organizadora.
      - name: eo_substituta_nome
        description: Nome da Entidade Organizadora que assumiu após a substituição.
      - name: eo_substituta_cnpj
        description: CNPJ da Entidade Organizadora substituta, preservado apenas com dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: construtora_nome
        description: Nome da construtora associada ao empreendimento.
      - name: construtora_cnpj
        description: CNPJ da construtora, preservado apenas com dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: municipio
        description: Nome do município onde se localiza o empreendimento.
      - name: uf
        description: Sigla da unidade federativa do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UF"
      - name: cod_ibge
        description: Código IBGE do município do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CodigoIBGE"
      - name: logradouro
        description: Logradouro do endereço cadastrado para o empreendimento.
      - name: bairro
        description: Bairro do endereço cadastrado para o empreendimento.
      - name: cep
        description: Código de endereçamento postal do empreendimento.
      - name: co_tipo_edificacao
        description: Código do tipo de edificação informado pelo FDS.
      - name: co_regime_obra
        description: Código do regime de execução da obra informado pelo FDS.
      - name: co_modalidade
        description: Código da modalidade do empreendimento informado pelo FDS.
      - name: co_tipo_empreendimento
        description: Código do tipo de empreendimento informado pelo FDS.
      - name: co_modalidade_projeto
        description: Código da modalidade aplicada à etapa de projeto.
      - name: co_modalidade_obra
        description: Código da modalidade aplicada à etapa de obra.
      - name: qt_uh_construcao
        description: Quantidade de unidades habitacionais cadastradas em construção.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_projeto
        description: Quantidade de unidades habitacionais cadastradas em projeto.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: gps_lat_grau
        description: Componente de graus da latitude em coordenadas DMS.
      - name: gps_lat_minuto
        description: Componente de minutos da latitude em coordenadas DMS.
      - name: gps_lat_segundo
        description: Componente de segundos da latitude em coordenadas DMS.
      - name: gps_long_grau
        description: Componente de graus da longitude em coordenadas DMS.
      - name: gps_long_minuto
        description: Componente de minutos da longitude em coordenadas DMS.
      - name: gps_long_segundo
        description: Componente de segundos da longitude em coordenadas DMS.
      - name: gps_datum
        description: Referencial geodésico usado nas coordenadas do empreendimento.
      - name: area_terreno
        description: Área do terreno informada no cadastro do empreendimento.
      - name: vr_financiamento_fds
        description: Valor do financiamento concedido com recursos do FDS, em reais.
      - name: vr_total_contrapartidas
        description: Valor total das contrapartidas do empreendimento, em reais.
      - name: vr_total_investimento
        description: Valor total do investimento no empreendimento, em reais.
      - name: vr_total_operacao
        description: Valor total da operação informado pelo FDS, em reais.
      - name: vr_terreno
        description: Parcela do investimento destinada ao terreno, em reais.
      - name: vr_trabalho_social
        description: Parcela do investimento destinada ao trabalho social, em reais.
      - name: vr_equipamentos_publicos
        description: Parcela destinada a equipamentos públicos, em reais.
      - name: vr_equipamento_uso_comum
        description: Parcela destinada a equipamentos de uso comum, em reais.
      - name: vr_infraestrutura
        description: Parcela destinada à infraestrutura incidente, em reais.
      - name: vr_legalizacao
        description: Parcela destinada à legalização do empreendimento, em reais.
      - name: vr_regularizacao
        description: Parcela destinada à regularização do empreendimento, em reais.
      - name: vr_seguros
        description: Parcela destinada aos seguros obrigatórios, em reais.
      - name: vr_vigilancia
        description: Parcela destinada à vigilância da obra, em reais.
      - name: vr_contrapartida_estado_infra
        description: Contrapartida estadual destinada à infraestrutura, em reais.
      - name: vr_contrapartida_estado_terreno
        description: Contrapartida estadual destinada ao terreno, em reais.
      - name: vr_contrapartida_estado_complementar
        description: Contrapartida estadual complementar, em reais.
      - name: vr_contrapartida_municipio_infra
        description: Contrapartida municipal destinada à infraestrutura, em reais.
      - name: vr_contrapartida_municipio_terreno
        description: Contrapartida municipal destinada ao terreno, em reais.
      - name: vr_contrapartida_municipio_complementar
        description: Contrapartida municipal complementar, em reais.
      - name: vr_contrapartida_outras
        description: Valor de contrapartidas provenientes de outras origens, em reais.
      - name: apf_aporte
        description: APF vinculada ao aporte ou à suplementação da operação.
      - name: co_operacao_retomada
        description: Código que caracteriza a operação de retomada.
      - name: vr_aporte_suplementacao
        description: Valor contratado de aporte ou suplementação, em reais.
      - name: dt_aporte_suplementacao
        description: Data de contratação do aporte ou da suplementação.
      - name: vr_total_em_construcao
        description: Valor total associado às unidades em construção, em reais.
      - name: vr_total_em_projeto
        description: Valor total associado às unidades em projeto, em reais.
      - name: dt_contratacao
        description: Data de assinatura e contratação do empreendimento.
      - name: dt_inicio_obra
        description: Data de início da obra.
      - name: dt_previsao_conclusao
        description: Data prevista para a conclusão da obra.
      - name: dt_apresentacao_orcamento
        description: Data de apresentação do orçamento do empreendimento.
      - name: dt_inicio_obra_retomada
        description: Data de início da obra após a retomada.
      - name: dt_previsao_conclusao_retomada
        description: Data prevista para concluir a obra retomada.
      - name: dt_movimento
        description: Data de referência do registro na extração de origem.
      - name: ic_terreno_doado
        description: Indica se o terreno do empreendimento foi doado.
      - name: ic_uniao_imovel
        description: Indica se há participação de imóvel da União na operação.
      - name: ic_aquecimento_solar
        description: Indica se o empreendimento prevê sistema de aquecimento solar.
      - name: ic_energia_alternativa
        description: Indica se o empreendimento prevê sistema alternativo de energia.
      - name: ic_area_comercial
        description: Indica se há previsão de área comercial no empreendimento.
      - name: ic_mudanca_fase
        description: Indica se a operação passou por mudança de fase.
      - name: apf_mudanca_fase
        description: APF relacionada à mudança de fase da operação.
      - name: vr_energia_alternativa
        description: Valor destinado ao sistema alternativo de energia, em reais.
      - name: vr_aquecimento_solar
        description: Valor destinado ao sistema de aquecimento solar, em reais.
      - name: arquivo_de_origem
        description: Nome do arquivo de origem do registro carregado na camada raw.
      - name: criado_em
        description: Data e hora em que o registro foi carregado na camada raw.
    tests:
      - row_count_match:
          source_table: __dados_brutos.novo_mcmv_fds_cad_pj_mensal
          target_table: entidades_fds.fds_cadastro_pj

  - name: fds_dados_prioritarios_entregas
    description: >
      Cada linha representa um registro de entrega recebido da CAIXA para um
      empreendimento e uma data de movimento. Mantém registros de diferentes
      programas; a associação ao FDS é realizada nas transformações posteriores.
    config:
      tags:
        - bronze
        - entidades
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier3"
        tags:
          - "Certification.Bronze"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVEntidades"
          - "MCID.FundosEFontes.FDS"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFisica"
    columns:
      - name: apf
        description: APF do empreendimento normalizado para oito dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
      - name: agente_financeiro
        description: Nome do agente financeiro que reportou a entrega.
      - name: qt_uh_entregues
        description: Quantidade de unidades habitacionais entregues no registro.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: dt_entrega
        description: Data efetiva da entrega das unidades habitacionais.
      - name: dt_movimento
        description: Data de referência do registro na fonte.
      - name: arquivo_de_origem
        description: Nome do arquivo de origem do registro carregado na camada raw.
      - name: criado_em
        description: Data e hora em que o registro foi carregado na camada raw.

  - name: fds_financeiro_mensal
    description: >
      Cada linha representa um movimento financeiro de um empreendimento FDS.
      Tipifica valores e datas da extração novo_mcmv_fds_financeiro_mensal,
      preservando débitos de liberação e créditos de devolução para agregação
      temporal nas camadas seguintes.
    config:
      tags:
        - bronze
        - entidades
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier3"
        tags:
          - "Certification.Bronze"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVEntidades"
          - "MCID.FundosEFontes.FDS"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFinanceira"
          - "MCID.ExecucaoDeEmpreendimentos.Desembolso"
          - "MCID.ExecucaoDeEmpreendimentos.TrabalhoSocial"
    columns:
      - name: apf
        description: APF do empreendimento normalizado para oito dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
        tests:
          - not_null
      - name: co_tipo_movimento
        description: Código numérico do tipo de movimento financeiro.
      - name: co_tipo_registro
        description: Código do tipo de registro financeiro informado pela fonte.
      - name: ic_credito
        description: Indicador em que 0 identifica liberação e 1 identifica devolução.
      - name: vr_liberado
        description: Valor total liberado, em reais; liberações com indicador 0 chegam negativas.
      - name: vr_movimento
        description: Valor total do movimento financeiro, em reais.
      - name: vr_pago_obra
        description: Parcela paga para a obra do empreendimento, em reais.
      - name: vr_pago_terreno
        description: Parcela paga para o terreno, em reais.
      - name: vr_pago_trabalho_social
        description: Parcela paga para o trabalho social, em reais.
      - name: vr_pago_projeto
        description: Parcela paga para o projeto, em reais.
      - name: vr_pago_aporte
        description: Parcela paga como aporte ou suplementação, em reais.
      - name: vr_pago_incc
        description: Parcela paga referente a despesas de INCC, em reais.
      - name: vr_pago_legalizacao
        description: Parcela paga para cartórios e legalização, em reais.
      - name: vr_pago_seguranca
        description: Parcela paga para segurança ou vigilância, em reais.
      - name: pct_evolucao
        description: Percentual de evolução informado no movimento financeiro.
      - name: dt_movimento
        description: Data de registro do movimento no sistema de origem.
      - name: dt_liberacao
        description: Data efetiva da liberação do recurso.
      - name: dt_remessa
        description: Data de remessa do movimento financeiro.
      - name: dt_evento
        description: Data do evento financeiro registrado pela fonte.
      - name: identificador
        description: Identificador do registro financeiro na fonte.
      - name: arquivo_de_origem
        description: Nome do arquivo de origem do registro carregado na camada raw.
      - name: criado_em
        description: Data e hora em que o registro foi carregado na camada raw.

  - name: fds_int_059_caixa_pj
    description: >
      Cada linha preserva um empreendimento da extração complementar INT 059 da
      CAIXA, com situação contratual, proponente, localização, unidades, valores
      e marcos. A fonte reúne operações legadas e do Novo MCMV; o filtro
      selecao_pmcmv_e é aplicado na camada silver.
    config:
      tags:
        - bronze
        - entidades
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier3"
        tags:
          - "Certification.Bronze"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVEntidades"
          - "MCID.FundosEFontes.FDS"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFisica"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFinanceira"
          - "MCID.ExecucaoDeEmpreendimentos.Desembolso"
    columns:
      - name: apf
        description: APF do empreendimento normalizado para oito dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
      - name: empreendimento_nome
        description: Nome do empreendimento informado na INT 059.
      - name: selecao_pmcmv_e
        description: Classificação usada para distinguir o Novo MCMV-E das operações legadas.
      - name: situacao_gefus
        description: Situação contratual do empreendimento no GEFUS.
      - name: fase_contrato
        description: Fase atual do contrato informada pela CAIXA.
      - name: situacao_empreendimento
        description: Descrição da situação geral do empreendimento.
      - name: eo_nome
        description: Razão social da Entidade Organizadora proponente.
      - name: eo_cnpj
