  - name: fds_obra_mensal
    description: >
      Cada linha representa o acompanhamento mensal da obra de um empreendimento
      FDS. Padroniza situação, evolução física, unidades, paralisações, invasões
      e datas da fonte novo_mcmv_fds_obra_mensal.
    config:
      tags:
        - bronze
        - entidades
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier3"
        tags:
          - "Certification.Bronze"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVEntidades"
          - "MCID.FundosEFontes.FDS"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFisica"
    columns:
      - name: apf
        description: APF do empreendimento normalizado para oito dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('fds_cadastro_pj')
              field: apf
      - name: co_situacao_operacao
        description: Código da situação da operação no período de referência.
      - name: dt_alteracao_situacao
        description: Data da última alteração da situação da operação.
      - name: co_andamento_operacao
        description: Código do andamento da operação no período de referência.
      - name: dt_alteracao_andamento
        description: Data da última alteração do andamento da operação.
      - name: pct_obra_prevista
        description: Percentual de obra previsto para a data de referência.
      - name: pct_obra_realizada
        description: Percentual de obra efetivamente realizado na data de referência.
      - name: qt_uh_concluidas
        description: Quantidade de unidades habitacionais concluídas.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_concluidas_adaptadas
        description: Quantidade de unidades habitacionais adaptadas e concluídas.
        meta:
