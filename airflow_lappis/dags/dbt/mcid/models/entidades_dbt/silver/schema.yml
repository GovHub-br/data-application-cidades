version: 2

models:
  - name: fds_empreendimento
    description: >
      Uma linha por APF do Novo MCMV Entidades. Consolida cadastro, obra,
      situação da INT 059, trabalho social e liberações financeiras; trata datas
      sentinela, padroniza o CNPJ da Entidade Organizadora e calcula indicadores
      físicos, financeiros e de entrega usados pelos modelos analíticos.
    config:
      tags:
        - silver
        - entidades
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVEntidades"
          - "MCID.FundosEFontes.FDS"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFisica"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFinanceira"
          - "MCID.ExecucaoDeEmpreendimentos.Desembolso"
          - "MCID.ExecucaoDeEmpreendimentos.TrabalhoSocial"
          - "MCID.ExecucaoDeEmpreendimentos.PTS"
    columns:
      - name: apf
        description: Chave do empreendimento, normalizada para oito dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
        tests:
          - unique
          - not_null
      - name: eo_nome
        description: Nome da Entidade Organizadora responsável pelo empreendimento.
      - name: eo_cnpj
        description: CNPJ da Entidade Organizadora preenchido à esquerda até 14 dígitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: co_nivel_hab_eo
        description: Código do nível de habilitação da Entidade Organizadora.
      - name: ic_substituicao_eo
        description: Indica se houve substituição da Entidade Organizadora.
      - name: dt_substituicao_eo
        description: Data em que ocorreu a substituição da Entidade Organizadora.
      - name: eo_substituta_nome
        description: Nome da Entidade Organizadora que assumiu após a substituição.
      - name: eo_substituta_cnpj
        description: CNPJ somente com dígitos da Entidade Organizadora substituta.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: empreendimento_nome
        description: Nome cadastral do empreendimento.
      - name: construtora_nome
        description: Nome da construtora associado ao cadastro do empreendimento.
      - name: construtora_cnpj
        description: CNPJ somente com dígitos da construtora associada.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: agente_financeiro
        description: Nome do agente financeiro responsável pela operação.
      - name: quantidade_uh
        description: >
          Quantidade de unidades habitacionais, calculada pelo maior valor entre
          as quantidades cadastradas em construção e em projeto.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_construcao
        description: Quantidade bruta de unidades habitacionais cadastradas em construção.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_projeto
        description: Quantidade bruta de unidades habitacionais cadastradas em projeto.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: pessoas_atendidas
        description: Estimativa inteira de pessoas atendidas, calculada como quantidade_uh vezes 3,3.
      - name: municipio
        description: Nome do município onde se localiza o empreendimento.
      - name: uf
        description: Sigla da unidade federativa do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UF"
      - name: cod_ibge
        description: Código IBGE do município do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CodigoIBGE"
      - name: co_tipo_edificacao
        description: Código do tipo de edificação informado pelo FDS.
      - name: tipologia
        description: Tipologia decodificada como Casa, Misto, Apartamento ou Não Informado.
      - name: co_regime_obra
        description: Código do regime de execução da obra informado pelo FDS.
      - name: co_modalidade
        description: Código da modalidade do empreendimento informado pelo FDS.
      - name: valor_contratado
        description: Valor total do investimento contratado, em reais, com nulos convertidos em zero.
      - name: valor_financiamento_fds
        description: Valor financiado com recursos do FDS, em reais, com nulos convertidos em zero.
      - name: valor_contrapartidas
        description: Valor total das contrapartidas, em reais, com nulos convertidos em zero.
      - name: valor_por_uh
        description: Valor contratado dividido pela quantidade de unidades habitacionais.
      - name: dt_contratacao
        description: Data de contratação; o valor sentinela 1900-01-01 é convertido em nulo.
      - name: dt_inicio_obra
        description: Data de início da obra; o valor sentinela 1900-01-01 é convertido em nulo.
      - name: dt_previsao_conclusao
        description: Data prevista para a conclusão da obra.
      - name: situacao_gefus
        description: Situação contratual da INT 059, preenchida como Não mapeado quando ausente.
      - name: fase_contrato
        description: Fase contratual da INT 059, preenchida como Não mapeada quando ausente.
      - name: co_situacao_operacao
        description: Código da situação da operação no acompanhamento de obra.
      - name: co_andamento_operacao
        description: Código do andamento da operação no acompanhamento de obra.
      - name: percentual_obra_prevista
        description: Percentual de execução física previsto, com nulos convertidos em zero.
      - name: percentual_execucao_fisica
        description: Percentual de execução física realizado, com nulos convertidos em zero.
      - name: qt_uh_concluidas
        description: Quantidade de unidades habitacionais concluídas, com nulos convertidos em zero.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_alienadas
        description: Quantidade de unidades habitacionais alienadas, usada como indicador de entrega.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_sem_habitese
        description: Quantidade de unidades habitacionais sem habite-se, com nulos convertidos em zero.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_construcao_parcial
        description: Quantidade de unidades habitacionais em construção parcial.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_ocupacao_irregular
        description: Quantidade de unidades habitacionais em ocupação irregular.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: pct_entrega
        description: Percentual de unidades alienadas sobre a quantidade total de unidades habitacionais.
      - name: dt_paralisacao
        description: Data de paralisação da obra, quando registrada.
      - name: co_classificacao_paralisado
        description: Código da classificação aplicada à obra paralisada.
      - name: ic_invadido
        description: Indica se o empreendimento foi invadido.
      - name: dt_invasao
        description: Data da invasão do empreendimento, quando registrada.
      - name: dt_conclusao_obra
        description: Data efetiva de conclusão da obra.
      - name: dt_entrega
        description: Data efetiva de entrega do empreendimento.
      - name: dt_previsao_entrega
        description: Data prevista para entrega do empreendimento.
      - name: valor_desembolsado
        description: Soma acumulada, em reais, do valor absoluto das liberações com ic_credito igual a 0.
      - name: qt_liberacoes
        description: Quantidade total de liberações financeiras consideradas para o empreendimento.
      - name: dt_ultima_liberacao
        description: Data da liberação financeira mais recente considerada no acumulado.
      - name: percentual_execucao_financeira
        description: Percentual do valor desembolsado sobre o valor contratado.
      - name: divergencia_fisico_financeira
        description: >
          Diferença, em pontos percentuais, entre a execução financeira e a
          execução física; valores positivos indicam desembolso mais avançado.
      - name: co_situacao_trabalho_social
        description: Código da situação do trabalho social do empreendimento.
      - name: pct_execucao_ts
        description: Percentual de execução do trabalho social.
      - name: dt_aprovacao_pts
        description: Data de aprovação do Projeto de Trabalho Social.
        meta:
          openmetadata:
            glossary:
              - "MCID.ExecucaoDeEmpreendimentos.PTS"
      - name: dias_contratacao_inicio
        description: Quantidade de dias entre a contratação e o início da obra.
      - name: gps_lat_grau
        description: Componente de graus da latitude em DMS; zero é convertido em nulo.
      - name: gps_lat_minuto
        description: Componente de minutos da latitude em DMS, mantido quando o grau é válido.
      - name: gps_lat_segundo
        description: Componente de segundos da latitude em DMS, mantido quando o grau é válido.
      - name: gps_long_grau
        description: Componente de graus da longitude em DMS; zero é convertido em nulo.
      - name: gps_long_minuto
        description: Componente de minutos da longitude em DMS, mantido quando o grau é válido.
      - name: gps_long_segundo
        description: Componente de segundos da longitude em DMS, mantido quando o grau é válido.

  - name: fds_evolucao_financeira
    description: >
      Uma linha por APF e mês com liberações reais do FDS. Agrega o valor
      absoluto dos movimentos com ic_credito igual a 0, calcula o desembolso
      acumulado e acrescenta Entidade Organizadora, valor contratado e
      localização do empreendimento.
    config:
      tags:
        - silver
        - entidades
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVEntidades"
          - "MCID.FundosEFontes.FDS"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFinanceira"
          - "MCID.ExecucaoDeEmpreendimentos.Desembolso"
          - "MCID.ExecucaoDeEmpreendimentos.TrabalhoSocial"
          - "MCID.ExecucaoDeEmpreendimentos.PTS"
    columns:
      - name: apf
        description: APF de oito dígitos do empreendimento associado às liberações.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
        tests:
          - not_null
          - relationships:
              to: ref('fds_empreendimento')
              field: apf
      - name: eo_cnpj
        description: CNPJ de 14 dígitos da Entidade Organizadora do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: eo_nome
        description: Nome da Entidade Organizadora do empreendimento.
      - name: mes
        description: Primeiro dia do mês em que ocorreram as liberações agregadas.
        tests:
          - not_null
      - name: qt_liberacoes
        description: Quantidade de liberações financeiras consideradas no mês.
      - name: vr_liberado_mes
        description: Soma mensal do valor absoluto liberado, em reais.
        tests:
          - not_null
      - name: vr_pago_obra_mes
        description: Soma mensal do valor absoluto pago para obra, em reais.
      - name: vr_pago_terreno_mes
        description: Soma mensal do valor absoluto pago para terreno, em reais.
      - name: vr_pago_pts_mes
        description: Soma mensal do valor absoluto pago para trabalho social, em reais.
        meta:
          openmetadata:
            glossary:
              - "MCID.ExecucaoDeEmpreendimentos.PTS"
      - name: vr_pago_projeto_mes
        description: Soma mensal do valor absoluto pago para projeto, em reais.
      - name: vr_pago_incc_mes
        description: Soma mensal do valor absoluto pago para despesas de INCC, em reais.
      - name: vr_pago_aporte_mes
        description: Soma mensal do valor absoluto pago como aporte, em reais.
      - name: vr_pago_legalizacao_mes
        description: Soma mensal do valor absoluto pago para legalização, em reais.
      - name: vr_pago_seguranca_mes
        description: Soma mensal do valor absoluto pago para segurança, em reais.
      - name: vr_acumulado
        description: Soma progressiva do valor liberado por APF até o mês da linha.
      - name: pct_executado_financeiro
        description: Percentual do desembolso acumulado sobre o valor contratado.
      - name: valor_contratado
        description: Valor total contratado do empreendimento, em reais.
      - name: municipio
        description: Nome do município do empreendimento.
      - name: uf
        description: Sigla da unidade federativa do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UF"
