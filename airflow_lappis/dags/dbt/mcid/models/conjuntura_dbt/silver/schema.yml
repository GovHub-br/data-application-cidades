  - name: silver_abramat_indice
    description: >
      Serie mensal Silver do Indice ABRAMAT, que acompanha o faturamento
      deflacionado da industria de materiais para construcao. Disponibiliza o
      nivel do indice e suas variacoes mensal e em doze meses com os timestamps
      de rastreabilidade do processamento.
    config:
      tags:
        - silver
        - conjuntura
        - mcid
        - abramat
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.IndicadoresConjunturais.IndiceABRAMAT"
          - "MCID.FontesInstitucionais.ABRAMAT"
    columns:
      - name: data_referencia
        description: Data mensal de referencia do indice ABRAMAT.
      - name: indice
        description: Valor do indice ABRAMAT no periodo.
      - name: var_mes
        description: Variacao percentual do indice em relacao ao mes anterior.
      - name: var_12_meses
        description: Variacao percentual do indice em relacao ao mesmo mes do ano anterior.
      - name: dt_ingest
        description: Timestamp em que o registro de origem foi ingerido.
      - name: dt_silver
        description: Timestamp de processamento do registro na camada Silver.

  - name: silver_bacen_financiamentos_imobiliarios
    description: >
      Serie Silver de indicadores de financiamentos imobiliarios publicados pelo
      Banco Central. Cada linha representa um tipo de indicador em uma data de
      referencia, preservando seu valor numerico e a rastreabilidade da carga.
    config:
      tags:
        - silver
        - conjuntura
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.FontesInstitucionais.BACEN"
          - "MCID.IndicadoresConjunturais.FinanciamentoImobiliario"
    columns:
      - name: tipo
        description: Tipo de indicador de financiamento imobiliario medido.
      - name: data_referencia
        description: Data de referencia do indicador de financiamento imobiliario.
        tests:
          - not_null
          - date_year_between:
              min_year: 1900
              max_year: 2100
      - name: valor
        description: Valor numerico do indicador no periodo.
      - name: dt_ingest
        description: Timestamp em que o registro de origem foi ingerido.
      - name: dt_silver
        description: Timestamp de processamento do registro na camada Silver.

  - name: silver_balancos_empresas
    description: >
      Serie trimestral Silver dos balancos de empresas do setor imobiliario.
      Organiza, por empresa e periodo fiscal, os indicadores de lancamentos e
      vendas utilizados nas comparacoes conjunturais da camada Gold.
    config:
      tags:
        - silver
        - conjuntura
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.IndicadoresConjunturais.LancamentoImobiliario"
          - "MCID.IndicadoresConjunturais.VendaImobiliaria"
    columns:
      - name: nome_empresa
        description: Nome padronizado da empresa do setor imobiliario.
      - name: ano_balanco
        description: Ano fiscal de referencia do balanco da empresa.
      - name: trimestre_balanco
        description: Trimestre fiscal de referencia do balanco da empresa.
      - name: lancamento
        description: Indicador de lancamentos imobiliarios divulgado pela empresa no periodo.
      - name: vendas
        description: Indicador de vendas imobiliarias divulgado pela empresa no periodo.
      - name: dt_ingest
        description: Campo de compatibilidade sem timestamp de ingestao na origem, preenchido com nulo.
      - name: dt_silver
        description: Timestamp de processamento do registro na camada Silver.

