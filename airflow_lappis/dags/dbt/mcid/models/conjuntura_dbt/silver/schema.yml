version: 2

models:
  - name: silver_abecip_novos_financiamentos_imobiliarios
    description: >
      Serie mensal Silver dos novos financiamentos imobiliarios informados pela
      ABECIP. Consolida os agentes em grupos bancarios, inclui uma linha de total
      por periodo e apresenta o valor acumulado no ano em bilhoes e a quantidade
      de unidades habitacionais financiadas.
    config:
      tags:
        - silver
        - conjuntura
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.FontesInstitucionais.ABECIP"
          - "MCID.IndicadoresConjunturais.FinanciamentoImobiliario"
    columns:
      - name: ano
        description: Ano de referencia dos financiamentos imobiliarios.
      - name: mes
        description: Mes de referencia dos financiamentos imobiliarios.
      - name: banco
        description: Grupo bancario padronizado ou categoria TOTAL do periodo.
      - name: valor_bi
        description: Valor acumulado dos financiamentos no ano, convertido para bilhoes de reais.
      - name: uh
        description: Quantidade acumulada de unidades habitacionais financiadas no ano.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: dt_ingest
        description: Campo de compatibilidade sem timestamp de ingestao na origem, preenchido com nulo.
      - name: dt_silver
        description: Timestamp de processamento do registro na camada Silver.

  - name: silver_abecip_poupanca_sbpe
    description: >
      Serie mensal Silver da poupanca do Sistema Brasileiro de Poupanca e
      Emprestimo publicada pela ABECIP. Mantem depositos, retiradas, captacao,
      rendimentos e saldo e acrescenta a captacao liquida em bilhoes e seu
      acumulado movel de doze meses.
    config:
      tags:
        - silver
        - conjuntura
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.FontesInstitucionais.ABECIP"
          - "MCID.FundosEFontes.SBPE"
          - "MCID.IndicadoresConjunturais.CaptacaoLiquida"
    columns:
      - name: data_referencia
        description: Data mensal de referencia dos valores da poupanca SBPE.
      - name: deposito
        description: Valor total de depositos realizados no periodo.
      - name: retirada
        description: Valor total de retiradas realizadas no periodo.
      - name: captacao_liquida_valor
        description: Saldo monetario entre depositos e retiradas no periodo.
      - name: captacao_liquida_pct
        description: Variacao percentual da captacao liquida no periodo.
      - name: rendimento
        description: Valor dos rendimentos creditados no periodo.
      - name: saldo
        description: Saldo total da poupanca SBPE ao fim do periodo.
      - name: captacao_liquida_bi
        description: Captacao liquida do periodo convertida para bilhoes de reais.
      - name: captacao_acum_12m
        description: Soma movel da captacao liquida no mes corrente e nos onze meses anteriores.
      - name: fonte
        description: Identificacao da fonte informada no dado de origem.
      - name: dt_ingest
        description: Timestamp em que o registro de origem foi ingerido.
      - name: dt_silver
        description: Timestamp de processamento do registro na camada Silver.

  - name: silver_abecip_sbpe_financiamentos_habitacionais
