        description: Variacao percentual das vendas do primeiro trimestre de 2026 contra o quarto trimestre de 2025.
      - name: variacao_1t25
        description: Variacao percentual das vendas do primeiro trimestre de 2026 contra o primeiro trimestre de 2025.
      - name: variacao_12m_26_25
        description: Variacao percentual das vendas acumuladas em doze meses de 2026 contra a janela equivalente de 2025.
      - name: variacao_12m_25_24
        description: Variacao percentual das vendas acumuladas em doze meses de 2025 contra a janela equivalente de 2024.
      - name: dt_ingest
        description: Timestamp da ingestao mais recente entre os registros de origem.
      - name: dt_silver
        description: Timestamp de processamento da camada Silver de origem.
      - name: dt_gold
        description: Timestamp de geracao deste registro na camada Gold.

