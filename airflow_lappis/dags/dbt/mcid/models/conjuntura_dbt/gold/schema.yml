  - name: gold_indices_mercado_imobiliario
    description: >
      Uma linha por periodo de comparacao com variacoes dos indices IMOB,
      FIPEZAP de locacao, ICST e ABRAMAT, consolidando fontes de mercado para
      consumo direto em paineis de conjuntura imobiliaria.
    config:
      tags:
        - gold
        - conjuntura
        - mcid
        - indices
        - mercado_imobiliario
    meta:
      openmetadata:
        tier: "Tier.Tier1"
        tags:
          - "Certification.Gold"
        glossary:
          - "MCID.IndicadoresConjunturais.IMOB"
          - "MCID.FontesInstitucionais.B3"
          - "MCID.IndicadoresConjunturais.FipeZapLocacao"
          - "MCID.IndicadoresConjunturais.ICST"
          - "MCID.FontesInstitucionais.FGVIBRE"
          - "MCID.IndicadoresConjunturais.IndiceABRAMAT"
          - "MCID.FontesInstitucionais.ABRAMAT"
    columns:
      - name: periodo
        description: Periodo ou janela usada para comparar os indices de mercado.
        tests:
          - not_null
          - unique
          - accepted_values:
              values:
                - "DEZ 25 vs. NOV 25"
                - "DEZ 25 vs. DEZ 24"
                - "JAN-DEZ/25"
                - "JAN-DEZ/24"
      - name: imob_var
        description: Variacao percentual do indice IMOB no periodo.
      - name: fipezap_var
        description: Variacao percentual do indice FIPEZAP de locacao no periodo.
      - name: icst_var
        description: Variacao percentual do ICST sem ajuste sazonal no periodo.
      - name: abramat_var
        description: Variacao percentual do indice ABRAMAT no periodo.
      - name: dt_ingest
        description: Timestamp mais recente das ingestoes das quatro fontes de indices.
      - name: dt_silver
        description: Timestamp mais recente dos processamentos Silver das quatro fontes.
      - name: dt_gold
        description: Timestamp de geracao deste registro na camada Gold.
