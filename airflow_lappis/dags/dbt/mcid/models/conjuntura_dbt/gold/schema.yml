version: 2

models:
  - name: gold_abecip_novos_financiamentos_imobiliarios
    description: >
      Uma linha por ano, mes e banco com o volume de novos financiamentos
      imobiliarios da ABECIP, participacao no total e variacao contra o mesmo
      mes do ano anterior, tanto em valor quanto em unidades habitacionais.
    config:
      tags:
        - gold
        - conjuntura
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier1"
        tags:
          - "Certification.Gold"
        glossary:
          - "MCID.FontesInstitucionais.ABECIP"
          - "MCID.IndicadoresConjunturais.FinanciamentoImobiliario"
    columns:
      - name: ano
        description: Ano de referencia dos financiamentos.
      - name: mes
        description: Mes de referencia dos financiamentos.
      - name: banco
        description: Instituicao financeira ou linha de totalizacao informada pela ABECIP.
      - name: valor_bi
        description: Valor dos novos financiamentos no mes, em bilhoes de reais.
      - name: perc_valor
        description: Participacao percentual do banco no valor financiado do mes.
      - name: var_ano_valor
        description: Variacao percentual do valor contra o mesmo banco e mes do ano anterior.
      - name: uh
        description: Quantidade de unidades habitacionais financiadas no mes.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: perc_uh
        description: Participacao percentual do banco nas unidades financiadas do mes.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: var_ano_uh
        description: Variacao percentual das unidades contra o mesmo banco e mes do ano anterior.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: ordem
        description: Ordem de exibicao das instituicoes financeiras nos paineis.
      - name: dt_ingest
        description: Timestamp da ingestao mais recente entre os registros de origem.
      - name: dt_silver
        description: Timestamp de processamento da camada Silver de origem.
      - name: dt_gold
        description: Timestamp de geracao deste registro na camada Gold.

  - name: gold_balancos_empresas_lancamentos
    description: >
      Uma linha por empresa de capital aberto com variacoes percentuais dos
      lancamentos imobiliarios do primeiro trimestre de 2026 contra o trimestre
      anterior, o mesmo trimestre de 2025 e janelas acumuladas de doze meses.
    config:
      tags:
        - gold
        - conjuntura
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier1"
        tags:
          - "Certification.Gold"
        glossary:
          - "MCID.IndicadoresConjunturais.LancamentoImobiliario"
    columns:
      - name: nome_empresa
        description: Nome da incorporadora ou construtora analisada.
      - name: variacao_4t25
        description: Variacao percentual dos lancamentos do primeiro trimestre de 2026 contra o quarto trimestre de 2025.
      - name: variacao_1t25
        description: Variacao percentual dos lancamentos do primeiro trimestre de 2026 contra o primeiro trimestre de 2025.
      - name: variacao_12m_26_25
        description: Variacao percentual dos lancamentos acumulados em doze meses de 2026 contra a janela equivalente de 2025.
      - name: variacao_12m_25_24
        description: Variacao percentual dos lancamentos acumulados em doze meses de 2025 contra a janela equivalente de 2024.
      - name: dt_ingest
        description: Timestamp da ingestao mais recente entre os registros de origem.
      - name: dt_silver
        description: Timestamp de processamento da camada Silver de origem.
      - name: dt_gold
        description: Timestamp de geracao deste registro na camada Gold.

  - name: gold_balancos_empresas_vendas
