#        * icst_var: ordem=1/2/3/4 comparam pares de datas diferentes
#          (atual×anterior, atual×ano anterior, atual×ano anterior de novo,
#          ano anterior×ano retrasado) — mesma coluna, bases de comparação
#          diferentes por linha.
#        * abramat_var: ordem=1 usa var_mes (variação mensal) da fonte;
#          ordem=2/3 usam var_12_meses (variação anual) avaliado em
