version: 2

models:
  - name: empreendimento
    description: >
      Visao unificada Silver de empreendimentos FAR do Novo MCMV. Consolida dados
      cadastrais, contratuais, localizacao, tipologia, situacao, execucao fisica
      e execucao financeira a partir das tabelas bronze cadastro_pj, consolidado,
      obra_mensal e dados_prioritarios_caixa.
    config:
      tags:
        - silver
        - empreendimento_far
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVFAR"
          - "MCID.FundosEFontes.FAR"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFisica"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFinanceira"
    columns:
      - name: apf
        description: Chave principal do empreendimento, com APF normalizado para 8 digitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
      - name: portaria_selecao
        description: Numero da portaria MCID de selecao ou contratacao; assume "Nao informada" quando ausente.
      - name: proponente_cnpj
        description: CNPJ do proponente original da proposta.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: proponente_nome
        description: Nome do proponente original da proposta.
      - name: tomador_cnpj
        description: CNPJ do tomador do financiamento ou recurso.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: tomador_nome
        description: Nome do tomador do financiamento ou recurso.
      - name: empreendimento_nome
        description: Nome do empreendimento contratado.
      - name: quantidade_uh
        description: Quantidade total de unidades habitacionais do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: municipio
        description: Municipio onde o empreendimento esta localizado.
      - name: uf
        description: Unidade federativa onde o empreendimento esta localizado.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UF"
      - name: co_originacao
        description: Codigo de originacao do empreendimento.
      - name: co_tipo_demanda
        description: Codigo do tipo de demanda habitacional atendida.
      - name: situacao_empreendimento
        description: Situacao gerencial atual do empreendimento, priorizada a partir dos dados da CAIXA.
      - name: codigo_tipologia
        description: Codigo numerico da tipologia da edificacao.
      - name: tipologia
        description: Tipologia descritiva da edificacao, derivada do codigo de tipo de edificacao.
      - name: pessoas_atendidas
        description: Estimativa de pessoas atendidas, calculada por quantidade de UHs multiplicada por 3,3.
      - name: valor_contratado
        description: Valor total contratado ou investido no empreendimento.
      - name: agente_financeiro
        description: Agente financeiro responsavel pelo contrato ou acompanhamento do empreendimento.
      - name: dt_contratacao
        description: Data de contratacao do empreendimento.
      - name: valor_aporte_adicional
        description: Valor de aporte adicional ou suplementacao associado ao empreendimento.
      - name: valor_por_uh
        description: Valor medio contratado por unidade habitacional.
      - name: percentual_execucao_fisica
        description: Percentual de execucao fisica consolidado, priorizando obra_mensal e dados prioritarios da CAIXA.
      - name: dt_conclusao_obra
        description: Data de conclusao fisica da obra, quando informada.
      - name: dt_entrega
        description: Data de entrega do empreendimento, quando informada.
      - name: dt_previsao_entrega
        description: Data prevista de entrega do empreendimento.
      - name: valor_desembolsado
        description: Valor total desembolsado acumulado.
      - name: percentual_execucao_financeira
        description: >
          Percentual de execucao financeira calculado como o valor desembolsado
          sobre o valor contratado, multiplicado por 100.

  - name: evolucao_financeira
    description: >
      Serie temporal Silver da evolucao financeira dos empreendimentos FAR, com
      uma linha por APF e mes de liberacao. Agrega os desembolsos da tabela bronze
      financeiro_mensal e os relaciona ao modelo Silver empreendimento pela raiz
      de 6 digitos do APF. Registra valores mensais por componente, desembolso
      acumulado, percentual de execucao financeira e contexto territorial.
    config:
      tags:
        - silver
        - empreendimento_far
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier2"
        tags:
          - "Certification.Silver"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVFAR"
          - "MCID.FundosEFontes.FAR"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
          - "MCID.ExecucaoDeEmpreendimentos.ExecucaoFinanceira"
          - "MCID.ExecucaoDeEmpreendimentos.Desembolso"
    columns:
      - name: apf
        description: Chave do empreendimento, com APF normalizado para 8 digitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
        tests:
          - not_null
      - name: mes
        description: Primeiro dia do mes de referencia das liberacoes financeiras.
        tests:
          - not_null
      - name: qt_liberacoes
        description: Quantidade de liberacoes financeiras individuais agregadas no mes.
      - name: vr_liberado_mes
        description: Soma dos valores financeiros liberados no mes, em reais.
        tests:
          - not_null
      - name: vr_pago_obra_mes
        description: Valor mensal destinado a obra ou edificacao, em reais.
      - name: vr_pago_terreno_mes
        description: Valor mensal destinado ao terreno, em reais.
      - name: vr_pago_pts_mes
        description: Valor mensal destinado ao Projeto de Trabalho Social (PTS), em reais.
        meta:
          openmetadata:
            glossary:
              - "MCID.ExecucaoDeEmpreendimentos.PTS"
      - name: vr_pago_incc_mes
        description: Valor mensal referente a ajuste pelo INCC, em reais.
      - name: vr_pago_aporte_mes
        description: Valor mensal de aportes adicionais, em reais.
      - name: vr_pago_equipamentos_mes
        description: Valor mensal destinado a equipamentos, em reais.
      - name: vr_pago_manutencao_mes
        description: Valor mensal destinado a manutencao, em reais.
      - name: vr_pago_legalizacao_mes
        description: Valor mensal destinado a legalizacao, em reais.
      - name: vr_acumulado
        description: >
          Desembolso acumulado progressivamente por APF ate o mes corrente, por
          meio da soma dos valores mensais ordenados pelo mes de referencia.
      - name: pct_executado_financeiro
        description: >
          Percentual de execucao financeira calculado como o desembolso acumulado
          sobre o valor contratado, multiplicado por 100.
      - name: valor_contratado
        description: Valor total contratado, herdado do modelo Silver empreendimento.
      - name: municipio
        description: Municipio onde o empreendimento esta localizado.
      - name: uf
        description: Unidade federativa onde o empreendimento esta localizado.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UF"
