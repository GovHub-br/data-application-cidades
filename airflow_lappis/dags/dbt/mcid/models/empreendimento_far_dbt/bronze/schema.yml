      - name: vr_pago_terreno
        description: Parcela paga referente ao terreno.
      - name: vr_pago_trabalho_social
        description: Parcela paga referente ao trabalho social.
      - name: vr_pago_equipamentos
        description: Parcela paga referente a equipamentos publicos ou de uso comum.
      - name: vr_pago_aporte
        description: Parcela paga referente a aporte ou suplementacao.
      - name: vr_pago_manutencao
