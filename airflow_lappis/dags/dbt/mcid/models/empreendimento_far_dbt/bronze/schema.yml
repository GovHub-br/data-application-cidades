      - name: dt_liberacao
        description: Data efetiva da liberacao do recurso.
      - name: dt_remessa
        description: Data de remessa do movimento.
      - name: identificador
        description: Identificador textual do registro financeiro.
      - name: arquivo_de_origem
        description: Nome ou identificador do arquivo de origem usado na carga.
      - name: criado_em
        description: Timestamp de criacao do registro no processo de ingestao.

