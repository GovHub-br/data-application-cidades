        description: Identificador da proposta associada ao empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.IDProposta"
      - name: agente_financeiro
        description: Agente financeiro responsavel pelo contrato.
      - name: empreendimento_nome
        description: Nome do empreendimento contratado.
      - name: construtora_nome
        description: Nome da construtora responsavel.
      - name: construtora_cnpj
        description: CNPJ da construtora, normalizado apenas com digitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: co_ente_publico
        description: Codigo do ente publico proponente.
      - name: municipio
        description: Municipio do empreendimento.
      - name: uf
        description: Unidade federativa do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UF"
      - name: cod_ibge
        description: Codigo IBGE do municipio.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CodigoIBGE"
      - name: co_tipo_edificacao
        description: Codigo da tipologia da edificacao.
      - name: co_tipo_administracao
        description: Codigo do tipo de administracao do empreendimento.
      - name: co_linha_atendimento
        description: Codigo da linha de atendimento habitacional.
      - name: co_tipo_demanda
        description: Codigo do tipo de demanda habitacional.
      - name: co_tipo_empreendimento
        description: Codigo do tipo de empreendimento.
      - name: qt_uh
        description: Quantidade de unidades habitacionais contratadas.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: gps_lat_grau
        description: Grau da latitude em formato DMS.
      - name: gps_lat_minuto
        description: Minuto da latitude em formato DMS.
      - name: gps_lat_segundo
        description: Segundo da latitude em formato DMS.
      - name: gps_long_grau
        description: Grau da longitude em formato DMS.
      - name: gps_long_minuto
        description: Minuto da longitude em formato DMS.
      - name: gps_long_segundo
        description: Segundo da longitude em formato DMS.
      - name: gps_datum
        description: Datum geodesico informado para as coordenadas GPS.
      - name: vr_emprestimo_far
        description: Valor do emprestimo FAR em reais.
      - name: vr_contrapartida_ente_publico
        description: Valor de contrapartida do ente publico em reais.
      - name: vr_total_investimento
        description: Valor total do investimento, incluindo FAR e contrapartidas.
      - name: vr_obra_edificacao
        description: Valor destinado a obra e edificacao.
      - name: vr_terreno
        description: Valor destinado ao terreno.
      - name: vr_trabalho_social
        description: Valor destinado ao trabalho social.
      - name: vr_equipamento_uso_comum
        description: Valor destinado a equipamentos de uso comum.
      - name: vr_legalizacao
        description: Valor destinado a legalizacao do empreendimento.
      - name: vr_seguro_obrigatorio
        description: Valor destinado a seguros obrigatorios.
      - name: dt_contratacao
        description: Data de assinatura do contrato.
      - name: dt_inicio_obra
        description: Data de inicio da obra.
      - name: dt_previsao_conclusao
        description: Data prevista de conclusao da obra.
      - name: dt_apresentacao_orcamento
        description: Data de apresentacao do orcamento.
      - name: dt_movimento
        description: Data de movimento ou referencia do registro.
      - name: ic_terreno_doado
        description: Indica se o terreno foi doado.
      - name: ic_aquecimento_solar
        description: Indica previsao ou existencia de sistema de aquecimento solar.
      - name: ic_energia_alternativa
        description: Indica previsao ou existencia de energia alternativa.
      - name: ic_area_comercial
        description: Indica previsao de area comercial no empreendimento.
      - name: arquivo_de_origem
        description: Nome ou identificador do arquivo de origem usado na carga.
      - name: criado_em
        description: Timestamp de criacao do registro no processo de ingestao.
