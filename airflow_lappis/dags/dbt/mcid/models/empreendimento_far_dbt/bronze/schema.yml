      Contem situacao, percentuais de execucao, quantidades e valores de UHs,
      informacoes de invasao/paralisacao, marcos de obra, entrega, assinatura,
      acoes corretivas e metadados de carga.
    config:
      tags:
        - bronze
        - empreendimento_far
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier3"
        tags:
          - "Certification.Bronze"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVFAR"
          - "MCID.FundosEFontes.FAR"
