        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: qt_uh_invadidas
        description: Quantidade de unidades habitacionais invadidas.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: vr_uh_alienadas
        description: Valor total das unidades habitacionais alienadas.
      - name: vr_uh_a_alienar
        description: Valor total das unidades habitacionais a alienar.
      - name: vr_uh_sem_habitese
        description: Valor total das unidades habitacionais sem habitese.
      - name: vr_uh_em_construcao
        description: Valor total das unidades habitacionais em construcao.
      - name: vr_uh_ociosas_retomadas
        description: Valor total das unidades habitacionais ociosas retomadas.
      - name: qt_uh_a_alienar
        description: Quantidade de unidades habitacionais a alienar.
