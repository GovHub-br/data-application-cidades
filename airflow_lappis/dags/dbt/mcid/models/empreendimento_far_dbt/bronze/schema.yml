version: 2

models:
  - name: consolidado
    description: >
      Dados do GFAR consolidados com propostas e contratos FAR do Novo MCMV.
      Cobre o ciclo de vida da proposta, da protocolizacao ate a contratacao,
      com identificadores, situacao, localizacao, tipologia, valores, infraestrutura
      do entorno, datas de referencia e metadados de carga.
    config:
      tags:
        - bronze
        - empreendimento_far
        - mcid
    meta:
      openmetadata:
        tier: "Tier.Tier3"
        tags:
          - "Certification.Bronze"
        glossary:
          - "MCID.ProgramasHabitacionais.MCMV"
          - "MCID.ProgramasHabitacionais.MCMV.MCMVFAR"
          - "MCID.FundosEFontes.FAR"
          - "MCID.ExecucaoDeEmpreendimentos.EmpreendimentoHabitacional"
    columns:
      - name: id_proposta
        description: Identificador unico da proposta no GFAR.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.IDProposta"
      - name: apf
        description: APF normalizado para 8 digitos, usado como chave principal de integracao.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.APF"
      - name: nu_operacao_af
        description: Numero da operacao junto ao agente financeiro, quando informado.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.NumeroOperacao"
      - name: portaria_contratacao
        description: Numero da portaria MCID associada a selecao ou contratacao.
      - name: co_situacao_contratada
        description: Codigo da situacao da proposta contratada.
      - name: co_situacao_protocolizada
        description: Codigo da situacao da proposta protocolizada.
      - name: co_fase
        description: Codigo da fase da proposta no fluxo GFAR.
      - name: co_etapa
        description: Codigo da etapa da proposta no fluxo GFAR.
      - name: co_status
        description: Codigo de status da proposta no GFAR.
      - name: proponente_nome
        description: Nome do proponente da proposta, como ente publico ou construtora.
      - name: proponente_cnpj
        description: CNPJ do proponente, normalizado apenas com digitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: co_tipo_proponente
        description: Codigo do tipo de proponente.
      - name: tomador_nome
        description: Nome do tomador do financiamento ou recurso.
      - name: tomador_cnpj
        description: CNPJ do tomador, normalizado apenas com digitos.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CNPJ"
      - name: empreendimento_nome
        description: Nome do empreendimento, priorizando o nome de contratacao sobre o nome da proposta.
      - name: agente_financeiro
        description: Agente financeiro responsavel pelo empreendimento.
      - name: municipio
        description: Municipio onde o empreendimento esta localizado.
      - name: uf
        description: Unidade federativa do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UF"
      - name: regiao
        description: Regiao geografica associada ao empreendimento.
      - name: cod_ibge
        description: Codigo IBGE do municipio.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.CodigoIBGE"
      - name: logradouro
        description: Logradouro do empreendimento.
      - name: bairro
        description: Bairro do empreendimento.
      - name: cep
        description: CEP do empreendimento.
      - name: co_tipo_edificacao
        description: Codigo da tipologia da edificacao, como casa terrea, apartamento, sobrado ou misto.
      - name: qt_uh
        description: Quantidade de unidades habitacionais do empreendimento.
        meta:
          openmetadata:
            glossary:
              - "MCID.Identificadores.UH"
      - name: co_tipo_demanda
        description: Codigo do tipo de demanda habitacional atendida.
      - name: co_originacao
        description: Codigo de originacao do empreendimento, como selecao ou calamidade.
      - name: valor_far
        description: Valor do emprestimo FAR em reais.
      - name: valor_contrapartidas
        description: Valor total de contrapartidas em reais.
      - name: ic_energia_eletrica
        description: Indica se ha energia eletrica ou iluminacao publica no entorno.
      - name: ic_agua_potavel
        description: Indica se ha agua potavel no entorno.
      - name: ic_esgoto
        description: Indica se ha rede de esgoto e coleta de lixo no entorno.
      - name: ic_via_pavimentada
        description: Indica se ha via pavimentada no entorno.
      - name: ic_drenagem
        description: Indica se ha drenagem pluvial no entorno.
      - name: ic_educacao_infantil
        description: Indica se ha equipamento de educacao infantil no entorno.
      - name: ic_saude_ubs
        description: Indica se ha unidade basica de saude no entorno.
      - name: ic_terreno_doado
        description: Indica se o terreno foi doado.
      - name: dt_protocolo
        description: Data de protocolo da proposta.
      - name: dt_recebimento_gfar
        description: Data de recebimento da proposta no GFAR.
      - name: dt_movimento
        description: Data de movimento ou referencia do registro.
      - name: dt_vencimento_portaria
        description: Data de vencimento da portaria de contratacao.
      - name: arquivo_de_origem
        description: Nome ou identificador do arquivo de origem usado na carga.
      - name: criado_em
        description: Timestamp de criacao do registro no processo de ingestao.
    tests:
      - row_count_match:
          source_table: __dados_brutos.novo_mcmv_far_consolidado
          target_table: empreendimento_far.consolidado

  - name: cadastro_pj
    description: >
      Cadastro mensal detalhado de pessoa juridica e empreendimento contratado.
