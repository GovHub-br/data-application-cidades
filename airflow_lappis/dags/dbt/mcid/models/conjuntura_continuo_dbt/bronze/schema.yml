  - name: bronze_fgv_incc_m
    description: >
      Índice Nacional de Custo da Construção (INCC-M) por município, em valores correntes.
      Dados extraídos da Fundação Getúlio Vargas (FGV), com cobertura de 2010 a 2021 para os 5.570 municípios brasileiros.
      Tipagem aplicada: text→int, text→numeric.
  
  - name: bronze_variacao_ticket_medio

