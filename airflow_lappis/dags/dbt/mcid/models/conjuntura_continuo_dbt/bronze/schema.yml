version: 2

models: 
# Página 01 do Boletim de conjuntura
  - name: bronze_ibge_pib_construcao_civil
    description: >
      Produto Interno Bruto (PIB) da construção civil por município, em valores correntes e constantes.
      Dados extraídos do IBGE, com cobertura de 2010 a 2021 para os 5.570 municípios brasileiros.
      Tipagem aplicada: text→int, text→numeric.
    meta:
      tags:
        - bronze
    columns:
      - name: variavel_id
        description: "Ano de referência do PIB"
      - name: variavel_nome
        description: Código IBGE do município (7 dígitos).
      - name: unidade
        description: Nome do município.
      - name: periodo
        description: PIB da construção civil em valores correntes (R$).
      - name: data_referencia
        description: PIB da construção civil em valores constantes (R$ de 2010).
      - name: valor
        description: PIB da construção civil em valores constantes (R$ de 2010)
      - name: localidade
        description: PIB da construção civil em valores constantes (R$ de 2010)
      - name: dt_ingest
        description: PIB da construção civil em valores constantes (R$ de 2010)
    data_tests:
      - row_count_match:
          source_table: ibge.pib_construcao
          target_table: conjuntura_continuo.bronze_ibge_pib_construcao_civil

# Página 02 do Boletim de conjuntura
  - name: bronze_balancos_empresas
    description: >
      Balanços de empresas da construção civil, dados de lançamentos e vendas. Empresas contempladas: MRV, Cury, Tenda, Direcional, Pacaembu, Plano & Plano
  
  - name: bronze_bacen_financiamentos_imobiliarios
    description: >
      Dados de financiamentos imobiliários sobre concessões, taxas de juros e inadimplência para pessoas físicas e pessoas jurídicas. 
  
  - name: bronze_fgts_financiamentos_habitacionais_fgts_pj
    description: >
      Crédito imobiliário concedido para financiamentos habitacionais do FGTS para pessoas jurídicas.
  
  - name: bronze_abecip_sbpe_const
    description: >
      Crédito imobiliário concedido pelo Sistema Brasileiro de Poupança e Empréstimo para financiamentos habitacionais.
  
# Página 03 do Boletim de conjuntura
  - name: bronze_caged_empregos_construcao
    description: >
      Empregos formais na construção civil, com dados de criação líquida de empregos (saldo) e total de postos (estoque).
  
  - name: bronze_ibge_pnad_continua
    description: >
      Empregos formais na construção civil, com dados de total dos trabalhadores ocupados na construção civil e total de trabalhadores no geral.
  
  - name: bronze_ibge_rendimento_medio_real
    description: >
      Rendimento médio real dos trabalhadores ocupados na construção civil e total de trabalhadores no geral.
    
  - name: bronze_ibge_producao_fisica_industrial_vendas_construcao
    description: >
      Produção física industrial e vendas da construção civil, com dados de produção física industrial e vendas da construção civil.
  
  - name: bronze_abecip_novos_financiamentos_imobiliarios
    description: >
      Novos financiamentos imobiliários concedidos pelo ABECIP. Contém dados do total de financiamentos concedidos por Agente Financeiro (Caixa Econômica Federal (CEF), Itaú, Bradesco, Santander, BRB, Banco do Brasil (BB) e demais bancos (outros)).
  
# Página 04 do Boletim de Conjuntura
  - name: bronze_bacen_credito_imobiliario_por_pib
    description: >
      Somatório dos valores a vencer, vencidos e em prejuízo das linhas de crédito SFH, FGTS, Livre e Comercial das pessoas físicas e jurídicas dividido pelo valor do PIB acumulado dos últimos 12 meses
  
  - name: bronze_fgts_fs_pf
    description: >
      Unidades habitacionais novas e usadas adquiridas com recursos do FGTS e do Fundo Social do Pré-sal para pessoas físicas, com dados de unidades habitacionais novas e usadas adquiridas com recursos do FGTS.
  
  - name: bronze_fgts_pf_uh_condicao_uso
    description: >
      Unidades habitacionais novas e usadas adquiridas com recursos do FGTS para pessoas físicas destinado para compra de imóveis prontos.

  - name: bronze_abecip_sbpe_aquisicao
    description: >
      Número de unidades habitacionais usadas e novas adquiridas com recursos do Sistema Brasileiro de Poupança e Empréstimo (SBPE) para pessoas físicas destinado para compra de imóveis prontos, com dados de unidades habitacionais novas e usadas adquiridas com recursos do SBPE.
  
# Página 05 do Boletim de Conjuntura
  - name: bronze_abecip_saldo_caderneta_poupanca
    description: >
      Saldo da caderneta de poupança do Sistema Brasileiro de Poupança e Empréstimo (SBPE) para pessoas físicas, com dados de saldo da caderneta de poupança do SBPE.
  
  - name: bronze_fgts_financiamento_pf_cci_cca_procot
    description: >
      Crédito imobiliário concedido para financiamentos habitacionais do FGTS para pessoas físicas, com dados de crédito imobiliário concedido para financiamentos habitacionais do FGTS.
  
  - name: bronze_fgts_pf_apoio_producao
    description: >
      Crédito imobiliário concedido para financiamentos habitacionais do FGTS para pessoas físicas, com dados de crédito imobiliário concedido para financiamentos habitacionais do FGTS.
  
  - name: bronze_fgts_fin_pf_total
    description: >
      Crédito imobiliário concedido para financiamentos habitacionais do FGTS para pessoas físicas, com dados de crédito imobiliário concedido para financiamentos habitacionais do FGTS.
  
  - name: bronze_financiamento_pf_mcmv
    description: >
      Crédito imobiliário concedido para financiamentos habitacionais do FGTS para pessoas físicas, com dados de crédito imobiliário concedido para financiamentos habitacionais do FGTS. 

