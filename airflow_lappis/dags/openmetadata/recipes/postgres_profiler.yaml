processor:
  type: orm-profiler
  config: {}

sink:
  type: metadata-rest
  config:
    bulk_sink_batch_size: 10

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OM_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${PROFILER_TOKEN}
