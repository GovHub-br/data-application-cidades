source:
  type: postgres
  serviceName: Cidades
  serviceConnection:
    config:
      type: Postgres
      hostPort: ${DB_DW_HOST}:${DB_DW_PORT}
      username: ${DB_DW_USER}
      authType:
        password: ${DB_DW_PASSWORD}
      database: ${DB_DW_DBNAME}
      sslMode: disable
  sourceConfig:
    config:
      type: Profiler
      computeMetrics: true
      profileSample: 25
      schemaFilterPattern:
        includes:
          - '^conjuntura_bronze$'
          - '^conjuntura_gold$'
          - '^conjuntura_silver$'
          - '^empreendimento_far$'
          - '^entidades_fds$'
      # Deve permanecer identica a allowlist de postgres_metadata.yaml.
      tableFilterPattern:
        includes:
          - '^bronze_abecip_poupanca_sbpe$'
          - '^bronze_bacen_financiamentos_imobiliarios$'
          - '^bronze_fgv_icst$'
          - '^bronze_fgv_incc_m$'
          - '^bronze_fipezap_locacao$'
          - '^bronze_ibge_pib_construcao_civil$'
          - '^bronze_ibge_pnadc_ocupados_construcao$'
          - '^bronze_ibge_pnadc_rendimento_construcao$'
          - '^bronze_ibge_sinapi$'
          - '^bronze_imob_infomoney$'
          - '^bronze_novo_caged$'
          - '^silver_abecip_novos_financiamentos_imobiliarios$'
          - '^silver_abecip_poupanca_sbpe$'
          - '^silver_abecip_sbpe_financiamentos_habitacionais$'
          - '^silver_abramat_indice$'
          - '^silver_bacen_financiamentos_imobiliarios$'
          - '^silver_balancos_empresas$'
          - '^silver_cbic_lancamentos_vendas$'
          - '^silver_fgts_financiamentos_habitacionais$'
          - '^silver_fgv_icst$'
          - '^silver_fgv_incc_m$'
          - '^silver_financiamentos_habitacionais$'
          - '^silver_fipezap_locacao$'
          - '^silver_ibge_pib_construcao_civil$'
          - '^silver_ibge_pnadc_ocupados_construcao$'
          - '^silver_ibge_pnadc_rendimento_construcao$'
          - '^silver_ibge_sinapi$'
