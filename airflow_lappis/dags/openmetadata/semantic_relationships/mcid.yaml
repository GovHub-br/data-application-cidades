pii_and_sensitive_metadata:
  suspected_column_count: 71
  categories:
    email: 1
    identificador_pessoa_juridica: 19
    localizacao: 44
    nome_ou_razao_social: 8
  policy:
  - Explore metadata before data values.
  - Do not emit raw values or reusable transformed identifiers in catalog artifacts.
  - Use protected exact-match tokens for business identifiers.
  - Mask or coarsen addresses and coordinates before semantic indexing.
known_limitations:
- No physical PK, FK, UNIQUE constraint or index exists in the 74-table scope.
- The aggregate profile does not encode every dbt ref/source lineage edge.
- Transformed joins such as six-digit APF roots require a dedicated transformed-key validation before publication.
- PII was inferred from dbt/PostgreSQL metadata and checked against authenticated OpenMetadata metadata where available; no sample value was read.
- Database counts and coverage are a point-in-time observation and must be reprofiled after material changes.
