model_join_logic:
  description: >
    Inventário das 53 cláusulas JOIN encontradas em 19 modelos dbt. JOINs
    entre CTEs do mesmo modelo descrevem cardinalidade e regra temporal, mas
    não criam uma nova aresta de linhagem entre tabelas.
  join_count: 53
  model_count: 19
  models:
  - model: conjuntura_gold.gold_abecip_novos_financiamentos_imobiliarios
    join_count: 2
    predicates:
    - b.ano = t.ano AND b.mes = t.mes
    - c.banco = a.banco AND a.ano = c.ano - 1 AND a.mes = c.mes
  - model: conjuntura_gold.gold_balancos_empresas_lancamentos
    join_count: 5
    predicates:
    - atual.nome_empresa = t_4t25.nome_empresa
    - atual.nome_empresa = t_1t25.nome_empresa
    - atual.nome_empresa = acum_26.nome_empresa
    - atual.nome_empresa = acum_25.nome_empresa
    - atual.nome_empresa = acum_24.nome_empresa
  - model: conjuntura_gold.gold_balancos_empresas_vendas
    join_count: 5
    predicates:
    - atual.nome_empresa = t_4t25.nome_empresa
    - atual.nome_empresa = t_1t25.nome_empresa
    - atual.nome_empresa = acum_26.nome_empresa
    - atual.nome_empresa = acum_25.nome_empresa
    - atual.nome_empresa = acum_24.nome_empresa
  - model: conjuntura_gold.gold_cbic_lancamentos_regiao
    join_count: 2
    predicates:
    - atual.regiao = ant.regiao
    - atual.regiao = aa.regiao
  - model: conjuntura_gold.gold_cbic_vendas_regiao
    join_count: 2
    predicates:
    - atual.regiao = ant.regiao
    - atual.regiao = aa.regiao
  - model: conjuntura_gold.gold_empregos_construcao
    join_count: 1
    predicates:
    - v.ano = a.ano AND v.trimestre = a.trimestre
  - model: conjuntura_gold.gold_ibge_pnad_construcao
    join_count: 1
    predicates:
    - o.periodo = r.periodo
    upstream_columns:
    - conjuntura_silver.silver_ibge_pnadc_ocupados_construcao.periodo
    - conjuntura_silver.silver_ibge_pnadc_rendimento_construcao.periodo
  - model: conjuntura_gold.gold_indices_mercado_imobiliario
    join_count: 10
    predicates:
    - ia.data_referencia = p.data_atual
    - ib.data_referencia = p.data_anterior
    - fa.data_referencia = p.data_atual
    - fb.data_referencia = p.data_anterior
    - ca.data_referencia = p.data_atual
    - cb.data_referencia = p.data_anterior
    - cc.data_referencia = p.data_ano_anterior
    - cd.data_referencia = DATE '2023-12-01'
    - aa.data_referencia = p.data_atual
    - ab.data_referencia = p.data_ano_anterior
  - model: conjuntura_gold.gold_ticket_medio_vs_incc
