[project]
name = "data-application-cidades"
version = "0.1.0"
description = "Pipeline de dados do MCid"
readme = "README.md"
requires-python = "~=3.11.0"

# Única declaração de dependências (ADR-0014). O uv.lock é versionado e a CI instala com
# `uv sync --locked`. Mexeu aqui: `make lock` (regenera o lock da imagem e o uv.lock).
[dependency-groups]
# O que vai para a imagem do Airflow. A imagem instala infra/docker/airflow/requirements.lock.txt,
# resolvido a partir deste grupo contra a imagem base por infra/docker/airflow/compile-lock.sh.
# Os pacotes que já vêm na imagem apache/airflow:3.3.2-python3.11 ficam na versão dela, que
# segue as constraints oficiais do Airflow; os instalados por cima que também aparecem lá usam
# a versão de lá.
runtime = [
    # Vêm da imagem base.
    "apache-airflow==3.3.2",
    "apache-airflow-providers-postgres==7.0.2",
    # PythonOperator, TriggerDagRunOperator, EmptyOperator e @task.virtualenv saíram do core
    # no Airflow 3 e moram neste provider.
    "apache-airflow-providers-standard==1.19.0",
    "numpy==2.4.6",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "sqlalchemy==2.0.52",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    # Abaixo da base (1.43.75): o openmetadata-ingestion 1.13 pede boto3<1.42.
    "boto3==1.41.5",
    # Importados direto pelo código; antes só chegavam como dependência de outros.
    "pyyaml==6.0.3",
    "psycopg2-binary==2.9.13",
    "paramiko==5.0.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "chardet==4.0.0",
    "pytz==2026.3.post1",
    # Instalados por cima da base.
    "openpyxl==3.1.5",
    # Fora das constraints do Airflow.
    "astronomer-cosmos==1.15.1",
    # dbt 1.7 não convive com a base do Airflow 3: fixa sqlparse<0.5 e urllib3 1.x, e a base
    # traz sqlparse 0.6 (common-sql) e urllib3 2.
    "dbt-core==1.12.5",
    "dbt-postgres==1.11.0",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
    "imap-tools==1.15.0",
    # Cliente do OpenMetadata (os testes injetam `metadata.*` falso). SEM o extra `airflow`,
    # que fixa apache-airflow==3.2.2: o conector do Airflow usa o Airflow desta imagem. SEM o
    # `pii-processor`, que exige numpy<2 e rebaixaria o pandas 3 da ingestão. A versão
    # acompanha a linha do servidor.
    "openmetadata-ingestion[dbt,postgres,superset]==1.13.3.2",
    # Vem com o metricflow do dbt-core 1.12. Fica na 29.0.1, abaixo das constraints (30.x),
    # porque o collate-sqllineage do openmetadata-ingestion a fixa; o metricflow aceita. É a
    # versão única do repositório: a linhagem de scripts/governance/ roda com ela.
    "sqlglot==29.0.1",
]
test = [
    "pytest",
    "pytest-cov",
    "packaging",
]
dev = [
    "pre-commit",
    # scripts/governance/: validação da prata no GX e edição do YAML do dbt a partir de
    # sugestão do OpenMetadata. Rodam fora da imagem.
    "great-expectations>=1.21,<2.0",
    "ruamel-yaml>=0.18,<0.20",
    "datacontract-cli>=1.2,<2",
]

[tool.uv]
package = false
default-groups = ["runtime", "test", "dev"]
