# <<<

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "build",
    "dist",
    "*.pyi",
    ".ipynb_checkpoints",
    "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
# O comprimento é do formatador (ruff format, sqlfmt); o E501 só sobrava para strings e
# comentários longos.
ignore = ["E501"]

# `helpers/openmetadata/` é código PORTADO — de `origin/refactor/openmetadata`
# e do data-application-minc, que evoluiu a mesma integração. Quebrar as
# funções longas aqui nos afastaria do upstream e encareceria trazer as
# melhorias deles depois. A complexidade é herdada, não escolhida; se um dia
# formos donos deste código de verdade, o ignore sai junto.
[tool.ruff.lint.per-file-ignores]
"helpers/openmetadata/glossary.py" = ["C901"]
"helpers/openmetadata/semantic_relationships.py" = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Raízes de import dos testes; dags/ fica fora (dags/conjuntura colide com scripts/conjuntura).
pythonpath = ["plugins", "helpers", "scripts", "scripts/governance", "scripts/superset"]
python_files = ["test_*.py"]

[tool.sqlfmt]
line_length = 100
dialect = "polyglot"
exclude = [
    ".git/",
    ".venv/",
    "build/",
    "dist/",
    "**/target/**",
    "**/compiled/**"
]
