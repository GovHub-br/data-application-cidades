# scripts/bronze_familias.yml
#
# Registro das famílias da camada bronze. Cada família é um recorte de negócio que vira um
# conjunto de tabelas no Postgres, carregado pelo scripts/staging_para_bronze.py.
#
# Diferente do raw->staging (que varre o lake inteiro), a bronze é seletiva: só um pequeno
# subconjunto da staging/ vira tabela, porque só esse subconjunto alimenta modelos dbt.
# Adicionar dado novo à bronze = adicionar uma entrada aqui.
#
# Campos de uma família:
#   descricao  texto livre, aparece no --listar
#   schema     schema do Postgres onde as tabelas são criadas
#   objetos    lista de entradas, cada uma com `tabela` e UMA das duas formas de origem:
#
#     staging_key  key exata do parquet. Use para dado que é um arquivo só, sem versões.
#
#     padrao       glob de keys; vence a de DATA mais recente. Use para dado que chega
#                  periodicamente, com a data no nome do arquivo. `*` casa qualquer coisa,
#                  inclusive `/`. A data é extraída do nome do arquivo por `data_regex`
#                  (default: o último grupo de 6 a 8 dígitos), e o desempate é pela key.
#     data_regex   opcional; regex com UM grupo de captura, aplicado ao NOME do arquivo,
#                  cujo valor ordena as versões. Só necessário quando o default erra.
#
# Ao usar `padrao`, o arquivo escolhido em cada execução aparece no log e fica gravado em
# lake._bronze_log.staging_key — dá para auditar qual versão gerou cada carga.

empreendimento_far:
  descricao: >-
    Novo MCMV FAR — consolidado GFAR, cadastro PJ, obra mensal, financeiro mensal e
    dados prioritários da CAIXA. Alimenta o empreendimento_far_dbt.
    Fontes reais do SharePoint, uma versão nova por mês; carrega sempre a mais recente.
  schema: bronze
  objetos:
    # Os padrões não fixam a pasta de propósito: o descarte de gêmeos do
    # raw_para_staging.py mantém UM objeto por nome no lake inteiro, então o arquivo
    # canônico pode estar em sharepoint/ ou em sftp/ dependendo de quem chegou primeiro
    # (os DADOS_PRIORITARIOS, por exemplo, vencem em staging/sftp/fabrica/GEFUS/).
    # Como o `*` do fnmatch casa `/`, `staging/*NOME_*` acha em qualquer profundidade.

    # HIS_MCIDADES_CONSOLIDADO_<aaaammdd>.csv — data completa no nome
    - padrao: "staging/*HIS_MCIDADES_CONSOLIDADO_*.parquet"
      tabela: novo_mcmv_far_consolidado

    # MONIT_CAD_PJ_FAR_MENSAL_<aaaamm>_<hhmmss>.CSV — o regex isola a competência
    # (aaaamm); sem ele o default pegaria o sufixo de hora, que não ordena por período.
    - padrao: "staging/*MONIT_CAD_PJ_FAR_MENSAL_*.parquet"
      data_regex: "MONIT_CAD_PJ_FAR_MENSAL_(\\d{6})"
      tabela: novo_mcmv_far_cad_pj_mensal

    - padrao: "staging/*MONIT_MOV_OBRA_FAR_MENSAL_*.parquet"
      data_regex: "MONIT_MOV_OBRA_FAR_MENSAL_(\\d{6})"
      tabela: novo_mcmv_far_obra_mensal

    - padrao: "staging/*MONIT_MOV_FINANC_FAR_MENSAL_*.parquet"
      data_regex: "MONIT_MOV_FINANC_FAR_MENSAL_(\\d{6})"
      tabela: novo_mcmv_far_financeiro_mensal

    # <aaaamm>_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA.csv — competência é o PREFIXO.
    # O `_ENTREGAS` no fim é outra tabela (5 colunas): o padrão termina em
    # `AF_CAIXA.parquet` justamente para não casar com ele.
    - padrao: "staging/*_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA.parquet"
      data_regex: "^(\\d{6})_SNH_PMCMV"
      tabela: dados_prioritarios_recebidos_caixa_empreendimentos

entidades_fds:
  descricao: >-
    Novo MCMV Entidades (FDS) — cadastro PJ, obra mensal, financeiro mensal e trabalho
    social do GFAR, mais o INT059 da CAIXA e as entregas dos dados prioritários.
    Alimenta o entidades_dbt. Mesma cadência do FAR: uma versão nova por mês,
    carrega sempre a mais recente.
  schema: bronze
  objetos:
    # MONIT_<dado>_FDS_MENSAL_<aaaamm>_<hhmmss>.CSV — como no FAR, o regex isola a
    # competência; o default pegaria o sufixo de hora, que não ordena por período.
    - padrao: "staging/*MONIT_CAD_PJ_FDS_MENSAL_*.parquet"
      data_regex: "MONIT_CAD_PJ_FDS_MENSAL_(\\d{6})"
      tabela: novo_mcmv_fds_cad_pj_mensal

    - padrao: "staging/*MONIT_MOV_OBRA_FDS_MENSAL_*.parquet"
      data_regex: "MONIT_MOV_OBRA_FDS_MENSAL_(\\d{6})"
      tabela: novo_mcmv_fds_obra_mensal

    - padrao: "staging/*MONIT_MOV_FINANC_FDS_MENSAL_*.parquet"
      data_regex: "MONIT_MOV_FINANC_FDS_MENSAL_(\\d{6})"
      tabela: novo_mcmv_fds_financeiro_mensal

    - padrao: "staging/*MONIT_EXEC_TS_FDS_MENSAL_*.parquet"
      data_regex: "MONIT_EXEC_TS_FDS_MENSAL_(\\d{6})"
      tabela: novo_mcmv_fds_trabalho_social_mensal

    # INT059_..._EMPREENDIMENTOS_<aaaammdd>.TXT — data completa no nome. Há também um
    # `_VALIDACAO_<aaaammdd>` antigo no lake; ele casa com o padrão mas perde por data.
    - padrao: "staging/*INT059_MinisterioCidades_FDS_CAIXA_EMPREENDIMENTOS_*.parquet"
      tabela: int_empreendimentos_int_059_fds_caixa_pj

    # Entregas reportadas pela CAIXA, todas as modalidades — o filtro FDS é na silver.
    - padrao: "staging/*_SNH_PMCMV_DADOS_PRIORITARIOS_AF_CAIXA_ENTREGAS.parquet"
      data_regex: "^(\\d{6})_SNH_PMCMV"
      tabela: dados_prioritarios_recebidos_caixa_entregas
