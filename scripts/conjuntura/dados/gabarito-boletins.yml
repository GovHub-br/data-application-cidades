# Contrato de validação Gold × números efetivamente publicados.
#
# Cada item é atômico: uma consulta escalar, um número publicado e a página
# que permite auditoria humana. Não registrar valores pessoais neste arquivo.
versao: 1
escopo: "Boletins trimestrais de 2025 em diante"

edicoes:
  "2025_3t":
    arquivo: "Cópia de Boletim de Conjuntura 2025 3T.pptx.pdf"
  "2025_4t":
    arquivo: "Boletim de Conjuntura 2025 4T FINAL.pdf"
  "2026_1t":
    arquivo: "Boletim de Conjuntura 2026 1T Final.pdf"

checagens:
  # Este PDF contém uma única lâmina rasterizada. Os números abaixo foram
  # transcritos por inspeção visual em 29/08/2026; manter a página como 1.
  - id: balanco_mrv_2025_3t_lancamentos_tri
    edicao: "2025_3t"
    indicador: "MRV — lançamentos, variação contra trimestre anterior"
    gold: gld_balancos_empresas
    pagina_pdf: 1
    sql: "select var_lancamentos_tri_anterior::numeric * 100 from conjuntura.gld_balancos_empresas where periodo = '3T2025' and empresa = 'MRV'"
    esperado: -32
    tolerancia_abs: 0.5
    classificacao: conforme

  - id: balanco_mrv_2025_3t_lancamentos_ano
    edicao: "2025_3t"
