  - numero: 27
    titulo: Índice ABRAMAT
    automatizado: false
    frequencia: Mensal
    fonte: ABRAMAT — Associação Brasileira da Indústria de Materiais de Construção
    tipo: Release mensal em PDF
    insercao: Manual
    situacao: Automação avaliada e descartada
    dado_coletado: 'Variação do faturamento deflacionado da indústria de materiais de construção, no mês,
      contra o mesmo mês do ano anterior e acumulada no ano. Por que foi descartada: os números existem
      no texto do PDF, mas em redação livre que muda a cada mês. Em quatro edições analisadas, a variação
      mensal aparecia em todas, a anual em três — uma delas escrita por extenso, sem número — e o acumulado
      do ano em apenas duas. Um release ainda trazia uma projeção que uma extração automática confundiria
      com dado realizado. O risco de gravar número errado em silêncio supera o ganho. Notas gerais Critério
      de validação. Nenhum indicador é dado por concluído sem comparação com os boletins publicados de
      3T2025, 4T2025 e 1T2026 — inclusive quando o número é calculado internamente, e não apenas quando
      vem pronto de uma fonte nova. Fontes que revisam o passado. FIPE, IBGE (PNAD), CBIC e as construtoras
      reveem números de períodos já publicados. Isso significa que um painel recalculado hoje pode não
      reproduzir o que saiu no boletim da época. Preservar a safra de cada edição é uma pendência de arquitetura
      em aberto. O que ainda não é automatizado. Dez blocos dependem de inserção manual, por três motivos
      distintos: não há fonte acessível (Blocos 02, 19 e 27), a fonte existe mas a extração não é confiável
      o suficiente (Bloco 27), ou a base automatizada equivalente ainda não está disponível (Blocos 06,
      11 e 14). Entre os manuais, quatro séries estão defasadas: Novos Financiamentos por Banco (setembro
      de 2025), Financiamento PF por Faixa e Canal FGTS Pró-Cotista (novembro de 2025) e Unidades por
      Condição de Uso (setembro de 2025).'
    link: https://abramat.org.br/indicadores-publicos/
    link_texto: null
