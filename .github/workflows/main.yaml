name: Python CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/govhub-br/data-application-cidades-airflow
  IMAGE_TAG_SHA: ${{ github.sha }}

jobs:
  # Os três jobs abaixo são checks obrigatórios do ruleset da main: PR vermelho não entra.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Os mesmos hooks do commit local, no repositório inteiro: o --no-verify não passa daqui.
      - name: Lint
        run: uv run --locked --only-group dev pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked reprova o PR que mexeu no pyproject.toml sem refazer o uv.lock.
      - run: uv sync --locked

      - name: Run tests
        run: >
          uv run --locked pytest tests
          --junitxml=report.xml
          --cov=dags --cov=plugins --cov=helpers --cov=scripts
          --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            report.xml
            coverage.xml

  dbt_parse:
    name: dbt parse
    runs-on: ubuntu-latest
    env:
      # O profiles.yml exige as credenciais; o parse não conecta no banco.
      DB_DW_HOST_MCID: localhost
      DB_DW_USER_MCID: ci
      DB_DW_PASSWORD_MCID: ci
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: dbt parse
        run: uv run --locked --only-group runtime dbt parse --project-dir dbt/mcid --profiles-dir dbt/mcid --no-partial-parse

  docker_build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test, dbt_parse]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          file: ./infra/docker/airflow/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_SHA }}

  docker_push:
    name: Docker push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker_build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./infra/docker/airflow/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_SHA }}
            ${{ env.IMAGE_NAME }}:latest
