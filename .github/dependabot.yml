# Dependabot só nos manifestos reais (ADR-0014), e sem PRs de versão nova: as versões
# sobem por decisão do time (o Airflow segue no 3.3.2, com as constraints dele), não por
# calendário. Os alertas e os PRs de correção de segurança continuam: eles são ligados nas
# configurações do repositório e não dependem do open-pull-requests-limit.
# Documentação: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "Infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "Infra"

  - package-ecosystem: "docker"
    directories:
      - "/infra/docker/airflow"
      - "/infra/docker/superset"
      - "/infra/k8s/postgres"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "Infra"
