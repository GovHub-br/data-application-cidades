# Busca do OpenMetadata: Elasticsearch 9.3.0 de um nó só, a mesma versão do
# docker-compose oficial do OpenMetadata 1.13.3 e do playbook de VM.
#
# node.store.allow_mmap=false dispensa vm.max_map_count >= 262144 nos nós
# (e, com isso, init container privilegiado para ajustar o kernel).
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: cidades
  labels: {app: elasticsearch}
spec:
  selector: {app: elasticsearch}
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: cidades
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: {app: elasticsearch}
  template:
    metadata:
      labels: {app: elasticsearch}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: node.store.allow_mmap, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g"}
          ports:
            - containerPort: 9200
          readinessProbe:
            httpGet: {path: "/_cluster/health?wait_for_status=yellow&timeout=2s", port: 9200}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
