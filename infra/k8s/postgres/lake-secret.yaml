# Liga o pg_duckdb ao lake (RustFS) e acerta as permissões do banco cidades.
#
# O secret do DuckDB é um SERVER (endpoint) + um USER MAPPING por usuário
# (access/secret key) no FDW "duckdb". Este Job recria os dois a cada execução,
# então serve também para trocar a chave ou o endereço do lake:
#
#   kubectl -n cidades delete job cidades-pg-lake-secret --ignore-not-found
#   kubectl apply -f infra/k8s/postgres/lake-secret.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: cidades-pg-lake-secret
  namespace: cidades
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: ghcr.io/govhub-br/cidades-postgres:15-pgduckdb-ee38d3b
          env:
            - name: PGHOST
              value: cidades-pg-rw
            - name: PGDATABASE
              value: cidades
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: cidades-pg-superuser, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: cidades-pg-superuser, key: password}
            - name: LAKE_ENDPOINT
              valueFrom:
                secretKeyRef: {name: cidades-lake, key: endpoint}
            - name: LAKE_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: cidades-lake, key: access_key}
            - name: LAKE_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: cidades-lake, key: secret_key}
            - name: LAKE_BUCKET
              valueFrom:
                secretKeyRef: {name: cidades-lake, key: bucket}
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              psql -v ON_ERROR_STOP=1 \
                -v endpoint="$LAKE_ENDPOINT" \
                -v key_id="$LAKE_ACCESS_KEY" \
                -v secret="$LAKE_SECRET_KEY" \
                -v teste="SELECT * FROM glob('s3://$LAKE_BUCKET/*')" <<'SQL'
              CREATE EXTENSION IF NOT EXISTS pg_duckdb;
              -- Deixa o httpfs baixado (o pod precisa de saída para extensions.duckdb.org).
              SELECT duckdb.install_extension('httpfs');

              -- Não usar duckdb.create_simple_secret(): cria um SERVER novo a cada chamada.
              DROP SERVER IF EXISTS lake_s3 CASCADE;
              CREATE SERVER lake_s3 TYPE 's3' FOREIGN DATA WRAPPER duckdb
                OPTIONS (endpoint :'endpoint', region 'us-east-1', url_style 'path', use_ssl 'false');
              CREATE USER MAPPING FOR cidades SERVER lake_s3
                OPTIONS (key_id :'key_id', secret :'secret');

              -- Leitura: só o banco do DW, e o que o dbt (usuário cidades) criar.
              REVOKE CONNECT ON DATABASE cidades FROM PUBLIC;
              GRANT CONNECT ON DATABASE cidades TO cidades, usuario_leitura;
              ALTER DEFAULT PRIVILEGES FOR ROLE cidades GRANT USAGE ON SCHEMAS TO usuario_leitura;
              ALTER DEFAULT PRIVILEGES FOR ROLE cidades GRANT SELECT ON TABLES TO usuario_leitura;

              -- O secret é por usuário: confere como cidades.
              SET ROLE cidades;
              SELECT count(*) AS objetos_na_raiz_do_bucket
              FROM duckdb.query(:'teste');
              SQL
