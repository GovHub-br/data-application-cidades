# O nome do projeto e fixo para nao depender do diretorio de onde o Compose e
# chamado: com o arquivo em infra/, o padrao seria "infra", o que criaria
# containers e volumes separados dos que ja existem.
name: data-application-cidades

# Base configuration for Airflow services
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: infra/docker/airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - ../.env
  volumes:
    - ./airflow/airflow.cfg:${AIRFLOW_HOME}/airflow.cfg
    - ../dags:${AIRFLOW_HOME}/dags/
    - ../plugins:${AIRFLOW_HOME}/plugins/
    - ../helpers:${AIRFLOW_HOME}/helpers/
    - ../templates:${AIRFLOW_HOME}/templates/
    - ../dbt:${AIRFLOW_HOME}/dbt/
    - ../dbt/mcid/profiles.yml:${AIRFLOW_HOME}/.dbt/profiles.yml
    # Scripts do pipeline do data lake (importados pelas tasks da sftp_ingest_dag).
    # Também usado pela DAG do OpenMetadata, que roda `scripts/governance/` no
    # fim para reaplicar o que o conector apaga — ver a nota lá.
    - ../scripts:${AIRFLOW_HOME}/scripts/
    # Temporários dos scripts (arquivos de GBs): NÃO usar /tmp (tmpfs em RAM)
    - lake_tmp:/opt/airflow/lake_tmp
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    lake-tmp-init:
      condition: service_completed_successfully

# Common environment variables for Airflow
x-airflow-environment: &airflow-common-env
  AIRFLOW__CORE__DEFAULT_TIMEZONE: 'America/Sao_Paulo'
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__TEST_CONNECTION: Enabled
  AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '300'
  # No Airflow 3 a opcao saiu de [core] para [dag_processor]. E o teto do
  # dagbag_import_timeout, por isso fica acima dele.
  AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: '360'
  # Login do Airflow 3 (SimpleAuthManager). A senha vem do arquivo copiado na
  # imagem, ver infra/airflow/simple_auth_manager_passwords.json.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: ${AIRFLOW_HOME}/simple_auth_manager_passwords.json
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
  AIRFLOW__EMAIL__DEFAULT_EMAIL_ON_RETRY: 'false'
  AIRFLOW__EMAIL__DEFAULT_EMAIL_ON_FAILURE: 'false'
  # A secao [webserver] nao existe no Airflow 3: o nome da instancia e a
  # secret_key foram para [api].
  AIRFLOW__API__INSTANCE_NAME: "Ipea - Local Dev!"
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-local-dev-airflow-secret-key}
  # Sem isso, cada subprocesso do `airflow standalone` (scheduler, api-server,
  # dag-processor, triggerer) sorteia o proprio jwt_secret -- o token que o
  # scheduler assina para uma task nao bate com a chave que o api-server usa,
  # e toda task falha com "Invalid auth token: Signature verification failed".
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-local-dev-airflow-jwt-secret}
  PYTHONPATH: "/opt/airflow/dags:/opt/airflow/plugins:/opt/airflow/helpers:/opt/airflow/scripts:$PYTHONPATH"
  # Temporários dos scripts do data lake — sobrescreve os caminhos de host do .env
  LAKE_TMPDIR: /opt/airflow/lake_tmp
  MASKING_TMPDIR: /opt/airflow/lake_tmp
  # Desliga os artefatos locais dos scripts (log em arquivo, preview): o bind-mount de
  # scripts/ não é gravável pelo usuário do container. Logs vão p/ stderr (UI).
  LAKE_LOCAL_ARTIFACTS: "0"
  _AIRFLOW_DB_MIGRATE: 'true'
  AIRFLOW__CORE__PLUGINS_FOLDER: ${AIRFLOW_HOME}/plugins
  AIRFLOW__CORE__DAGS_FOLDER: ${AIRFLOW_HOME}/dags
  AIRFLOW_REPO_BASE: ${AIRFLOW_HOME}
  # A ENV AIRFLOW_REPO_BASE É IMPORTANTE PARA SINCRONIZAR COM O SISTEMA DE PASTAS
  # DO AIRFLOW EM HOMOLOG E PROD, ELES POSSUEM UMA ESTRUTURA DE PASTAS DIFERENTE
  # USAR ESSA ENV NOS CÓDIGOS PARA NÃO HAVER CONFLITOS
  
services:
  # Ajusta o dono do volume lake_tmp (criado root:root, sem escrita p/ o usuário do
  # container) para o UID do airflow. Sem isso os scripts do data lake falham ao gravar
  # temporários (PermissionError). Roda uma vez e sai antes do airflow subir.
  lake-tmp-init:
    build:
      context: ..
      dockerfile: infra/docker/airflow/Dockerfile
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - "mkdir -p /opt/airflow/lake_tmp && chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/lake_tmp && chmod -R 775 /opt/airflow/lake_tmp"
    volumes:
      - lake_tmp:/opt/airflow/lake_tmp
    restart: "no"

  # Airflow Services
  airflow:
    <<: *airflow-common
    # Usamos o comando de standalone aqui para não rodar múltiplos containers
    # do airflow localmente e assim melhorar a velocidade inicialização
    # doc do standalone: https://airflow.apache.org/docs/apache-airflow/3.3.2/start.html
    command: standalone
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health" ]
      interval: 10s
      timeout: 60s
      start_period: 60s
      retries: 5
    restart: always
    environment:
      <<: *airflow-common-env

  # Postgres database
  postgres:
    image: postgres:17-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-db:/var/lib/postgresql/data
      - ./docker/postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Analytics Tools
  superset:
    build:
      context: ..
      dockerfile: infra/docker/superset/Dockerfile  # Custom Dockerfile with PostgreSQL drivers
    environment:
      SUPERSET_SECRET_KEY: 'supersetadmin'
      SUPERSET_ENV: development
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
    ports:
      - "8088:8088"
    depends_on:
      - postgres
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      /bin/sh -c "
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin &&
      superset db upgrade &&
      superset init &&
      superset run -p 8088 -h 0.0.0.0 --with-threads --reload --debugger
      "

  jupyter:
    image: jupyter/base-notebook:latest
    command: >
      jupyter lab 
      --ip=0.0.0.0 
      --no-browser 
      --allow-root 
      --NotebookApp.token='' 
      --NotebookApp.password=''
    ports:
      - "8888:8888"
    volumes:
      - ../notebooks:/home/jovyan/notebooks
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    restart: always

volumes:
  postgres-db:
  airflow_logs:
  lake_tmp: