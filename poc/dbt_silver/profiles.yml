poc_silver:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POC_PG_HOST') }}"
      port: "{{ env_var('POC_PG_PORT') | int }}"
      user: "{{ env_var('POC_PG_USER') }}"
      password: "{{ env_var('POC_PG_PASSWORD') }}"
      dbname: "{{ env_var('POC_PG_DBNAME') }}"
      schema: silver
      threads: 4
